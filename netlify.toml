[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# AI endpoint: POST /api/chat is declared by the function itself (config.path in netlify/functions/chat.mjs),
# which is also where its rate limit is attached. No redirect is needed here.

# Don't serve backend source / config as static files (publish dir is the project root)
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
