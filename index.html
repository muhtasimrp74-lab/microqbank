v": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Visceral leishmaniasis (kala-azar) caused by *Leishmania donovani*** — prolonged **low-grade, intermittent fever (often double-quotidian)** with **hepatosplenomegaly (massive splenomegaly) and anaemia** in a patient from **Fulbaria, Mymensingh**, a **hyperendemic kala-azar focus in Bangladesh**. Other features: weight loss, hyperpigmentation (\"black fever\"), pancytopenia, hypergammaglobulinaemia.\n\n**Life cycle in brief.** Vector: female **sandfly (*Phlebotomus argentipes*)**; promastigotes inoculated → engulfed by macrophages → **amastigotes (LD bodies)** multiply in reticulo-endothelial cells of spleen, liver, bone marrow. Man is the main reservoir in the Indian subcontinent (anthroponotic).\n\n**Laboratory confirmation**\n1. **Rapid immunochromatographic test — rK39 (rK39 dipstick)** — **recommended first-line test in the national programme** (sensitivity ≈ 97 %, specificity ≈ 98 %); used for screening and diagnosis in the field. Positive test + compatible clinical findings (fever ≥ 2 weeks, splenomegaly) diagnoses kala-azar.\n2. **Demonstration of amastigotes (Leishman–Donovan bodies)** — **gold standard**: splenic aspirate (most sensitive, 93–99 %), **bone-marrow aspirate** (60–85 %), lymph-node aspirate; stained by **Giemsa/Leishman** — **oval 2–4 µm intracellular bodies with nucleus and rod-shaped kinetoplast**.\n3. **Culture** — **NNN (Novy–MacNeal–Nicolle) medium**, Schneider's insect medium (promastigotes in 2–3 weeks).\n4. **PCR** — most sensitive and detects species; used for relapse and PKDL.\n5. **Other serology** — ELISA (rK39), direct agglutination test (DAT), IFAT; **Aldehyde test (Napier's formol-gel)** — non-specific, obsolete.\n6. **Haematology:** **pancytopenia**, raised ESR, **hypergammaglobulinaemia with reversed A/G ratio**; **leishmanin (Montenegro) skin test is negative** in active disease.\n\n**Other parasites causing febrile illness**\n- **Malaria** (*Plasmodium* spp.), **trypanosomiasis** (African, American), **babesiosis**, **toxoplasmosis**, **amoebic liver abscess**, **schistosomiasis (Katayama fever)**, **filariasis** (acute filarial fever), **trichinellosis**, fascioliasis, visceral larva migrans.\n\n**Viva pearls**\n- Kala-azar triad: **fever + splenomegaly + pancytopenia**; **rK39** is the rapid test; **splenic aspirate** is the gold standard.\n- Vector = *Phlebotomus argentipes*; causative agent = *L. donovani*; **PKDL** follows treated kala-azar."}, {"id": 363, "n": 363, "t": "\"A person from Durgapur complains of prolonged irregular fever with chill, rigor and sweating for 2 weeks\" – Which parasite is responsible for this febrile illness? How will you confirm the diagnosis in the lab? Name some other parasites causing febrile illness.", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Malaria** — **prolonged irregular fever with chills, rigor and sweating** (cold, hot and sweating stages) in a patient from **Durgapur**, a **north-central border upazila adjoining Meghalaya**, which is a **malaria-endemic belt of Bangladesh**. ***Plasmodium falciparum*** is the dominant species (≈ 90 % of cases in Bangladesh), with *P. vivax* less common. Irregular (non-periodic) fever is typical of falciparum malaria.\n\n**Laboratory confirmation**\n1. **Peripheral blood smear — gold standard**\n   - **Thick film** (screening; concentrates parasites ×20–30; detects as few as 5–20 parasites/µL) and **thin film** (species identification, parasite density).\n   - **Giemsa (or Leishman/JSB/Field's) stain**; take blood **at any time** (not just during fever), repeat every 6–12 h for 3 occasions if the first is negative.\n   - ***P. falciparum*:** **ring forms with double chromatin dots, banana-shaped gametocytes**, multiply infected RBCs; **schizonts rarely seen in peripheral blood**; *P. vivax* shows enlarged RBCs with **Schüffner's dots**, amoeboid trophozoites.\n2. **Rapid diagnostic tests (RDT)** — **HRP-2 antigen** (specific to *P. falciparum*) and **pLDH/aldolase** (pan-malarial) on blood; results in 15–20 min; used in national programme (RDT first at field level).\n3. **Quantitative buffy coat (QBC)** — acridine-orange fluorescent stain.\n4. **Molecular diagnosis** — **PCR** (species-specific, sub-microscopic infections, drug-resistance markers).\n5. **Serology** — IFAT/ELISA: not useful for acute diagnosis (epidemiology only).\n6. **Supportive:** haemoglobin (anaemia), platelets (thrombocytopenia), blood glucose, bilirubin, urea/creatinine for severe malaria.\n\n**Other parasites causing febrile illness**\nKala-azar (*L. donovani*), **trypanosomes**, **babesia**, **toxoplasma**, amoebic liver abscess, schistosomiasis (Katayama fever), filarial fever, trichinellosis, visceral larva migrans.\n\n**Viva pearls**\n- **Thick film** to detect, **thin film** to identify species.\n- **HRP-2 RDT** is specific for *P. falciparum*; **Schüffner's dots = *P. vivax***; **banana gametocytes = *P. falciparum***.\n- Falciparum malaria complications: cerebral malaria, severe anaemia, ARDS, AKI, blackwater fever."}, {"id": 364, "n": 364, "t": "\"A person from Bandarban complains of prolonged irregular fever with chill, rigor and sweating for 2 weeks\" – Which parasite is responsible for this febrile illness? How will you confirm the diagnosis in the lab? Name some other parasites causing febrile illness.", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Malaria, most likely falciparum malaria** — **Bandarban (Chittagong Hill Tracts)** is the **most malaria-endemic district of Bangladesh**, accounting for about 60 % of the country's cases; *P. falciparum* is the predominant species (the majority of cases in surveys; *P. vivax*, *P. malariae* and *P. ovale* are less common). Features: **irregular (non-periodic) fever with chills, rigor and sweating for 2 weeks.**\n\n**Laboratory confirmation** — same as Q363:\n- **Giemsa-stained thick and thin blood films** (gold standard; species and parasite density; report as parasites/µL or % infected RBCs).\n- **RDT (HRP-2 for *P. falciparum*; pLDH for *P. vivax*/pan-malarial)**; **PCR** (sub-microscopic infection, mixed infections, drug-resistance markers such as *K13*).\n- **Supportive tests** — Hb, platelets, blood glucose, renal/liver function (severe malaria).\n\n**Special points in Chittagong Hill Tracts**\n- **Mixed infections and asymptomatic carriers** are frequent, so PCR/ RDT help.\n- **Drug-resistance surveillance** (chloroquine-resistant *P. falciparum*; ACT is the standard treatment — **artemether-lumefantrine**).\n- **Vectors:** *Anopheles baimaii (dirus)*, *A. minimus*, *A. philippinensis*.\n\n**Other parasites causing febrile illness:** kala-azar, **trypanosomiasis**, **babesiosis**, **toxoplasmosis**, amoebic liver abscess, schistosomiasis, filariasis, **trichinellosis**.\n\n**Viva pearls**\n- **Falciparum malaria** — ring forms and crescent gametocytes in peripheral smear; **no schizonts in peripheral blood**.\n- Treatment: **artemisinin-based combination therapy (ACT)**; **primaquine** for gametocyte clearance (and vivax radical cure)."}, {"id": 365, "n": 365, "t": "\"A person from Rangpur complains of prolonged low-grade fever with heavy eosinophilia for few months\" – Which parasite is responsible for this febrile illness? How will you confirm the diagnosis in the lab? Name some other parasites causing febrile illness.", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Lymphatic filariasis due to *Wuchereria bancrofti*, with tropical pulmonary eosinophilia (TPE)** — prolonged **low-grade fever with marked (> 3000/µL) eosinophilia, nocturnal cough/wheeze** in a patient from **Rangpur**, in the **north-west filariasis-endemic belt of Bangladesh**. *W. bancrofti* is the only human filarial species present, transmitted by ***Culex quinquefasciatus***.\n\n**Pathogenesis of TPE.** Hypersensitivity to microfilarial antigens trapped in the lungs (**occult filariasis**); microfilariae are usually **absent from peripheral blood**.\n\n**Laboratory diagnosis**\n1. **Peripheral blood film (night blood, 10 pm–2 am — nocturnal periodicity)** — **thick film stained with Giemsa/Leishman** to demonstrate **sheathed microfilariae (≈ 250–300 µm) with nuclei not reaching the tail tip**. Concentration methods improve yield: **Knott's concentration** (blood + 2 % formalin), **membrane (Nuclepore) filtration**, **counting chamber**.\n2. **Antigen detection** — **immunochromatographic card test (ICT)** for **filarial antigen (Og4C3, circulating filarial antigen)**; daytime sampling is possible; used in national survey and mass-drug-administration programme.\n3. **Antibody detection** — antifilarial IgG/IgG4 ELISA (high titres in TPE).\n4. **Haematology:** **absolute eosinophil count > 3000/µL**, markedly raised **serum IgE** (> 1000 IU/mL).\n5. **Radiology:** chest X-ray with **diffuse miliary mottling / increased bronchovascular markings**; **filarial dance sign** on scrotal USG (for adult worms).\n6. **Molecular** — PCR for *W. bancrofti* DNA; xenomonitoring of vector.\n7. **Diethylcarbamazine (DEC) provocation test** — obsolete in modern practice.\n8. **Response to DEC therapy** — dramatic clinical improvement is itself supportive.\n\n**Other parasites causing fever with eosinophilia** (differentials): **Strongyloides stercoralis** (hyperinfection), **Löffler's syndrome** (*Ascaris*, hookworm larval migration), **toxocariasis (visceral larva migrans)**, **schistosomiasis (Katayama fever)**, **trichinellosis**, **fascioliasis**, **paragonimiasis**, hydatid disease, tropical pulmonary eosinophilia from other filariae (*Brugia malayi*).\n\n**Treatment (for completeness):** **diethylcarbamazine** (± albendazole); **doxycycline** (kills *Wolbachia* endosymbionts).\n\n**Viva pearls**\n- **Night blood film (10 pm–2 am)**: nocturnal periodicity of *W. bancrofti*; **ICT card test** can be done at any time.\n- **TPE**: eosinophils > 3000/µL, high IgE, **microfilariae absent in blood**."}]}, {"id": "clinical-9", "title": "Central Nervous System (CNS) Scenarios", "qs": [{"id": 366, "n": 366, "t": "\"A new born baby presented with high fever, convulsion and neck rigidity\" - What are the most probable bacteria causing this illness? Mention their source.", "st": 2, "src": "Board 1 Set 08, 16", "du": [], "nmc": [], "vv": ["Board 1 Set 08", "Board 1 Set 16"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Probable causes of neonatal meningitis (fever, convulsions, neck rigidity — the neck stiffness may be absent in newborns; bulging fontanelle, irritability, poor feeding, lethargy, apnoea are also seen):**\n\n| Organism | Source |\n|---|---|\n| ***Streptococcus agalactiae* (GBS)** — **commonest** | **Maternal genital and gastro-intestinal tract** (vaginal/rectal colonisation in 10–30 % of pregnant women); acquired by **ascending infection or during passage through the birth canal** (**early-onset**, < 7 days); late-onset (7 days–3 months) from the community/hospital (hands of staff, breast milk) |\n| ***Escherichia coli* K1** (capsular polysialic acid mimics neural tissue) | **Maternal gut/perineal flora**; the neonatal gut |\n| ***Listeria monocytogenes*** | **Maternal gut / contaminated foods** (unpasteurised milk, soft cheeses, ready-to-eat meats) — **transplacental or at birth** |\n| ***Klebsiella*, *Enterobacter*, *Citrobacter koseri*, *Acinetobacter*, *Pseudomonas*, *S. aureus*, CoNS** | **Nosocomial** — neonatal intensive care unit, contaminated equipment, health-worker hands, umbilical stump, cord care; **very common in South Asian neonatal units** |\n| ***Cronobacter sakazakii*** | **Contaminated powdered infant formula** |\n| *Salmonella*, *Candida* (very low-birth-weight infants), *H. influenzae*, *S. pneumoniae* | Community / hospital |\n\n**Risk factors:** prematurity/low birth weight, **prolonged rupture of membranes (> 18 h)**, maternal fever/chorioamnionitis, maternal GBS colonisation, **home or unhygienic delivery**, birth asphyxia, invasive procedures.\n\n**Lab diagnosis (summary):** CSF cytology/biochemistry/Gram stain/culture (blood agar + chocolate agar + MacConkey), blood culture, latex agglutination, PCR; **CSF cell counts are higher in normal neonates than in adults (up to 20–30 cells/µL)**.\n\n**Viva pearls**\n- **Neonatal meningitis: GBS, *E. coli* K1, *Listeria* (\"GEL\")**.\n- GBS prevention: **intrapartum ampicillin/penicillin** for colonised mothers (screen at 35–37 weeks)."}, {"id": 367, "n": 367, "t": "\"A young adult presented with high fever with neck rigidity and altered consciousness\" - What is the clinical diagnosis? Which bacteria is the aetiological agent? How will you proceed to diagnose the case?", "st": 0, "src": "Board 1 Set 09", "du": [], "nmc": [], "vv": ["Board 1 Set 09"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Clinical diagnosis: Acute bacterial (pyogenic) meningitis** — the triad of **fever, neck rigidity (nuchal stiffness) and altered consciousness** in a young adult (± headache, vomiting, photophobia, **positive Kernig's and Brudzinski's signs**; petechial/purpuric rash in meningococcaemia). It is a **medical emergency**.\n\n**Aetiological agent**\n- Most probable: ***Neisseria meningitidis*** (meningococcus) — **young adults, crowded settings (hostels, barracks, Hajj pilgrims)**, with or without petechial rash/purpura fulminans.\n- Alternatives: ***Streptococcus pneumoniae*** (commonest overall in adults; with otitis, sinusitis, pneumonia, CSF leak, splenectomy) and *H. influenzae* (unvaccinated).\n\n**Approach to diagnosis**\n1. **Immediately:** take **blood cultures (2 sets)** → start **empiric IV antibiotics (third-generation cephalosporin ± vancomycin) + dexamethasone** without waiting for CSF; **CT head** first if signs of raised ICP/focal deficit, then **lumbar puncture**.\n2. **CSF examination:**\n   - Macroscopy — turbid/purulent; **opening pressure ↑**.\n   - Cytology — **neutrophilic pleocytosis (> 1000/µL)**.\n   - Biochemistry — **protein ↑, glucose ↓** (CSF : blood < 0.4–0.6), lactate ↑.\n   - **Gram stain** — **Gram-negative intracellular diplococci (kidney-bean shaped, within neutrophils)** = meningococcus; Gram-positive lanceolate diplococci = pneumococcus.\n   - **Culture** — blood and chocolate agar with 5–10 % CO₂; identify (oxidase +, glucose and maltose fermentation) and test susceptibility.\n   - **Latex agglutination test / PCR** — rapid and useful if antibiotics were given.\n3. **Other:** CBC (leucocytosis), CRP, procalcitonin, serum glucose, **skin lesion scraping/biopsy Gram stain** for petechiae, throat/nasopharyngeal swab (carriers).\n4. **Public health:** notify; **chemoprophylaxis** for close contacts (**ciprofloxacin or rifampicin**, ceftriaxone); **vaccination** (meningococcal ACWY, B).\n\n**Viva pearls**\n- **Gram-negative intracellular diplococci in CSF = meningococcal meningitis.**\n- **Waterhouse–Friderichsen syndrome** = meningococcaemia with adrenal haemorrhage and shock."}, {"id": 368, "n": 368, "t": "\"CSF from suspected case of meningitis sent to microbiology lab for cytological examination. Total count of WBC was 3000/cumm with 80% neutrophils\" - What might be the causative agent? What are the other tests you need to do to confirm the diagnosis?", "st": 2, "src": "Board 1 Set 11, 19", "du": [], "nmc": [], "vv": ["Board 1 Set 11", "Board 1 Set 19"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Interpretation.** CSF with **3000 cells/µL and 80 % neutrophils** is the classic picture of **acute pyogenic (bacterial) meningitis** (> 90 % polymorphs in most cases; viral meningitis typically has < 500 lymphocytes).\n\n**Probable causative agents** (depends on age/setting)\n- ***Streptococcus pneumoniae***, ***Neisseria meningitidis***, ***Haemophilus influenzae* type b** (unvaccinated children).\n- Neonates: GBS, *E. coli*, *Listeria*; elderly/immunocompromised: *Listeria*, Gram-negative bacilli; post-neurosurgical: *S. aureus*, *Pseudomonas*.\n- A partially treated bacterial meningitis can show lower counts and a mixed picture.\n\n**Other tests needed to confirm the diagnosis**\n1. **CSF biochemistry** — **protein (↑, > 100 mg/dL)** and **glucose (↓)** with **simultaneous blood glucose** (ratio < 0.4–0.6); lactate.\n2. **CSF Gram stain** (cytospin) and **CSF culture** on **blood agar and chocolate agar (CO₂)** with antimicrobial susceptibility.\n3. **Antigen detection** (latex agglutination, immunochromatographic) and **PCR / multiplex PCR panel** — especially in partially treated cases.\n4. **Blood culture** (positive in up to 50–80 %), CBC with differential, **CRP / procalcitonin**.\n5. **Imaging** (CT/MRI) for complications.\n6. **To exclude other causes of neutrophilic pleocytosis** — early viral meningitis, early TB meningitis, brain abscess/parameningeal focus.\n\n**Viva pearls**\n- **> 1000 cells/µL, > 90 % neutrophils, low glucose, high protein = bacterial.**\n- **Never refrigerate CSF**; use chocolate agar in CO₂."}, {"id": 369, "n": 369, "t": "\"An immunocompromised patient developed headache and neck rigidity. CSF gives a positive Indian ink test\" – State your diagnosis with explanation.", "st": 0, "src": "Board 2 Set 11", "du": [], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Diagnosis: Cryptococcal meningitis (meningo-encephalitis) caused by *Cryptococcus neoformans*** in an **immunocompromised host (HIV/AIDS with CD4 < 100/µL, transplant, corticosteroids)**.\n\n**Explanation of the India ink test**\n- **India ink (Nigrosin) is a negative (background) stain**: the fine carbon particles **cannot penetrate the thick polysaccharide (glucuronoxylomannan) capsule**, so the **budding encapsulated yeast cells (4–10 µm) appear as round refractile bodies surrounded by a clear halo against a dark background**. A **narrow-based budding** pattern may be seen.\n- The test is simple and rapid but has **limited sensitivity (≈ 50–80 %; higher in AIDS because of high fungal burden)**; **false negatives** with low organism counts, and **false positives** (lymphocytes, air bubbles, RBCs).\n\n**Further confirmation**\n1. **Cryptococcal antigen (CrAg) detection** in **CSF and serum** — **latex agglutination** or **lateral flow assay (LFA)** — the **most sensitive test (> 95 %)**; serum CrAg screening is used in AIDS patients.\n2. **CSF culture** on **Sabouraud dextrose agar** (without cycloheximide; **creamy-white mucoid colonies** at 25–37 °C in 2–5 days); **birdseed (Guizotia abyssinica) agar** — **brown colonies** (phenol oxidase); **urease +**; **mucicarmine stain** stains capsule red.\n3. **CSF findings:** **raised opening pressure** (check and manage), mild lymphocytic pleocytosis (may be absent in AIDS), **raised protein, low glucose**; CT/MRI for cryptococcomas.\n4. **Blood culture** (fungaemia in AIDS); histology of tissue — **mucicarmine/PAS/GMS**.\n5. **Other opportunistic infections** to be considered — TB, toxoplasmosis; HIV serology and CD4 count.\n\n**Treatment (for completeness):** **liposomal/conventional amphotericin B + flucytosine** (induction), followed by **fluconazole** (consolidation and maintenance); **therapeutic lumbar puncture** to relieve raised pressure; antiretroviral therapy is delayed until after the induction phase to avoid IRIS.\n\n**Viva pearls**\n- **India ink: encapsulated yeast with clear halo** → *Cryptococcus neoformans*.\n- **CrAg (latex/LFA)** is the most sensitive and specific test; **birdseed agar** = brown colonies."}]}, {"id": "clinical-10", "title": "Respiratory Tract Scenarios", "qs": [{"id": 370, "n": 370, "t": "Sputum from a young adult pneumonic patient was sent to microbiology laboratory. On gram staining gram positive diplococci was seen. What are the causative bacteria? Which media is required for culture of that sputum?", "st": 0, "src": "Board 1 Set 05", "du": [], "nmc": [], "vv": ["Board 1 Set 05"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Interpretation.** In a young adult with pneumonia, **Gram-positive diplococci in sputum** most probably represent ***Streptococcus pneumoniae*** (pneumococcus) — the commonest cause of **community-acquired lobar pneumonia**.\n\n**Causative bacteria (Gram-positive diplococci)**\n- ***Streptococcus pneumoniae*** — **lanceolate (flame/lancet-shaped) diplococci**, capsulated, often with a clear halo; seen within and outside pus cells.\n- Less likely: ***Enterococcus*** species, viridans streptococci (oral contaminants). (Gram-negative diplococci would suggest *Moraxella catarrhalis*; *Neisseria* are Gram-negative.)\n\n**Media required for culture of sputum**\n1. **Blood agar (5 % sheep blood)** — **α-haemolytic, small, dome-shaped \"draughtsman-/carrom-coin\" colonies** (central depression due to autolysis) after incubation at 37 °C in **5–10 % CO₂ (candle jar)**.\n2. **Chocolate agar** — supports fastidious organisms (*H. influenzae*, *S. pneumoniae*), incubated in CO₂.\n3. **MacConkey agar** — for Gram-negative bacilli (*Klebsiella*, *Pseudomonas*).\n4. Optional: **gentamicin–blood agar** (selects pneumococci and suppresses oral flora).\n\n**Confirmation of *S. pneumoniae***\n- **Optochin (ethylhydrocupreine) sensitivity** — zone of inhibition ≥ 14 mm around a 5 µg disc.\n- **Bile solubility** (2 % sodium deoxycholate) — colonies lyse.\n- **Quellung (capsular swelling) reaction** with type-specific antiserum; inulin fermentation (historical); latex agglutination.\n- **Catalase negative**; **mouse virulence test** (historical).\n\n**Sputum quality (Murray–Washington / Bartlett):** > 25 polymorphs and < 10 squamous epithelial cells per low-power field = acceptable specimen; use **mucopurulent portion**, collect **before antibiotics**.\n\n**Other tests:** blood culture, **urinary pneumococcal antigen**, PCR, chest X-ray (lobar consolidation); susceptibility testing (penicillin MIC, ceftriaxone). **Prevention:** pneumococcal conjugate (PCV) and polysaccharide (PPSV23) vaccines.\n\n**Viva pearls**\n- **Gram-positive lanceolate diplococci + α-haemolysis + optochin sensitivity + bile solubility = *S. pneumoniae*.**\n- Incubate in **CO₂** (blood agar and chocolate agar)."}, {"id": 371, "n": 371, "t": "\"A 30 year old lady has come to you with low grade fever and weight loss for 3 months. She also complained of productive cough. Chest X-ray shows bilateral consolidation.\" How you will proceed to diagnose the case?", "st": 0, "src": "Board 1 Set 15", "du": [], "nmc": [], "vv": ["Board 1 Set 15"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Provisional diagnosis: Pulmonary tuberculosis** — chronic course (3 months), low-grade fever, **weight loss, productive cough** and chest X-ray abnormality in a South Asian adult; the main differential diagnoses are bacterial pneumonia, lung abscess, **fungal infection**, bronchogenic carcinoma and HIV-related lung disease.\n\n**Diagnostic approach**\n1. **Clinical history** — cough ≥ 2 weeks, night sweats, haemoptysis, contact with TB, diabetes/HIV status.\n2. **Specimens** — **two sputum samples (spot + early morning)**; if unable to expectorate, **induced sputum**, gastric lavage, **bronchoscopy/BAL**, pleural fluid, biopsy.\n3. **Smear microscopy**\n   - **Ziehl–Neelsen (hot) or Kinyoun (cold) stain:** carbol-fuchsin + heat → decolourise with **20 % H₂SO₄ (or 3 % acid-alcohol)** → counterstain with methylene blue or malachite green → **acid-fast bacilli (red, slender, beaded rods) on blue background**; **graded 1+ to 3+**; needs ≥ 5000–10,000 bacilli/mL.\n   - **Fluorescence microscopy** (auramine-O/rhodamine) — more sensitive.\n4. **Molecular rapid test — Xpert MTB/RIF (Ultra) / Truenat**: detects *M. tuberculosis* DNA **and rifampicin resistance within 2 hours**; used as **initial diagnostic test** in Bangladesh's National TB Programme; line-probe assay (LPA) for first/second-line drug resistance.\n5. **Culture** — **Löwenstein–Jensen medium (solid, 4–8 weeks; buff, dry, rough \"rice-grain/breadcrumb\" colonies)**, **MGIT 960 (liquid, 1–6 weeks)**; **species identification** (niacin, nitrate, MPT-64 antigen), **drug-susceptibility testing**.\n6. **Radiology** — chest X-ray (upper-lobe infiltrates, **cavitation**, fibrosis, miliary pattern, hilar adenopathy); here bilateral consolidation also requires exclusion of **bacterial pneumonia**.\n7. **Immunological tests** — **Mantoux test** (≥ 10 mm induration at 48–72 h; low value in endemic population), **IGRA** (QuantiFERON-TB): support latent infection, do not discriminate active disease.\n8. **Other** — **Gram stain and culture** of sputum, complete blood count, ESR, **HIV test**, random blood sugar, LFT/RFT before therapy; **histopathology** (caseating granulomas) for extra-pulmonary sites.\n\n**Biosafety:** TB specimens are handled in a biosafety cabinet (BSL-2; BSL-3 for culture).\n\n**Flow summary**\n```\nPresumptive TB → sputum x2 → Xpert MTB/RIF (±smear) → positive?  → treat (check RIF resistance)\n                                          └ negative but suspicious → culture (LJ/MGIT), CXR, other specimens, alternate diagnosis\n```\n\n**Viva pearls**\n- **Xpert MTB/RIF** = rapid test of choice; **ZN stain** = commonest; **culture** = gold standard.\n- AFB require **≥ 10⁴ bacilli/mL** to be seen on smear."}, {"id": 372, "n": 372, "t": "\"Broad spectrum antibiotics should not be used for treatment of sore throat\" - Why?", "st": 0, "src": "Board 1 Set 12", "du": [], "nmc": [], "vv": ["Board 1 Set 12"], "bd": ["Board 1"], "w": false, "v": true, "a": "Broad-spectrum antibiotics should **not** be used for sore throat (acute pharyngitis/tonsillitis) because:\n\n1. **Most sore throats are viral (70–85 % in adults, ≈ 60–70 % in children)** — rhinovirus, adenovirus, coronavirus, influenza, EBV, HSV — and antibiotics are **ineffective** against viruses.\n2. **Only a minority (≈ 5–15 % of adults, 20–30 % of children) are caused by the bacterial pathogen requiring treatment — *Streptococcus pyogenes* (Group A β-haemolytic *Streptococcus*, GAS)**, which is **uniformly sensitive to narrow-spectrum penicillin** (benzathine penicillin/penicillin V/amoxicillin). **Broad-spectrum agents give no added benefit.**\n3. **Adverse effects:** allergic reactions, rash (**ampicillin/amoxicillin cause a characteristic rash in infectious mononucleosis due to EBV**), diarrhoea, ***C. difficile*** colitis, candidiasis.\n4. **Emergence of antimicrobial resistance** and disruption of normal flora; adds to drug cost and healthcare burden.\n5. **Self-limiting course** — viral pharyngitis resolves in 3–7 days; antibiotics reduce symptom duration by only ≈ 1 day even in GAS pharyngitis.\n\n**Rational approach**\n- Use the **Centor / McIsaac score** (fever, tonsillar exudate, tender anterior cervical lymphadenopathy, absence of cough ± age).\n- **Rapid antigen detection test (RADT)** and/or **throat swab culture** (blood agar, β-haemolysis, bacitracin sensitivity, PYR test, Lancefield grouping) to identify GAS.\n- **Treat only confirmed/likely GAS** with a **10-day course of penicillin (narrow-spectrum)** — this **prevents rheumatic fever** (a major problem in Bangladesh); it does *not* prevent post-streptococcal glomerulonephritis.\n- Consider **diphtheria** in unvaccinated children with grey pseudomembrane (culture on Loeffler's serum slope/tellurite agar).\n\n**Viva pearls**\n- Sore throat is **mostly viral**; **GAS** needs **narrow-spectrum penicillin** to prevent rheumatic fever.\n- Aminopenicillin + EBV infectious mononucleosis → **maculopapular rash**."}]}, {"id": "clinical-11", "title": "Genitourinary, Gynecological & Reproductive Scenarios", "qs": [{"id": 373, "n": 373, "t": "\"A newly/recently married young girl/lady complains of frequent painful urination with burning sensation (and low grade fever)\" - What is your probable diagnosis / What might be the bacterial cause? How will you proceed to establish the diagnosis?", "st": 2, "src": "Board 1 Set 17, 20", "du": [], "nmc": [], "vv": ["Board 1 Set 17", "Board 1 Set 20"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Probable diagnosis: Acute uncomplicated cystitis (\"honeymoon cystitis\")** — lower urinary tract infection in a sexually active young woman. The short female urethra and its proximity to vagina and anus, plus sexual intercourse, massage bacteria into the bladder.\n\n**Probable bacterial causes**\n1. ***Escherichia coli*** (uropathogenic strains, **70–80 %**) — adheres through **P and type 1 fimbriae**; the commonest cause.\n2. ***Staphylococcus saprophyticus*** (**5–15 %**; second commonest in young sexually active women; coagulase-negative, **novobiocin-resistant**).\n3. Others — *Klebsiella pneumoniae*, *Proteus mirabilis*, *Enterococcus faecalis*, *Pseudomonas* (complicated cases); also consider *Chlamydia trachomatis*/*N. gonorrhoeae* (urethral syndrome).\n\n**Mild fever suggests possible ascending infection (pyelonephritis).** Cystitis typically has **no systemic fever**; fever, flank pain, vomiting and costovertebral angle tenderness suggest **pyelonephritis**.\n\n**How to establish the diagnosis**\n1. **Specimen:** **clean-catch midstream urine** collected before antibiotics; transport quickly (< 2 h) or refrigerate.\n2. **Urinalysis:** **pyuria (≥ 10 WBC/µL)**, **positive leucocyte esterase and nitrite**, haematuria; Gram stain of uncentrifuged urine (≥ 1 organism/oil field ≈ ≥ 10⁵ CFU/mL).\n3. **Semi-quantitative culture** — **CLED agar / blood agar + MacConkey agar**; **≥ 10⁵ CFU/mL** of a single organism (**≥ 10²–10³ CFU/mL is significant in symptomatic women**).\n4. **Identification** (colony, indole, urease, coagulase, novobiocin) and **antimicrobial susceptibility testing** (disc diffusion).\n5. **Additional tests:** pregnancy test, STI screen (NAAT for *Chlamydia*/gonococcus) if sterile pyuria or vaginal discharge, USG KUB for recurrent infections, blood culture if pyelonephritis.\n6. **Treatment (for reference):** short course — **nitrofurantoin, fosfomycin, pivmecillinam, TMP-SMX** (depending on local resistance); fluoroquinolones are reserved; **phenazopyridine** for symptom relief. **Prevention:** post-coital voiding, adequate fluids, avoid spermicides.\n\n**Viva pearls**\n- Honeymoon cystitis: *E. coli*; **young sexually active woman with *S. saprophyticus***.\n- Pyuria + nitrite + ≥ 10⁵ CFU/mL = UTI."}, {"id": 374, "n": 374, "t": "\"Urine from a UTI patient showed alkaline reaction with foul odor\" - Which is the most possible bacteria? What might be its complications?", "st": 0, "src": "Board 1 Set 07", "du": [], "nmc": [], "vv": ["Board 1 Set 07"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Most probable bacterium: *Proteus mirabilis*** (also *Proteus vulgaris*, *Providencia*, *Morganella*, *Klebsiella*, *Staphylococcus saprophyticus* produce urease).\n\n**Reason for alkaline urine and foul odour**\n- *Proteus* produces a potent **urease** that hydrolyses urea → **ammonia + CO₂** → urine **pH rises (8–9)** and the **ammoniacal, foul smell** develops.\n- Alkaline urine causes **precipitation of magnesium ammonium phosphate (struvite) and calcium carbonate-apatite crystals**.\n\n**Complications**\n1. **Struvite (triple-phosphate) stones** — **staghorn calculi** in the renal pelvis; recurrent infection, because bacteria are trapped within the stone.\n2. **Pyelonephritis**, perinephric/renal abscess, **obstructive uropathy**, hydronephrosis.\n3. **Chronic pyelonephritis** → **renal scarring and chronic renal failure**.\n4. **Bacteraemia/septicaemia** and shock; catheter blockage (encrustation, biofilm).\n5. **Prostatitis/epididymitis** in men.\n\n**Laboratory identification**\n- **Swarming growth on blood agar** (concentric rings, \"Dienes phenomenon\"); on **MacConkey agar — non-lactose fermenter (colourless colonies, no swarming)**; **CLED** prevents swarming.\n- **Urease positive (rapid, within 2–4 h)**, **H₂S positive**, motile, **phenylalanine deaminase positive**, indole negative (*P. mirabilis*) or positive (*P. vulgaris*).\n- **Urine pH > 7.5** and struvite crystals (\"coffin-lid\") in urine microscopy; **USG/CT** for stones.\n\n**Management:** appropriate antibiotics for susceptibility, **removal of stones/obstruction**; acidification and urease inhibitors in selected cases.\n\n**Viva pearls**\n- ***Proteus*** → **alkaline urine**, **struvite (staghorn) stones**, swarming, **urease +**.\n- Weil–Felix: *Proteus* OX-19/OX-2/OX-K antigens cross-react with rickettsial antibodies."}, {"id": 375, "n": 375, "t": "\"A diabetic lady complains of whitish vaginal discharge\" – Which fungi might cause this and how will you diagnose in the lab?", "st": 0, "src": "Board 2 Set 01", "du": [], "nmc": [], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable organism: *Candida albicans*** (≈ 80–90 %; other *Candida* species like *C. glabrata*, *C. tropicalis* in recurrent cases) causing **vulvovaginal candidiasis (VVC)** — thick curdy (\"cottage-cheese\") white discharge, vulval pruritus, erythema, dyspareunia, **pH ≤ 4.5**.\n\n**Predisposing factor here:** **diabetes mellitus** — hyperglycaemia and glycosuria increase vaginal glycogen and *Candida* adherence; impaired neutrophil function.\n\n**Laboratory diagnosis**\n1. **Specimen:** **high vaginal swab (HVS)** from the lateral vaginal wall/posterior fornix before treatment.\n2. **Direct microscopy**\n   - **10 % KOH wet mount** — **budding yeast cells with pseudohyphae**.\n   - **Gram stain** — Gram-positive oval budding yeast and pseudohyphae (**often with few pus cells**).\n3. **Culture**\n   - **Sabouraud dextrose agar (SDA) with chloramphenicol** at 25–37 °C for 24–48 h — **creamy-white, smooth, pasty colonies with yeasty odour**.\n   - **CHROMagar *Candida*** — *C. albicans* gives **green colonies** (species-level differentiation).\n4. **Identification of *C. albicans***\n   - **Germ-tube (Reynolds–Braude phenomenon) test** — positive within 2–3 h in serum at 37 °C.\n   - **Chlamydospores** (terminal, thick-walled) on **corn meal agar / Tween-80** at 25 °C.\n   - **Sugar assimilation (API 20C), fermentation**, **MALDI-TOF**, PCR.\n5. **Vaginal pH** (< 4.5 normal), **whiff test negative** (differs from BV).\n6. **Supportive:** **random/fasting blood sugar and HbA1c** for diabetes; HIV screening in recurrent cases.\n\n**Differentiation from other vaginal discharges**\n\n| Feature | Candidiasis | Bacterial vaginosis | Trichomoniasis |\n|---|---|---|---|\n| Discharge | Thick, white, curdy | Thin, grey, fishy | Frothy, yellow-green |\n| pH | ≤ 4.5 | > 4.5 | > 4.5 |\n| Whiff test | Negative | **Positive** | May be positive |\n| Microscopy | Pseudohyphae, yeasts | **Clue cells** | **Motile trichomonads** |\n\n**Treatment (for reference):** topical azoles (clotrimazole pessary) or oral fluconazole; control diabetes.\n\n**Viva pearls**\n- ***C. albicans*** — **germ-tube test positive**, chlamydospores on corn meal agar, **green on CHROMagar**.\n- **Diabetes, pregnancy, OCP, antibiotics, immunosuppression** predispose."}, {"id": 376, "n": 376, "t": "\"A young female with oral contraceptive complains of whitish vaginal discharge\" – Which fungi might cause this and how will you diagnose?", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable fungus: *Candida albicans*** (vulvovaginal candidiasis).\n\n**Why oral contraceptive pills (OCP)?** The **oestrogen component** increases the **glycogen content of the vaginal epithelium** and lowers the vaginal pH (more lactic acid by lactobacilli); *Candida* uses glycogen as a nutrient and adheres better to oestrogen-primed epithelium (also seen in **pregnancy** and hormone therapy).\n\n**Laboratory diagnosis** — as in Q375:\n1. **High vaginal swab (HVS)** → **10 % KOH preparation** (budding yeast + pseudohyphae) and **Gram stain**.\n2. **Culture on Sabouraud dextrose agar (± chloramphenicol)** — **creamy-white colonies**; **CHROMagar *Candida*** (green = *C. albicans*).\n3. **Germ-tube test** (positive in 2–3 h with serum); **chlamydospore formation** on corn meal–Tween 80 agar; **sugar assimilation**/MALDI-TOF.\n4. **Vaginal pH ≤ 4.5; whiff test negative.**\n5. Exclude **bacterial vaginosis and trichomoniasis** (wet mount), and test for **diabetes** if recurrent (≥ 4 episodes per year).\n\n**Viva pearls**\n- **Oestrogen** (OCP/pregnancy) → **glycogen-rich vaginal epithelium** → *Candida* overgrowth.\n- Germ-tube test is the **rapid screening test** for *C. albicans*."}, {"id": 377, "n": 377, "t": "\"A young female with whitish vaginal discharge came to you\" – Which fungi might cause these infections and under which predisposing factors?", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable fungus: *Candida albicans*** (80–90 %); less commonly ***Candida glabrata*, *C. tropicalis*, *C. parapsilosis*, *C. krusei*** (**non-albicans species** are more often azole-resistant and occur in recurrent infection) — causing **vulvovaginal candidiasis (vaginal thrush)**.\n\n**Predisposing factors**\n- **Endogenous hormonal:** **pregnancy**, **oral contraceptive pills**, hormone-replacement therapy, premenstrual phase.\n- **Metabolic:** **diabetes mellitus** (uncontrolled), obesity.\n- **Antimicrobial therapy:** **broad-spectrum antibiotics** (suppress protective vaginal *Lactobacillus* flora).\n- **Immunosuppression:** corticosteroids, chemotherapy, **HIV/AIDS**, malignancy, malnutrition.\n- **Local factors:** tight synthetic clothing, poor hygiene/douching, warm humid climate, IUCD, sexual transmission (balanitis in male partner).\n\n**Diagnosis in brief** — as in Q375: HVS → **KOH mount / Gram stain** (yeast + pseudohyphae) → **culture on SDA / CHROMagar** → **germ-tube test**; vaginal pH ≤ 4.5.\n\n**Viva pearls**\n- Candida vaginitis predisposed by **diabetes, pregnancy, OCP, antibiotics, immunosuppression**.\n- Recurrent VVC = ≥ 4 episodes/year → look for diabetes/HIV/non-albicans species."}, {"id": 378, "n": 378, "t": "\"33-year pregnant women complain of repeated history of previous abortions\" – What parasites are to be screened? Mention its complications and mode of transmission.", "st": 0, "src": "Board 2 Set 11", "du": [], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable parasite: *Toxoplasma gondii*** — a woman with **repeated abortions/stillbirths** should be screened for the **TORCH group** of infections (***T**oxoplasma*, **R**ubella, **C**ytomegalovirus, **H**erpes simplex ± syphilis), of which *T. gondii* is the parasitic cause. (*Plasmodium falciparum* malaria may also cause abortion in pregnancy and should be excluded in endemic areas.)\n\n**Mode of transmission**\n1. **Ingestion of oocysts** (from **cat faeces** — cat is the definitive host; contaminated soil, garden vegetables, water, litter box).\n2. **Ingestion of tissue cysts (bradyzoites) in raw or undercooked meat** (pork, mutton, lamb).\n3. **Transplacental (congenital)** — **tachyzoites cross the placenta** when a non-immune woman acquires **primary infection during pregnancy** (the risk increases with gestational age, but severity is greater when infection occurs early).\n4. Blood transfusion and organ transplantation (rare); reactivation of latent infection in the immunocompromised.\n\n**Complications**\n- **In the mother:** usually asymptomatic or mild lymphadenopathy (cervical lymph nodes), \"glandular-fever-like\" illness.\n- **In the fetus/newborn (congenital toxoplasmosis):**\n  - **Abortion, stillbirth, premature birth.**\n  - **Classic triad: chorioretinitis, hydrocephalus (or microcephaly) and intracranial calcifications** (± convulsions, mental retardation).\n  - Hepatosplenomegaly, jaundice, anaemia, rash; late sequelae — visual loss, deafness, learning disability.\n\n**Laboratory screening/diagnosis**\n1. **Serology** — **Toxoplasma IgG, IgM (ELISA)**; **IgG avidity test** (**high avidity** excludes infection in the last 3–4 months); **IgG seroconversion/rising titre** in paired sera; Sabin–Feldman dye test (reference; seldom used).\n2. **PCR** on **amniotic fluid** (≥ 18 weeks) for prenatal diagnosis; placental/foetal tissue.\n3. **Neonate:** IgM/IgA, PCR of CSF/blood, cranial USG/CT, ophthalmological examination.\n4. **Histology/ cell culture or mouse inoculation** (research).\n5. Also test **rubella IgG/IgM, CMV, HSV, VDRL/TPHA, HIV** and malaria smear.\n\n**Treatment/prevention (brief):** **spiramycin** to reduce transplacental transmission; pyrimethamine + sulfadiazine + folinic acid for fetal infection after first trimester. **Prevention:** cooking meat thoroughly, washing vegetables, **avoiding cat litter**, hand hygiene, screening in pregnancy.\n\n**Viva pearls**\n- **Cat = definitive host**; **congenital toxoplasmosis triad = chorioretinitis, hydrocephalus, cerebral calcification.**\n- **IgM positive** → recent infection; **IgG avidity** distinguishes recent from old infection."}]}, {"id": "clinical-12", "title": "Pediatric, Dermatological & Miscellaneous Scenarios", "qs": [{"id": 379, "n": 379, "t": "\"A bare footed boy from village is suffering from abdominal discomfort and anaemia\" – Which helminth might cause this and how? Mention its lab diagnosis and mode of transmission.", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable helminth: Hookworm — *Ancylostoma duodenale* / *Necator americanus*** — a **barefooted child** with **anaemia and vague abdominal discomfort** from a **rural, poorly sanitated** area.\n\n**How does hookworm cause anaemia?**\n- Adult worms (~1 cm) attach to the **jejunal mucosa** by their **buccal capsule (teeth in *A. duodenale*; cutting plates in *N. americanus*)**, suck blood and tissue fluid, and **secrete anticoagulant substances**; they frequently shift sites, leaving **multiple bleeding points**.\n- **Blood loss:** ≈ **0.15–0.25 mL/worm/day (*A. duodenale*)** and ≈ 0.03 mL (*N. americanus*). Chronic loss → **iron-deficiency (hypochromic microcytic) anaemia**, hypoalbuminaemia (oedema), growth retardation and **impaired cognitive development**.\n- Other features: **ground itch** (at the site of larval penetration), **pneumonitis** with eosinophilia during larval lung migration, epigastric pain.\n\n**Mode of transmission**\n- **Infective stage: filariform (L3) larva** in moist, shaded, **faecally contaminated soil**.\n- Larvae **penetrate intact skin** (**bare feet, hands**) → veins → right heart → lungs → coughed up and swallowed → mature in small intestine (6–8 weeks).\n- *A. duodenale* can also be acquired **orally** (contaminated food, water) and **by trans-mammary route**.\n- **Man is the only host**; there is **no direct person-to-person spread**. Eggs hatch in soil (rhabditiform larva → moults to filariform larva in ~5–10 days).\n\n**Laboratory diagnosis**\n1. **Stool microscopy (fresh)** — **eggs**: oval, **60 × 40 µm**, **colourless, thin-shelled with a clear space between the shell and the 4–8 celled segmented ovum**; eggs of the two species are indistinguishable. Use **concentration methods** (saturated saline flotation, formalin–ethyl acetate sedimentation) and **Kato–Katz** egg count (egg load = intensity of infection).\n2. **Stool culture** — **Harada–Mori filter-paper**, charcoal/agar-plate cultures to identify **filariform larvae** (to differentiate from *Strongyloides*).\n3. **Blood:** **hypochromic microcytic anaemia, low serum ferritin**, **eosinophilia** (early), hypoalbuminaemia.\n4. **Stool occult blood** — positive.\n5. **Serology/PCR** — not routine.\n6. Old stool (> 24 h) may contain **rhabditiform larvae** that mimic *Strongyloides* — caution.\n\n**Treatment (for completeness):** **albendazole/mebendazole** (single-dose), **iron supplementation**, deworming, improved sanitation, wearing footwear.\n\n**Viva pearls**\n- **Infective stage = filariform larva (skin penetration)**; diagnostic stage = **egg in stool**.\n- Anaemia = **iron-deficiency** due to blood loss; hookworm is the commonest cause of this in rural South Asia."}, {"id": 380, "n": 380, "t": "\"A 5 years poor boy from village is suffering from night blindness\" – Which helminth might cause this and how? Mention its lab diagnosis and mode of transmission.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Probable helminth: *Ascaris lumbricoides* (roundworm; ascariasis)** — heavy infection in a poor, malnourished child with **night blindness** (vitamin A deficiency).\n\n**How does ascariasis cause night blindness?**\n- **Heavy worm burden** competes for **nutrients and impairs absorption** of fat, protein and **fat-soluble vitamin A** (damage to the intestinal mucosa, reduced bile and pancreatic function, decreased appetite, diarrhoea).\n- In a child already on a **vitamin-A-poor diet**, this precipitates **vitamin A deficiency** → **night blindness (nyctalopia)**, xerophthalmia/**Bitot's spots**, and **malnutrition and growth retardation**.\n- Other complications: **Löffler's syndrome** (larval lung migration), **intestinal obstruction** (bolus of worms), biliary ascariasis (cholangitis), pancreatitis, appendicitis, perforation.\n\n**Mode of transmission (faeco-oral route)**\n- **Infective stage: embryonated egg (containing L3 larva)** after 2–3 weeks of incubation in warm moist soil.\n- Ingested through **contaminated hands, food (raw vegetables, salads), water, soil (geophagia/pica)** → small intestine → larvae penetrate the mucosa → portal circulation → liver → heart → lungs (break into alveoli) → coughed up and swallowed → adult worms in jejunum (**8–10 weeks**). Adult female lays ~200,000 eggs/day; the adult lives 1–2 years.\n- **Open defaecation, use of night-soil as fertiliser, poor hygiene**, and children playing in the soil promote spread.\n\n**Laboratory diagnosis**\n1. **Stool microscopy (direct, saline/iodine wet mount; concentration technique)**\n   - **Fertilised egg:** **round to oval, 45–75 × 35–50 µm, golden-brown (bile-stained)**, **thick shell with a mammillated (knobbly) albuminous coat**, containing a granular zygote. **Decorticated egg** — lacks the mammillated coat.\n   - **Unfertilised egg:** **longer, narrower (≈ 90 × 45 µm)**, thin shell with a coarse mammillated coat and a **mass of disorganised refractile granules**.\n2. **Adult worm** — passed in stool or vomit, or detected at endoscopy; **males 15–30 cm, females 20–35 cm**.\n3. **Larvae in sputum/gastric aspirate** during lung phase (Löffler's); **eosinophilia**.\n4. **Imaging** — plain X-ray/ultrasonography/ERCP for worms in biliary tree or obstruction (**\"tram-track\" or \"whorled mass\" of worms**).\n5. **Egg count (Kato–Katz)** to assess burden; **serum retinol** for vitamin A status; haemoglobin.\n6. **Treatment:** **albendazole/mebendazole**, **vitamin A supplementation**; school-based deworming, sanitation, hygiene.\n\n**Viva pearls**\n- **Infective stage = embryonated egg (ingested)**; diagnostic stage = **egg in stool**.\n- Ascariasis → **malnutrition, vitamin A deficiency**; the commonest nematode infection worldwide."}, {"id": 381, "n": 381, "t": "\"A 5-year-old boy wakes up at night because his anal area is itching.\" – How do you proceed to diagnose this case?", "st": 3, "src": "Board 2 Set 02, 04, 10", "du": [], "nmc": [], "vv": ["Board 2 Set 02", "Board 2 Set 04", "Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Enterobiasis (pinworm/threadworm infection) caused by *Enterobius vermicularis*.** **Nocturnal perianal pruritus** in a child is characteristic: the **gravid female migrates at night to the perianal skin and lays eggs**, causing itching; scratching leads to **autoinfection** (hand-to-mouth) and spread to family members.\n\n**How to diagnose**\n1. **Perianal swab — the test of choice**\n   - **Cellophane (Scotch) tape test (Graham's) or NIH swab (a glass paddle with adhesive tape)** pressed against the **perianal skin in the early morning, before bathing or defecation**; the tape is placed on a slide with a drop of toluene/saline and examined under a low-power microscope.\n   - **Repeat on 3 consecutive mornings** (sensitivity ≈ 50 % with a single swab, ≈ 90 % with three, up to 99 % with five).\n2. **Eggs** — **colourless, planoconvex (\"D\"-shaped, flattened on one side), 50–60 × 20–30 µm, thin, double-contoured shell** with a **coiled larva** inside.\n3. **Adult worms** — **white, thread-like, ~1 cm (female 8–13 mm with pointed tail; male 2–5 mm with curved tail)**; seen at night on the perianal skin or in the stool; the **head has cervical alae and a double-bulb pharynx (esophageal bulb)**.\n4. **Stool examination** — **not reliable** (eggs found in only 5–10 %) because eggs are laid outside the gut.\n5. **Other** — **nail scrapings** (eggs under fingernails), **peripheral eosinophilia is usually absent**; examine for vulvovaginitis in girls (ectopic migration).\n\n**Treatment/prevention:** **albendazole or mebendazole single dose, repeated after 2 weeks**; **treat all family members**; short nails, hand washing, daily change of underwear and bed linen, hot washing.\n\n**Viva pearls**\n- **Cellophane tape (Graham) test in early morning** is the **best** test; stool exam is poor.\n- **Autoinfection and retro-infection**; the egg is infective within hours."}, {"id": 382, "n": 382, "t": "\"A young man with expanding erythematous vesicular lesion at the groin\" – Which fungi might cause this? How will you diagnose in the lab?", "st": 0, "src": "Board 2 Set 16", "du": [], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Tinea cruris (\"dhobi itch\" / jock itch)** — **dermatophytosis of the groin**, with an **expanding erythematous, scaly lesion with raised, vesicular/pustular active margin and central clearing (annular \"ring\")**, often **bilateral and sparing the scrotum**.\n\n**Fungi that cause it:** ***Trichophyton rubrum*** (commonest in South Asia), ***T. mentagrophytes* (interdigitale)**, ***Epidermophyton floccosum***; *T. tonsurans* occasionally. Predisposing factors: heat and humidity, sweating, tight/wet clothing, obesity, diabetes, shared towels.\n\n**Laboratory diagnosis**\n1. **Specimen collection** — **clean the skin with 70 % alcohol**, and **scrape scales with a blunt scalpel from the advancing (active) margin** of the lesion into sterile paper/Petri dish.\n2. **Direct microscopy — 10–20 % KOH (± DMSO)**: **hyaline, septate, branching hyphae** and **arthroconidia (chains of spores)**; calcofluor white fluorescent stain improves sensitivity. **Positive KOH = dermatophytosis** (genus/species cannot be identified).\n3. **Culture** — **Sabouraud dextrose agar (SDA) with chloramphenicol + cycloheximide (actidione)** (e.g. Mycosel) incubated at **25–30 °C for 2–4 weeks**; **dermatophyte test medium (DTM)** — turns **red** by alkaline metabolites.\n4. **Identification** — colony morphology + **lactophenol cotton blue (LPCB)** mount:\n   - ***T. rubrum*:** white, fluffy colony with **deep red reverse pigment**; **tear-drop/pencil-shaped microconidia**, few macroconidia.\n   - ***T. mentagrophytes*:** powdery/granular colony; **spherical microconidia in clusters (\"bunch of grapes\") and spiral hyphae**, cigar-shaped macroconidia.\n   - ***E. floccosum*:** khaki-coloured colony; **club-shaped, smooth, thin-walled macroconidia in clusters (\"beaver-tail\")**; **no microconidia**.\n5. **Other tests** — **urease test**, **hair perforation test**, **Wood's lamp** (dermatophytes of the groin do not fluoresce; **erythrasma** due to *Corynebacterium minutissimum* shows **coral-red fluorescence**), **skin biopsy with PAS/GMS** in doubtful cases, **PCR/MALDI-TOF** for species identification.\n6. **Differential diagnosis:** **erythrasma**, **candidal intertrigo** (satellite pustules, scrotal involvement), psoriasis (inverse), seborrhoeic dermatitis, contact dermatitis — **to be excluded** by smear/culture.\n\n**Treatment (for reference):** topical terbinafine/azoles; oral terbinafine/itraconazole in extensive or recalcitrant disease; avoid topical corticosteroid misuse (**\"tinea incognito\"**), hygiene.\n\n**Viva pearls**\n- Take scrapings from the **active edge**; **KOH mount** shows septate branching hyphae.\n- **Erythrasma** — coral-red under Wood's lamp; *Candida* — satellite lesions."}, {"id": 383, "n": 383, "t": "\"Microscopical and immunological tests but not culture are main tests for the diagnosis of parasitic diseases\" – Comment.", "st": 0, "src": "Board 2 Set 20", "du": [], "nmc": [], "vv": ["Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Statement.** *\"Microscopical and immunological tests but not culture are main tests for the diagnosis of parasitic diseases.\"* — **This is largely true.**\n\n**Why microscopy is the mainstay**\n- **Most parasites have characteristic, easily recognised morphology**: eggs, larvae, cysts, trophozoites, adult worms, amastigotes — directly visible in **stool** (ova, cysts, parasites), **blood** (malaria, microfilariae, trypanosomes), **bone marrow/spleen** (LD bodies), **urine** (*S. haematobium*), **sputum, tissue** (e.g. Giemsa, ZN-modified, trichrome).\n- **Simple, inexpensive, rapid**, allows species identification and **quantification** (egg counts, parasite density).\n- Examples: **thick and thin film for malaria**, **stool wet mount/concentration**, **Scotch-tape test for pinworm**, **night blood film for filariasis**, **modified acid-fast stain for *Cryptosporidium***.\n\n**Why immunological tests are important**\n- When the parasite is **inaccessible or not shed**: **hydatid disease, cysticercosis, amoebic liver abscess, toxoplasmosis, visceral leishmaniasis (rK39), schistosomiasis, trichinellosis, filariasis (antigen ICT), tissue-stage and migratory infections**.\n- Tools: **antibody detection** (ELISA, IHA, IFAT, immunoblot), **antigen detection** (rapid immunochromatographic tests — malaria HRP-2, *Giardia*, *Entamoeba*, *Cryptosporidium*, filarial ICT), skin tests (historical), **molecular tests (PCR)** for species identification, drug resistance and low-density infection.\n\n**Why culture is not a routine test for most parasites**\n1. **Most parasites cannot be grown in routine artificial media** — **obligate intracellular** (*Plasmodium*, *Toxoplasma*, *Cryptosporidium*, *Babesia*, microsporidia), have **complex life cycles requiring vectors/intermediate hosts** (helminths: *Taenia*, *Echinococcus*, filaria).\n2. **Cultures are slow, expensive, laborious and technically demanding** (days to weeks), need special media/cell cultures and **lower sensitivity** than microscopy.\n3. **Culture adds no clinical value** where microscopy already gives a diagnosis within minutes.\n4. **Biosafety** concerns (infective larval/oocyst stages).\n\n**Exceptions — where culture is useful**\n- ***Leishmania*** (**NNN medium**), ***Trypanosoma cruzi***, ***Trichomonas vaginalis*** (Diamond's / InPouch TV), ***Entamoeba histolytica*** (Robinson's, research), **free-living amoebae** (*Naegleria*, *Acanthamoeba* — **non-nutrient agar with *E. coli* overlay**), ***Strongyloides*, hookworm** (**Harada–Mori filter-paper and agar-plate culture** — larvae, not parasite multiplication), *Plasmodium falciparum* (research/drug-sensitivity studies).\n\n**Conclusion.** In **parasitology**, diagnosis is made mainly by **direct demonstration of the parasite (microscopy)**, supplemented by **immunodiagnosis and molecular tests**, and **culture** is limited to a few organisms or to research.\n\n**Viva pearls**\n- **Parasitology** = microscopy + serology (+ PCR); **culture** only for *Leishmania*, *Trichomonas*, free-living amoebae and larval culture (Harada–Mori).\n- *Plasmodium* and *Toxoplasma* are **obligate intracellular** — no routine culture."}]}]}]}</script>

let FQ='',TPO=false;

function seq(){const srt=a=>F.sort==='freq'?[...a].sort((x,y)=>y.st-x.st):a;return PARTS.filter(p=>!PART||p.id===PART).flatMap(p=>p.topics.flatMap(t=>srt(t.qs.filter(q=>pass(q,true)))))}
function fview(){const L=seq();if(!L.length)return '<p class="empty">No questions match the current filters.</p>';
  let i=L.findIndex(x=>String(x.id)===FQ);if(i<0)i=Math.max(0,L.findIndex(x=>String(x.id)===String(S.last)));const q=L[i],T=TI[q.topic];FQ=String(q.id);
  return `<div class="fvh"><button class="ab" data-act="fexit">${I('x')}<span>Exit focus</span></button><div class="fvm"><b>${T.no} · ${esc(T.title)}</b><small>Question ${i+1} of ${L.length}</small></div><i class="bar"><u style="width:${100*(i+1)/L.length}%"></u></i></div>${card(q,true,true)}
  <nav class="fnav"><button class="fb2" data-act="fgo" data-d="-1"${i?'':' disabled'}>${I('arrow')}<span>Previous</span></button><span class="fc2">${i+1}<em> / ${L.length}</em></span><button class="fb2 nx" data-act="fgo" data-d="1"${i<L.length-1?'':' disabled'}><span>Next</span>${I('arrow')}</button></nav>`}
const STOP=new Set('the and for with from that this are what how can you your its their about between mention describe discuss write name state list give define explain outline note short briefly also asked vignette which who why has have was were not any all one two three four five other more most such than into using use used'.split(' '));
const TK=s=>(s.toLowerCase().match(/[a-z][a-z0-9-]{2,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.replace(/(ies|ing|es|ed|s)$/,'')),DF={},REV={},RC={};
const refs=q=>[...new Set([...(String(q.src).match(/#\d+/g)||[]).map(s=>s.slice(1)),...(q.a.match(/\bQ\d+/g)||[]).map(s=>s.slice(1))])].filter(r=>BY[r]&&BY[r]!==q);
ALL.forEach(q=>{q.k=new Set(TK(q.t+' '+q.tt));q.k.forEach(w=>DF[w]=(DF[w]||0)+1)});
ALL.forEach(q=>refs(q).forEach(r=>(REV[BY[r].id]=REV[BY[r].id]||new Set()).add(String(q.id))));
function relq(q){if(RC[q.id])return RC[q.id];const f=new Set(refs(q).map(r=>String(BY[r].id))),rv=REV[q.id]||new Set(),N=ALL.length;
  return RC[q.id]=ALL.filter(o=>!o.x&&o!==q).map(o=>{let s=0;q.k.forEach(w=>{if(o.k.has(w))s+=Math.log(N/DF[w])});s/=Math.sqrt(q.k.size*o.k.size||1);const id=String(o.id);if(f.has(id))s+=9;else if(rv.has(id))s+=7;if(o.topic===q.topic)s+=.15;return[s,o]}).filter(x=>x[0]>.3).sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1])}
const plain=t=>t.replace(/\*/g,'').replace(/^Vignette:\s*/,'Case: ');
function related(q){const r=relq(q);return r.length?`<div class="rel"><span>Related</span>${r.map(x=>`<a class="rc2" href="#/${PAGE==='questions'?'questions':'answers/'+x.part}?q=${x.id}"><i>Q${x.n}</i><b>${esc(plain(x.t))}</b></a>`).join('')}</div>`:''}
function tsel(ans){const T=F.topic&&TI[F.topic];
  return `<div class="tsel"><button class="tsb" data-act="tpick" aria-expanded="${TPO}" aria-haspopup="listbox"><em>${T?T.no:'All'}</em><b>${T?esc(T.title):'All topics'}</b>${I('chev')}</button>${TPO?`<div class="tsl" role="listbox"><button class="${T?'':'on'}" data-act="tgo" data-id=""><em>All</em><b>All topics${PART?' in this part':''}</b></button>${PARTS.map(p=>`<h5 style="color:${PC[p.id]}">${esc(p.name.replace(/^Part \w+ — /,''))}</h5>`+p.topics.map(t=>{const n=t.qs.filter(q=>ans||!q.x).length;return n?`<button class="${F.topic===t.id?'on':''}" data-act="tgo" data-id="${t.id}"><em>${t.no}</em><b>${esc(t.title)}</b><i>${n}</i></button>`:''}).join('')).join('')}</div>`:''}</div>`}

<script>
/* ===== L. INK v2: stylus handwriting layer. Strokes are ANCHORED TO THE TEXT (they follow words when the layout reflows) and drawn on

  const sc=RS.docs.map(d=>{if(skip&&d.q.id===skip)return[0,d.q];let s=0;for(const t of qt){const f=d.tf.get(t);if(!f)continue;const df=RS.df.get(t);s+=Math.log(1+(RS.N-df+.5)/(df+.5))*f*2.2/(f+1.2*(.25+.75*d.len/RS.avg))}return[s,d.q]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  return sc.length?sc.filter(x=>x[0]>=sc[0][0]*.45).slice(0,n).map(x=>x[1]):[]}
const pl=t=>plain(t);
function viewQ(){if(typeof FV==='function'&&FV()&&FQ&&BY[FQ])return BY[FQ];if(PAGE!=='questions'&&PAGE!=='answers')return null;
  const cs=$$('.q');if(!cs.length)return null;const mid=innerHeight*.4;let best=null,bd=1e9;
  for(const c of cs){const r=c.getBoundingClientRect();if(r.bottom<80||r.top>innerHeight)continue;const d=(c.classList.contains('o')?0:200)+Math.abs((r.top+Math.min(r.height,300)/2)-mid);if(d<bd){bd=d;best=c}}
  return best&&BY[best.dataset.id]||null}
function ctxFor(c,ui){const u=c.msgs[ui],q=u.qid&&BY[u.qid],P0=PARTS.find(p=>p.id===PART),T=F&&F.topic&&TI[F.topic];
  const ctx={location:{page:PAGE,part:P0?P0.name:'',topic:T?T.title:''}};
  if(q)ctx.current={n:q.n,id:q.id,title:pl(q.t),part:(PARTS.find(p=>p.id===q.part)||{}).name||'',topic:q.tt,src:q.src,answer:q.a};
  let qs=u.content;if(tok(qs).length<3){const prev=c.msgs.slice(0,ui).reverse().find(m=>m.role==='user');if(prev)qs=prev.content+' '+qs}
  ctx.retrieved=search(qs.slice(0,2000),4,q&&q.id).map(r=>({n:r.n,topic:r.tt,title:pl(r.t),excerpt:r.a.slice(0,2200)}));
  if(c.summary)ctx.summary=c.summary;return ctx}

/* ---------- DOM ---------- */
const mk=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const panel=mk(`<div id="aip" role="dialog" aria-label="AI Study Assistant" aria-modal="false">
 <div class="ai-h"><button class="ai-ib" data-a="hist" title="Chats" aria-label="Chat history">${I('aiHist')}</button>
  <button class="ai-t" data-a="rename" title="Rename chat"><b id="aT">New chat</b><small>AI Study Assistant</small></button>
  <button class="ai-ib" data-a="new" title="New chat" aria-label="New chat">${I('aiPlus')}</button>
  <button class="ai-ib" data-a="clear" title="Clear conversation" aria-label="Clear conversation">${I('aiTrash')}</button>
  <button class="ai-ib ai-dsk" data-a="wide" title="Wider / narrower" aria-label="Resize">${I('aiExpand')}</button>
  <button class="ai-ib" data-a="close" title="Close" aria-label="Close assistant">${I('x')}</button></div>
 <div class="ai-wrap"><div class="ai-list" id="aL"></div><div class="ai-body" id="aB" role="log"></div><button class="ai-adn" id="aD" data-a="down" aria-label="Scroll to latest">${I('aiDown')}</button></div>
 <div class="ai-f"><div class="ai-row" id="aQ"></div><div class="ai-row" id="aM"></div><div class="ai-chip" id="aC" hidden></div>
  <div class="ai-box"><textarea id="aI" rows="1" placeholder="Ask anything about microbiology…" enterkeyhint="send" autocomplete="off" aria-label="Message"></textarea><button class="ai-send" id="aS" data-a="send" aria-label="Send">${I('aiSend')}</button></div>
  <p class="ai-fn">AI can make mistakes — check important facts against your textbook.</p></div></div>`);
document.body.append(panel);
const $b=$('#aB',panel),$in=$('#aI',panel),$s=$('#aS',panel),$t=$('#aT',panel),$l=$('#aL',panel),$d=$('#aD',panel);
const hb=mk(`<button class="ib" id="bAI" title="AI Study Assistant" aria-label="AI Study Assistant"><i data-i="aiSpark"></i><span class="aitx">Ask AI</span></button>`);hb.querySelector('i').outerHTML=I('aiSpark');
const bf=$('#bFocus');bf.parentNode.insertBefore(hb,bf);
document.body.append(mk(`<button id="aiFab" aria-label="Open AI Study Assistant">${I('aiSpark')}Ask AI</button>`));
$('#tabbar').insertAdjacentHTML('beforeend',`<button id="aiTab">${I('aiSpark')}Ask AI</button>`);

let AI={open:false,busy:false,ctrl:null,stick:true,live:null};
const ccopy=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}};

function chatList(){return Object.values(CH).filter(c=>c.msgs.length||c===cur).sort((a,b)=>b.updated-a.updated)}
function renderList(){$l.innerHTML=`<h4>Chats<button class="ai-ib" data-a="hist" aria-label="Close list">${I('x')}</button></h4><button class="ai-ln" data-a="new">${I('aiPlus')} New chat</button><div class="ai-ls">${chatList().map(c=>`<div class="ai-li${c===cur?' on':''}"><button data-a="open" data-id="${c.id}"><b>${esc(c.title)}</b><small>${new Date(c.updated).toLocaleDateString(undefined,{day:'numeric',month:'short'})} · ${c.msgs.filter(m=>m.role==='user').length} msg</small></button><button class="ai-ib" data-a="ren" data-id="${c.id}" title="Rename" aria-label="Rename">${I('aiEdit')}</button><button class="ai-ib" data-a="del" data-id="${c.id}" title="Delete" aria-label="Delete">${I('aiTrash')}</button></div>`).join('')}</div>`}
function chip(){const c=$('#aC',panel),q=cur.qid&&BY[cur.qid];c.hidden=!q;if(q)c.innerHTML=`<span>${I('aiSpark')} Q${q.n} · ${esc(pl(q.t).slice(0,90))}</span><button data-a="chipx" title="Remove question context" aria-label="Remove question context">${I('x')}</button>`}
function modes(){$('#aM',panel).innerHTML=MODES.map(([k,l])=>`<button class="ai-pill${cur.mode===k?' on':''}" data-a="mode" data-m="${k}">${l}</button>`).join('')}
function quick(){const r=$('#aQ',panel),show=cur.qid&&BY[cur.qid]&&cur.msgs.length&&!AI.busy;r.hidden=!show;r.innerHTML=show?QUICK.map((x,i)=>`<button class="ai-pill" data-a="quick" data-i="${i}">${x[0]}</button>`).join(''):''}
function syncSend(){const has=$in.value.trim().length>0;$s.classList.toggle('stop',AI.busy);$s.innerHTML=I(AI.busy?'aiStop':'aiSend');$s.disabled=!AI.busy&&!has;$s.setAttribute('aria-label',AI.busy?'Stop generating':'Send');$s.title=AI.busy?'Stop generating':'Send'}
function welcome(){const q=cur.qid&&BY[cur.qid];return mk(`<div class="ai-wel"><span class="lg">${I('aiSpark')}</span><h2>How can I help you study microbiology?</h2><p>${q?`I can see Q${q.n}. Ask anything about it, or pick a quick action.`:'Ask any microbiology question — in the bank or beyond it.'}</p><div class="ai-sg">${q?QUICK.map((x,i)=>`<button class="ai-pill" data-a="quick" data-i="${i}">${x[0]}</button>`).join(''):SUGG.map((x,i)=>`<button class="ai-pill" data-a="sug" data-i="${i}">${x[0]}</button>`).join('')}</div></div>`)}
const ico=(a,i,l)=>`<button data-a="${a}" title="${l}" aria-label="${l}">${I(i)}<span>${l}</span></button>`;
function msgEl(m,i){const last=i===cur.msgs.length-1,d=document.createElement('div');d.className='ai-m '+(m.role==='user'?'u':'a');d.dataset.i=i;
  if(m.role==='user'){const q=m.qid&&BY[m.qid];d.innerHTML=`${q?`<span class="ai-ctx">Q${q.n}</span>`:''}<div class="ai-b">${esc(m.content)}</div>${AI.busy?'':`<div class="ai-ctl">${ico('edit','aiEdit','Edit')}${ico('copy','aiCopy','Copy')}</div>`}`;return d}
  const live=AI.busy&&last;d.innerHTML=`<div class="ai-b md${live&&m.content?' ai-cur':''}">${m.content?renderMd(m.content,live?null:m):(live?'<span class="ai-dots"><i></i><i></i><i></i></span><span class="ai-think">Thinking\u2026</span>':'')}</div>`;
  if(live){AI.live=d.firstChild;return d}
  if(m.err){const msg={offline:'You appear to be offline.',network:'Could not reach the AI service.',unavailable:"The AI service isn't available here yet.",rate_limit:'The AI service is busy or its quota is used up.',stopped:'Generation stopped before a reply arrived.'}[m.err]||m.msg||'';d.insertAdjacentHTML('beforeend',`<div class="ai-err"><span>${m.err==='stopped'?'Stopped.':'Something went wrong. Please try again.'}</span><button data-a="retry">Retry</button>${msg?`<small>${esc(msg)}</small>`:''}</div>`)}
  else if(m.cut)d.insertAdjacentHTML('beforeend',`<div class="ai-note"><span>${{stopped:'Stopped.',max_tokens:'Reply reached the length limit.',interrupted:'The connection was interrupted.'}[m.cut]||'Cut off.'}</span><button data-a="cont">Continue</button></div>`);
  if(m.content)d.insertAdjacentHTML('beforeend',`<div class="ai-ctl">${ico('copy','aiCopy','Copy')}${last?ico('regen','aiRedo','Regenerate'):''}</div>`);return d}
function renderAll(keep){const c=cur;$t.textContent=c.title;$b.innerHTML='';AI.live=null;if(!c.msgs.length)$b.append(welcome());else c.msgs.forEach((m,i)=>$b.append(msgEl(m,i)));chip();modes();quick();syncSend();if(!keep)toEnd(true)}
const atEnd=()=>$b.scrollHeight-$b.scrollTop-$b.clientHeight<90;
function toEnd(f){if(f||AI.stick)$b.scrollTop=$b.scrollHeight;$d.classList.toggle('on',!AI.stick&&$b.scrollHeight>$b.clientHeight+200)}
$b.addEventListener('scroll',()=>{AI.stick=atEnd();$d.classList.toggle('on',!AI.stick)},{passive:true});

/* ---------- network ---------- */
async function api(body,signal){const h={'content-type':'application/json'};let k=ls('mbai-code');if(k)h['x-access-code']=k;
  let r=await fetch(EP,{method:'POST',headers:h,body:JSON.stringify(body),signal});
  if(r.status===401){const c=prompt('Enter the access code for the AI assistant:');if(c){ls('mbai-code',c.trim());h['x-access-code']=c.trim();r=await fetch(EP,{method:'POST',headers:h,body:JSON.stringify(body),signal})}}return r}
async function compact(c,end,signal){ // fold old turns into a rolling summary so long chats never hit a visible limit
  const tot=c.msgs.slice(c.sumN,end).reduce((a,m)=>a+m.content.length,0);if(tot<70000)return;
  let k=end,keep=0;while(k>c.sumN&&keep<30000){k--;keep+=c.msgs[k].content.length}while(k<end&&c.msgs[k].role!=='user')k++;if(k<=c.sumN)return;
  try{const r=await api({action:'summarize',previousSummary:c.summary,messages:c.msgs.slice(c.sumN,k).filter(m=>m.content).map(m=>({role:m.role,content:m.content}))},signal);
    if(r.ok){const j=await r.json();if(j.summary){c.summary=j.summary;c.sumN=k;persist(c.id)}}}catch(e){if(e.name==='AbortError')throw e}}

async function generate(c,opt={}){ // fills the last (assistant) message of chat c
  const mi=c.msgs.length-1,m=c.msgs[mi],cont=!!opt.cont,base=cont?m.content:'';let ui=mi-1;
  AI.busy=true;AI.ctrl=new AbortController();AI.stick=true;delete m.err;delete m.cut;delete m.msg;if(!cont)m.content='';
  if(cur===c){renderAll();} 
  const sig=AI.ctrl.signal;let got=false,fin=false,stop='';
  try{
    if(navigator.onLine===false)throw Object.assign(new Error('offline'),{code:'offline'});
    await compact(c,ui,sig);
    let hist=c.msgs.slice(c.sumN,mi).filter(x=>x.content).map(x=>({role:x.role,content:x.content}));
    if(cont){hist.push({role:'assistant',content:base},{role:'user',content:'Continue exactly from where you stopped. Do not repeat anything already written.'})}
    while(hist.reduce((a,x)=>a+x.content.length,0)>500000&&hist.length>3)hist.splice(0,2);
    const r=await api({messages:hist,mode:c.mode,context:ctxFor(c,ui)},sig);
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw Object.assign(new Error(j.message||'http'),{code:r.status===404?'unavailable':(j.error||'http'),msg:j.message})}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',raf=0,lt=0;
    const paint=()=>{raf=0;const n=performance.now();if(n-lt<40){raf=requestAnimationFrame(paint);return}lt=n;if(cur===c&&AI.live){AI.live.classList.add('ai-cur');AI.live.innerHTML=renderMd(m.content);toEnd()}};
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const l of blk.split('\n')){if(!l.startsWith('data:'))continue;let j;try{j=JSON.parse(l.slice(5))}catch(e){continue}
          if(j.t){got=true;m.content+=j.t;if(!raf)raf=requestAnimationFrame(paint)}
          else if(j.error)throw Object.assign(new Error(j.message||j.error),{code:j.error,msg:j.message});
          else if(j.done){fin=true;stop=j.stop}}}}
    if(raf)cancelAnimationFrame(raf);
    if(!fin){if(m.content)m.cut='interrupted';else m.err='network'}else if(stop==='max_tokens'||stop==='length')m.cut='max_tokens';
  }catch(e){
    if(e.name==='AbortError'){if(cont||m.content)m.cut='stopped';else m.err='stopped'}
    else if(got||cont)m.cut='interrupted';
    else{m.err=e.code||(navigator.onLine===false?'offline':(e instanceof TypeError?'network':'error'));m.msg=e.msg||''}
  }
  AI.busy=false;AI.ctrl=null;AI.live=null;c.updated=Date.now();persist(c.id);
  if(cur===c){renderAll(true);toEnd(false)}
}
function send(text){text=(text||'').trim();if(!text||AI.busy)return;const c=cur;
  c.msgs.push({role:'user',content:text,qid:c.noQ?null:c.qid,t:Date.now()},{role:'assistant',content:'',t:Date.now()});
  if(c.title==='New chat')c.title=text.replace(/\s+/g,' ').slice(0,48);c.updated=Date.now();CH[c.id]=c;persist(c.id);
  $in.value='';sizeIn();saveDraft();generate(c)}
const stopGen=()=>{if(AI.ctrl)AI.ctrl.abort()};

/* ---------- chat management ---------- */
function setCur(c){stopGen();cur=c;ls('mbai-cur',c.id);$in.value=drafts()[c.id]||'';sizeIn();renderAll();renderList()}
function sizeIn(){$in.style.height='auto';$in.style.height=Math.min($in.scrollHeight,Math.round(innerHeight*.4))+'px'}
function autoAttach(){const q=viewQ();if(q&&!cur.noQ)cur.qid=q.id}

function openAI(o={}){AI.open=true;panel.classList.add('on');document.body.classList.add('ai-open');document.body.classList.toggle('ai-m',mobile());hb.classList.add('on');vv();buildIndex();
  if(!cur)cur=CH[ls('mbai-cur')]||newChat();const prev=cur;
  if(o.qid){if(cur.msgs.length&&String(cur.qid)!==String(o.qid)){cur=chatList().find(c=>!c.msgs.length&&c!==cur)||newChat()}cur.qid=o.qid;cur.noQ=false}
  else if(!AI.busy)autoAttach();
  if(cur!==prev)setCur(cur);else{if(!$in.value)$in.value=drafts()[cur.id]||'';sizeIn();renderAll()}
  if(!mobile()||o.focus)setTimeout(()=>$in.focus({preventScroll:true}),30)}
function closeAI(){flush();saveDraft();AI.open=false;panel.classList.remove('on');$l.classList.remove('on');document.body.classList.remove('ai-open','ai-m');hb.classList.remove('on')}
function vv(){const v=window.visualViewport;if(v&&mobile()&&AI.open){panel.style.setProperty('--aivt',v.offsetTop+'px');panel.style.setProperty('--aivh',v.height+'px')}else{panel.style.removeProperty('--aivt');panel.style.removeProperty('--aivh')}document.body.classList.toggle('ai-m',AI.open&&mobile());if(AI.open)toEnd(false)}
if(window.visualViewport){visualViewport.addEventListener('resize',vv);visualViewport.addEventListener('scroll',vv)}addEventListener('resize',vv);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ask=e.target.closest('[data-askai]');if(ask){const a=ask.closest('.q');if(a){openAI({qid:a.dataset.id,focus:true})}return}
  if(e.target.closest('#bAI,#aiTab,#aiFab')){AI.open&&e.target.closest('#bAI,#aiTab')?closeAI():openAI();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&AI.open&&!$('#modal').classList.contains('on')){e.stopPropagation();closeAI()}},true);
const act={
  close:closeAI,hist(){renderList();$l.classList.toggle('on')},down(){AI.stick=true;toEnd(true)},
  new(){stopGen();$l.classList.remove('on');const c=cur.msgs.length?newChat():cur;c.noQ=false;if(!c.qid||c!==cur){const q=viewQ();c.qid=q?q.id:null}cur=c;setCur(c)},
  clear(){if(!cur.msgs.length||!confirm('Clear this conversation?'))return;stopGen();cur.msgs=[];cur.summary='';cur.sumN=0;cur.title='New chat';persist(cur.id);renderAll()},
  wide(){panel.classList.toggle('wide');ls('mbai-wide',panel.classList.contains('wide')?'1':'0')},
  rename(a){const n=prompt('Rename chat',cur.title);if(n&&n.trim()){cur.title=n.trim().slice(0,80);persist(cur.id);$t.textContent=cur.title}},
  ren(a){const c=CH[a.dataset.id],n=c&&prompt('Rename chat',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,80);persist(c.id);renderList();if(c===cur)$t.textContent=c.title}},
  open(a){const c=CH[a.dataset.id];if(c){$l.classList.remove('on');setCur(c)}},
  del(a){const c=CH[a.dataset.id];if(!c||!confirm('Delete "'+c.title+'"?'))return;delete CH[c.id];persist(c.id);const d=drafts();delete d[c.id];ls('mbai-dr',JSON.stringify(d));if(c===cur){stopGen();setCur(chatList()[0]||newChat())}else renderList()},
  send(){AI.busy?stopGen():send($in.value)},
  mode(a){cur.mode=cur.mode===a.dataset.m&&a.dataset.m!=='normal'?'normal':a.dataset.m;persist(cur.id);modes()},
  chipx(){cur.qid=null;cur.noQ=true;persist(cur.id);chip();quick();if(!cur.msgs.length)renderAll()},
  quick(a){send(QUICK[+a.dataset.i][1])},
  sug(a){const s=SUGG[+a.dataset.i];if(s[2])return send(s[1]);$in.value=s[1];sizeIn();syncSend();$in.focus();$in.setSelectionRange($in.value.length,$in.value.length)},
  copy(a){const i=+a.closest('.ai-m').dataset.i;ccopy(cur.msgs[i].content).then(ok=>{if(ok){a.classList.add('ok');a.querySelector('span').textContent='Copied';setTimeout(()=>{a.classList.remove('ok');a.querySelector('span').textContent='Copy'},1400)}})},
  regen(){if(AI.busy)return;const c=cur;if(c.msgs.at(-1).role!=='assistant')return;c.msgs[c.msgs.length-1]={role:'assistant',content:'',t:Date.now()};generate(c)},
  retry(){if(AI.busy)return;const c=cur;c.msgs[c.msgs.length-1]={role:'assistant',content:'',t:Date.now()};generate(c)},
  cont(){if(AI.busy)return;generate(cur,{cont:true})},
  edit(a){if(AI.busy)return;const el=a.closest('.ai-m'),i=+el.dataset.i,m=cur.msgs[i];el.innerHTML=`<div class="ai-edit" style="width:100%"><textarea>${esc(m.content)}</textarea><div><button data-a="cedit">Cancel</button><button class="p" data-a="sedit">Send</button></div></div>`;const t=el.querySelector('textarea');t.focus();t.setSelectionRange(t.value.length,t.value.length)},
  cedit(){renderAll(true)},
  sedit(a){const el=a.closest('.ai-m'),i=+el.dataset.i,v=el.querySelector('textarea').value.trim();if(!v)return;const c=cur,old=c.msgs[i];c.msgs.length=i;c.msgs.push({role:'user',content:v,qid:old.qid,t:Date.now()},{role:'assistant',content:'',t:Date.now()});if(c.sumN>i){c.sumN=0;c.summary=''}persist(c.id);generate(c)}};
panel.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])act[a.dataset.a](a)});
$in.addEventListener('input',()=>{sizeIn();syncSend();clearTimeout(act._dt);act._dt=setTimeout(saveDraft,300)});
$in.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!AI.busy)send($in.value)}});
$in.addEventListener('focus',()=>setTimeout(()=>{AI.stick&&toEnd(true)},250));
panel.addEventListener('keydown',e=>e.stopPropagation()); // keep typing away from the site's global shortcuts

/* ---------- boot ---------- */
if(ls('mbai-wide')==='1')panel.classList.add('wide');
loadAll().then(()=>{if(!cur){const id=ls('mbai-cur');cur=CH[id]||chatList()[0]||newChat()}setTimeout(buildIndex,2000)});
window.MBAI={open:openAI,close:closeAI};
})();
</script>
