Virulence factors | **Gal/GalNAc lectin** (adherence), **amoebapore** (pore-forming, contact-dependent lysis), **cysteine proteases/collagenase/hyaluronidase**, anti-complement activity, motility, induction of apoptosis | Ventral **sucking disc** (adherence, mechanical blockade), lectin, variant-specific surface proteins (antigenic variation) |\n| Lesion | **Flask-shaped ulcer**, necrosis, liver abscess | Villous blunting/flattening only — **no necrosis, no ulcers** |\n| Stool | **Blood and mucus** (dysentery) | **Watery, fatty**, foul, **no blood/pus** |\n| Extra-intestinal spread | **Yes** — liver, lung, brain | **No** |\n| Site | Large gut | **Duodenum and jejunum** |\n\n**Why amoebiasis is invasive:** the trophozoite *lyses host cells on contact* (amoebapores, proteases), digests extracellular matrix and resists complement and lysis; hence it burrows through the mucosa and spreads by the portal vein. **Giardia** lacks these cytolytic and proteolytic mechanisms; it merely adheres and causes malabsorption through brush-border damage.\n\n**Viva point.** Blood in stool → think of *E. histolytica*, never *Giardia*."}, {"id": 217, "n": 217, "t": "Write/discuss the pathogenesis of amoebic liver abscess / hepatic amoebiasis (including in vignette form).", "st": 4, "src": "NMC 1; NMC 3; DU-22M, 20Nov/July", "du": ["DU-22M", "DU-20Nov/July"], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Amoebic liver abscess (hepatic amoebiasis)** is the commonest extra-intestinal manifestation of amoebiasis; caused by the **trophozoite** of *E. histolytica*. It occurs in ~3–9% of symptomatic amoebiasis and, importantly, **up to 50% of patients give no history of previous dysentery**.\n\n**Pathogenesis (sequential)**\n1. Trophozoites **invade the colonic mucosa** (caecum/ascending colon) and enter **mesenteric venules**.\n2. They are carried in the **portal vein** (mainly via the superior mesenteric vein → **right lobe**) as **emboli**.\n3. The **sinusoids of the liver filter and trap** the amoebae.\n4. Amoebae kill **neutrophils** (so no true pus is formed), **lyse hepatocytes** by contact-dependent cytolysis (amoebapore, proteases, Gal/GalNAc lectin) and **resist complement**.\n5. Focal accumulation → **obstruction of portal venules/sinusoids → thrombosis → ischaemic necrosis** of surrounding hepatocytes.\n6. The central necrotic mass **liquefies** (lytic action) → radial spread; neighbouring \"miliary\" microabscesses **coalesce** → a large **solitary abscess** (80% in the **postero-superior surface of the right lobe**).\n7. Amoebae multiply in the **periphery (wall)** of the abscess and invade further healthy tissue.\n\n**Pathology — three zones (centre → periphery)**\n1. **Central:** liquefied necrotic (chocolate-brown \"anchovy-sauce\") material, no amoebae.\n2. **Intermediate:** degenerating liver cells, connective tissue, a few leucocytes, occasional trophozoites.\n3. **Peripheral:** congested sinusoids, necrotic hepatocytes, **amoebae multiplying** — the zone to sample.\n\n**Vignette approach.** *Patient with fever, right hypochondrial pain, tender hepatomegaly, history of dysentery, cystic lesion in right lobe on USG* → *amoebic liver abscess*; cause: *E. histolytica trophozoites* via the portal vein.\n\n**Clinical features:** insidious onset, **pain and tenderness in the right hypochondrium** (referred to the right shoulder), fever with chills, weight loss, tender enlarged liver, raised right dome of diaphragm, leucocytosis (15,000–30,000/mm³).\n\n**Complications:** rupture into the pleura (empyema), lung (hepatobronchial fistula), peritoneum (peritonitis), pericardium (from left-lobe abscess — tamponade); secondary bacterial infection.\n\n**Viva points**\n- Liver is the commonest extra-intestinal site because the **portal vein drains the colon** directly into it.\n- Typical pus is **sterile, odourless, chocolate-brown (\"anchovy sauce\")**; trophozoites are scanty in the pus (they lie in the wall).\n- *Ref: K.D. Chatterjee; Akram's; Davidson's 21st.*"}, {"id": 218, "n": 218, "t": "Discuss the pathogenesis of intestinal amoebiasis.", "st": 4, "src": "NMC 4; DU-24M, 23Nov, 19Nov", "du": ["DU-24M", "DU-23Nov", "DU-19Nov"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Pathogenesis of intestinal amoebiasis (sequential)**\n\n1. **Ingestion** of mature cysts → excystation in ileo-caecal region → amoebulae colonise the **large-gut lumen**.\n2. In most persons the amoebae remain luminal commensals (carrier state); in a few, **invasive strains** attack the mucosa.\n3. **Adherence:** trophozoites bind colonic mucin and epithelial cells through the **Gal/GalNAc lectin** (a 260 kDa surface adhesin) and enter the **crypts of Lieberkühn**.\n4. **Cytolysis:** after attachment the **amoebapore (pore-forming protein)** inserts into the target cell membrane → cell lysis (**contact-dependent cytotoxicity**); trophozoites also **induce apoptosis** of host cells.\n5. **Matrix destruction:** **cysteine proteinases, collagenase, elastase, hyaluronidase** degrade extracellular matrix, basement membrane, mucin and IgA; trophozoites are **resistant to complement** (lectin mimics CD59).\n6. **Inflammatory amplification:** neutrophils lysed by amoebae release lysosomal enzymes and oxygen radicals → added tissue injury.\n7. The amoebae burrow through the **muscularis mucosae** into the **submucosa**, where resistance is lower, and spread **laterally** under the intact mucosa (lysis and **liquefactive necrosis**).\n8. The overlying mucosa finally sloughs → **flask-shaped (bottle-shaped) ulcer** with a narrow mouth, wide base and undermined edges, ragged margin, necrotic base (yellow-black slough), and **little inflammatory cell infiltration** (few pus cells — amoebae kill neutrophils).\n9. Ulcers coalesce → extensive mucosal destruction → **bloody mucoid diarrhoea (amoebic dysentery)**.\n10. Invasion of **mesenteric venules** → portal vein → **liver abscess** (and rarely lung/brain).\n\n**Sites of ulceration:** caecum and ascending colon, rectum and sigmoid colon (areas of stasis).\n\n**Fate of ulcers:** superficial ulcers heal by regeneration; deep ones by fibrosis → stricture. **Complications:** haemorrhage, perforation, peritonitis, **ameboma** (granulomatous mass mimicking carcinoma), toxic megacolon, appendicitis, intussusception, amoebic colitis, peri-anal skin ulceration.\n\n**Host and parasite factors:** virulent zymodeme, high inoculum; host malnutrition, pregnancy, steroids, alcoholism, immune suppression; bacterial flora of the gut.\n\n```\nCyst → amoebulae → adhere (lectin) → lyse cells (amoebapore + proteases)\n   → submucosal spread → FLASK-SHAPED ULCER → bloody mucoid stool\n                               └──→ venules → portal vein → LIVER ABSCESS\n```\n\n**Viva points**\n- Characteristic lesion: **flask-shaped ulcer**. Typical stool: acidic, offensive, dark brown, blood + mucus, **scanty pus cells**.\n- *E. dispar* and *E. moshkovskii* are morphologically identical but **non-invasive**."}, {"id": 219, "n": 219, "t": "Write/state the laboratory diagnosis of amoebic liver abscess / how to diagnose a case of hepatic amoebiasis.", "st": 5, "src": "NMC 1; NMC 3; DU-22M, 20Nov/July, 19Nov", "du": ["DU-22M", "DU-20Nov/July", "DU-19Nov"], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** diagnosis of amoebic liver abscess (ALA) rests on **clinical, imaging and serological** findings; direct demonstration of the parasite is *not* always possible.\n\n**Specimens:** blood/serum, **pus aspirated from the abscess** (from the wall/periphery or drained fluid after 1–2 days), **stool**, liver biopsy.\n\n**A. Direct evidence**\n1. **Aspiration of pus** — thick, **chocolate-brown (\"anchovy sauce\")**, odourless, sterile; microscopy shows degenerated liver cells, a few RBC, few pus cells; **trophozoites** may be seen in the last portions/ wall of the abscess (not in the centre).\n2. **Liver biopsy** (wall of abscess) — trophozoites; **rarely required** because of bleeding risk.\n3. **Stool examination** — cysts/trophozoites in **< 15%** of cases (≈50% of extra-intestinal amoebiasis cases have negative stool).\n4. **PCR** on pus — highly sensitive and species-specific.\n\n**B. Indirect evidence**\n1. **Serology (most useful):**\n   - *Antibody detection* — IHA, latex agglutination, IFA, **ELISA**, CIEP, gel diffusion; sensitivity **> 94%**, specificity ~95%. IHA is significant at ≥ 1:256; titres may stay positive for years after cure.\n   - *Antigen detection* — **ELISA for Gal/GalNAc lectin** in serum or pus (sensitivity 96%; specificity 100% on pus).\n2. **Imaging:** **ultrasonography (first-line)** — hypo-echoic single lesion in the right lobe; **CT/MRI**; isotope (Tc-99m) scan \"cold area\". Chest X-ray: **raised, fixed right dome** of the diaphragm, pleural reaction.\n3. **Blood:** **neutrophilic leucocytosis (15,000–30,000/mm³)**, raised ESR, mild anaemia, raised alkaline phosphatase; LFT often near-normal.\n4. **Therapeutic response** to metronidazole (supportive).\n\n| Test | Finding in ALA |\n|---|---|\n| Pus | Chocolate-brown, sterile, no bacteria, amoebae at wall |\n| USG | Single hypo-echoic cavity in right lobe |\n| Serology | Antibody (IHA/ELISA) positive; lectin antigen in serum/pus |\n| CBC | Leucocytosis |\n| Stool | Often negative (cysts in < 15%) |\n\n**Viva points**\n- *Serology + a lesion on USG* is strong evidence of ALA.\n- Aspiration is **not routinely required**; indicated for imminent rupture, left-lobe abscess, large abscess, or failed therapy.\n- Treatment: **metronidazole/tinidazole**, followed by a **luminal amoebicide** (paromomycin/diloxanide) to clear cysts."}, {"id": 220, "n": 220, "t": "State the laboratory diagnosis of intestinal amoebiasis.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** demonstration of **trophozoites (with ingested RBC) or cysts** in stool, or of *E. histolytica* antigen/DNA.\n\n**Specimen:** **fresh stool** (examine within **1 hour** while warm; at least **3 specimens on different days** as cyst excretion is intermittent); mucosal scrapings (sigmoidoscopy); serum.\n\n**1. Macroscopic (amoebic dysentery stool):** semi-liquid, **dark brown, offensive, acidic**; admixed with **blood and mucus**; does not stick to the container.\n\n**2. Microscopic**\n- **Saline wet mount:** actively motile **trophozoites with ingested RBCs**, sluggish pus cells, macrophages, epithelial cells; RBCs in clumps/rouleaux; **Charcot–Leyden crystals**.\n- **Iodine wet mount:** cysts (4 nuclei, glycogen mass, chromatoid bars).\n- **Concentration** (formol–ether, zinc sulphate floatation) for cysts in formed stool.\n- **Permanent stains** (iron-haematoxylin, trichrome) for nuclear detail and species identification.\n- **Acute dysentery → trophozoites; chronic/carriers → cysts.**\n\n**3. Antigen detection:** stool **ELISA** for Gal/GalNAc lectin — more sensitive than microscopy and **differentiates *E. histolytica* from *E. dispar***.\n**4. Molecular:** **PCR/real-time PCR** — most accurate for species differentiation.\n**5. Culture:** polyxenic media (Robinson's, Boeck–Drbohlav's, Craig's) — for carriers; axenic (Diamond's) for research.\n**6. Sigmoidoscopy:** ulcers with scrapings/biopsy (flask-shaped ulcer on histology).\n**7. Serology:** useful mainly in **invasive** disease; antibodies appear late in intestinal infection.\n**8. Blood:** moderate leucocytosis.\n\n**Interpretation pearls:** microscopy cannot separate *E. histolytica* from *E. dispar/E. moshkovskii* (cysts), but **ingested RBCs** in trophozoites suggest *E. histolytica*."}, {"id": 221, "n": 221, "t": "Mention the differences between amoebic and bacillary dysentery.", "st": 0, "src": "DU-25M", "du": ["DU-25M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | **Amoebic dysentery** | **Bacillary dysentery** |\n|---|---|---|\n| Agent | *E. histolytica* | *Shigella dysenteriae, flexneri, sonnei* |\n| Incubation | 2–4 weeks (variable) | 1–3 days |\n| Onset | Gradual | Acute, abrupt |\n| Fever, toxaemia | Absent/mild | **High fever, toxaemic** |\n| Stool volume and frequency | Moderate; 6–8 / day | Small, **very frequent** (10–20+) |\n| Stool nature | Dark brown, semi-liquid, **offensive**; blood admixed with stool (\"red-currant jelly\"); blood + mucus | Little faecal matter, mostly blood + mucus + pus; **not offensive** |\n| Reaction | **Acidic** | **Alkaline** |\n| Tenesmus, colic | Mild | **Severe** |\n| Macroscopy | Fills container, **does not stick** | Sticks to container |\n| Microscopy | **Scanty pus cells**; **clumped RBCs** (rouleaux); Charcot–Leyden crystals; **macrophages**; trophozoites with ingested RBCs; **no bacteria** | **Numerous pus cells (neutrophils)**; macrophages; RBCs scattered; **many bacteria** |\n| Eosinophils | Present | Rare |\n| Culture | No bacterial pathogen | *Shigella* on MacConkey/DCA/SS agar |\n| Ulcers | Flask-shaped, deep, with normal intervening mucosa | Superficial, diffuse, patchy |\n| Site | Caecum, ascending colon, sigmoid–rectum | Rectum, sigmoid (left colon) |\n| Complications | Liver abscess, ameboma, perforation, stricture | Dehydration, HUS, toxic megacolon, reactive arthritis |\n| Treatment | **Metronidazole/tinidazole** + luminal agent | **Ciprofloxacin/azithromycin**, ORS |"}, {"id": 222, "n": 222, "t": "*Vignette: a 30-year-old man with abdominal pain and passage of blood/mucus in stool; stool microscopy shows trophozoites with ingested RBCs.* Organism and morphological forms; pathogenesis of hepatic amoebiasis.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*Vignette — a 30-year-old man with abdominal pain and blood/mucus in the stool; stool microscopy shows trophozoites with ingested RBCs.*\n\n**(a) Organism:** ***Entamoeba histolytica*** — causing **amoebic dysentery** (acute intestinal amoebiasis). *Ingested RBCs* are pathognomonic of *E. histolytica* trophozoites.\n\n**(b) Morphological forms:**\n1. **Trophozoite** (12–60 µm; ecto-/endoplasm; one nucleus with central karyosome and fine peripheral chromatin; ingested RBC) — *pathogenic*.\n2. **Precyst** — transitional.\n3. **Cyst** (10–20 µm; 1, 2 or 4 nuclei; chromatoid bars; glycogen mass) — **infective** when quadrinucleate.\n\n**(c) Pathogenesis of hepatic amoebiasis (if complicated):** trophozoites from the base of colonic ulcers invade mesenteric venules → portal vein emboli → trapped in hepatic sinusoids → kill neutrophils/hepatocytes (amoebapore, proteases, lectin) → portal venule thrombosis and ischaemic necrosis → coalescence of microabscesses, liquefaction → large solitary abscess in the postero-superior right lobe with \"anchovy-sauce\" pus (see #217).\n\n**Management note:** metronidazole (or tinidazole) followed by a luminal amoebicide (paromomycin)."}, {"id": 223, "n": 223, "t": "*Vignette: a 40-year-old livestock farmer with RUQ fullness, hepatomegaly and a cystic liver lesion.* Diagnosis, etiological agent, infective form.", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*Vignette — a 40-year-old livestock farmer with right upper-quadrant fullness, hepatomegaly and a cystic liver lesion.*\n\n**Diagnosis:** **Hydatid cyst of the liver (cystic echinococcosis).**\nReasoning: rural livestock/dog contact (sheep–dog cycle), slowly growing cystic liver mass with **hepatomegaly and RUQ fullness** but without the acute febrile illness, dysentery history or leucocytosis of amoebic liver abscess. *Differential: amoebic liver abscess (acute, febrile, painful, leucocytosis), pyogenic abscess, simple cyst, cystic tumour.*\n\n**Etiological agent:** ***Echinococcus granulosus*** (dog tapeworm). Definitive host: **dog**; intermediate hosts: sheep, cattle, pig, **man (accidental, dead-end)**.\n\n**Infective form:** **egg** (embryonated, containing the six-hooked oncosphere) — ingested through contact with infected dogs' faeces or contaminated vegetables/water.\n\n**Confirmation:** USG/CT (daughter cysts, \"water-lily\" sign, calcified wall); serology (IHA, ELISA, immunoelectrophoresis arc 5); Casoni's test (obsolete). **Do not perform needle aspiration** without albendazole cover (anaphylaxis/spillage).\n**Treatment:** albendazole + surgery or PAIR (puncture–aspiration–injection–reaspiration) with a protoscolicidal agent.\n\n*(See #331–#335 for details of hydatid cyst.)*"}, {"id": 224, "n": 224, "t": "*Vignette: a 35-year-old man with dysentery, alternating constipation/diarrhoea, RUQ pain/fever, and a cystic liver lesion.* Diagnosis, liver involvement, sample and tests for diagnosis.", "st": 0, "src": "DU-19M", "du": ["DU-19M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*Vignette — a 35-year-old man with dysentery, alternating constipation/diarrhoea, right-hypochondrial pain with high fever, and a cystic lesion in the right lobe on USG.*\n\n**(a) Diagnosis:** **Amoebic liver abscess** complicating chronic intestinal amoebiasis.\n\n**(b) Liver involvement:** trophozoites of *E. histolytica* from the base of colonic ulcers are carried by **portal-vein radicles** as emboli; the hepatic sinusoids trap them; focal necrosis (ischaemic + cytolytic) → liquefaction → abscess (see #217).\n\n**(c) Samples:** **blood** (CBC, serology); **pus** from the abscess; **stool**; (liver biopsy of the abscess wall).\n\n**(d) Tests:**\n- CBC: neutrophilic **leucocytosis**; ESR ↑.\n- **Pus** — gross (anchovy-sauce) and microscopy (necrotic cells; trophozoites at the wall).\n- **Serology** — IHA/ELISA antibody; lectin antigen; **PCR**.\n- **Stool microscopy** — cysts/trophozoites (< 15%).\n- **Imaging** — USG (first line), CT.\n- Therapeutic response to metronidazole."}, {"id": 225, "n": 225, "t": "State the clinical features of amoebiasis.", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Amoebiasis** — all conditions produced by *E. histolytica*. Over 90% of infections are **asymptomatic** (cyst passers — the main reservoir).\n\n**A. Intestinal amoebiasis**\n1. **Asymptomatic carrier state.**\n2. **Acute amoebic dysentery** — abdominal colic, tenesmus, **frequent loose stools with blood and mucus** (6–10/day), little or no fever, tender abdomen over the colon.\n3. **Fulminant colitis** (rare) — severe bloody diarrhoea, toxaemia, perforation, peritonitis; very high mortality.\n4. **Chronic amoebic colitis** — intermittent diarrhoea alternating with constipation, flatulence, weight loss, weakness, anaemia.\n5. **Ameboma** — granulomatous mass in caecum or rectosigmoid, mimicking carcinoma.\n6. **Complications:** perforation, haemorrhage, appendicitis, stricture, intussusception, toxic megacolon.\n\n**B. Extra-intestinal amoebiasis**\n1. **Liver abscess** (commonest): RUQ pain, fever, tender hepatomegaly, weight loss.\n2. **Pleuro-pulmonary:** from rupture of liver abscess — empyema, lung abscess, hepatobronchial fistula, \"chocolate-coloured\" sputum.\n3. **Pericardial** (left-lobe abscess rupture) — tamponade.\n4. **Brain abscess** (rare), **splenic abscess**.\n5. **Cutaneous** (peri-anal, genital); **amoebic vaginitis/balanitis** (rare)."}, {"id": 226, "n": 226, "t": "What is anchovy sauce pus? Give its microscopic findings and important points in favor.", "st": 2, "src": "Board 2 Set 06, 11", "du": [], "nmc": [], "vv": ["Board 2 Set 06", "Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Anchovy-sauce pus** is the classical aspirate of **amoebic liver abscess**. It is *not true pus*; it is a **mixture of liquefied (lysed) liver tissue and altered blood**.\n\n**Characteristics**\n- **Colour:** chocolate or reddish-brown, resembling \"anchovy sauce\" (tomato-ketchup/paste).\n- **Consistency:** thick, viscid, semi-fluid, **odourless** (rarely foul).\n- **Bacteriologically sterile** (unless secondarily infected).\n\n**Microscopic findings**\n- **Necrotic debris and degenerated hepatocytes**; a **few RBCs**; **few or no pus cells** (neutrophils are killed by amoebae).\n- **Trophozoites** are usually *absent* in the freshly aspirated central fluid; they are found in the **last portion of the aspirate or in the abscess wall (periphery)**.\n- **No cysts** (cysts never occur in extra-intestinal lesions).\n\n**Important points in favour of amoebic nature**\n1. Characteristic colour and odourless pus.\n2. Sterile culture.\n3. Few leucocytes; presence of necrotic hepatocytes.\n4. Positive **serology** (antibody; lectin antigen) and PCR.\n5. History of dysentery (not always present) and single right-lobe lesion on USG.\n6. Dramatic **response to metronidazole**.\n\n**Viva point.** *Pyogenic* abscess pus: yellowish-green, foul, many neutrophils, bacteria on Gram stain."}]}, {"id": "parasitology-4", "title": "Giardia intestinalis", "qs": [{"id": 227, "n": 227, "t": "Describe the morphological forms of *Giardia lamblia*, with diagram. — Also asked: state its pathogenesis.", "st": 2, "src": "DU-25M; Board 2 Set 10", "du": ["DU-25M"], "nmc": [], "vv": ["Board 2 Set 10"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n*Giardia lamblia* (syn. *G. intestinalis*, *G. duodenalis*) exists in **two forms**: **trophozoite** (vegetative, pathogenic) and **cyst** (infective, resistant).\n\n**1. Trophozoite**\n- **Shape:** pear/tennis-racket shaped (flat view), **bilaterally symmetrical**; 9–21 µm × 5–15 µm. Side view — curved like a half-pear/spoon.\n- **Dorsal surface convex; ventral surface concave with a large adhesive \"sucking disc\"** (occupying the anterior half).\n- **Two nuclei** (anterior, each with a large central karyosome, no peripheral chromatin) giving a face-like (\"**old man with spectacles**\") appearance.\n- **Four pairs of flagella** (anterior, lateral, ventral, caudal), **two axostyles** (axonemes) running down the midline, and **two median (parabasal) bodies** (curved, \"claw hammer\") posterior to the disc.\n- **Motility:** characteristic **\"falling-leaf\"** tumbling motion.\n- No mitochondria or Golgi (diplomonad); feeds by pinocytosis.\n\n**2. Cyst**\n- **Oval**, 8–14 × 7–10 µm, **thick, smooth, hyaline wall** with a clear halo (cytoplasm shrunken from wall).\n- **Four nuclei** (clustered at one end in mature cyst), **axonemes** lying diagonally, remnants of sucking disc and **median bodies** (4); **no flagella visible**.\n\n**Diagram**\n\n```\n   TROPHOZOITE (ventral view)                 CYST\n   ┌────────────────────────┐              ╭────────────╮\n  ╱  ◉           ◉  (2 nuclei)╲            │  ◉ ◉  ◉ ◉  │  4 nuclei\n │   ╲ sucking disc ╱          │           │   ╲ axonemes │\n │ ═══ axostyles ═══  ▬▬ median │           │  ▬ median    │\n  ╲  bodies          ╱           │           │  bodies    │\n   ╲   flagella ×8 (4 pairs)    ╱            ╰────────────╯\n     ╲_____________╱  tapering tail           oval, thick wall\n```\n\n*Labels:* sucking disc, two nuclei, axostyles, median bodies, 4 pairs of flagella (anterior, lateral, ventral, caudal); cyst wall, nuclei ×4, axonemes, median bodies.\n\n**Pathogenesis (also asked)** — see #229.\n\n**Viva points**\n- 2 nuclei (trophozoite) → 4 nuclei (cyst): \"**2-4-8**\" (2 nuclei, 4 nuclei, 8 flagella).\n- Only protozoan living in the lumen of the human **small intestine**.\n- Trophozoite = pathogenic; cyst = infective."}, {"id": 228, "n": 228, "t": "Write the mode of transmission of *Giardia lamblia*.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mode of transmission of *Giardia lamblia*** — **faeco-oral**, by ingestion of **mature (4-nucleate) cysts**:\n1. **Contaminated water** — most important (waterborne epidemics; **cysts resist chlorination** at usual concentrations; removed by filtration and killed by boiling).\n2. **Contaminated food and vegetables**; house-flies and cockroaches (mechanical).\n3. **Person-to-person** — hand-to-mouth in children (day-care, orphanages), poor personal hygiene; **anal–oral sexual contact** (MSM).\n4. **Zoonotic** — beavers, dogs, cattle, sheep (reservoirs).\n5. Travellers and campers drinking untreated stream water.\n\n**Infective dose:** as few as **10–100 cysts**.\n**Risk groups:** children, malnourished, IgA deficiency/hypogammaglobulinaemia, achlorhydria, travellers, institutionalised persons.\n**Cyst viability:** weeks in cold water."}, {"id": 229, "n": 229, "t": "What is the pathogenesis of giardiasis?", "st": 4, "src": "NMC 1; NMC 3; DU-18Nov, 24N", "du": ["DU-18Nov", "DU-24N"], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Pathogenesis (sequential)**\n1. **Ingestion** of cysts → **excystation** in the duodenum (gastric acid and pancreatic enzymes) → **two trophozoites** per cyst.\n2. Trophozoites **multiply by longitudinal binary fission** in the lumen of the duodenum/jejunum and **attach to the epithelium** by the **ventral sucking disc** (aided by a lectin activated by duodenal secretions) — *they do not invade the mucosa or enter blood*.\n3. **Mucosal injury:** large numbers coat the villi → **mechanical blockade** of absorption; **brush-border damage**; **flattening and shortening (blunting) of villi**, crypt hyperplasia, lymphocytic infiltration of lamina propria, epithelial **apoptosis**.\n4. **Loss of disaccharidases** (lactose intolerance) and reduced absorption of fat, fat-soluble vitamins (A, D, E, K), vitamin B₁₂, folate, iron and xylose.\n5. **Bile-salt deconjugation and altered motility**; bacterial overgrowth in the jejunum.\n6. **Net result:** **malabsorption** → **steatorrhoea** (pale, bulky, foul, floating stool), flatulence, abdominal cramps, weight loss; in children failure to thrive.\n7. **Host factors:** **IgA deficiency**, hypogammaglobulinaemia, achlorhydria, blood group A, malnutrition predispose to chronic/symptomatic infection; **variant-specific surface proteins (VSPs)** allow antigenic variation.\n8. **Blocked bile-duct theory (older text):** attachment over the papilla blocks bile entry → defective fat emulsification → steatorrhoea.\n\n**Clinical features:** incubation 1–3 weeks; **sudden foul-smelling watery diarrhoea, flatulence, epigastric cramps, steatorrhoea, anorexia, nausea; no blood, mucus (little), no fever**; ~50% are asymptomatic carriers; chronic giardiasis → malabsorption syndrome mimicking coeliac disease.\n\n**Viva points**\n- **Non-invasive** — no blood/pus in stool.\n- Chlorination does not kill cysts; **no vaccine**.\n- Treatment: **metronidazole / tinidazole / nitazoxanide**."}, {"id": 230, "n": 230, "t": "Write/describe the laboratory diagnosis of giardiasis.", "st": 4, "src": "DU-26M, 18Nov, 24N; Board 2 Set 03", "du": ["DU-26M", "DU-18Nov", "DU-24N"], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Principle:** demonstration of **cysts or trophozoites** in faeces/duodenal contents, or of **antigen/DNA**.\n\n**Specimens:** faeces; **duodenal aspirate/string-test** sample; jejunal biopsy; bile.\n\n**1. Stool examination (first-line)**\n- **Macroscopic:** pale, bulky, greasy, foul-smelling, floating stool (steatorrhoea); no blood.\n- **Microscopic — saline and iodine wet mounts:** formed stool → **cysts**; diarrhoeal stool → **trophozoites** (\"falling-leaf\" motility) and cysts; carriers → cysts only.\n- **Concentration** (formol–ether, zinc sulphate floatation) improves yield; **permanent stain** (trichrome/iron-haematoxylin).\n- **Excretion is intermittent (\"showers\")** → examine **3 specimens on alternate days**; a single negative stool does **not** exclude giardiasis.\n\n**2. Duodenal specimens (if stool negative but suspicion high)**\n- **Duodenal aspiration** (trophozoites in aspirate or bile).\n- **String test (Entero-Test):** patient swallows a weighted gelatin capsule with a coiled thread; after ~2–4 hours the thread is withdrawn, the mucus examined for trophozoites.\n- **Jejunal/duodenal biopsy** — trophozoites between villi; villous atrophy.\n\n**3. Antigen detection:** stool **ELISA / immunochromatography / DFA** (Giardia-specific antigen **GSA-65**) — more sensitive than microscopy; indicates active infection.\n\n**4. Molecular:** PCR/multiplex NAAT (sensitivity ≈ 98–100%, specificity ≈ 99%).\n\n**5. Serology:** antibody tests **not useful** (cannot distinguish current from past infection).\n\n**6. Others:** steatorrhoea — fat globules on Sudan III stain; ↓D-xylose absorption."}, {"id": 231, "n": 231, "t": "What is the infective form of *Giardia lamblia* and *Trichomonas vaginalis*?", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Protozoan | Infective form |\n|---|---|\n| ***Giardia lamblia*** | **Mature (quadrinucleate) cyst** — ingested by faeco-oral route |\n| ***Trichomonas vaginalis*** | **Trophozoite** — transmitted directly by **sexual contact** (no cyst stage exists) |\n\n**Viva point.** *Trichomonas* has **no cyst** because it is transmitted by direct sexual contact and need not survive in the external environment."}, {"id": 232, "n": 232, "t": "\"Ingestion of *Giardia lamblia* trophozoite will not lead to infection\" – explain.", "st": 2, "src": "Board 2 Set 17, 18", "du": [], "nmc": [], "vv": ["Board 2 Set 17", "Board 2 Set 18"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Statement: \"Ingestion of *Giardia lamblia* trophozoite will not lead to infection\" — TRUE (as a rule).**\n\n**Explanation**\n1. The **trophozoite is a fragile, vegetative form**, delicate and wall-less; it dies rapidly outside the host (drying, temperature).\n2. It is **destroyed by gastric HCl and pepsin** in the stomach and cannot survive transit to the duodenum.\n3. Only the **cyst** possesses a **thick, resistant wall** that withstands gastric acid, cold water and chlorination, and **excystation is triggered by gastric acid and duodenal enzymes** in the duodenum.\n4. Therefore the **cyst is the only infective form**; trophozoites passed in diarrhoeal stool are not infective to others.\n\n**Similarly:** trophozoites of *E. histolytica* are non-infective; **trophozoite of *T. vaginalis* is infective** only because it is transmitted by direct sexual contact (no gastric passage)."}, {"id": 233, "n": 233, "t": "What are the differences between lesions caused by *E. histolytica* and *Giardia lamblia*?", "st": 0, "src": "Board 2 Set 14", "du": [], "nmc": [], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Feature | ***E. histolytica*** | ***G. lamblia*** |\n|---|---|---|\n| Site | **Large intestine** (caecum, colon, rectum); liver | **Duodenum and jejunum** (lumen) |\n| Mechanism | **Invasion** and **cytolysis** of mucosa | **Adhesion**, mechanical blockade and brush-border damage |\n| Lesion | **Flask-shaped ulcers**, necrosis, **liver abscess** | **Villous blunting/flattening**, lymphocytic infiltrate; **no ulcers, no necrosis** |\n| Inflammatory response | Scanty (amoebae kill neutrophils) | Mild lymphocytic |\n| Spread | **Haematogenous** (liver, lung, brain) | None (confined to gut lumen) |\n| Diarrhoea | **Dysentery** — blood + mucus | **Watery, fatty**, foul; no blood |\n| Net effect | Tissue destruction | **Malabsorption** (steatorrhoea) |\n| Complications | Perforation, ameboma, stricture, abscesses | Lactose intolerance, vitamin deficiency, failure to thrive |\n| Stool | Trophozoites with RBC | Cysts and trophozoites, **no RBC** |"}]}, {"id": "parasitology-5", "title": "Trichomonas vaginalis", "qs": [{"id": 234, "n": 234, "t": "*Vignette: a 35-year-old married woman with greenish, foul-smelling vaginal discharge, itching and dysuria; strawberry cervix.* Clinical diagnosis, etiological agent, key points of laboratory diagnosis.", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*Vignette — a 35-year-old married woman with greenish, foul-smelling vaginal discharge, itching and dysuria; speculum examination shows a \"strawberry cervix\".*\n\n**(a) Clinical diagnosis:** **Vaginal trichomoniasis** (*Trichomonas vaginitis*), a sexually transmitted infection. Strawberry cervix (**colpitis macularis**) — punctate haemorrhagic spots on the cervix — is highly characteristic, though seen in only ~2–5% (up to 45% colposcopically).\n\n**(b) Etiological agent:** ***Trichomonas vaginalis*** — a pear-shaped flagellate **trophozoite** (no cyst).\n\n**(c) Key points of laboratory diagnosis**\n1. **Specimen:** **high vaginal swab** (posterior fornix); in males — urethral discharge / urine sediment / prostatic secretion.\n2. **Saline wet mount (fresh, within 10–20 min):** **motile, pear-shaped trophozoites with \"jerky\" (twitching, tumbling) motion**, 4 anterior flagella and undulating membrane; plenty of pus cells. Sensitivity ~50–70%.\n3. **Stains:** Giemsa/Papanicolaou — non-motile; acridine orange, **direct fluorescent antibody**.\n4. **Culture** — modified **Diamond's medium**, CPLM, **InPouch TV**; pH 5.5–6.0, 37 °C; positive in 2–7 days (gold standard historically).\n5. **NAAT/PCR, antigen-detection** (point-of-care) — most sensitive.\n6. **Vaginal pH > 4.5**; positive **whiff test** can accompany (not specific).\n7. **Treatment:** **metronidazole/tinidazole** for **both partners**."}, {"id": 235, "n": 235, "t": "Describe briefly the pathogenic form of *Trichomonas*.", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Pathogenic form of *Trichomonas vaginalis* = the trophozoite** (the only stage; no cyst).\n\n- **Shape/size:** pear-shaped (pyriform) or ovoid, **10–30 µm × 5–10 µm**.\n- **Flagella:** **five** — **four free anterior flagella** and **one recurrent flagellum** forming the outer margin of the **undulating membrane**.\n- **Undulating membrane:** short, extending about **half to two-thirds** of the body length; **supported by the costa** (rod-like structure at its base).\n- **Axostyle:** rigid central rod projecting posteriorly as a pointed tail — attaches to epithelium and may injure cells.\n- **Nucleus:** single, oval, anterior; **parabasal body**, **hydrogenosomes** (energy organelles); **siderophilic granules**.\n- **Motility:** characteristic **jerky, twitching, tumbling** movement.\n- **Habitat:** vagina and urethra (female), prostate, seminal vesicles and urethra (male). **Infective and pathogenic stage: trophozoite.**\n\n**Viva points**\n- Only trophozoite — **no cyst**; transmitted by **sexual intercourse** (rarely fomites; vertical during childbirth).\n- Stain: Giemsa; best seen unstained by motility."}, {"id": 236, "n": 236, "t": "State in short the life cycle and pathogenesis of *Trichomonas vaginalis*.", "st": 0, "src": "Board 2 Set 13", "du": [], "nmc": [], "vv": ["Board 2 Set 13"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Life cycle (monoxenous, direct)**\n- **Single host: man**; **single stage: trophozoite**; no cyst, no intermediate host, no animal reservoir.\n- **Transmission:** **sexual intercourse** (trophozoites in vaginal/urethral/prostatic secretions); occasionally **fomites** (wet towels, toilet seats) and **vertical** (newborn girls during passage through an infected birth canal — vaginitis/pneumonia).\n- **Replication:** trophozoites colonise the squamous epithelium of the vagina/urethra (female) and the urethra/prostate (male), multiplying by **longitudinal binary fission**.\n- Incubation: 4–28 days (average ~10 days).\n\n**Pathogenesis**\n1. Trophozoites **adhere to vaginal squamous epithelial cells** by adhesins and **contact-dependent cytotoxicity** (cysteine proteinases, haemolysins, cell-detaching factor).\n2. Loss of acidity: infection raises **vaginal pH to > 4.5**, reducing *Lactobacillus* and favouring further growth.\n3. **Epithelial damage, neutrophilic infiltration, capillary dilatation and petechial haemorrhages** (\"strawberry cervix\"); the organism is **non-invasive** and **produces no exotoxin**.\n4. **Clinical features:** **frothy, greenish-yellow, foul-smelling vaginal discharge**, itching/burning, dysuria, dyspareunia, post-coital bleeding. Males: **mostly asymptomatic** carriers (reservoir); ~10% urethritis, prostatitis.\n5. **Complications:** premature rupture of membranes and preterm labour, low birth weight, **increased risk of HIV acquisition/transmission**, endometritis, pelvic inflammatory disease, infertility.\n\n**Viva points**\n- Treat **both partners** simultaneously with metronidazole/tinidazole; avoid alcohol (disulfiram-like reaction).\n- Differential diagnosis: candidiasis (curdy white, pH < 4.5), bacterial vaginosis (fishy odour, clue cells)."}]}, {"id": "parasitology-6", "title": "Cryptosporidium & Opportunistic Intestinal Protozoa", "qs": [{"id": 237, "n": 237, "t": "What are the opportunistic intestinal pathogens?", "st": 0, "src": "Board 2 Set 01", "du": [], "nmc": [], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Opportunistic intestinal pathogens** cause severe, protracted disease in **immunocompromised persons** (AIDS with CD4 < 100/µL, malignancy, transplant, malnutrition), but self-limiting disease in healthy people.\n\n| Pathogen | Type | Infective form | Disease and diagnostic clue |\n|---|---|---|---|\n| ***Cryptosporidium hominis / C. parvum*** | Coccidian protozoan | **Oocyst** (4–6 µm; chlorine-resistant) | Profuse watery diarrhoea; **modified Ziehl–Neelsen (Kinyoun) acid-fast** — red oocysts |\n| ***Cyclospora cayetanensis*** | Coccidian | Sporulated oocyst (8–10 µm) | Prolonged, relapsing watery diarrhoea (imported berries/herbs); variably acid-fast, **UV autofluorescence** |\n| ***Cystoisospora (Isospora) belli*** | Coccidian | Sporulated oocyst (20–30 µm) | Chronic diarrhoea with **eosinophilia**; acid-fast; **cotrimoxazole** |\n| **Microsporidia** (*Enterocytozoon bieneusi*, *Encephalitozoon*) | Fungi-like spore-forming | Spore | Chronic diarrhoea; chromotrope or modified trichrome stain |\n| ***Strongyloides stercoralis*** | Nematode | Filariform larva | Hyperinfection syndrome |\n| *Balantidium coli*, *Blastocystis*, *Giardia* | — | — | Occasionally more severe |\n\n**Viva points**\n- Coccidia stain with **modified acid-fast** stain.\n- Treatment: nitazoxanide (*Cryptosporidium*), cotrimoxazole (*Cyclospora*, *Cystoisospora*), albendazole/fumagillin (microsporidia), **antiretroviral therapy** restores immunity."}, {"id": 238, "n": 238, "t": "What is the clinical importance of *Cryptosporidium parvum*?", "st": 0, "src": "Board 2 Set 15", "du": [], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n***Cryptosporidium parvum* / *C. hominis*** (Gr. \"hidden spore\") — an **obligate intracellular coccidian**; exhibits both asexual (schizogony) and sexual (gametogony) cycles. *C. hominis* is the species mainly in humans; *C. parvum* is zoonotic (cattle, calves).\n\n**Clinical importance**\n1. **Common cause of waterborne diarrhoea** worldwide — large outbreaks from municipal supplies and swimming pools because **oocysts resist chlorination** (killed by boiling/pasteurisation, removed by filtration).\n2. **Immunocompetent:** self-limiting watery diarrhoea (1–2 weeks), abdominal cramps, low-grade fever.\n3. **AIDS and other immunodeficiency (CD4 < 100):** **profuse, chronic, life-threatening watery diarrhoea** (up to several litres/day), wasting, malabsorption; may involve biliary tree (AIDS cholangiopathy) and respiratory tract.\n4. **Malnourished children** in developing countries — persistent diarrhoea, growth faltering.\n5. Zoonosis: calves/cattle; person-to-person (day-care, hospitals).\n\n**Life cycle:** **thick-walled oocyst** (infective, 4–6 µm; contains 4 sporozoites) ingested → excystation in small intestine → sporozoites → trophozoites in the **brush border** (intracellular but extracytoplasmic) → schizonts → merozoites → micro- and macrogametes → zygote → **oocysts (thick-walled — passed in stool; thin-walled — autoinfection)**.\n\n**Diagnosis:** **modified Ziehl–Neelsen (Kinyoun) acid-fast stain** of stool — pink-red round oocysts 4–6 µm on a blue-green background; auramine fluorescence; stool **antigen detection (ELISA, immunofluorescence)**; PCR. Routine O&P is insufficient.\n\n**Treatment and prevention:** **nitazoxanide** (self-limited in immunocompetent; in HIV, antiretroviral therapy is key); no vaccine; boiling/filtration of water, hand hygiene, avoid swimming during diarrhoea.\n\n**Viva points**\n- Oocyst: **infective form**; **resistant to chlorination**.\n- Diagnosis: **modified acid-fast stain**."}]}, {"id": "parasitology-7", "title": "Leishmania Species & PKDL", "qs": [{"id": 239, "n": 239, "t": "Name the important haemoflagellates, with the diseases they produce.", "st": 2, "src": "NMC 4; DU-22M", "du": ["DU-22M"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Haemoflagellates** are flagellate protozoa (order *Kinetoplastida*, family *Trypanosomatidae*) that live in the blood and tissues of man and are transmitted by blood-sucking arthropods. They possess a **flagellum and a kinetoplast** at some stage of the life cycle.\n\n| Haemoflagellate | Disease produced | Vector | Distribution |\n|---|---|---|---|\n| ***Leishmania donovani*** | Visceral leishmaniasis (**kala-azar**); PKDL | *Phlebotomus argentipes* | India, **Bangladesh**, Nepal, East Africa |\n| *L. infantum* (= *L. chagasi*) | Mediterranean and New World visceral leishmaniasis | *Phlebotomus* spp.; *Lutzomyia longipalpis* | Mediterranean, Middle East, Latin America |\n| *L. tropica* | Old World cutaneous leishmaniasis (oriental sore, Delhi boil) | *P. sergenti* | Asia, Middle East |\n| *L. major* | Zoonotic cutaneous leishmaniasis | *P. papatasi* | Middle East, Africa |\n| *L. mexicana* complex | New World cutaneous leishmaniasis (chiclero's ulcer) | *Lutzomyia* spp. | Central/South America |\n| *L. braziliensis* | Mucocutaneous leishmaniasis (**espundia**) | *Lutzomyia* spp. | Central/South America |\n| *Trypanosoma brucei gambiense* | West African sleeping sickness (chronic) | *Glossina palpalis* group | West/Central Africa |\n| *T. b. rhodesiense* | East African sleeping sickness (acute) | *Glossina morsitans* group | East/Southern Africa |\n| *T. cruzi* | Chagas' disease (American trypanosomiasis) | Reduviid (triatomine) bug | Central/South America |\n\n**Viva points**\n- In Bangladesh only *L. donovani* is endemic; the vector is the female sandfly *P. argentipes*.\n- Bangladesh was the **first country validated by WHO (October 2023)** for elimination of kala-azar as a public health problem (< 1 case/10,000 population at upazila level)."}, {"id": 240, "n": 240, "t": "Describe the morphological forms of *Leishmania donovani*, with diagram.", "st": 0, "src": "DU-25M", "du": ["DU-25M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*L. donovani* exists in **two morphological forms**: the **amastigote** (in man) and the **promastigote** (in the sandfly vector and in culture).\n\n```\n AMASTIGOTE (LD body)                 PROMASTIGOTE\n intracellular, in man                extracellular, sandfly gut / NNN culture\n\n     _______                          free flagellum\n   /  _____  \\                  ~~~~~~~~~~~~~~~~~~~~~~~~~  \n  |  / N   \\  |                B ● K      N\n  |  \\_____/  |                |____ spindle-shaped body ____|\n  |   ▬ K     |                      15-25 x 1.5-3.5 um\n   \\  ● B    /\n    \\_______/                  N = nucleus   K = kinetoplast\n  2-4 um, ovoid,               B = basal body (flagellum arises here)\n  no free flagellum\n```\n*Fig. Morphological forms of* L. donovani.\n\n| Feature | Amastigote (LD body) | Promastigote |\n|---|---|---|\n| Habitat | Inside macrophages/monocytes of the RE system (spleen, liver, marrow, nodes) | Sandfly midgut and proboscis; NNN culture at 22–25 °C |\n| Shape and size | Round to oval, 2–4 µm | Elongated, spindle-shaped, 15–25 × 1.5–3.5 µm |\n| Flagellum | No free flagellum (rudimentary axoneme) | One long free anterior flagellum |\n| Kinetoplast | Rod-shaped, at right angle to nucleus | Anterior (pre-nuclear), near basal body |\n| Motility | Non-motile | Actively motile; forms rosettes in culture |\n| Role | Pathogenic and diagnostic form; **infective to sandfly** | **Infective form to man** |\n| Giemsa/Leishman stain | Pale-blue cytoplasm, red-purple nucleus, deep-red rod-like kinetoplast | Same pattern |\n\n**Viva points**\n- Amastigotes are called **Leishman–Donovan (LD) bodies**.\n- **Kinetoplast** = mass of mitochondrial DNA (kDNA) near the flagellar base; characteristic of order Kinetoplastida."}, {"id": 241, "n": 241, "t": "Mention the infective form of *Leishmania donovani* (Kala-azar).", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nThe **infective form of *L. donovani* to man is the metacyclic promastigote**, injected into the skin by the bite of an infected **female** sandfly (*Phlebotomus argentipes* in the Indian subcontinent).\n\n- In man the promastigote is engulfed by macrophages and transforms into the **amastigote**, the pathogenic and diagnostic form.\n- The amastigote is the form **infective to the sandfly**; it reverts to promastigotes in the vector's midgut.\n- In the sandfly, promastigotes multiply and migrate to the pharynx and proboscis; the cycle takes about 10 days."}, {"id": 242, "n": 242, "t": "Mention/explain the causes/mechanism of anaemia in Kala-azar.", "st": 5, "src": "DU-22N, 24M, 23N, 25M, 18M", "du": ["DU-22N", "DU-24M", "DU-23N", "DU-25M", "DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nAnaemia in kala-azar is **multifactorial**, typically **normocytic normochromic**, and forms part of a **pancytopenia**.\n\n1. **Bone-marrow suppression:** infiltration by parasitised macrophages and RE-cell hyperplasia reduce erythropoiesis (dyserythropoiesis); cytokines (TNF-α, IFN-γ, IL-1) impair iron utilisation and red-cell production.\n2. **Hypersplenism:** massive splenomegaly sequesters and destroys red cells (red-cell survival roughly halved).\n3. **Immune haemolysis:** anti-red-cell antibodies and immune complexes coat red cells (direct Coombs' test may be positive).\n4. **Haemorrhage:** epistaxis, gum and GI bleeding from thrombocytopenia and reduced hepatic synthesis of clotting factors.\n5. **Haemodilution:** expanded plasma volume (splenomegaly, hypergammaglobulinaemia).\n6. **Nutritional factors:** anorexia, malnutrition, folate deficiency, co-existing hookworm in rural patients.\n\n**Viva points**\n- Dominant picture: pancytopenia (anaemia + leucopenia + thrombocytopenia).\n- Type: normocytic normochromic."}, {"id": 243, "n": 243, "t": "Name the *Leishmania* species that cause visceral leishmaniasis.", "st": 0, "src": "DU-18Nov", "du": ["DU-18Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Species | Visceral leishmaniasis pattern | Region |\n|---|---|---|\n| *L. donovani* | Indian (anthroponotic) kala-azar; East African kala-azar | Indian subcontinent (India, **Bangladesh**, Nepal), Sudan, Ethiopia, Kenya |\n| *L. infantum* | Mediterranean/infantile (zoonotic; reservoir dog) kala-azar | Mediterranean basin, Middle East, Central Asia, China |\n| *L. infantum* (= *L. chagasi*) | New World visceral leishmaniasis | Brazil and Latin America |\n\n*Note:* *L. archibaldi* (Sudan) is regarded as a synonym of *L. donovani*. In Bangladesh only *L. donovani* occurs, and **man is the main reservoir**."}, {"id": 244, "n": 244, "t": "Describe/state the pathogenesis of visceral leishmaniasis/Kala-azar.", "st": 3, "src": "NMC 4; DU-19Nov, 18Nov", "du": ["DU-19Nov", "DU-18Nov"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mode of infection:** bite of the infected **female** sandfly (only females take blood meals); rarely blood transfusion, shared needles, congenital transmission.\n**Incubation period:** usually 2–6 months (range: weeks to years).\n\n**Pathogenesis (sequence)**\n\n1. Promastigotes injected into the skin are taken up by macrophages (via complement and mannose receptors).\n2. Within the phagolysosome they transform into **amastigotes**; virulence factors (**gp63**, lipophosphoglycan, acid phosphatase) protect them from complement and oxidative killing.\n3. Amastigotes multiply by binary fission; the macrophage ruptures and the freed parasites infect fresh cells. Dissemination occurs through the **RE system: spleen, liver, bone marrow, lymph nodes**.\n4. **Immune dysregulation:** poor Th1 response (low IL-12/IFN-γ), high IL-10, T-cell anergy and polyclonal B-cell activation → **hypergammaglobulinaemia** (non-protective IgG) and immune-complex formation (glomerulonephritis).\n5. **Consequences**\n   - Hepatosplenomegaly (proliferating macrophages + sequestered blood cells); spleen may be massive.\n   - Pancytopenia: anaemia, leucopenia, thrombocytopenia.\n   - Fever, wasting, hypoalbuminaemia, darkening of skin (kala-azar = \"black fever\").\n   - Immunosuppression → secondary infections (pneumonia, dysentery, TB) — the usual cause of death in untreated cases.\n\n**Viva points**\n- Cell infected: macrophage/monocyte of the RE system.\n- Untreated kala-azar is almost always fatal; recovery gives lasting immunity."}, {"id": 245, "n": 245, "t": "Describe the laboratory diagnosis of visceral leishmaniasis / Kala-azar.", "st": 10, "src": "NMC 1; NMC 3; DU-23N, 18Nov, 22N, 22M, 20Nov/July, 19Nov; Board 2 Set 04, 20", "du": ["DU-23N", "DU-18Nov", "DU-22N", "DU-22M", "DU-20Nov/July", "DU-19Nov"], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 04", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Principle:** clinical suspicion (fever > 2 weeks with splenomegaly in an endemic area) supported by demonstration of LD bodies or a positive serological test.\n\n**Specimens:** splenic aspirate, bone-marrow aspirate (sternum/iliac crest), lymph-node aspirate, peripheral blood (buffy coat, serum, EDTA blood for PCR).\n\n**A. Parasitological (direct) diagnosis — confirmatory**\n\n1. **Microscopy of Leishman/Giemsa-stained smears** — amastigotes (LD bodies) inside monocytes/macrophages.\n\n| Specimen | Approx. sensitivity | Remarks |\n|---|---|---|\n| Splenic aspirate | 93–99 % (highest) | Risk of fatal haemorrhage; avoid if platelets low |\n| Bone-marrow aspirate | 55–85 % | Safest and commonest |\n| Lymph-node aspirate | 50–65 % | |\n| Buffy-coat smear | Low | Useful in HIV co-infection |\n\n2. **Culture** — **NNN medium** at 22–25 °C for up to 4 weeks; promastigotes appear. Allows species identification/drug sensitivity; slow, least sensitive.\n3. **Animal inoculation** (golden hamster) — obsolete in routine practice.\n\n**B. Immunological diagnosis**\n\n- **Antibody detection:** **rK39 immunochromatographic strip test** (rapid, cheap, field-friendly), **DAT**, ELISA, IFAT, CFT.\n- **Antigen detection:** urinary latex agglutination (KAtex) — limited use.\n- *Limitations:* antibody persists for years after cure (cannot diagnose relapse); healthy endemic residents may be seropositive.\n\n**C. Molecular:** PCR (kDNA/ITS1) on blood, marrow or spleen — very sensitive; used for relapse and HIV co-infection.\n\n**D. Non-specific tests**\n\n- **Aldehyde (formol-gel) test of Napier:** 1 mL serum + 1–2 drops of 40 % formalin → **jellification and milky opacity** (like hard-boiled egg white) within 2–20 min = raised γ-globulin; positive only after 2–3 months of illness; also positive in myeloma, cirrhosis, schistosomiasis.\n- **Blood:** **pancytopenia**, raised ESR, **hypergammaglobulinaemia**, low albumin with reversed A:G ratio.\n\n**Bangladesh algorithm (upazila health complex):** fever > 2 weeks + splenomegaly → **rK39 rapid test** → positive: treat with single-dose **liposomal amphotericin B**; negative but strongly suspected → refer for marrow/splenic aspirate.\n\n**Viva points**\n- Most sensitive sample: splenic aspirate; safest: bone marrow.\n- Culture medium: NNN; form in smear: amastigote; form in culture: promastigote.\n- rK39 = first-line field test. Aldehyde test = non-specific."}, {"id": 246, "n": 246, "t": "Write the clinical features of PKDL.", "st": 2, "src": "NMC 1; NMC 3", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nPKDL develops in about 5–10 % of treated kala-azar patients in the Indian subcontinent, usually **1–3 years after apparent cure**, when the visceral infection has cleared but parasites persist in the skin.\n\n1. **Hypopigmented macules** — earliest and commonest lesion (predominant in Bangladesh), on trunk and limbs.\n2. **Erythematous patches** — \"butterfly\" distribution on cheeks, nose, chin; photosensitive.\n3. **Papules and yellowish-pink nodules/plaques** — soft, painless, granulomatous, on face, ears, trunk; **no ulceration**.\n4. No systemic symptoms; **no spontaneous healing**; lesions may coalesce.\n5. Mucosal (lip, tongue) involvement is rare.\n\n*Differential diagnosis:* lepromatous leprosy, vitiligo, pityriasis versicolor, tinea, syphilis."}, {"id": 247, "n": 247, "t": "Write short note on post-kala-azar dermal leishmaniasis (PKDL).", "st": 3, "src": "NMC 4; DU-22M; Board 2 Set 01", "du": ["DU-22M"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Definition.** Post-kala-azar dermal leishmaniasis (PKDL) is a chronic dermal complication of visceral leishmaniasis appearing after treatment and apparent clinical cure, caused by persistence of *L. donovani* in the skin.\n\n**Epidemiology:** about 5–10 % of treated cases in the Indian subcontinent (more frequent in Sudan); associated with incomplete treatment.\n\n**Pathogenesis:** parasites persist in dermal macrophages; local immune dysregulation (high IL-10, mixed Th1/Th2) permits survival and granuloma formation.\n\n**Clinical types:** macular (hypopigmented), papulo-nodular, mixed (see Q246).\n\n**Diagnosis:** typical lesions + history of kala-azar + **positive rK39/DAT** in most; confirmed by LD bodies in **slit-skin smear or skin biopsy** (scanty), culture, or PCR.\n\n**Treatment (Bangladesh protocol):** **miltefosine** (12 weeks) first line; liposomal amphotericin B regimens as alternative.\n\n**Public-health importance:** PKDL patients are an **infective reservoir** for sandflies between epidemics; detecting and treating them is essential to sustain kala-azar elimination.\n\n**Viva points**\n- PKDL = *L. donovani* in skin after kala-azar; slit-skin smear shows LD bodies."}, {"id": 248, "n": 248, "t": "Enumerate the specimens for diagnosis of Kala-azar and PKDL.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Disease | Specimens | Tests |\n|---|---|---|\n| **Kala-azar** | Splenic aspirate; bone-marrow aspirate; lymph-node aspirate; peripheral blood (buffy coat); serum; EDTA blood | Smear microscopy (LD bodies); NNN culture; rK39/DAT/ELISA; PCR; blood count; aldehyde test |\n| **PKDL** | **Slit-skin smear / skin biopsy** from lesion; serum; blood | LD bodies on Giemsa smear; histology; culture; rK39/DAT; PCR |"}, {"id": 249, "n": 249, "t": "*Vignette: a patient with a maculopapular rash on face/trunk, with a history of kala-azar treatment one year back.* Provisional diagnosis, causative agent, sample/tests for diagnosis.", "st": 0, "src": "DU-18M", "du": ["DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Provisional diagnosis:** **Post-kala-azar dermal leishmaniasis (PKDL)** — rash of face and trunk one year after kala-azar treatment.\n- **Causative agent:** *Leishmania donovani*.\n- **Samples:** slit-skin smear or skin biopsy from lesions; blood/serum.\n- **Tests:** Giemsa/Leishman stain for LD bodies; NNN culture; serology (rK39 strip, DAT); PCR.\n- *Differentials to exclude:* leprosy, vitiligo, pityriasis versicolor."}, {"id": 250, "n": 250, "t": "What is the causative agent of kala-azar? Who discovered this?", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n- **Causative agent:** *Leishmania donovani*, an intracellular haemoflagellate transmitted by *Phlebotomus* sandflies.\n- **Discovery:** **William Leishman** (1900 at Netley; reported 1903) found the parasites in the spleen of a soldier who died of \"Dum-Dum fever\" near Calcutta; **Charles Donovan** (1903, Madras) independently demonstrated them in a splenic puncture. **Ronald Ross** named the organism *L. donovani*; hence **Leishman–Donovan bodies**."}, {"id": 251, "n": 251, "t": "What are the species of Leishmania?", "st": 3, "src": "Board 2 Set 02, 11, 16", "du": [], "nmc": [], "vv": ["Board 2 Set 02", "Board 2 Set 11", "Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Classification of *Leishmania*** (subgenera *Leishmania* and *Viannia*):\n\n| Species / complex | Disease | Distribution |\n|---|---|---|\n| *L. donovani* complex (*L. donovani*, *L. infantum*/*chagasi*) | Visceral leishmaniasis | Asia, Africa, Mediterranean, Latin America |\n| *L. tropica* | Old World anthroponotic cutaneous | Asia, Middle East |\n| *L. major* | Zoonotic cutaneous | Middle East, Africa |\n| *L. aethiopica* | Cutaneous, diffuse cutaneous | East Africa |\n| *L. mexicana* complex (*mexicana*, *amazonensis*) | New World cutaneous | Americas |\n| *L. braziliensis* (and *Viannia* spp.) | Mucocutaneous (espundia), cutaneous | Latin America |\n\n**Clinical groups:** visceral (kala-azar), cutaneous, mucocutaneous, PKDL/diffuse cutaneous."}, {"id": 252, "n": 252, "t": "What do you know about the culture of Donovan in artificial media?", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*L. donovani* (promastigote form) is cultivated as follows:\n\n- **Medium:** **NNN medium** (Novy–MacNeal–Nicolle) = defibrinated rabbit-blood agar with a liquid phase (water of condensation). Others: Schneider's insect medium, M199, RPMI-1640, Tobie's medium.\n- **Inoculum:** splenic/bone-marrow aspirate or buffy coat, inoculated aseptically into the condensation fluid.\n- **Incubation:** **22–25 °C** (sandfly-gut temperature, not 37 °C) for 1–4 weeks.\n- **Result:** motile promastigotes (often in rosettes) in the fluid, seen in wet mount or Giemsa smear; subculture at intervals.\n- **Value:** species identification (isoenzymes, PCR), drug-sensitivity testing; slow (about a month) and of low sensitivity."}]}, {"id": "parasitology-8", "title": "Trypanosomes (Sleeping Sickness & Chagas Disease)", "qs": [{"id": 253, "n": 253, "t": "Name protozoa that cause sleeping sickness and Chagas disease.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Feature | *T. brucei gambiense* | *T. brucei rhodesiense* | *T. cruzi* |\n|---|---|---|---|\n| Disease | West African sleeping sickness (chronic) | East African sleeping sickness (acute) | Chagas' disease (American trypanosomiasis) |\n| Vector | *Glossina palpalis* group (tsetse) | *Glossina morsitans* group (tsetse) | Reduviid (kissing) bug — bite wound contaminated by faeces |\n| Reservoir | Man | Wild game, cattle | Man, dog, cat, armadillo |\n| Infective form | Metacyclic trypomastigote | Metacyclic trypomastigote | Metacyclic trypomastigote |\n| Distribution | West/Central Africa | East/Southern Africa | Central and South America |\n\n*Clinical notes:* sleeping sickness — fever, posterior cervical lymphadenopathy (**Winterbottom's sign**), later meningoencephalitis; Chagas' — acute Romaña's sign, chronic cardiomyopathy, megaoesophagus, megacolon. **Neither is endemic in Bangladesh** (see Q328)."}]}, {"id": "parasitology-9", "title": "Toxoplasma gondii", "qs": [{"id": 254, "n": 254, "t": "Mention the infective forms and modes of transmission of *Toxoplasma gondii*.", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Infective forms**\n\n1. **Sporulated oocyst** (containing sporozoites) — shed in cat faeces; resistant in soil.\n2. **Tissue cyst** (containing bradyzoites) — in raw/undercooked meat.\n3. **Tachyzoite** — responsible for transplacental, transfusion and transplant transmission.\n\n**Modes of transmission**\n\n1. Ingestion of **oocysts** from soil, water, vegetables or cat litter.\n2. Ingestion of **tissue cysts** in undercooked pork, mutton, goat meat.\n3. **Congenital** — transplacental tachyzoites in primary maternal infection.\n4. **Blood transfusion / organ transplantation.**\n5. Unpasteurised milk (tachyzoites); laboratory accidents (rare)."}, {"id": 255, "n": 255, "t": "Describe the laboratory diagnosis of toxoplasmosis.", "st": 4, "src": "NMC 4; DU-26M, 25N, 22N", "du": ["DU-26M", "DU-25N", "DU-22N"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** serology is the mainstay; direct demonstration is used in selected cases.\n**Specimens:** serum, CSF, amniotic fluid, lymph-node biopsy, other tissue, aqueous humour.\n\n1. **Serology**\n   - **IgG:** **Sabin–Feldman dye test** (gold standard), ELISA, IFAT, indirect haemagglutination, latex agglutination. A **four-fold rise** in paired sera = recent infection.\n   - **IgM** (ELISA, IFAT, ISAGA): acute/recent and congenital infection.\n   - **IgG avidity:** low avidity suggests infection within 3–4 months; high avidity excludes recent infection.\n2. **Demonstration of parasite:** Giemsa smear/imprint (crescent-shaped **tachyzoites**); tissue cysts in biopsy; lymph-node histology.\n3. **Isolation:** mouse inoculation or tissue culture.\n4. **Molecular:** **PCR** (B1 gene) on amniotic fluid, CSF, blood, aqueous humour.\n5. **Imaging:** CT/MRI (ring-enhancing lesions in AIDS); fetal ultrasound (hydrocephalus, calcification)."}, {"id": 256, "n": 256, "t": "Write/describe/mention the laboratory diagnosis of toxoplasmosis in a pregnant woman.", "st": 3, "src": "DU-18M, 24N, 23N", "du": ["DU-18M", "DU-24N", "DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n1. **Maternal screening:** IgG and IgM at booking.\n   - IgG–/IgM–: susceptible; repeat each trimester, counsel on prevention.\n   - IgG+/IgM–: past infection; no fetal risk.\n   - IgM+ (± IgG+): confirm with **IgG avidity**; low avidity = recent infection (possibly in pregnancy).\n2. **Fetal diagnosis (after confirmed maternal infection):** **PCR on amniotic fluid** (amniocentesis ≥ 18 weeks); serial **ultrasound** (ventricular dilatation, intracranial calcification, hepatomegaly, ascites).\n3. **Neonate:** IgM/IgA in serum, persistence of IgG beyond 12 months, PCR on placenta/cord blood/CSF, eye examination, cranial imaging.\n4. **Management:** spiramycin to reduce transmission; pyrimethamine + sulfadiazine (with folinic acid) once fetal infection is established."}, {"id": 257, "n": 257, "t": "Which animal is the reservoir of *Toxoplasma gondii*?", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nThe **domestic cat (and other Felidae)** is the **definitive host and reservoir** of *T. gondii*; the sexual cycle occurs in its intestinal epithelium and **oocysts** are shed in faeces. Man, sheep, goat, pig, rodents and birds are intermediate hosts (man being accidental)."}, {"id": 258, "n": 258, "t": "Why is *T. gondii* dangerous for pregnant women? / \"Toxoplasma gondii infection is dangerous in pregnant mother\" – explain.", "st": 2, "src": "Board 2 Set 11, 14", "du": [], "nmc": [], "vv": ["Board 2 Set 11", "Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*T. gondii* is dangerous in pregnancy because a **primary maternal infection** causes parasitaemia and **transplacental passage of tachyzoites** to the fetus.\n\n- **Timing:** transmission risk rises with gestational age (~15 % in first trimester to > 60 % in third), but **severity is greatest when infection occurs early**.\n- **Early infection:** abortion, stillbirth, hydrocephalus.\n- **Congenital toxoplasmosis:** chorioretinitis, hydrocephalus/microcephaly, **intracranial calcification**, convulsions, hepatosplenomegaly, jaundice; late visual loss or mental retardation.\n- Pre-existing maternal immunity protects the fetus.\n- **Prevention:** cook meat thoroughly, wash vegetables and hands, avoid cat litter, screening and counselling."}]}, {"id": "parasitology-10", "title": "Plasmodium Species", "qs": [{"id": 259, "n": 259, "t": "Describe the life cycle of *Plasmodium*.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nMalarial parasites need **two hosts**: **man** (intermediate host — **asexual cycle, schizogony**) and the **female *Anopheles* mosquito** (definitive host and vector — **sexual cycle, sporogony**).\n\n```\n FEMALE ANOPHELES BITES MAN -> SPOROZOITES (infective stage)\n                                   |\n LIVER (hepatocytes): pre-erythrocytic schizogony --> hypnozoites (P. vivax, P. ovale) -> relapse\n                                   |  merozoites released\n RED CELLS: ring -> trophozoite -> schizont -> merozoites (erythrocytic schizogony, 48/72 h)\n                    |                               |\n                    |                    RBC bursts: fever paroxysm\n          some merozoites -> GAMETOCYTES (male + female)\n                    |\n MOSQUITO ingests gametocytes -> exflagellation -> zygote -> ookinete\n          -> oocyst (stomach wall) -> SPOROZOITES -> salivary glands -> next bite\n```\n\n**A. Human cycle**\n\n1. **Pre-erythrocytic (hepatic) schizogony:** sporozoites reach the liver within ~30 min, enter hepatocytes → schizont → merozoites. Duration: *P. falciparum* 6 d, *P. vivax* 8 d, *P. ovale* 9 d, *P. malariae* 13–15 d. No symptoms. **Hypnozoites** persist in *P. vivax* and *P. ovale*.\n2. **Erythrocytic schizogony:** merozoites invade red cells (*P. vivax*: reticulocytes via Duffy antigen; *P. falciparum*: all ages; *P. malariae*: old cells) → **ring** → trophozoite → schizont → merozoites. Cycle: **48 h** (*Pv, Pf, Po*), **72 h** (*Pm*). Rupture causes the **paroxysm**.\n3. **Gametogony:** some merozoites differentiate into macro- and microgametocytes (*P. falciparum* gametocytes are crescentic and mature in deep capillaries). Gametocytes cause no fever; their bearer is a **carrier**.\n\n**B. Mosquito cycle (sporogony)** — 8–15 days (extrinsic incubation period)\n\n1. Gametocytes ingested in the blood meal → microgametocyte **exflagellates** → microgametes; fertilisation → **zygote** → motile **ookinete**.\n2. Ookinete penetrates the stomach wall → **oocyst** → thousands of **sporozoites**.\n3. Oocyst ruptures; sporozoites migrate to the **salivary glands** and are injected at the next bite.\n\n| Feature | *P. vivax* | *P. falciparum* | *P. malariae* | *P. ovale* |\n|---|---|---|---|---|\n| Hepatic phase | 8 d | 6 d | 13–15 d | 9 d |\n| Erythrocytic cycle | 48 h | 48 h | 72 h | 48 h |\n| Hypnozoite | Yes | No | No | Yes |\n| Incubation period | 12–17 d | 9–14 d | 18–40 d | 16–18 d |\n\n**Viva points**\n- Infective form to man = **sporozoite**; infective form to mosquito = **gametocyte**; man = intermediate host."}, {"id": 260, "n": 260, "t": "Enumerate the species and modes of transmission of the malarial parasite.", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Species:** *P. vivax* (benign tertian), *P. falciparum* (malignant tertian), *P. malariae* (quartan), *P. ovale* (ovale tertian) and *P. knowlesi* (zoonotic, quotidian; South-East Asia). In **Bangladesh**, *P. falciparum* (predominant, mainly in hill-tract and border districts) and *P. vivax* occur; *P. malariae* and *P. ovale* are rare.\n\n**Modes of transmission**\n\n| Type | Mode |\n|---|---|\n| **Sporozoite-induced** (natural) | Bite of infected female *Anopheles* (in Bangladesh chiefly *An. baimaii*, *An. minimus*, *An. philippinensis*, *An. sundaicus*) |\n| **Trophozoite-induced** | **Blood transfusion**; **congenital** (transplacental); **shared needles** in drug addicts; organ transplantation; laboratory accident |\n\n*Note:* trophozoite-induced malaria has **no hepatic phase** and therefore no relapse."}, {"id": 261, "n": 261, "t": "Mention/differentiate the differences between vivax and falciparum malaria (clinically and in the laboratory).", "st": 4, "src": "DU-24M, 19M; Board 2 Set 03, 08", "du": ["DU-24M", "DU-19M"], "nmc": [], "vv": ["Board 2 Set 03", "Board 2 Set 08"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | *P. vivax* (benign tertian) | *P. falciparum* (malignant tertian) |\n|---|---|---|\n| **Clinical** | | |\n| Incubation period | 12–17 days | 9–14 days |\n| Fever pattern | Regular tertian (every 48 h) | Irregular, often continuous/remittent |\n| Severity | Usually benign | Severe; life-threatening |\n| Complications | Rare (anaemia, splenic rupture) | Cerebral, algid malaria, blackwater fever, renal failure, pulmonary oedema, hypoglycaemia |\n| Relapse | **Yes** (hypnozoites) | **No** (recrudescence only) |\n| Treatment | Chloroquine + primaquine | Artemisinin-based combination therapy (ACT) |\n| **Laboratory** | | |\n| Red cells invaded | Reticulocytes; max parasitaemia ~2 % | All ages; very high parasitaemia |\n| Infected red cell | **Enlarged**, pale; **Schüffner's dots** | Normal size; **Maurer's clefts** |\n| Ring form | Large (⅓ of cell), single chromatin dot | Small (⅕ of cell), delicate, **double chromatin dots**, multiple rings per cell |\n| Stages in peripheral blood | **All stages** | **Rings and crescents only** (others sequestered) |\n| Trophozoite | Amoeboid, irregular | Compact |\n| Pigment | Fine, light-brown | Coarse, dark |\n| Mature schizont | 12–24 merozoites, irregular | 18–24+ merozoites, grape-like; rare in blood |\n| Gametocyte | Round/oval | **Crescent (banana)-shaped** |\n| RDT antigen | pLDH | **HRP-2**, pLDH |"}, {"id": 262, "n": 262, "t": "List the parasite that causes anaemia in malaria, and explain the mechanism/causes of anaemia (including in *P. vivax*).", "st": 3, "src": "DU-25N, 19Nov; Board 2 Set 16", "du": ["DU-25N", "DU-19Nov"], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Parasites:** all species, but severe anaemia is characteristic of ***P. falciparum*** (all red-cell ages invaded); ***P. vivax*** causes chronic anaemia (especially in children) through repeated relapses.\n\n**Mechanisms**\n\n1. **Rupture of parasitised red cells** at schizont release.\n2. **Splenic removal** of parasitised and non-parasitised cells (hypersplenism).\n3. **Immune-mediated haemolysis:** antibody/complement on infected and normal red cells (\"bystander\" destruction).\n4. **Bone-marrow dyserythropoiesis:** TNF-α, IFN-γ and haemozoin suppress erythropoiesis.\n5. **Folate deficiency** (increased demand).\n6. **Drug-induced haemolysis** (primaquine, sulfonamides) in **G6PD deficiency**.\n7. *P. vivax:* repeated relapses with limited reticulocyte response; haemodilution, hookworm or nutritional deficiency may add to it.\n\n*Type:* normocytic normochromic (haemolytic) anaemia."}, {"id": 263, "n": 263, "t": "Explain relapse and recrudescence of malaria.", "st": 2, "src": "DU-24N, 20Nov/July", "du": ["DU-24N", "DU-20Nov/July"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | **Relapse** | **Recrudescence** |\n|---|---|---|\n| Definition | Recurrence after **clearance** of blood parasites, from the **liver** | Recurrence from **persistent low-grade blood parasitaemia** |\n| Source | **Hypnozoites** in hepatocytes | Surviving erythrocytic forms |\n| Species | ***P. vivax*, *P. ovale*** | ***P. falciparum*** (up to ~1 year), ***P. malariae*** (up to decades) |\n| Interval | Weeks to 3–5 years | Weeks to months (Pf); decades (Pm) |\n| Prevented by | **Primaquine/tafenoquine** (radical cure; check G6PD) | Complete, effective blood-schizonticide course |\n\n*Reinfection* = new infection by a fresh mosquito bite. Mnemonic: **Relapse = Liver; Recrudescence = Red cells.**"}, {"id": 264, "n": 264, "t": "Discuss the pathogenesis of cerebral malaria.", "st": 5, "src": "NMC 4; DU-25N, 24M, 19M, 18M", "du": ["DU-25N", "DU-24M", "DU-19M", "DU-18M"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Definition.** Cerebral malaria is an acute diffuse encephalopathy of *P. falciparum* infection with unrousable coma (no other cause) and parasitaemia; mortality 15–50 % even with treatment.\n\n**Pathogenesis (sequestration/obstruction + cytokine hypotheses)**\n\n```\n P. falciparum infection\n        |\n PfEMP-1 (var gene product) on \"knobs\" of the infected red cell\n        |\n CYTOADHERENCE to cerebral capillary endothelium (ICAM-1, CD36, EPCR)\n ROSETTING (infected + uninfected RBCs) and AUTO-AGGLUTINATION\n        |\n SEQUESTRATION in brain micro-vessels\n        |\n Micro-vascular obstruction -> reduced perfusion -> hypoxia, lactic acidosis\n   + cytokines (TNF-a, IFN-g, IL-1) -> adhesion molecules, nitric oxide\n        |\n Endothelial activation -> BLOOD-BRAIN BARRIER leak -> brain swelling\n        |\n Ring haemorrhages, oedema, neuronal dysfunction -> COMA, convulsions\n```\n\n**Contributing factors:** reduced deformability of infected red cells, platelet clumping, hypoglycaemia, endothelial dysfunction.\n**Pathology:** swollen congested brain; capillaries packed with parasitised red cells; petechial (ring) haemorrhages in white matter.\n**Clinical features:** fever, headache, vomiting, convulsions, delirium → coma; retinal haemorrhages; usually no focal signs.\n**Diagnosis:** thick and thin films, RDT (HRP-2); blood glucose; lumbar puncture to exclude meningitis.\n\n**Viva points**\n- Knob protein = **PfEMP-1**; cytoadherence + rosetting = sequestration. Treatment: IV artesunate."}, {"id": 265, "n": 265, "t": "Discuss black-water fever (with the basic events in pernicious malaria).", "st": 4, "src": "NMC 1; NMC 3; DU-23N; Board 2 Set 12", "du": ["DU-23N"], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Black-water fever** is a syndrome of **massive intravascular haemolysis** in *P. falciparum* infection, characterised by **haemoglobinuria (dark/black urine)**, fever, jaundice and acute renal failure. Now rare since quinine has been replaced.\n\n**Predisposing factors:** repeated *P. falciparum* attacks in non-immune persons, irregular/inadequate quinine (also halofantrine, mefloquine), G6PD deficiency.\n\n**Pathogenesis**\n\n1. Intravascular haemolysis (immune-mediated/drug-triggered) of parasitised and unparasitised red cells.\n2. Free haemoglobin saturates plasma haptoglobin.\n3. Free Hb filtered by glomeruli → **haemoglobinuria**.\n4. Tubular obstruction by Hb casts and hypoxia → **acute tubular necrosis → oliguria/renal failure**.\n5. Unconjugated jaundice, severe anaemia, circulatory collapse.\n\n**Clinical features:** sudden rigor, fever, loin pain, bilious vomiting, jaundice, dark urine, oliguria.\n**Pathology:** large dark kidneys with Hb casts; enlarged yellow liver; dark spleen (malarial pigment).\n\n**Basic events in pernicious (severe) malaria:** erythrocytic schizogony of *P. falciparum* → knob formation → cytoadherence, rosetting, sequestration in vital-organ capillaries → **capillary blockage → ischaemia, oedema, haemorrhage, necrosis**. Seen when parasitaemia exceeds ~5 %; presents as **cerebral**, **algid** (shock) or **septicaemic** malaria.\n\n**Management:** stop the offending drug, parenteral artesunate, supportive care, transfusion, dialysis."}, {"id": 266, "n": 266, "t": "Outline/state the laboratory diagnosis of (falciparum) malaria.", "st": 4, "src": "NMC 1; NMC 3; NMC 4; DU-25N", "du": ["DU-25N"], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** demonstration of parasites in blood films, supported by antigen detection (RDT) and molecular tests.\n**Specimen:** capillary (finger-prick) or EDTA blood, ideally during fever; repeat every 6–12 h for 3 sets if negative.\n\n1. **Blood-film microscopy (gold standard)** — Giemsa/Field's/Leishman stain.\n   - **Thick film:** detects low parasitaemia (concentrated, dehaemoglobinised).\n   - **Thin film:** species identification and parasitaemia (% infected red cells).\n   - *P. falciparum:* small rings with double chromatin dots, **crescentic gametocytes**, no schizonts in peripheral blood, red cells not enlarged; **parasitaemia > 5 %** indicates severe disease.\n2. **Rapid diagnostic tests:** **HRP-2** (specific for *P. falciparum*; positive 2–4 weeks after cure), pLDH/aldolase (other species); result in 15–20 min.\n3. **QBC** (acridine-orange fluorescence).\n4. **PCR/LAMP:** very sensitive; mixed infections, reference use.\n5. **Serology** (IFAT/ELISA): epidemiological only.\n6. **Supportive tests:** Hb, platelets (low), leucopenia, glucose, bilirubin, urea/creatinine, lactate, urine Hb."}, {"id": 267, "n": 267, "t": "*Vignette: a 30-year-old male with high fever for 4 days, travel to Bandarban 2 weeks back, profuse sweating, headache and mild confusion.* Diagnosis, parasite, two lab tests.", "st": 0, "src": "DU-25M", "du": ["DU-25M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Falciparum malaria — complicated (early cerebral) malaria**: fever with chills/sweating, recent visit to the hill-tract endemic area (Bandarban), ~2-week incubation, altered sensorium.\n- **Parasite:** *Plasmodium falciparum*.\n- **Two laboratory tests:** (1) Giemsa-stained **thick and thin blood films**; (2) **rapid diagnostic test (HRP-2)**.\n- *Also:* blood glucose, Hb, renal function; lumbar puncture if meningitis is suspected. Treatment: IV artesunate."}, {"id": 268, "n": 268, "t": "What is schizogony and sporogony in the case of Plasmodium? Where does it occur?", "st": 0, "src": "Board 2 Set 09", "du": [], "nmc": [], "vv": ["Board 2 Set 09"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| | **Schizogony** | **Sporogony** |\n|---|---|---|\n| Meaning | **Asexual** multiplication by multiple fission → merozoites | **Sexual** reproduction followed by multiplication → sporozoites |\n| Site | In **man**: liver cells (pre-erythrocytic) and red cells (erythrocytic) | In the **female *Anopheles***: fertilisation in stomach lumen, oocyst on stomach wall, sporozoites in salivary glands |\n| Product | Merozoites | Sporozoites |\n| Duration | 6–15 days (liver); 48/72 h (red cell) | 8–15 days |"}, {"id": 269, "n": 269, "t": "Which species of Plasmodium causes malaria in our country? Which one is most dangerous and why?", "st": 0, "src": "Board 2 Set 13", "du": [], "nmc": [], "vv": ["Board 2 Set 13"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n- **Species in Bangladesh:** ***P. falciparum*** (predominant) and ***P. vivax***, concentrated in hill-tract and border districts (Bandarban, Rangamati, Khagrachhari, Cox's Bazar and neighbouring areas); *P. malariae* and *P. ovale* are rare.\n- **Most dangerous: *P
