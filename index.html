as **control**.\n3. Read at **30 minutes (immediate reaction)** and again at **24 hours (delayed reaction)**.\n\n**Result**\n\n- **Positive:** a wheal ≥ 5 mm (often > 2 cm) with erythema and **pseudopods** within 20–30 min, larger than the control; delayed 24-hour reaction may follow.\n- **Negative:** no reaction beyond the control.\n\n**Interpretation and limitations**\n\n- Positive in ~60–70 % of cases; **false-positive** (up to 30 %: cysticercosis, other helminths, previous test) and **false-negative** results are common (~10–40 %); reaction may persist after cure.\n- Risk of **anaphylaxis**; antigen standardisation is poor.\n- **Obsolete today**; replaced by **ultrasound and serology (ELISA, IHA, immunoblot)**.\n\n**Viva points**\n- Casoni = intradermal hydatid-fluid test; immediate hypersensitivity; of historical interest only."}]}]}, {"id": "clinical", "name": "Part IV — Clinical Microbiology", "intro": "", "notes": "## Notes on interpretation of scenario questions\n\n- **#362–365 (Board 2 Sets 02–05):** the place names are the clue — **Fulbaria, Mymensingh → kala-azar** (hyperendemic focus); **Durgapur (north-central border belt) and Bandarban (Chittagong Hill Tracts) → falciparum-predominant malaria**; **Rangpur (north-west) with eosinophilia → *Wuchereria bancrofti* filariasis / tropical pulmonary eosinophilia**.\n- **#380 (night blindness in a poor village child):** the helminth intended is ***Ascaris lumbricoides*** (vitamin A malabsorption in heavy infection); *Giardia* would be the protozoal alternative.\n- **#356:** current guidelines (IDSA/SHEA 2021) place **fidaxomicin / oral vancomycin** ahead of metronidazole; older Indian/Bangladeshi textbooks still list metronidazole as first line — write both and state the alternative if the examiner's textbook is older.\n- **#347:** counts below 10⁵ CFU/mL are significant in specified situations (symptomatic women, catheter specimens, suprapubic aspirates) — Kass's 10⁵ is the classical examination answer.\n- **Cross-references to Part III (Parasitology)** in #359 (Q332, Q335) refer to questions in the same question bank that are outside this Part-IV answer key.\n\n## Sources used\n\n**Provided files**\n1. *Micro_2nd_Term_All_Q_for_website.md* — question bank (question text, stars and sitting references reproduced unchanged).\n2. *levinson_infectious_diseases.json* — Levinson's *Review of Medical Microbiology and Immunology*, 18th ed., Part IX (Ch. 72 CNS infections incl. Tables 72-1/72-2; Ch. 78 urinary tract infections; Ch. 73–76 GI, pelvic and respiratory infections; Ch. 79 sepsis).\n3. *study_infectious_diseases.json* — structured study notes aligned to Levinson Part IX (syndromes, pathogens, diagnostic principles).\n4. *Infectious_Diseases.txt* — MRCP-style infectious disease notes (sepsis, viral meningitis, typhoid, hydatid disease, tapeworm and others).\n\n**Internet sources consulted (for current definitions, guidelines and Bangladesh-specific epidemiology)**\n- Fever of unknown origin — Petersdorf & Beeson (1961); Durack & Street (1991) classification: *Wiener Klinische Wochenschrift* review \"Fever of unknown origin (FUO) revised\" (PMC5104815); AAFP 2003 FUO classification; Kumar et al., *J Clin Sci Res* 2016 (FUO in India).\n- Significant bacteriuria — Kass criteria and lower-count exceptions (symptomatic women, catheter specimens, suprapubic aspirate); Mandal J., \"Significance of asymptomatic bacteriuria\", EMJ Reviews.\n- Malaria in Bangladesh — endemic districts including Bandarban and Netrokona (Durgapur, Kalmakanda) — *Malaria Journal* 2014 (PMC3896725); K13 propeller study (PMC4240861); Dhaka University Journal of Biological Sciences.\n- Kala-azar in Bangladesh — rK39 RDT and parasitological diagnosis in Mymensingh (Fulbaria, Trishal): *Parasites & Vectors* 2015; PMC3003646; PMC1317080.\n- Lymphatic filariasis in Bangladesh — *Wuchereria bancrofti*, northern/Rangpur division endemicity, ICT antigen testing: Dhaka University and Rajshahi University zoology journals; Banglapedia; PMC6062013.\n- Clostridioides difficile — IDSA/SHEA 2021 focused update (fidaxomicin preferred; metronidazole only if others unavailable); bezlotoxumab withdrawn by manufacturer (UCSF treatment guideline, 2025).\n- Typhoid — sensitivity of blood culture, effect of prior antibiotics, bone-marrow culture superiority: *Indian Pediatrics* 2006; JPMA; Oxford tropical medicine meta-analysis (blood-volume and antimicrobial effect); PMC4869319.\n- Dengue — NS1 (days 1–5/9), IgM/IgG ELISA after day 5, PCR, haematocrit and platelet monitoring (GPnotebook; BMJ Best Practice).\n\n**Recommended textbooks for cross-checking (not quoted here):** Ananthanarayan & Paniker's *Textbook of Microbiology*; Chakraborty *Textbook of Microbiology*; Jawetz, Melnick & Adelberg's *Medical Microbiology*; Parija *Textbook of Medical Parasitology*; Levinson *Review of Medical Microbiology and Immunology*.\n\n> **Study note:** This answer key is a revision aid prepared from the sources above. Exam-specific wording, diagrams and local guidelines (e.g. the Bangladesh National TB, Malaria and Kala-azar programmes) should be confirmed against your own department's prescribed textbook and lecture notes.\n\n", "topics": [{"id": "clinical-1", "title": "Pyrexia of Unknown Origin & Septicaemia", "qs": [{"id": 336, "n": 336, "t": "Define and enumerate the causes of pyrexia of unknown origin (PUO).", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** Pyrexia (fever) of unknown origin (PUO / FUO) is a prolonged febrile illness in which the cause remains undiagnosed even after a reasonable, structured initial work-up.\n\n- **Petersdorf and Beeson (1961) criteria** — (i) temperature **> 38.3 °C (101 °F)** on several occasions; (ii) duration **> 3 weeks**; (iii) **no diagnosis after 1 week** of in-hospital investigation.\n- **Durack and Street (1991) revision** — the \"1 week in hospital\" was replaced by **3 outpatient visits or 3 days of hospital investigation**, and PUO was divided into four classes.\n\n| Class | Setting | Special points |\n|---|---|---|\n| **Classical** | Community-acquired; fever > 3 weeks | Original Petersdorf–Beeson definition |\n| **Nosocomial** | Hospitalised ≥ 24 h; fever not present or incubating on admission | Post-operative, *C. difficile*, drug fever, line infection, DVT/PE |\n| **Neutropenic (immune-deficient)** | Neutrophils ≤ 500/mm³ | Bacteria, *Candida*, *Aspergillus*, herpesviruses |\n| **HIV-associated** | Confirmed HIV; fever > 4 weeks (outpatient) or > 3 days (inpatient) | *M. avium* complex, TB, CMV, PCP, cryptococcosis, lymphoma |\n\n**Causes of classical PUO** (four broad groups):\n\n1. **Infections** (commonest in South Asia, ≈ 30–40 %)\n   - *Bacterial:* tuberculosis (especially extrapulmonary / miliary), enteric fever, brucellosis, infective endocarditis (culture-negative, HACEK), deep abscesses (liver, subphrenic, pelvic, psoas), osteomyelitis, chronic UTI/pyelonephritis, sinusitis, leptospirosis, melioidosis, rickettsial infections (scrub typhus).\n   - *Parasitic:* malaria, **kala-azar (visceral leishmaniasis)**, amoebic liver abscess, toxoplasmosis, schistosomiasis, filariasis.\n   - *Viral:* HIV, EBV, CMV, hepatitis viruses.\n   - *Fungal:* disseminated histoplasmosis, cryptococcosis, candidiasis.\n2. **Neoplasms** — lymphoma, leukaemia, renal cell carcinoma, hepatocellular carcinoma, atrial myxoma.\n3. **Non-infectious inflammatory diseases (collagen-vascular)** — SLE, adult Still's disease, giant-cell arteritis, polyarteritis nodosa, rheumatoid arthritis, sarcoidosis, inflammatory bowel disease.\n4. **Miscellaneous** — drug fever, deep-vein thrombosis / pulmonary embolism, thyroiditis/thyrotoxicosis, factitious fever, familial Mediterranean fever, haematoma, cirrhosis. A residual group (≈ 10–20 %) remains **undiagnosed**.\n\n**Microbiological work-up in PUO (stepwise):** repeated **blood cultures** (≥ 3 sets, before antibiotics); malarial parasite (smear + RDT); Widal/Typhidot, *Salmonella* culture; **rK39** for kala-azar; Mantoux/IGRA, sputum AFB/Xpert MTB/RIF; Brucella serology (Rose Bengal, SAT); scrub typhus IgM; HIV, EBV, CMV serology; urine R/E and culture; imaging (CXR, USG, CT, echocardiography); bone-marrow aspirate/biopsy for culture and histology; FDG-PET/CT where available.\n\n**Viva pearls**\n- PUO = fever > 38.3 °C, > 3 weeks, undiagnosed after 1 week of study (Petersdorf–Beeson).\n- Four classes: classical, nosocomial, neutropenic, HIV-associated (Durack and Street).\n- In India/Bangladesh, **tuberculosis, enteric fever and kala-azar** top the infective list."}, {"id": 337, "n": 337, "t": "Name the various organisms causing septicaemia.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definitions**\n- **Bacteraemia** — presence of viable bacteria in the blood (may be transient and harmless).\n- **Septicaemia** — multiplication of microorganisms in the blood with systemic toxicity (a clinical syndrome).\n- **Sepsis (Sepsis-3, 2016)** — life-threatening organ dysfunction caused by a dysregulated host response to infection; **septic shock** = sepsis with persistent hypotension requiring vasopressors (MAP ≥ 65 mmHg) and lactate > 2 mmol/L despite fluids.\n- **Pyaemia** — pus-forming organisms in blood with metastatic abscesses.\n\n**Organisms causing septicaemia**\n\n| Group | Organisms |\n|---|---|\n| **Gram-positive cocci** | *Staphylococcus aureus* (incl. MRSA), coagulase-negative staphylococci (catheter-related), *Streptococcus pneumoniae*, *S. pyogenes*, *S. agalactiae* (GBS, neonates), viridans streptococci, *Enterococcus faecalis/faecium* |\n| **Gram-negative bacilli** | *Escherichia coli*, *Klebsiella pneumoniae*, *Enterobacter*, *Proteus*, ***Salmonella* Typhi / Paratyphi**, *Pseudomonas aeruginosa*, *Acinetobacter baumannii*, *Burkholderia pseudomallei* (melioidosis), *Brucella*, *Citrobacter*, *Serratia* |\n| **Gram-negative cocci / coccobacilli** | *Neisseria meningitidis* (meningococcaemia), *Haemophilus influenzae* |\n| **Anaerobes** | *Bacteroides fragilis*, *Clostridium perfringens*, *Fusobacterium* |\n| **Fungi** | *Candida* species (commonly *C. albicans*, *C. tropicalis*, *C. auris*), *Cryptococcus*, *Aspergillus* |\n| **Others** | Rickettsiae, *Leptospira* (not by routine culture) |\n\n**Predominant organism by setting**\n- *Community-acquired:* *E. coli*, *S. aureus*, *S. pneumoniae*, *Salmonella* Typhi.\n- *Hospital-acquired / catheter-related:* *Klebsiella*, *Pseudomonas*, *Acinetobacter*, MRSA, CoNS, *Candida*.\n- *Neonatal:* GBS, *E. coli*, *Klebsiella*, *Listeria*, *S. aureus*.\n- *Neutropenic:* Gram-negative bacilli, *Candida*, *Aspergillus*.\n\n**Source** (identify for treatment): urinary tract, chest, skin/soft tissue, biliary tract, intra-abdominal/pelvic, intravascular devices.\n\n**Viva pearls**\n- Commonest causes overall: *E. coli* (Gram-negative) and *S. aureus* (Gram-positive).\n- Endotoxin (lipid A of LPS) → TNF-α, IL-1, IL-6 → vasodilatation, DIC, shock."}, {"id": 338, "n": 338, "t": "How will you diagnose septicaemia in the laboratory?", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Principle.** Septicaemia is diagnosed by **isolating the organism from blood culture** — the single most important test — supported by source cultures, inflammatory markers and rapid molecular methods.\n\n**1. Collection of blood culture (pre-analytical — decides the yield)**\n- **Timing:** before starting antibiotics; ideally at the onset of fever/chills; **2–3 sets** from **separate venepuncture sites** within 24 hours (one set from each arm).\n- **Skin asepsis:** 2 % chlorhexidine–alcohol or 70 % alcohol followed by povidone-iodine; allow to dry; no touching after disinfection. Disinfect the bottle stopper.\n- **Volume:** adults **8–10 mL per bottle** (aerobic + anaerobic = 1 set; ≈ 20 mL per set); children 1–5 mL (≈ 1–2 % of total blood volume); neonates ≥ 1 mL. Volume is the strongest determinant of sensitivity.\n- **Blood : broth ratio 1 : 5 to 1 : 10** — dilutes antibacterial substances, complement and lysozyme in the blood.\n- **Catheter-related sepsis:** paired cultures from peripheral vein and catheter; **differential time to positivity** (catheter bottle positive ≥ 2 h earlier) or tip culture (semi-quantitative roll-plate, ≥ 15 colonies).\n\n**2. Culture media**\n- **Brain-heart infusion / tryptic soy broth** containing **sodium polyanethol sulfonate (SPS 0.025–0.05 %)** — anticoagulant that also inhibits complement, phagocytes and aminoglycosides.\n- **Biphasic (Castañeda) medium** — for *Brucella* and *Salmonella*; allows subculture without opening the bottle.\n- **Bile broth (10–20 % ox-bile)** — for *Salmonella* Typhi (bile inhibits blood bactericidal action but not the bacillus).\n- **Resin/charcoal-containing bottles** — neutralise antibiotics in patients already on therapy.\n- **Lysis-centrifugation (Isolator) / fungal media** — for fungi, *Mycobacterium*, *Brucella*.\n\n**3. Incubation and detection**\n- **Conventional (manual):** incubate at 37 °C for **7 days** (up to 4 weeks for *Brucella*); examine daily for turbidity, haemolysis, gas, surface pellicle, clots; **blind subcultures** on blood agar, chocolate agar and MacConkey agar at 18–24 h, day 3 and day 7.\n- **Automated continuous-monitoring systems** (BACTEC — fluorescence, BacT/ALERT — colorimetric CO₂ sensor): detect growth in 12–48 h; usually 5 days of incubation are enough.\n\n**4. When the bottle flags positive**\n1. **Gram stain** immediately — telephone a critical result to the clinician.\n2. Subculture → identification by colony morphology, catalase, coagulase, oxidase, biochemical tests, **MALDI-TOF MS** or multiplex PCR panels on the positive bottle.\n3. **Antimicrobial susceptibility testing** (Kirby–Bauer disc diffusion / automated MIC; screen for MRSA, ESBL, carbapenemase).\n\n**5. Interpretation**\n- Always significant: *S. aureus*, *S. pneumoniae*, *E. coli*, *Salmonella*, *Pseudomonas*, *Candida*, *Brucella*.\n- Probable contaminants (if only 1 of ≥ 2 sets positive): coagulase-negative staphylococci, *Corynebacterium* (diphtheroids), *Bacillus* (non-anthracis), *Cutibacterium*, viridans streptococci.\n\n**6. Supportive and non-culture tests**\n- **Haematology:** leucocytosis/leucopenia, neutrophilia with toxic granules, thrombocytopenia (DIC).\n- **Biomarkers:** CRP, **procalcitonin**, **serum lactate** (> 2 mmol/L), SOFA/qSOFA scoring.\n- **Cultures of suspected source:** urine, sputum, wound swab/pus, CSF, stool.\n- **Serology/other:** Widal / Typhidot / TUBEX (enteric fever), Brucella serology, β-D-glucan and galactomannan (fungal).\n- **Molecular:** 16S rRNA PCR, multiplex PCR panels.\n- **Bone-marrow culture** when blood cultures are negative (typhoid, brucellosis, kala-azar).\n\n**Viva pearls**\n- Blood culture = gold standard; sensitivity depends on **volume, number of sets, timing before antibiotics**.\n- **SPS** is the anticoagulant of choice in blood culture bottles.\n- **Bile broth** for typhoid, **Castañeda** for brucellosis."}]}, {"id": "clinical-2", "title": "Meningitis", "qs": [{"id": 339, "n": 339, "t": "Name the various organisms causing meningitis.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "Meningitis is inflammation of the meninges. The causative agents may be **bacteria, viruses, fungi or parasites**.\n\n**A. Bacterial**\n1. **Acute pyogenic:** *Streptococcus pneumoniae*, *Neisseria meningitidis*, *Haemophilus influenzae* type b, *Streptococcus agalactiae* (GBS), *Escherichia coli* K1, *Listeria monocytogenes*, *Klebsiella*, *Pseudomonas aeruginosa*, *Staphylococcus aureus*, coagulase-negative staphylococci (shunt infections), *Salmonella*, *Citrobacter koseri*, *Acinetobacter*.\n2. **Subacute / chronic (lymphocytic):** *Mycobacterium tuberculosis*, *Treponema pallidum* (neurosyphilis), *Borrelia burgdorferi*, *Leptospira*, *Brucella*, *Nocardia*.\n\n**B. Viral (aseptic)** — enteroviruses (Coxsackie, ECHO, EV-71), **mumps**, HSV-2, VZV, HIV, arboviruses (West Nile, Japanese encephalitis), LCM virus, adenovirus, EBV, CMV.\n\n**C. Fungal** — *Cryptococcus neoformans* (commonest in HIV/AIDS), *Candida*, *Coccidioides*, *Histoplasma*, *Aspergillus*, Mucorales.\n\n**D. Parasitic** — *Naegleria fowleri* (primary amoebic meningoencephalitis), *Acanthamoeba*, *Angiostrongylus cantonensis* (eosinophilic meningitis), *Taenia solium* (racemose neurocysticercosis), *Toxoplasma gondii* (in AIDS), cerebral malaria (encephalopathy, not meningitis).\n\n**Viva pearls**\n- Commonest bacterial cause overall: *S. pneumoniae*; teenagers/young adults: *N. meningitidis*; neonates: GBS, *E. coli*, *Listeria*.\n- Commonest viral cause: **enteroviruses**; commonest fungal cause: ***Cryptococcus***."}, {"id": 340, "n": 340, "t": "Discuss the laboratory diagnosis of acute pyogenic meningitis.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** Acute pyogenic (purulent) meningitis is an acute inflammation of the leptomeninges by pyogenic bacteria, a **medical emergency**. Diagnosis rests on **CSF examination** (macroscopy, cytology, biochemistry, Gram stain, culture, antigen/molecular tests) supplemented by blood culture.\n\n**Before lumbar puncture (LP):** examine for papilloedema, focal deficits, or depressed consciousness; **CT scan first** if raised intracranial pressure or a mass lesion is suspected, because LP may cause brain-stem herniation. **Do not delay antibiotics** if LP is delayed — draw **blood cultures first**.\n\n**1. Specimen collection and transport**\n- LP at **L3–L4 / L4–L5** interspace under strict asepsis. Collect 3 sterile tubes: **tube 1** — biochemistry; **tube 2** — microbiology (Gram stain, culture, antigen/PCR); **tube 3** — cell count. Record **opening pressure**.\n- Transport to the laboratory immediately (< 1 hour). **Do not refrigerate** — *N. meningitidis*, *H. influenzae* and *S. pneumoniae* are cold-sensitive and autolyse. Keep at room temperature or 37 °C.\n\n**2. Macroscopic appearance** — turbid/purulent (≥ 200 cells/µL gives visible turbidity); clot or cobweb formation is more typical of tuberculous meningitis.\n\n**3. Cytology (total and differential count)** — counted in a Neubauer chamber (and stained smear). In pyogenic meningitis: **200–5000 cells/µL, > 90 % neutrophils** (early viral or partially treated may mimic).\n\n**4. Biochemistry** — protein **raised (> 100 mg/dL)**; glucose **lowered (< 40 mg/dL or CSF : blood glucose ratio < 0.4–0.6)** — because bacteria and neutrophils consume glucose and transport across the blood–brain barrier is impaired; **lactate raised (> 3.5 mmol/L)**; chloride is not routinely used now.\n\n| Parameter | Normal | Acute bacterial | Acute viral | TB / fungal |\n|---|---|---|---|---|\n| Pressure (mm H₂O) | < 200 | **Increased** | Slight ↑ | Increased |\n| Cells /µL | 0–5 lymphocytes | **200–5000, > 90 % neutrophils** | 100–700 lymphocytes | 25–500 lymphocytes |\n| Protein (mg/dL) | < 45 | **> 100** | Slightly ↑ | **> 100** |\n| Glucose (CSF : blood) | > 0.6 | **< 0.6 (low)** | Normal | **< 0.6** |\n\n*(Levinson, Table 72-1.)*\n\n**5. Microscopy**\n- **Gram stain** of cytospin-concentrated sediment — sensitivity 60–90 %: Gram-positive lanceolate diplococci (*S. pneumoniae*); Gram-negative **intracellular kidney-bean diplococci** (*N. meningitidis*); small pleomorphic Gram-negative coccobacilli (*H. influenzae*); Gram-positive cocci in chains (GBS); Gram-negative bacilli (coliforms); Gram-positive short bacilli (*Listeria*).\n- **Ziehl–Neelsen** stain of the cobweb clot (for TB) and **India ink** (for *Cryptococcus*) if clinically indicated.\n\n**6. Culture** (gold standard for identification and susceptibility)\n- Inoculate **blood agar and chocolate agar**, incubate at 37 °C in **5–10 % CO₂ (candle jar)**; add MacConkey agar (Gram-negative bacilli) and enrichment broth (BHI).\n- **Identification:** *S. pneumoniae* — α-haemolysis, optochin-sensitive, bile-soluble; *N. meningitidis* — oxidase +, ferments glucose and maltose; *H. influenzae* — growth on chocolate agar only, requires X and V factors, satellitism around *S. aureus*; GBS — CAMP test positive, hippurate hydrolysis; *Listeria* — tumbling motility, β-haemolysis, grows at 4 °C.\n- **Antimicrobial susceptibility** (including penicillin/ceftriaxone MIC for pneumococcus).\n\n**7. Rapid/antigen/molecular methods**\n- **Latex agglutination** for capsular antigens (*S. pneumoniae*, *N. meningitidis*, *H. influenzae* b, GBS, *E. coli* K1) — useful in **partially treated** cases when Gram stain/culture are negative.\n- **PCR / multiplex PCR panels** (≈ 1 hour turnaround) and 16S rRNA gene sequencing; **metagenomic NGS** (where available) when cause remains unknown.\n\n**8. Other supportive tests** — **blood culture** (positive in up to 50–80 %), CBC (neutrophilic leucocytosis), CRP / procalcitonin, serum glucose, **CT/MRI** for complications (hydrocephalus, abscess, subdural empyema).\n\n**Flow summary**\n```\nSuspected meningitis → blood cultures → (CT if indicated) → LP\n   ├─ Cell count + protein + glucose  → pyogenic pattern?\n   ├─ Gram stain (cytospin)           → provisional organism\n   ├─ Culture (BA + CA, CO2) + AST    → definitive diagnosis\n   └─ Latex / PCR                     → rapid / partially treated cases\n```\n\n**Viva pearls**\n- CSF in pyogenic meningitis: **↑ neutrophils, ↑ protein, ↓ glucose.**\n- Do not refrigerate CSF for bacteriology; culture on chocolate agar with CO₂.\n- Latex agglutination/PCR help in partially treated meningitis."}, {"id": 341, "n": 341, "t": "Write a short note on aseptic meningitis.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** Aseptic meningitis is a syndrome of meningeal inflammation with **CSF pleocytosis (usually lymphocytic)** in which **routine Gram stain and bacterial culture of CSF are negative**. It is predominantly **viral**, hence also called *viral meningitis*.\n\n**Aetiology**\n1. **Viruses** (≈ 85–95 % of cases with identified cause) — **enteroviruses** (Coxsackie B, ECHO viruses, EV-71; commonest, summer–autumn peak), **HSV-2** (important in adults, especially after primary genital infection; recurrent form = Mollaret's meningitis), **mumps** (unvaccinated), VZV, HIV (acute seroconversion), arboviruses (West Nile, Japanese encephalitis), LCM virus, adenovirus, EBV, CMV.\n2. **Non-viral infectious** — partially treated pyogenic meningitis, early tuberculous meningitis, *Leptospira*, *Treponema pallidum*, *Borrelia burgdorferi*, *Mycoplasma*, rickettsiae, fungi (*Cryptococcus*), parasites.\n3. **Non-infectious** — drugs (NSAIDs, co-trimoxazole, IVIG, OKT3), SLE, sarcoidosis, Behçet's disease, carcinomatous/leukaemic meningitis, contrast media.\n\n**Pathogenesis.** Enteroviruses replicate in the gut/respiratory tract, spread by the blood (**viraemia**), cross the blood–brain barrier through infected endothelial cells or migrating leucocytes, and reach the subarachnoid space, where an inflammatory cytokine response (IL-6, TNF-α) with lymphocyte influx is triggered.\n\n**Clinical features.** Fever, headache, photophobia, neck stiffness, nausea/vomiting, malaise ± rash (enterovirus), parotitis (mumps), vesicles (HSV/VZV). Generally **milder than bacterial** and often **self-limiting** (7–10 days), but may be clinically indistinguishable.\n\n**Laboratory diagnosis**\n- **CSF:** clear/slightly turbid; pressure normal or slightly ↑; cells **10–500 /µL (up to ~1000), predominantly lymphocytes** (neutrophils may predominate in the first 24–48 h); **protein mildly raised (< 100 mg/dL)**; **glucose normal** (may be slightly reduced in mumps, HSV, LCM); **Gram stain and routine culture negative**.\n- **Virology:** **RT-PCR** for enterovirus RNA in CSF (the test of choice; rapid and sensitive); PCR for HSV-2, VZV; viral culture/PCR from throat swab, stool and rectal swab (enterovirus); **serology** (IgM or paired sera) for mumps, arboviruses.\n- **Exclusion tests:** blood culture, AFB stain/Xpert, India ink/cryptococcal antigen, VDRL — to exclude partially treated bacterial, TB and fungal meningitis.\n\n**Treatment and prevention.** Supportive (hydration, analgesia, antipyretics, antiemetics); **IV acyclovir** only for confirmed/suspected HSV or VZV; ganciclovir for CMV. Prevention: **MMR vaccine** (mumps), polio vaccine, hygiene. **Prognosis** is excellent, but headache and malaise may persist for weeks; infants and immunocompromised patients are at risk of complications.\n\n**Viva pearls**\n- Aseptic = CSF cells present but **no bacteria on Gram stain/culture**.\n- **Enterovirus** is the commonest cause; PCR is the diagnostic test of choice.\n- CSF glucose is **normal** in viral meningitis (low in bacterial, TB, fungal)."}, {"id": 342, "n": 342, "t": "Enumerate the causes of pyogenic meningitis.", "st": 0, "src": "NMC 1 — see also #339, #340", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Causes of pyogenic meningitis are best remembered by age and predisposing factor** (Levinson, Table 72-2):\n\n| Age group / predisposing factor | Commonest organisms |\n|---|---|\n| **Neonate (0–3 months)** | *Streptococcus agalactiae* (GBS), ***Escherichia coli* K1**, *Listeria monocytogenes*; also *Klebsiella*, *Citrobacter*, *Cronobacter* |\n| **Infants and young children** | *S. pneumoniae*, *N. meningitidis*, *Haemophilus influenzae* type b (reduced by Hib vaccine) |\n| **Teenagers and young adults** | *N. meningitidis*, *S. pneumoniae* |\n| **Older adults (> 50 y)** | *S. pneumoniae*, *N. meningitidis*, ***L. monocytogenes*** |\n| **Immunocompromised, pregnancy** | *L. monocytogenes*, aerobic Gram-negative bacilli (*Pseudomonas*, *Klebsiella*) |\n| **CSF leak (skull fracture), splenectomy, sickle-cell disease** | *S. pneumoniae* |\n| **Terminal-complement deficiency; military recruits / hostels** | *N. meningitidis* |\n| **After neurosurgery / head trauma** | *S. aureus*, Gram-negative bacilli, *Pseudomonas*, *Acinetobacter* |\n| **Ventriculo-peritoneal shunt** | *Staphylococcus epidermidis* (CoNS) |\n\n**Routes of entry:** haematogenous spread from nasopharyngeal colonisation (commonest); contiguous spread (otitis media, sinusitis, mastoiditis); direct inoculation (trauma, surgery, shunts, LP).\n\n**Viva pearls**\n- Three classical organisms: *S. pneumoniae*, *N. meningitidis*, *H. influenzae* b — all **encapsulated**; conjugate vaccines target their capsular polysaccharides.\n- Neonates: **GBS, *E. coli* K1, *Listeria*** (mnemonic \"GEL\"); elderly: add ***Listeria***."}]}, {"id": "clinical-3", "title": "Respiratory Tract & Food-borne Infections", "qs": [{"id": 343, "n": 343, "t": "Name the various organisms causing infection in the respiratory tract.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "Respiratory infections are classified as **upper (URTI)** and **lower (LRTI)** tract infections. Most URTIs are viral; bacteria matter chiefly because they need antibiotics.\n\n| Syndrome | Bacteria | Viruses / others |\n|---|---|---|\n| **Pharyngitis / tonsillitis** | *Streptococcus pyogenes* (Group A), *Corynebacterium diphtheriae*, *Neisseria gonorrhoeae*, *Arcanobacterium haemolyticum*, *Fusobacterium* (Vincent's angina) | Rhinovirus, adenovirus, EBV, influenza, coronavirus, HSV, Coxsackie (herpangina) |\n| **Sinusitis, otitis media** | *S. pneumoniae*, non-typeable *H. influenzae*, *Moraxella catarrhalis* | Rhinovirus, RSV; *Aspergillus*/Mucorales (invasive fungal sinusitis) |\n| **Croup / epiglottitis** | *H. influenzae* type b (epiglottitis) | Parainfluenza virus (croup), RSV |\n| **Acute bronchitis / bronchiolitis / whooping cough** | *Bordetella pertussis*, *Mycoplasma pneumoniae*, *Chlamydophila pneumoniae* | Influenza, RSV, rhinovirus, adenovirus |\n| **Community-acquired pneumonia (typical)** | ***S. pneumoniae*** (commonest), *H. influenzae*, *Klebsiella pneumoniae*, *S. aureus*, *Moraxella* | Influenza, SARS-CoV-2, RSV, adenovirus, measles, varicella |\n| **Atypical pneumonia** | *Mycoplasma pneumoniae*, *Chlamydophila pneumoniae*/*psittaci*, *Legionella pneumophila*, *Coxiella burnetii* | — |\n| **Hospital-acquired / ventilator-associated** | *Pseudomonas aeruginosa*, *Klebsiella*, *Acinetobacter*, *S. aureus* (MRSA), *Enterobacter* | — |\n| **Aspiration pneumonia / lung abscess** | Oral anaerobes (*Peptostreptococcus*, *Fusobacterium*, *Prevotella*), *Streptococcus anginosus* group | — |\n| **Chronic infections** | ***Mycobacterium tuberculosis***, NTM, *Nocardia*, *Actinomyces*, *Burkholderia pseudomallei* | — |\n| **Fungi** | — | *Aspergillus*, *Candida*, *Cryptococcus*, *Histoplasma*, *Pneumocystis jirovecii* (HIV/AIDS), Mucorales |\n| **Parasites** | — | *Paragonimus*, *Echinococcus* (hydatid), larval migration of *Ascaris*/hookworm/*Strongyloides* (Löffler's), tropical pulmonary eosinophilia (*Wuchereria*), *Entamoeba* (amoebic lung abscess) |\n| **Bioterror / zoonotic** | *Bacillus anthracis* (inhalational anthrax), *Yersinia pestis*, *Francisella* | — |\n\n**Viva pearls**\n- Commonest bacterial cause of CAP: *S. pneumoniae*; of HAP/VAP: *Pseudomonas*, *Klebsiella*, MRSA.\n- Atypical pneumonia organisms **do not grow on routine media/Gram stain** (no cell wall in *Mycoplasma*; intracellular in *Chlamydophila*/*Legionella*)."}, {"id": 344, "n": 344, "t": "Name the bacteria causing food poisoning.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** Food poisoning is an acute gastroenteritis resulting from ingestion of food or water contaminated with **bacteria, their toxins or other agents**. Bacterial food poisoning is classified by mechanism:\n\n**A. Preformed toxin ingested (short incubation, vomiting predominant, usually no fever)**\n- ***Staphylococcus aureus*** — heat-stable enterotoxin; incubation 1–6 h; foods: cream-filled pastries, ham, milk products, salads; food handlers with boils/nasal carriage.\n- ***Bacillus cereus* (emetic type)** — cereulide; 1–6 h; reheated/fried rice.\n- ***Clostridium botulinum*** — neurotoxin; 12–36 h; home-canned/fermented foods; descending flaccid paralysis.\n\n**B. Toxin formed in the gut (intermediate incubation, watery diarrhoea)**\n- ***Clostridium perfringens*** type A — enterotoxin released during sporulation; 8–16 h; reheated meat/gravy.\n- ***Bacillus cereus* (diarrhoeal type)** — enterotoxins; 8–16 h; meats, vegetables, sauces.\n- **Enterotoxigenic *E. coli* (ETEC)**, ***Vibrio cholerae*** — water/food-borne secretory diarrhoea.\n\n**C. Invasion / infection (longer incubation, fever, inflammatory diarrhoea)**\n- ***Salmonella* (non-typhoidal)** — 6–48 h; poultry, eggs, dairy.\n- ***Shigella* species** — 1–3 days; contaminated food/water.\n- ***Campylobacter jejuni*** — 2–5 days; undercooked poultry, raw milk (complication: Guillain–Barré syndrome).\n- ***Vibrio parahaemolyticus*** — 12–24 h; raw/undercooked seafood.\n- **EHEC (*E. coli* O157:H7)** — undercooked beef; haemorrhagic colitis and haemolytic uraemic syndrome (**avoid antibiotics**).\n- ***Yersinia enterocolitica*** — 4–7 days; pork, raw milk; pseudo-appendicitis.\n- ***Listeria monocytogenes*** — soft cheese, ready-to-eat meats; meningitis/abortion in pregnancy and the immunocompromised.\n\n**Viva pearls**\n- **Vomiting within hours** → *S. aureus* or *B. cereus* (emetic).\n- **Fried rice** → *B. cereus*; **reheated meat** → *C. perfringens*; **canned food** → *C. botulinum*.\n- Preformed-toxin illnesses are **not** helped by antibiotics."}]}, {"id": "clinical-4", "title": "Urinary Tract Infection", "qs": [{"id": 345, "n": 345, "t": "Discuss the laboratory diagnosis of UTI.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** Urinary tract infection (UTI) is the presence of **significant bacteriuria with symptoms/pyuria** in the urinary tract. Lab diagnosis involves specimen collection, microscopy, culture with quantification, identification and susceptibility.\n\n**1. Specimen collection and transport**\n\n| Method | Indication |\n|---|---|\n| **Clean-catch midstream urine (MSU)** | Routine specimen of choice (after cleaning meatus; first part discarded) |\n| **Catheter specimen** | Catheterised patients (sampled from catheter port, never from bag) |\n| **Suprapubic aspiration** | Infants, anaerobic culture; any growth is significant |\n| **Bag specimen** | Infants (only a negative result is reliable) |\n| **Early-morning urine × 3 days** | Tuberculosis (AFB) |\n\n- Collect **before antibiotics**; process **within 1–2 hours**, or **refrigerate at 4 °C (≤ 24 h)**, or use **boric-acid** preservative — otherwise contaminants multiply and cause false-positive counts.\n\n**2. Screening tests**\n- **Macroscopy:** turbidity, colour, odour (ammoniacal in *Proteus*).\n- **Dipstick:** **leucocyte esterase** (pyuria) and **nitrite (Griess test)** — Enterobacterales reduce nitrate to nitrite; also protein, blood, pH (alkaline with urease producers).\n- **Chemical tests:** catalase, TTC reduction test.\n\n**3. Microscopy**\n- **Wet mount (uncentrifuged urine):** **pyuria ≥ 10 WBC/µL (≥ 5 per HPF in centrifuged deposit)**; RBCs; **WBC casts** (pyelonephritis); epithelial cells (> 5/HPF suggests contamination); crystals; yeast; *Trichomonas*.\n- **Gram stain (uncentrifuged urine):** **≥ 1 bacterium per oil-immersion field ≈ ≥ 10⁵ CFU/mL.**\n\n**4. Culture — semi-quantitative (Kass method)**\n- Use a **calibrated loop (0.001 mL / 0.01 mL)**; streak across the entire plate of **CLED agar** (or blood agar + MacConkey agar).\n- Incubate aerobically at 37 °C for 18–24 h.\n- **Colony count** = colonies × 1000 (1 µL loop) or × 100 (10 µL loop) = CFU/mL. Dip-slide and filter-paper methods are alternatives.\n- **CLED medium** — lactose fermenters (yellow), non-lactose fermenters (blue-green); **inhibits swarming of *Proteus***, supports Gram-positive cocci and yeasts.\n\n**5. Identification**\n\n| Organism | Key features |\n|---|---|\n| ***Escherichia coli*** (70–80 %) | Pink on MacConkey, yellow on CLED; indole +, MR +, VP −, citrate −; motile |\n| ***Klebsiella pneumoniae*** | Mucoid lactose fermenter; non-motile; indole −, VP +, urease + |\n| ***Proteus mirabilis*** | Swarming on blood agar; non-lactose fermenter; **urease +**, H₂S + |\n| ***Pseudomonas aeruginosa*** | Oxidase +; pigment (pyocyanin), fruity odour |\n| ***Enterococcus*** | Gram-positive cocci in pairs; bile-esculin +, grows in 6.5 % NaCl |\n| ***Staphylococcus saprophyticus*** | Coagulase −, **novobiocin-resistant**; honeymoon cystitis |\n| ***Candida*** | Germ-tube test (*C. albicans*), cream colonies |\n\n**6. Antimicrobial susceptibility** — Kirby–Bauer disc diffusion (CLSI), or automated MIC; screen for ESBL / carbapenemase producers.\n\n**7. Special tests** — AFB smear, Xpert MTB/RIF and culture (renal TB — sterile pyuria); *Schistosoma haematobium* eggs in terminal urine; imaging (USG/CT) for obstruction, stones, reflux.\n\n**Interpretation (Kass criteria):** see Q347.\n\n**Viva pearls**\n- **MSU** is the specimen of choice; **semi-quantitative** culture on **CLED agar** is the standard method.\n- Pyuria + positive nitrite + ≥ 10⁵ CFU/mL = UTI.\n- **Sterile pyuria** → TB, *Chlamydia*, partially treated infection, stones."}, {"id": 346, "n": 346, "t": "\"Semi-quantitative culture of urine is required for the lab diagnosis of UTI\" — why?", "st": 2, "src": "NMC 4; Board 1 Set 13 — see also #345", "du": [], "nmc": ["NMC 4"], "vv": ["Board 1 Set 13 — see also #345"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Reason 1 — The normal urethra and perineum are colonised.** Urine in the bladder is sterile, but voided urine inevitably picks up commensals (coagulase-negative staphylococci, diphtheroids, lactobacilli, anaerobes, *Enterobacterales*) from the distal urethra, vulva and perineum. A mere **qualitative** culture (\"growth present\") would therefore falsely label contaminated samples as UTI.\n\n**Reason 2 — Bacterial numbers distinguish infection from contamination (Kass concept, 1956).** In a **true infection**, bacteria multiply in stagnant bladder urine with a generation time of 20–30 minutes, reaching **≥ 10⁵ CFU/mL**. In **contamination** the count is usually **< 10⁴ CFU/mL** and mixed. Only counting can separate the two.\n\n**Reason 3 — Urine at room temperature allows multiplication in the container.** Delayed transport can convert a low-count contaminated sample to > 10⁵; quantification with proper transport corrects this.\n\n**Reason 4 — Clinical correlation and avoiding overtreatment.** Counts are interpreted along with symptoms and pyuria; this prevents unnecessary antibiotic use for asymptomatic bacteriuria and contamination.\n\n**Method.** Semi-quantitative culture is done with a **calibrated loop (1 µL or 10 µL)** on CLED/blood agar; **number of colonies × 1000 (or × 100) = CFU/mL**; this is simpler and cheaper than full quantitative pour-plate counting.\n\n**Viva pearls**\n- *Qualitative growth is meaningless* in voided urine; **count ≥ 10⁵ CFU/mL** of a single species = significant (Kass).\n- Remember the **exceptions** — lower counts are significant in symptomatic women, catheter specimens, men, and **suprapubic aspirates** (see Q347)."}, {"id": 347, "n": 347, "t": "What is significant bacteriuria, and how is it expressed?", "st": 2, "src": "NMC 4; Board 1 Set 13", "du": [], "nmc": ["NMC 4"], "vv": ["Board 1 Set 13"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Definition (Kass, 1956).** **Significant bacteriuria** is the presence of **≥ 10⁵ colony-forming units (CFU) of a single bacterial species per mL** of a properly collected **midstream clean-catch urine**, which indicates true infection rather than contamination. In asymptomatic persons it should be **confirmed on two consecutive cultures** (a single specimen has only ≈ 80 % predictive value of true bacteriuria in women).\n\n**How it is expressed.** As **CFU/mL (colony-forming units per millilitre)** — e.g. \"*E. coli* ≥ 10⁵ CFU/mL\" — calculated as **colony count on the plate × loop factor** (× 1000 for a 0.001 mL loop; × 100 for a 0.01 mL loop).\n\n**Interpretation of counts**\n\n| Colony count (MSU) | Interpretation |\n|---|---|\n| **≥ 10⁵ CFU/mL**, single species | **Significant** — UTI (or asymptomatic bacteriuria if no symptoms) |\n| **10⁴–10⁵ CFU/mL** | Doubtful — repeat culture; interpret with symptoms/pyuria |\n| **< 10⁴ CFU/mL**, mixed growth | Contamination |\n\n**Situations where lower counts are significant**\n- **Symptomatic women with cystitis/dysuria + pyuria:** **≥ 10²–10³ CFU/mL** of a uropathogen (*E. coli*, *S. saprophyticus*) is significant.\n- **Men:** ≥ 10³ CFU/mL.\n- **Catheter specimen:** ≥ 10² CFU/mL (Levinson); ≥ 10³ CFU/mL with symptoms for catheter-associated UTI.\n- **Suprapubic aspirate:** **any growth** is significant (bladder is normally sterile).\n- Patients on antibiotics, diuresis, frequent micturition (dilute urine), renal TB.\n\n**Related terms:** **asymptomatic bacteriuria** = ≥ 10⁵ CFU/mL of a single species on two consecutive cultures without symptoms — treated only in pregnancy, before urological procedures and in neutropenia.\n\n**Viva pearls**\n- **Kass: ≥ 10⁵ CFU/mL** in MSU = significant bacteriuria.\n- **Suprapubic aspiration: any count is significant.**"}]}, {"id": "clinical-5", "title": "Sexually Transmitted & Genital Infections", "qs": [{"id": 348, "n": 348, "t": "Enumerate the causative agents with the diseases of STI.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Sexually transmitted infections (STI)** are caused by a wide variety of organisms transmitted through sexual contact. They are grouped by the type of agent:\n\n| Agent | Disease / syndrome |\n|---|---|\n| **BACTERIA** | |\n| *Neisseria gonorrhoeae* | **Gonorrhoea** (urethritis, cervicitis, PID, epididymitis, ophthalmia neonatorum, disseminated gonococcal infection) |\n| *Chlamydia trachomatis* D–K | Non-gonococcal urethritis, cervicitis, PID, inclusion conjunctivitis, neonatal pneumonia |\n| *Chlamydia trachomatis* L1–L3 | **Lymphogranuloma venereum** |\n| *Treponema pallidum* | **Syphilis** (primary chancre, secondary rash, tertiary gumma, neurosyphilis, congenital) |\n| *Haemophilus ducreyi* | **Chancroid** (painful soft chancre) |\n| *Klebsiella* (*Calymmatobacterium*) *granulomatis* | **Donovanosis** (granuloma inguinale; Donovan bodies) |\n| *Mycoplasma genitalium*, *Ureaplasma urealyticum* | Non-gonococcal urethritis, cervicitis |\n| *Gardnerella vaginalis* + anaerobes | Bacterial vaginosis (polymicrobial imbalance, not a true STI) |\n| **VIRUSES** | |\n| HIV | **AIDS** |\n| HSV-2 (and HSV-1) | **Genital herpes** |\n| HPV (6, 11; 16, 18) | Genital warts; cervical, anal cancers |\n| Hepatitis B (± C, D) virus | Acute/chronic hepatitis |\n| CMV, Molluscum contagiosum virus, HTLV-1, HHV-8 | Mononucleosis-like illness; molluscum; adult T-cell leukaemia; Kaposi sarcoma |\n| **PROTOZOA** | |\n| *Trichomonas vaginalis* | **Trichomoniasis** (vaginitis, urethritis) |\n| *Entamoeba histolytica*, *Giardia* | Sexually transmitted amoebiasis/giardiasis (MSM) |\n| **FUNGI** | |\n| *Candida albicans* | Vulvovaginitis, balanitis |\n| **ECTOPARASITES** | |\n| *Phthirus pubis*, *Sarcoptes scabiei* | Pubic lice (crabs), scabies |\n\n**Syndromic classification (WHO / national STI guidelines):** urethral discharge, vaginal discharge, genital ulcer disease, inguinal bubo, lower abdominal pain (PID), scrotal swelling, neonatal conjunctivitis.\n\n**Viva pearls**\n- **Painless ulcer** → syphilis; **painful ulcers** → herpes, chancroid.\n- All STI patients should be offered **HIV, syphilis and hepatitis B** testing."}, {"id": 349, "n": 349, "t": "How will you proceed to diagnose a case of genital discharge in the laboratory?", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Genital discharge** may be **urethral (male/female)**, **vaginal** or **cervical**. The laboratory plan is syndrome-based and aims to detect *N. gonorrhoeae*, *C. trachomatis*, *T. vaginalis*, *Candida*, bacterial vaginosis, HSV and *M. genitalium*.\n\n**1. Specimen collection**\n- **Male urethral discharge:** discharge from the meatus or a urethral swab (thin Dacron/calcium alginate) inserted 2–3 cm, **≥ 1 hour after last micturition**; first-catch urine for NAAT.\n- **Female:** **endocervical swab** (after wiping away mucus), **high vaginal swab (HVS)** from the posterior fornix, urethral swab; first-catch urine for NAAT.\n- **Transport:** immediately inoculate onto plates (gonococci are fastidious and die on drying/cold); otherwise use **Stuart's / Amies charcoal** transport medium. Do **not** use cotton wool swabs (fatty acids toxic to gonococci).\n\n**2. Direct examination**\n- **Gram stain** — **pus cells with Gram-negative intracellular diplococci** = gonorrhoea (sensitivity > 90 % in symptomatic men, 50–70 % in women); **clue cells** (epithelial cells coated with Gram-variable coccobacilli) + absence of lactobacilli = bacterial vaginosis (**Nugent score** 7–10); yeasts/pseudohyphae = *Candida*.\n- **Wet mount (saline, vaginal secretions)** — **motile flagellated trichomonads** (jerky movement), clue cells, yeasts.\n- **10 % KOH mount** — pseudohyphae and budding yeast; **whiff (amine) test** — fishy odour on adding KOH (BV).\n- **Vaginal pH** — > 4.5 in BV and trichomoniasis; ≤ 4.5 in candidiasis.\n- **Amsel criteria (BV, any 3 of 4):** thin homogeneous discharge, pH > 4.5, positive whiff test, clue cells.\n- **Dark-field microscopy / HSV tests** from genital ulcers where relevant.\n\n**3. Culture**\n- **Gonococcus:** **Thayer–Martin (VCN) or modified New York City medium**, or chocolate agar, incubated at 35–37 °C in **5–10 % CO₂** with humidity; colonies are **oxidase-positive**, Gram-negative diplococci; carbohydrate utilisation (glucose only); confirmation with MALDI-TOF/NAAT; susceptibility testing (rising resistance to ceftriaxone, azithromycin and fluoroquinolones).\n- ***Trichomonas*:** Diamond's medium or InPouch TV culture.\n- ***Candida*:** Sabouraud dextrose agar / CHROMagar; germ-tube test.\n- ***Mycoplasma/Ureaplasma*:** special media (A8 agar, Shepard's).\n\n**4. Nucleic acid amplification tests (NAAT) / molecular** — the **most sensitive** tests for gonococcus, *Chlamydia trachomatis* and *T. vaginalis*; multiplex PCR for HSV and *M. genitalium*. *Chlamydia* cannot be Gram-stained or grown on routine media: use NAAT, cell culture (McCoy cells), or direct fluorescent antibody.\n\n**5. Serology** — **VDRL/RPR with TPHA/FTA-ABS** (syphilis), **HIV** and **HBsAg** — screen all STI patients.\n\n**Flow summary**\n```\nGenital discharge\n  ├─ Male urethral: Gram stain → GNID in pus cells? → Gonorrhoea; culture (TM/chocolate) + NAAT\n  │                  no GNID → NGU → Chlamydia / Mycoplasma / Ureaplasma (NAAT)\n  └─ Female vaginal/cervical: pH, wet mount, KOH/whiff, Gram stain\n        ├─ Trichomonads → trichomoniasis\n        ├─ Clue cells / Amsel / Nugent → BV\n        ├─ Pseudohyphae → candidiasis\n        └─ Cervicitis → NAAT for gonorrhoea + chlamydia\n```\n\n**Viva pearls**\n- **Gram-negative intracellular diplococci in a urethral smear** is diagnostic of gonorrhoea in a symptomatic male.\n- **Thayer–Martin medium** is the selective medium for gonococcus (contains vancomycin, colistin, nystatin)."}]}, {"id": "clinical-6", "title": "Wound Infection & Hospital-Acquired Infection", "qs": [{"id": 350, "n": 350, "t": "Write briefly on the laboratory diagnosis of wound infection.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** A wound infection is the invasion and multiplication of microorganisms in a break in the skin (traumatic, surgical, burn, ulcer, bite). **Surgical site infection (SSI)** is classified as superficial incisional, deep incisional or organ/space infection.\n\n**Common organisms:** *S. aureus* (incl. MRSA), *S. pyogenes*, *E. coli*, *Klebsiella*, *Proteus*, ***Pseudomonas aeruginosa*** (burns), *Acinetobacter*, *Enterococcus*, anaerobes (*Bacteroides*, *Peptostreptococcus*), ***Clostridium perfringens* (gas gangrene)**, ***Clostridium tetani* (tetanus)**, *Mycobacterium* spp. (chronic/non-healing), fungi, *Mycobacterium ulcerans*.\n\n**1. Specimen collection**\n- **Pus aspirated by needle and syringe** is superior to swabs; **tissue biopsy / curettage** for deep infections.\n- If swabs are used, take **two** (one for Gram stain, one for culture); sample the **deep part / margin** after cleaning surface exudate; avoid skin contaminants.\n- **Anaerobic infection** is suspected if the pus is foul-smelling, necrotic or gas-containing: transport in an **anaerobic transport medium / syringe sealed of air**; do **not** refrigerate.\n\n**2. Direct microscopy**\n- **Gram stain** (immediate presumptive result): Gram-positive cocci in clusters (*Staphylococcus*), chains (*Streptococcus*), Gram-negative bacilli (coliforms, *Pseudomonas*), **large Gram-positive bacilli with few pus cells (clostridia, gas gangrene)**.\n- **Ziehl–Neelsen** stain for AFB in chronic, non-healing wounds/sinuses; **KOH/PAS** for fungal elements; dark-ground microscopy not required routinely.\n\n**3. Culture**\n- **Blood agar** (aerobic, 37 °C), **MacConkey agar** (Gram-negative bacilli), and **chocolate agar** (fastidious).\n- **Anaerobic culture:** neomycin-blood agar / Robertson's cooked-meat medium in an **anaerobic jar (GasPak)**; *C. perfringens* produces **double zone of haemolysis** and a **positive Nagler reaction** (lecithinase neutralised by anti-α-toxin).\n- Fungal culture on Sabouraud agar; AFB on Löwenstein–Jensen medium / MGIT when indicated.\n- **Identification** (catalase, coagulase, oxidase, biochemicals, MALDI-TOF) and **antimicrobial susceptibility testing** (screen for MRSA, ESBL).\n\n**4. Special situations**\n- **Tetanus** — diagnosed **clinically**; wound culture of *C. tetani* is unreliable (positive in only ~30 %) and not required.\n- **Necrotising fasciitis** — needs surgical exploration/tissue for culture (polymicrobial vs *S. pyogenes*).\n- **Blood culture** in systemic spread; **inflammatory markers** (CRP, ESR, WBC).\n\n**5. Reporting** — Gram stain result within the hour; culture and sensitivity in 24–48 h to guide antibiotic choice.\n\n**Viva pearls**\n- **Pus > swab**; send for **aerobic + anaerobic** culture.\n- **Nagler reaction** identifies *C. perfringens*; **tetanus is a clinical diagnosis**."}, {"id": 351, "n": 351, "t": "Give the factors which influence the development of hospital-acquired infection.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Definition.** A **hospital-acquired (nosocomial / healthcare-associated) infection (HAI)** is an infection that develops **≥ 48 hours after admission** (or within 30 days of surgery, or 1 year after an implant) and was **neither present nor incubating at admission**. The commonest types are **catheter-associated UTI, surgical site infection, ventilator-associated pneumonia and central-line bloodstream infection**.\n\n**Factors influencing the development of HAI** (explained through the **chain of infection**):\n\n**1. Agent (microbial) factors**\n- Virulence, inoculum size, and ability to survive in the hospital environment (e.g. *Pseudomonas* in moist areas, *S. aureus* on skin, *Acinetobacter* on surfaces).\n- **Antimicrobial resistance** (MRSA, ESBL, carbapenem-resistant *Klebsiella*/*Acinetobacter*, VRE).\n- Biofilm formation on devices.\n\n**2. Host (patient) factors**\n- **Extremes of age** (neonates, elderly), malnutrition, **diabetes mellitus**, malignancy, **immunosuppression** (steroids, chemotherapy, HIV), burns, severe underlying disease, prolonged hospitalisation, obesity, smoking.\n\n**3. Environmental and hospital factors**\n- **Overcrowding**, poor ventilation, contaminated water, air and surfaces.\n- **Poor hand hygiene** of healthcare workers (the commonest mode of spread); colonised/infected healthcare workers; patient-to-patient transmission.\n- Inadequate **sterilisation/disinfection** of instruments; contaminated fluids, medications and equipment.\n- Inadequate **waste management**, lack of isolation facilities.\n\n**4. Procedure- and device-related factors**\n- **Invasive devices** — urinary catheters, endotracheal tubes/ventilators, central and peripheral venous lines, drains, shunts.\n- **Surgery** — duration of operation, break in aseptic technique, contaminated wound class, inadequate skin preparation/prophylaxis.\n- Prolonged length of stay.\n\n**5. Antibiotic-related factors**\n- **Indiscriminate use of broad-spectrum antibiotics** — selection of resistant flora and suppression of normal flora (*C. difficile*, candidiasis).\n\n**6. System factors** — absence of an infection control committee/surveillance, understaffing, lack of education and policies.\n\n**Prevention (brief):** hand hygiene (WHO \"5 moments\"), standard and transmission-based precautions, aseptic technique, device care bundles, sterilisation and disinfection, antimicrobial stewardship, surveillance and cohort isolation.\n\n**Viva pearls**\n- Commonest HAI: **UTI (catheter-associated)**; commonest mode of spread: **contaminated hands**.\n- Nosocomial = **≥ 48 h after admission**."}]}, {"id": "clinical-7", "title": "Gastrointestinal & Abdominal Scenarios", "qs": [{"id": 352, "n": 352, "t": "\"A 25 years male complains of abdominal pain and bloody diarrhea\" – Which protozoa might cause this clinical condition? Mention microscopic findings of stool of this patient.", "st": 0, "src": "Board 2 Set 01", "du": [], "nmc": [], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Amoebic dysentery (intestinal amoebiasis) caused by *Entamoeba histolytica*.** Acute abdominal pain with bloody (dysenteric) stool in a young adult in South Asia, where it is endemic. Another protozoan that causes dysentery is ***Balantidium coli*** (large ciliate; pig contact).\n\n**Stool findings in amoebic dysentery**\n\n*Macroscopic:* offensive, **blood-and-mucus-mixed** stool, acid in reaction, with little faecal matter (\"raspberry-jelly\" appearance); not frankly purulent as in bacillary dysentery.\n\n*Microscopic (saline wet mount, fresh warm stool within 30 minutes):*\n- **Motile trophozoites** (20–40 µm) with **unidirectional, progressive movement through finger-like pseudopodia**; **ingested red blood cells** inside the cytoplasm = **pathognomonic of *E. histolytica*** (distinguishes it from non-pathogenic *E. dispar*/*E. coli*).\n- **Clumped (rouleaux) RBCs**, **few pus cells** (amoeba lyses them; contrast with bacillary dysentery with abundant pus cells and macrophages), and **Charcot–Leyden crystals** (from eosinophil breakdown).\n- **Cysts** (10–15 µm, round, **1–4 nuclei** with small **central karyosome** and fine peripheral chromatin; **cigar-shaped chromatoid bodies**) are mainly seen in formed stools/carriers (stain with iodine).\n\n*Staining:* iron–haematoxylin or trichrome shows nuclear details.\n\n**Further tests**\n- **Stool antigen detection (ELISA — Gal/GalNAc lectin)** — distinguishes *E. histolytica* from *E. dispar*; **PCR**.\n- **Sigmoidoscopy/colonoscopy** — **flask-shaped ulcers** with undermined edges; biopsy/scraping from the ulcer edge (trophozoites in tissue; PAS stain).\n- **Serology** (IHA, ELISA) — positive in invasive disease (liver abscess); not useful for acute dysentery in endemic areas.\n- **Stool culture** (Robinson's medium/ Boeck–Drbohlav) — research use.\n\n**Differentiation from bacillary dysentery**\n\n| Feature | Amoebic | Bacillary (*Shigella*) |\n|---|---|---|\n| Onset | Gradual | Abrupt |\n| Fever / toxaemia | Mild | High |\n| Stool | Blood + mucus, offensive, acidic | Mucopus + blood, odourless, alkaline |\n| Microscopy | Clumped RBCs, few pus cells, trophozoites with RBCs | Abundant pus cells + macrophages, RBCs |\n\n**Viva pearls**\n- **Trophozoites with ingested RBCs** = *E. histolytica* (pathogenic).\n- Stool must be examined **fresh and warm**; take **three specimens** on alternate days.\n- Treatment: **metronidazole/tinidazole** (tissue amoebicide) followed by **diloxanide furoate/paromomycin** (luminal agent)."}, {"id": 353, "n": 353, "t": "\"Stool of a person with watery diarrhoea is sent to the microbiology lab. on M/E of stool, no pus cells, macrophage or RBCs are found\". Which might be the causative agents? How will you establish the diagnosis?", "st": 0, "src": "Board 1 Set 10", "du": [], "nmc": [], "vv": ["Board 1 Set 10"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Interpretation.** Watery diarrhoea with **no pus cells, macrophages or RBCs** denotes a **non-inflammatory (secretory/ toxin-mediated or non-invasive) diarrhoea** — the organism acts on the small intestine without invading or destroying the mucosa.\n\n**Possible causative agents**\n\n| Group | Agents |\n|---|---|\n| **Bacteria** | ***Vibrio cholerae* O1/O139** (rice-water stool), **enterotoxigenic *E. coli* (ETEC)**, EPEC, *Staphylococcus aureus* / *Bacillus cereus* / *C. perfringens* (toxins) |\n| **Viruses** | **Rotavirus** (infants), norovirus, adenovirus 40/41, astrovirus |\n| **Protozoa** | ***Giardia intestinalis***, ***Cryptosporidium parvum***, *Cyclospora cayetanensis*, *Cystoisospora belli*, microsporidia |\n\n**How to establish the diagnosis (according to the suspected agent)**\n\n1. ***Vibrio cholerae*:**\n   - **Direct microscopy** of watery stool by **dark-field/phase-contrast** — **darting (\"shooting-star\") motility** that stops when specific anti-O1 antiserum is added; Gram stain shows curved Gram-negative bacilli in \"fish-in-stream\" pattern.\n   - **Enrichment:** **alkaline peptone water** (pH 8.6) for 6–8 h.\n   - **Culture:** **TCBS agar** (yellow sucrose-fermenting colonies), **Monsur's gelatin–taurocholate–tellurite agar** (grey colonies with dark centre and a turbid halo), or blood agar (β-haemolysis for El Tor).\n   - **Biochemical tests:** oxidase +, string test +, ferments glucose/sucrose/mannitol, Voges–Proskauer variable.\n   - **Slide agglutination** with polyvalent O1 and O139 antisera and monovalent **Ogawa/Inaba**; **PCR** for *ctxA*; rapid dipstick tests.\n2. **ETEC:** culture on MacConkey agar → lactose-fermenting *E. coli* → toxin detection (LT/ST by ELISA, PCR).\n3. **Rotavirus/norovirus:** **antigen detection by ELISA/immunochromatography** or RT-PCR.\n4. ***Giardia*:** stool microscopy for trophozoites/cysts (saline/iodine), stool antigen, duodenal aspirate, PCR.\n5. ***Cryptosporidium/Cyclospora*:** **modified Ziehl–Neelsen (cold Kinyoun) acid-fast stain** — pink-red oocysts (4–6 µm for *Cryptosporidium*; 8–10 µm for *Cyclospora*); stool antigen; PCR.\n\n**Management cue:** rehydration (ORS/IV) is the priority; stool should not be refrigerated for *Vibrio* but transported in **Cary–Blair** medium.\n\n**Viva pearls**\n- **No pus cells/RBCs** → non-invasive (toxigenic) organisms.\n- **Rice-water stool** with darting motility on dark-field = **cholera**; **TCBS** is the selective medium."}, {"id": 354, "n": 354, "t": "\"35-year man complains of watery, foul-smelling diarrhea and flatulence for the past 2 weeks. He drank untreated water on a camping trip about a month ago.\" – How will you diagnose it?", "st": 0, "src": "Board 2 Set 16", "du": [], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Provisional diagnosis: Giardiasis (*Giardia intestinalis* / *G. lamblia*)** — watery, foul-smelling, greasy diarrhoea with flatulence/bloating and weight loss, 1–3 weeks after drinking **contaminated (untreated) water** (camping, travellers, or poor sanitation). The main differential includes *Cryptosporidium*, *Cyclospora* and *Cystoisospora*.\n\n**Pathogenesis in brief.** Ingested **cysts** → excystation in the duodenum → **trophozoites attach to the villous brush border by the ventral sucking disc**, causing villous blunting, disaccharidase deficiency and **malabsorption (steatorrhoea)** — **without tissue invasion**.\n\n**Laboratory diagnosis**\n1. **Stool microscopy (routine and most important)**\n   - **Saline wet mount (fresh stool)** — **trophozoites**: pear-shaped, 12–15 µm, with **\"falling-leaf\" motility**, 2 nuclei (\"monkey-face\" / \"old-man's face\"), sucking disc, 4 pairs of flagella and median bodies.\n   - **Iodine mount / concentration (formalin–ether sedimentation or zinc-sulphate flotation)** — **cysts**: oval, 8–12 µm, with 2–4 nuclei and retracted cytoplasm with axonemes.\n   - **Examine ≥ 3 specimens on alternate days** — cyst excretion is intermittent.\n   - **Permanent stains** — iron–haematoxylin, trichrome.\n2. **Stool antigen detection** — **ELISA / direct fluorescent antibody / rapid immunochromatographic test** (very sensitive and specific; detects *Giardia* antigen GSA-65).\n3. **Duodenal/jejunal sampling** — **duodenal aspirate, Entero-test (string test)**, or biopsy (Giemsa stain) when stool tests are repeatedly negative.\n4. **PCR/molecular tests** — sensitive; multiplex gastrointestinal panels.\n5. **Supportive:** stool fat estimation, D-xylose test (malabsorption), IgA level in persistent disease.\n\n**Treatment (for completeness):** metronidazole, tinidazole or nitazoxanide. **Prevention:** boiling/filtering drinking water, hand hygiene.\n\n**Viva pearls**\n- Stool exam: **trophozoite with \"falling-leaf\" motility** (diarrhoeic stool); **cyst** (formed stool).\n- Diagnosis may need **repeated stool samples**, **string test** or **antigen ELISA**."}, {"id": 355, "n": 355, "t": "\"A debilitated middle-aged person coming from abroad complains of persistent watery diarrhea\" – Which parasites might cause this type of diarrhea and in what predisposing condition?", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Interpretation.** A **debilitated (immunocompromised/malnourished) traveller** with **persistent watery diarrhoea** suggests an **opportunistic intestinal protozoan or helminth infection**.\n\n**Parasites that may cause persistent watery diarrhoea**\n\n| Parasite | Diagnostic feature |\n|---|---|\n| ***Cryptosporidium parvum*** | **Acid-fast (modified Ziehl–Neelsen/Kinyoun) oocysts**, 4–6 µm; stool antigen/PCR |\n| ***Cystoisospora (Isospora) belli*** | Large oval **acid-fast oocyst (20–33 µm × 10–19 µm)** with 1–2 sporoblasts; Charcot–Leyden crystals, eosinophilia |\n| ***Cyclospora cayetanensis*** | Acid-fast variable oocyst 8–10 µm; **autofluorescence under UV**; travellers' diarrhoea |\n| **Microsporidia** (*Enterocytozoon bieneusi*, *Encephalitozoon intestinalis*) | Spores 1–3 µm; **modified trichrome** (Weber) or **calcofluor** stain; electron microscopy; PCR |\n| ***Giardia intestinalis*** | Trophozoites/cysts; **hypogammaglobulinaemia** predisposes to severe disease |\n| ***Strongyloides stercoralis*** | **Hyperinfection syndrome** in immunosuppressed (corticosteroids) — rhabditiform larvae in stool, sputum |\n\n**Predisposing conditions**\n- **HIV/AIDS** (CD4 count < 100–200/µL) — the classical setting.\n- **Malignancy / chemotherapy**, **organ transplantation**, **corticosteroid or immunosuppressive therapy**, congenital immune deficiency, hypogammaglobulinaemia, **malnutrition**, chronic alcoholism, **extremes of age**.\n- Travel to endemic areas; contaminated water/raw vegetables.\n\n**How diagnosed:** **concentrated stool** examined with **modified acid-fast staining**; **antigen ELISA / DFA**; **PCR**; for *Strongyloides* — **Harada–Mori filter-paper culture / agar-plate culture / Baermann technique**, serology (ELISA), duodenal aspirate.\n\n**Viva pearls**\n- **AIDS-associated diarrhoea** → *Cryptosporidium*, *Cystoisospora*, *Cyclospora*, microsporidia (**coccidian parasites — acid-fast oocysts**).\n- **Strongyloides hyperinfection** → steroids/HTLV-1/malnutrition."}, {"id": 356, "n": 356, "t": "\"A patient was treated with broad spectrum antibiotics for prolonged period and then developed diarrhea.\" Which bacteria might cause this and why? How will you treat the patient?", "st": 0, "src": "Board 1 Set 06", "du": [], "nmc": [], "vv": ["Board 1 Set 06"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Provisional diagnosis: Antibiotic-associated diarrhoea / pseudomembranous colitis caused by *Clostridioides (Clostridium) difficile*.**\n\n**Why does it occur?**\n1. **Broad-spectrum antibiotics** (**clindamycin, ampicillin/amoxicillin, cephalosporins, fluoroquinolones**) given for a prolonged period **kill the normal anaerobic gut flora** (colonisation resistance).\n2. This allows **resistant *C. difficile* spores** (acquired from hospital environment/contacts or already carried in the gut) to **germinate, multiply and produce toxins**.\n3. **Toxin A (TcdA — enterotoxin)** and **Toxin B (TcdB — cytotoxin)** glucosylate Rho-GTPases → disruption of the actin cytoskeleton, epithelial cell death, fluid secretion and intense neutrophilic inflammation → **pseudomembrane** (yellow-white plaques of fibrin, mucus, necrotic cells, neutrophils) on the colonic mucosa. Hypervirulent strains (**NAP1/BI/027**) also produce **binary toxin** and are associated with severe disease and toxic megacolon.\n\n**Organism:** large **Gram-positive, spore-forming, strictly anaerobic bacillus**; spores resist alcohol-based hand rubs.\n\n**Laboratory diagnosis** (test only **diarrhoeal (unformed) stools**)\n- **Two-step algorithm:** **glutamate dehydrogenase (GDH) antigen** screen + **toxin A/B enzyme immunoassay**; discordant results resolved by **NAAT (PCR for *tcdB*)**.\n- **Toxigenic culture** on **CCFA (cycloserine–cefoxitin–fructose agar)** — yellow, ground-glass colonies with **horse-dung (barnyard) odour** and chartreuse fluorescence under UV.\n- **Cytotoxin neutralisation assay** (reference method) on cell culture.\n- **Endoscopy** — **pseudomembranes**; CT — colonic wall thickening; **leucocytosis** is common.\n\n**Treatment**\n1. **Stop the inciting antibiotic** if possible; avoid anti-motility drugs; fluid and electrolyte replacement.\n2. **Oral vancomycin** or **fidaxomicin** (fidaxomicin is the preferred agent in the 2021 IDSA/SHEA update because of lower recurrence). **Metronidazole** is no longer the first choice and is reserved for use only when the other drugs are not available (as is common in resource-limited settings). Fulminant disease: high-dose oral vancomycin **plus** IV metronidazole.\n3. **Recurrent disease:** vancomycin taper/fidaxomicin; **faecal microbiota transplantation** or approved microbiome products. *(Bezlotoxumab, mentioned in older notes, has been withdrawn by its manufacturer.)*\n4. **Infection control:** contact precautions, **handwashing with soap and water**, environmental disinfection with sporicidal agents.\n\n**Viva pearls**\n- *C. difficile* = commonest cause of **antibiotic-associated diarrhoea and pseudomembranous colitis**.\n- Toxin A = enterotoxin; Toxin B = cytotoxin. Spores resist alcohol → **soap and water**."}, {"id": 357, "n": 357, "t": "\"A 30 years Muslim male used to take undercooked beef (shikh kabab) observed whitish tape-like segments in the stool\" – Which helminth might cause this? State mode of transmission and lab diagnosis of this helminth.", "st": 0, "src": "Board 2 Set 08", "du": [], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Diagnosis: *Taenia saginata* (beef tapeworm) — taeniasis.** The history of eating **undercooked beef (shik kabab)** and passing **whitish tape-like (flat, segmented) motile segments** in stool is characteristic.\n\n**Morphology.** Adult length **4–10 m**; **scolex** pear-shaped with **4 suckers, no rostellum or hooklets (unarmed)**; gravid proglottids **longer than broad**, with **15–20 lateral uterine branches** on each side; ~1000 proglottids; eggs ~30–40 µm, brown, radially striated embryophore with an **oncosphere (hexacanth embryo; 6 hooklets)**.\n\n**Mode of transmission**\n- **Definitive host:** man (only). **Intermediate host:** **cattle**.\n- Man acquires infection by **ingesting raw/undercooked beef** containing **cysticercus bovis**.\n- The scolex evaginates in the small intestine, attaches to the mucosa and matures in ~10–12 weeks. Gravid segments (**active, motile**, crawl out of the anus even without defecation) or eggs are shed in faeces → contaminated pasture → cattle ingest eggs → oncospheres penetrate gut → **cysticerci (*C. bovis*)** in muscle.\n- **Man does not get cysticercosis** from *T. saginata* (humans are not intermediate hosts).\n\n**Laboratory diagnosis**\n1. **Stool examination:** **eggs** (round/oval, striated shell, hexacanth embryo) by wet mount/concentration — **indistinguishable from *T. solium* eggs**.\n2. **Gravid proglottid examination** — the proglottid is flattened between two glass slides, or cleared in glycerine/lactophenol, or **India ink is injected through the genital pore**; **count of lateral uterine branches (15–20 on each side) = *T. saginata*** (vs 7–13 in *T. solium*).\n3. **Scolex identification** after treatment (unarmed, 4 suckers, no hooklets) to confirm cure.\n4. **Perianal swab (cellophane tape / Graham's tape)** — eggs are often present on perianal skin because gravid segments emerge actively.\n5. **Coproantigen ELISA / PCR** — sensitive and species specific.\n6. **Haematology:** mild eosinophilia.\n\n**Treatment (for reference):** **praziquantel** or **niclosamide** (single dose). **Prevention:** adequate cooking of beef (> 60 °C), freezing, meat inspection, sanitary disposal of faeces.\n\n**Viva pearls**\n- ***T. saginata*:** unarmed scolex, 15–20 uterine branches, **cattle** as intermediate host, **no cysticercosis in man**.\n- Proglottids are **motile and crawl out spontaneously**."}, {"id": 358, "n": 358, "t": "\"30 years non-Muslim male used to take undercooked pork observed whitish tape-like segments in the stool\" – Which helminth might cause this? State lab diagnosis and complications of this helminth.", "st": 0, "src": "Board 2 Set 09", "du": [], "nmc": [], "vv": ["Board 2 Set 09"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Diagnosis: *Taenia solium* (pork tapeworm) — taeniasis**, from eating undercooked pork containing **cysticercus cellulosae**.\n\n**Morphology.** Adult **2–4 m**; **scolex** globular with **4 suckers and a rostellum with a double row of 25–50 hooklets (armed)**; gravid proglottids with **7–13 lateral uterine branches**; proglottids are expelled **in chains of 5–6**, passively with stool (not actively crawling).\n\n**Laboratory diagnosis**\n1. **Stool microscopy** — typical *Taenia* eggs (cannot be differentiated from *T. saginata* eggs).\n2. **Proglottid examination** — **India-ink injection** into the uterus; **7–13 lateral branches** each side = *T. solium*. Handle gravid segments with care (eggs are infective to humans).\n3. **Scolex** — **rostellum and hooklets** after expulsion (after purgation).\n4. **Coproantigen ELISA** and **PCR** (species-specific).\n5. **Peripheral blood:** eosinophilia may be present.\n6. **Cysticercosis work-up (if clinical suspicion):** **CT/MRI** of brain (cysts with scolex \"dot sign\", calcifications), **immunoblot (EITB) / ELISA** for anti-cysticercal antibodies (serum, CSF), X-ray/USG for soft-tissue calcification, fundoscopy, **biopsy** of subcutaneous nodule.\n\n**Complications**\nUnique to ***T. solium*** because eggs are infective to humans (humans can act as the intermediate host):\n- **Cysticercosis** — via **autoinfection** (anti-peristalsis, faecal–oral) or ingestion of eggs from a carrier in the household.\n  - **Neurocysticercosis** — **seizures (commonest cause of acquired epilepsy in endemic areas)**, headache, raised intracranial pressure, hydrocephalus (racemose), focal deficits, meningitis.\n  - **Ocular** — vitreous/retina cysticerci → visual loss.\n  - **Subcutaneous/muscular** — painless nodules, later calcified \"rice-grain\" calcifications.\n  - **Cardiac** — arrhythmias.\n- **Intestinal taeniasis** — usually mild abdominal discomfort, nausea, weight loss.\n\n**Treatment:** intestinal taeniasis — **praziquantel** or **niclosamide**; cysticercosis — **albendazole ± praziquantel with corticosteroids**, antiepileptics, surgery for hydrocephalus. **Prevention:** meat inspection, cooking pork, latrines, **treating carriers**, health education.\n\n| Feature | *T. saginata* | *T. solium* |\n|---|---|---|\n| Intermediate host | Cattle | **Pig** (man in cysticercosis) |\n| Scolex | **Unarmed** | **Armed (rostellum + hooklets)** |\n| Uterine branches | 15–20 | 7–13 |\n| Larva | *C. bovis* | *C. cellulosae* |\n| Cysticercosis in man | **No** | **Yes** |\n\n**Viva pearls**\n- *T. solium* → **cysticercosis/neurocysticercosis (seizures)**; eggs are infective to humans.\n- Armed scolex; 7–13 uterine branches; **pork**."}, {"id": 359, "n": 359, "t": "\"A person from high society with pet dogs in the house was found to have a cystic mass in the liver on Ultrasonography\" – What might be the parasitic cause of this? State mode of transmission and lab diagnosis of this condition.", "st": 0, "src": "Board 2 Set 10", "du": [], "nmc": [], "vv": ["Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Diagnosis: Cystic hydatid disease (hydatidosis) caused by *Echinococcus granulosus*** — a cystic liver mass in a person living in close contact with **dogs** (definitive host).\n\n**Life cycle and mode of transmission**\n- **Definitive host:** dog (also wolf, jackal) — adult worm (3–6 mm) lives in the small intestine; **eggs** are excreted in faeces.\n- **Intermediate hosts:** **sheep, goat, cattle, pig**, camel. **Man is an accidental (dead-end) intermediate host.**\n- **Man is infected** by **ingesting eggs** — from fur of pet dogs contaminated with eggs (petting and hand-to-mouth), from **contaminated vegetables, water, soil, or hands**. **Not by eating infected meat.**\n- In the intestine the **oncosphere** is released, penetrates the mucosa and is carried by the portal circulation to the **liver (≈ 60–70 %)**, lungs (≈ 20 %), and other organs where it develops into a **hydatid cyst** (outer pericyst, laminated membrane, inner germinal layer producing **brood capsules, protoscolices, daughter cysts**).\n\n**Clinical features:** often asymptomatic for years; right upper quadrant pain, hepatomegaly, palpable cystic mass, obstructive jaundice; complications on rupture/secondary infection (see also Q332, Part III — Parasitology).\n\n**Laboratory diagnosis**\n1. **Imaging (first-line):** **ultrasonography** (WHO-IWGE classification CE1–CE5; \"water-lily sign\" in detached membranes), CT/MRI (cyst wall, daughter cysts, calcification), chest X-ray for pulmonary cysts.\n2. **Serology** — **ELISA, indirect haemagglutination (IHA)**, **immunoblot (Western blot; detects antigen B subunits)**, counter-immunoelectrophoresis (**arc 5** of Capron). Sensitivity is higher for liver than lung cysts; **false negatives** occur in calcified/inactive cysts and **cross-reactions** with cysticercosis.\n3. **Casoni's intradermal test** — now **obsolete** (poor specificity, false positives, risk of hypersensitivity) — see also Q335, Part III — Parasitology.\n4. **Haematology:** **eosinophilia** (in roughly 25–50 % of cases — not constant); raised ESR; abnormal LFTs if cyst compresses biliary tract.\n5. **Examination of cyst fluid** (obtained surgically or by PAIR) — **hydatid sand** (scolices with hooklets, free-lying brood capsules); **never aspirate a suspected hydatid cyst without precautions** (risk of anaphylaxis and dissemination) — only as part of **PAIR (puncture–aspiration–injection–reaspiration)** under albendazole cover.\n6. **Histopathology** — laminated (chitinous) membrane, germinal layer, scolices.\n7. **Molecular** — PCR for species confirmation.\n\n**Treatment:** **albendazole**; **surgery (cystectomy)**; **PAIR**; **\"watch and wait\"** for inactive cysts.\n\n**Viva pearls**\n- **Dog = definitive host; sheep = intermediate host; man = accidental host.**\n- Do **not** perform diagnostic aspiration (anaphylaxis, spillage); **Casoni's test is obsolete**."}]}, {"id": "clinical-8", "title": "Febrile, Systemic & Blood Scenarios", "qs": [{"id": 360, "n": 360, "t": "\"A patient with fever for 3 days has taken 6 tablets of ciprofloxacin\" - physicians asked for blood culture. Is it the appropriate test in this situation? Explain.", "st": 0, "src": "Board 1 Set 01", "du": [], "nmc": [], "vv": ["Board 1 Set 01"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Short answer.** Blood culture is the correct *test of choice* for a patient with a short febrile illness suspected of **bacteraemia/enteric fever**, but **after 6 tablets of ciprofloxacin it is no longer a reliable test** — a negative culture **cannot exclude** the infection. It is still worth doing correctly, and must be supplemented by other methods.\n\n**Why is blood culture less reliable here?**\n- **Prior antibiotic therapy** — even a few doses of ciprofloxacin (excellent against *Salmonella*, *E. coli*, many pathogens) produce partial treatment: bacterial count in blood falls below the detection limit and residual drug in the specimen **inhibits growth in the bottle**. Sensitivity of blood culture falls by about one-third after antibiotic use.\n- **Timing** — in enteric fever the sensitivity is highest in the first week (≈ 60–80 %) and declines later.\n- **Resistance** — fluoroquinolone-resistant *Salmonella* Typhi/Paratyphi (nalidixic-acid resistant) is common in South Asia, so \"treatment failure\" may also occur.\n\n**How should the laboratory proceed?**\n1. **Still collect blood culture** — **at the trough level**, just before the next dose, **2–3 sets with a large volume (8–10 mL per bottle for adults)**, using **resin- or charcoal-containing media** (BACTEC Plus, BacT/ALERT FA Plus) that adsorb antibiotics, or **bile broth**/dilution at 1 : 10.\n2. **Bone-marrow aspirate culture** — **the most sensitive** method (80–95 %), remains positive despite prior antibiotics and late in disease (bacterial concentration is ~10–50 × higher than in blood).\n3. **Clot culture** (lysis of the clot with streptokinase) — removes serum bactericidal effect.\n4. **Culture of other specimens** — **stool and urine** (positive from the 2nd–3rd week), duodenal aspirate, rose-spot biopsy.\n5. **Serology/molecular tests** — **Widal test** (paired sera, 4-fold rise; a single titre has limited value in endemic areas), **Typhidot (IgM/IgG), TUBEX**, **PCR**.\n6. **Haematology and exclusion of other causes** — leucopenia, relative bradycardia, malaria smear/RDT, dengue NS1, urine culture.\n\n**Viva pearls**\n- **Bone-marrow culture** is the **best test** in a patient who has already taken antibiotics.\n- Always collect blood culture **before** antibiotics — the reason for the standard rule."}, {"id": 361, "n": 361, "t": "\"A 25 years old women reported to you with history of high fever for 5 days. Clinical examination reveals petechial rashes over trunk with gum bleeding.\" What is your provisional diagnosis? What other tests you like to perform?", "st": 0, "src": "Board 1 Set 14", "du": [], "nmc": [], "vv": ["Board 1 Set 14"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Provisional diagnosis: Dengue haemorrhagic fever / dengue fever with bleeding manifestations (severe dengue)** — high fever for 5 days with **petechial rash on the trunk and gum bleeding** in a patient from a dengue-endemic area (Bangladesh, monsoon season). The 5th day corresponds to the **critical phase** (defervescence with plasma leakage).\n\n**Differential diagnosis:** chikungunya, leptospirosis, **meningococcaemia**, scrub typhus/rickettsial infection, malaria, enteric fever, **ITP/leukaemia**, other viral haemorrhagic fevers (rare).\n\n**Investigations**\n1. **Basic haematology:** **complete blood count** — **thrombocytopenia (< 100,000/mm³)**, leucopenia, **rising haematocrit (≥ 20 % over baseline = plasma leakage)**; peripheral smear.\n2. **Tourniquet test** (positive if ≥ 10–20 petechiae per 2.5 cm² — WHO 2009/1997).\n3. **Specific virological tests**\n   - **NS1 antigen (ELISA/rapid)** — positive from **day 1 to 5 (up to 9)** of fever; helpful in early diagnosis.\n   - **Anti-dengue IgM and IgG ELISA** — IgM becomes positive **after day 5**; **IgG in first days = secondary infection**; **paired sera** (4-fold rise in IgG) confirm.\n   - **RT-PCR / serotyping (DENV-1–4)** — most sensitive in the first 5–7 days; viral isolation (research).\n4. **Biochemistry:** raised AST/ALT, hypoalbuminaemia, **PT/aPTT** (coagulopathy), serum electrolytes, urea/creatinine.\n5. **Imaging:** USG/chest X-ray — gall-bladder wall thickening, ascites, pleural effusion.\n6. **To exclude other causes:** **malarial parasite (smear/RDT)**, **blood culture**, **Widal/Typhidot**, leptospira IgM, scrub typhus IgM (ELISA), urine R/E.\n\n**Viva pearls**\n- **NS1 antigen** (day 1–5) and **IgM** (after day 5) → complementary tests.\n- Danger signs: abdominal pain, persistent vomiting, bleeding, rising haematocrit with **falling platelets**."}, {"id": 362, "n": 362, "t": "\"A person from Phulbaria, Mymensingh complains of prolonged low-grade fever for 4 months associated with hepatosplenomegaly anemia\" – Which parasite is responsible for this febrile illness? How will you confirm the diagnosis in the lab? Name some other parasites causing febrile illness.", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "v
