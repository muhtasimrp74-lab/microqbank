mation** on corn-meal/Tween-80 agar at 20–25°C (*C. albicans*, *C. dubliniensis*), **blood culture**, **CHROMagar** (green colonies for *C. albicans*), sugar fermentation (glucose and maltose fermented, **not lactose**) and MALDI-TOF/PCR.\n- **Predisposing factors:** broad-spectrum antibiotics; **indwelling catheters**/ biofilm formation; diabetes mellitus; neutropenia, malignancy, chemotherapy; corticosteroids and immunosuppressants; AIDS; extremes of age; burns; abdominal surgery; total parenteral nutrition; IV drug abuse; pregnancy; oral contraceptives.\n- **Diseases produced:**\n  - *Mucosal:* oral thrush, oesophagitis, vulvovaginitis, balanitis.\n  - *Cutaneous:* intertrigo, paronychia, onychomycosis, diaper rash, otomycosis.\n  - *Chronic mucocutaneous candidiasis.*\n  - *Systemic:* candidaemia, endocarditis, meningitis, endophthalmitis, renal and hepatosplenic candidiasis.\n- **Treatment (brief):** **echinocandin** (caspofungin/micafungin) first-line for candidaemia; **remove the infected catheter**; fluconazole for susceptible species."}, {"id": 169, "n": 169, "t": "Mention the predisposing factors for vaginal candidiasis.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Predisposing factors for vaginal candidiasis (moniliasis / vulvovaginal candidiasis)**\n1. **Pregnancy** — high oestrogen and glycogen in vaginal epithelium.\n2. **Diabetes mellitus** — high glucose; ↑ yeast adherence.\n3. **Oral contraceptive pills** (high-oestrogen) and hormone replacement therapy.\n4. **Broad-spectrum antibiotics** — suppress vaginal lactobacilli (Döderlein's bacilli) and alter the flora/acidity.\n5. **Corticosteroids, immunosuppressive drugs, HIV/AIDS.**\n6. Local factors: tight synthetic underwear, moist hot climate, IUCD, douching, poor hygiene, obesity."}, {"id": 170, "n": 170, "t": "Describe the laboratory diagnosis of vaginal candidiasis.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** demonstration of budding yeasts and pseudohyphae in the vaginal discharge by microscopy, and isolation by culture.\n\n1. **Specimen:** **high vaginal swab** (HVS) — two swabs, one for direct smear and one for culture; collected before topical therapy.\n2. **Direct microscopy**\n   - **Wet mount** (normal saline / **10% KOH**): **budding yeast cells and pseudohyphae**.\n   - **Gram stain:** **Gram-positive** oval budding yeasts and pseudohyphae, few lactobacilli.\n3. **Culture:** **SDA** (or blood agar) at **37°C for 24–48 hours** → **cream-coloured, smooth, pasty colony** with a yeasty odour. Gram film of colony: yeast ± pseudohyphae.\n4. **Identification:** **germ-tube test** and **chlamydospore** formation (*C. albicans*); **CHROMagar** (green); carbohydrate fermentation (glucose and maltose acid + gas, **no lactose**).\n5. **Differentiate from trichomoniasis:** see table below.\n\n| Feature | Vaginal candidiasis | Trichomoniasis (*T. vaginalis*) |\n|---|---|---|\n| Discharge | **Curdy, white** (\"cottage-cheese\") | **Frothy**, yellow-green |\n| Itching | **Severe** | Less |\n| Vaginal pH | Usually ≤ 4.5 | > 4.5 |\n| Microscopy | Budding yeasts, pseudohyphae | Pear-shaped flagellates with jerky motility |\n| Culture | SDA — cream colony | Special (Diamond's) medium |\n\n**Treatment:** topical azoles (clotrimazole, miconazole) or oral **fluconazole**."}, {"id": 171, "n": 171, "t": "*Candida:* Name diseases / clinical problems caused by *Candida albicans* and discuss its clinical significance.", "st": 4, "src": "Board 2 Set 06, 08, 18, 19", "du": [], "nmc": [], "vv": ["Board 2 Set 06", "Board 2 Set 08", "Board 2 Set 18", "Board 2 Set 19"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n***Candida albicans*** is a **dimorphic-like yeast** (oval budding yeast with a single bud, forms pseudohyphae and true hyphae), **Gram-positive**, a **normal commensal** of mouth, GIT, vagina and skin. Candidiasis is the **commonest systemic mycosis**; *C. albicans* accounts for ≈ 90% of cases.\n\n**Diseases / clinical problems**\n\n| Category | Diseases |\n|---|---|\n| **A. Superficial — mucosal** | **Oral thrush** (white pseudomembrane), **vaginitis / vulvovaginitis (moniliasis)**, balanitis, oesophagitis |\n| **B. Superficial — cutaneous** | **Intertrigo** (axilla, groin, intergluteal), **diaper rash**, **paronychia and onychomycosis**, otomycosis |\n| **C. Systemic (invasive)** | **Candidaemia**, endocarditis (IV drug abusers), meningitis, endophthalmitis, renal candidiasis, hepatosplenic candidiasis, septicaemia |\n| **D. Chronic mucocutaneous candidiasis** | Persistent skin, nail and mucosal infection in T-cell deficiency (rare, early-onset) |\n| **E. Hypersensitivity** | Candidid (id) reaction |\n\n**Clinical significance**\n1. Commonest **opportunistic fungal infection**; marker of immunosuppression (oral/oesophageal thrush in AIDS).\n2. **Hospital-acquired** infections: bloodstream infection from catheters/biofilms; high mortality.\n3. Emerging resistant species (*C. glabrata*, *C. auris*).\n4. Treated by **removing predisposing factors** plus antifungals; no vaccine."}, {"id": 172, "n": 172, "t": "Mention the lab diagnosis of oral thrush.", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Oral thrush** — overgrowth of *Candida albicans* on mouth/tongue forming **creamy white, curd-like pseudomembranous plaques** that can be scraped off, leaving a red, raw (sometimes bleeding) surface. Common in **infants, the elderly, diabetics, patients on antibiotics/steroids/inhaled steroids, denture wearers and AIDS patients**.\n\n**Laboratory diagnosis**\n1. **Specimen:** **oral swab or scraping** from the plaque.\n2. **Microscopy:** smear stained by **Gram** → Gram-positive budding yeast cells and pseudohyphae; or wet mount with **10% KOH**/saline.\n3. **Culture:** **SDA at 37°C, 24–48 hours** → cream-coloured colonies; also on blood agar.\n4. **Identification:** **germ-tube test** (positive in *C. albicans*), chlamydospore production, CHROMagar (green), carbohydrate fermentation.\n5. In AIDS: also test for HIV and check CD4 count when thrush is unexplained or recurrent.\n\n**Treatment:** topical nystatin or clotrimazole; oral fluconazole if severe or in AIDS."}, {"id": 173, "n": 173, "t": "\"Presence of Candida in yeast form in stool does not always indicate candidiasis\" – explain.", "st": 0, "src": "Board 2 Set 13", "du": [], "nmc": [], "vv": ["Board 2 Set 13"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*Candida albicans* is a **normal commensal of the gastrointestinal tract** (and mouth, vagina, skin), carried by a considerable proportion of **healthy people**; therefore its presence in stool **only indicates colonisation**.\n\n1. **Colonisation ≠ infection:** disease requires **tissue invasion** (pseudohyphae/hyphae in tissue), impaired host defences and clinical correlation.\n2. Stool culture/microscopy for yeasts has **no diagnostic value**; antibiotic-associated diarrhoea is rarely due to *Candida*.\n3. Diagnosis of invasive disease needs **isolation from a normally sterile site** (blood, CSF), or **histological demonstration of tissue invasion**, along with appropriate risk factors.\n4. A heavy growth after **broad-spectrum antibiotics** reflects only suppression of competing flora.\n\n*Treat only when there is clinical evidence of disease (e.g., oesophageal candidiasis, invasive infection).*"}]}, {"id": "mycology-8", "title": "Cryptococcus neoformans", "qs": [{"id": 174, "n": 174, "t": "*Vignette: an HIV-positive patient presents with headache, fever and neck stiffness; CSF shows encapsulated yeast cells.* Identify the causative fungus and its pathogenesis.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Causative fungus:** ***Cryptococcus neoformans*** — causing **cryptococcal meningitis** (meningoencephalitis) in an HIV-positive (↓ CD4) patient; the **encapsulated yeast** in CSF clinches it.\n- **Pathogenesis**\n  1. **Habitat/source:** soil contaminated with **pigeon droppings**; birds are not infected. Infection by **inhalation** of aerosolised yeast cells (small, desiccated); **no person-to-person transmission.**\n  2. **Primary lung focus** — usually asymptomatic or flu-like, and self-limited in a healthy host.\n  3. In **↓ cell-mediated immunity (AIDS, CD4 < 100/µL, steroids, transplant)** the yeast **multiplies and disseminates by blood**, showing special tropism for the **CNS** (meninges and brain) → **meningoencephalitis**; also skin, bone, prostate, adrenals, eye.\n  4. **Virulence factors:** (a) **polysaccharide capsule** (glucuronoxylomannan) — anti-phagocytic, inhibits complement and cell-mediated immunity; (b) **melanin** (laccase/phenol oxidase) — protects from oxidative damage; (c) **urease** and (d) ability to grow at **37°C**.\n  5. Tissue reaction is minimal or granulomatous (**cryptococcoma**); ↑ intracranial pressure and meningeal inflammation give headache, fever, neck stiffness, confusion.\n- **Treatment:** **amphotericin B + flucytosine**, then fluconazole for consolidation/maintenance; control raised intracranial pressure with therapeutic lumbar punctures."}, {"id": 175, "n": 175, "t": "How can you diagnose cryptococcal meningitis in the laboratory? — Also asked: important characteristics and clinical importance of *Cryptococcus neoformans*.", "st": 7, "src": "NMC 4; DU-23N; Board 2 Set 03, 05, 13, 19, 20", "du": ["DU-23N"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 03", "Board 2 Set 05", "Board 2 Set 13", "Board 2 Set 19", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**A. Important characteristics of *Cryptococcus neoformans***\n1. **Oval, budding yeast** (4–6 µm) with a **wide polysaccharide capsule** — **the only capsulated fungus**.\n2. **Not dimorphic** — yeast only; **narrow-based** buds (cf. *Blastomyces* broad-based).\n3. **Urease positive**; **phenol oxidase** positive (brown colonies on **niger-seed agar**); grows at 37°C.\n4. **Habitat:** soil enriched with **pigeon droppings** (*C. gattii* — eucalyptus trees); transmission by **inhalation**, no human-to-human spread.\n5. Opportunistic — mainly in **AIDS** and other T-cell defects.\n\n**B. Clinical importance**\n- Causes **cryptococcosis**, especially **cryptococcal meningitis** — the **most common life-threatening fungal disease in AIDS patients** (also in diabetics, transplant, steroid therapy, malignancy; ≈ half of patients may be non-HIV).\n- Other lesions: pulmonary (pneumonia, nodules), skin (papules/ulcers, molluscum-like), bone (osteolytic), prostate, adrenals, eye.\n- *C. gattii* can infect immunocompetent individuals and forms cryptococcomas.\n\n**C. Laboratory diagnosis of cryptococcal meningitis**\n\n| Step | Details |\n|---|---|\n| **Specimen** | **CSF** (centrifuged deposit) — also sputum, blood, urine, tissue, skin scrapings. Note opening pressure (often raised) |\n| **1. Microscopy — India ink (negative stain)** | Mix CSF deposit with India ink → **round/oval budding yeast cells surrounded by a wide clear halo (capsule)** against a black background. Fast and cheap, but ~ 50–80% sensitive (depends on fungal load) |\n| **2. Antigen detection (most sensitive)** | **Cryptococcal capsular polysaccharide antigen (CrAg)** in CSF/serum by **latex agglutination test (CRAG)** or lateral-flow assay; titre rises → positive even when India ink is negative |\n| **3. Culture** | **SDA, 37°C, 2–3 days** → **cream-coloured, mucoid** colonies (capsule); brown colonies on **niger-seed agar**; **urease +**. *(Cycloheximide must not be added.)* |\n| **4. Histology** | **Mucicarmine** stains the capsule red; also PAS/GMS (Gram stain unreliable) |\n| **5. Molecular** | PCR for ribosomal DNA |\n\n**CSF findings:** raised pressure, mildly raised protein, low–normal glucose, few lymphocytes (often minimal inflammation in AIDS).\n\n**Viva corner**\n- *Why is India ink a \"negative stain\"?* — It stains the background, not the capsule — capsule appears as a halo.\n- *Test for capsular antigen?* — Latex agglutination (CRAG).\n- *Treatment?* — Amphotericin B + flucytosine → fluconazole.\n- *Natural source?* — Pigeon droppings."}, {"id": 176, "n": 176, "t": "Name the capsulated fungus with pathological lesions produced by it.", "st": 0, "src": "Board 2 Set 08", "du": [], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**The capsulated fungus is *Cryptococcus neoformans*** — the **only encapsulated pathogenic fungus** (a wide polysaccharide capsule is its major virulence factor; *Histoplasma capsulatum* is *not* capsulated).\n\n**Pathological lesions produced (cryptococcosis)**\n1. **CNS:** **meningitis / meningoencephalitis** (commonest and most serious), and **cryptococcomas** (granulomas).\n2. **Lungs:** asymptomatic infection, pneumonia, pulmonary nodules/cryptococcoma.\n3. **Skin:** papules, nodules, ulcers (molluscum-like).\n4. **Other sites:** bone (osteolytic), prostate, adrenal glands, eye, liver, kidney.\n\nHistologically, lesions show **minimal inflammation with masses of yeasts** (\"soap-bubble\" gelatinous lesions in the brain) or a granulomatous reaction."}]}, {"id": "mycology-9", "title": "Pneumocystis jirovecii", "qs": [{"id": 177, "n": 177, "t": "*Pneumocystis:* \"Pneumocystis jirovecii exists in cysts and trophozoite form and its cell membrane does not have ergosterol, but it is classified as fungi\" – explain.", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*Pneumocystis jirovecii* (formerly *P. carinii*; renamed in 2002 for the human species) causes **interstitial plasma-cell pneumonia (PCP)** in the immunocompromised.\n\n**Why it is called a fungus**\n1. **Molecular studies** — **rRNA sequence, mitochondrial DNA and enzyme analysis** show it to be a **fungus related to yeasts**, hence taxonomically a fungus.\n\n**Why it behaves like a protozoan (hence confusion)**\n1. In tissue it exists as **cysts (containing intracystic bodies/sporozoites) and trophozoites** — resembling protozoal cysts.\n2. Its membrane **lacks ergosterol** (contains cholesterol instead) → **resistant to amphotericin B and azoles**.\n3. It **cannot be cultured** on fungal (or bacterial) media.\n4. It **responds to antiprotozoal/antifolate drugs** — **co-trimoxazole, pentamidine** — not to antifungals.\n\n**Conclusion:** the exam statement is explained thus — *genetically a fungus; biologically and therapeutically protozoan-like*."}, {"id": 178, "n": 178, "t": "\"Pneumocystis jirovecii is one of the most important indicators of AIDS\" – explain.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*Pneumocystis jirovecii* pneumonia (PCP) is an **AIDS-defining (indicator) illness**:\n\n1. In the immunocompetent host, infection is **asymptomatic** and kept in check by CD4⁺ T lymphocytes and alveolar macrophages.\n2. When the **CD4 count falls below 200/µL**, the organism proliferates → **diffuse interstitial pneumonia** (fever, dry cough, dyspnoea, hypoxaemia; \"ground-glass\" bilateral infiltrates; ↑ LDH).\n3. It was **the commonest opportunistic infection and cause of death in AIDS** before prophylaxis, and untreated PCP is nearly 100% fatal.\n4. Appearance of PCP in an otherwise unexplained pneumonia should prompt **HIV testing**.\n5. **Diagnosis:** *bronchoalveolar lavage* or induced sputum — **cysts by Gomori methenamine silver, toluidine blue, Giemsa (trophozoites) or immunofluorescence**; PCR; serum β-D-glucan. *(Expectorated sputum is usually unsuitable.)*\n6. **Treatment:** **co-trimoxazole**; prophylaxis (co-trimoxazole or aerosolised pentamidine) when CD4 < 200."}]}, {"id": "mycology-10", "title": "Aspergillus", "qs": [{"id": 179, "n": 179, "t": "How would you diagnose a case of Aspergillosis?", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*Aspergillus* (mainly ***A. fumigatus***; also ***A. flavus***, *A. niger*) is an ubiquitous **mould** (not dimorphic) producing **airborne conidia**. The diagnostic approach depends on the **clinical type**.\n\n**Clinical forms:** (1) allergic — ABPA, allergic fungal sinusitis, asthma; (2) **aspergilloma (fungus ball)**; (3) **invasive aspergillosis** (pulmonary, sinus, CNS); (4) chronic necrotizing / chronic pulmonary aspergillosis; (5) cutaneous, ear (otomycosis), corneal (keratitis).\n\n**Laboratory diagnosis**\n\n1. **Specimen:** sputum, **bronchoalveolar lavage**, lung biopsy, sinus aspirate, corneal scrapings.\n2. **Direct microscopy** (KOH/calcofluor): **septate hyphae with dichotomous (V-shaped, ~45°) branching, parallel walls**.\n3. **Histopathology:** septate branching hyphae **invading tissue/blood vessels** (GMS or PAS) — proof of invasive disease.\n4. **Culture on SDA:** 25–37°C; colonies — *A. fumigatus* blue-green, *A. flavus* yellow-green, *A. niger* black; LPCB mount shows **conidiophore, vesicle, phialides and radiating chains of conidia**. A positive sputum culture alone shows colonisation, not disease.\n5. **Antigen:** **galactomannan** (serum/BAL) — high in invasive aspergillosis; **β-D-glucan**.\n6. **Serology / allergy tests (ABPA):** raised total IgE, *Aspergillus*-specific IgE/IgG (precipitins), peripheral **eosinophilia**, immediate skin-prick reactivity.\n7. **Imaging:** chest CT — **halo sign** (early invasive disease), **air-crescent sign** (later; also aspergilloma).\n8. **PCR** for *Aspergillus* DNA.\n\n**Treatment:** invasive disease — **voriconazole** (first-line), alternatives liposomal amphotericin B, isavuconazole, posaconazole; ABPA — corticosteroid ± itraconazole; aspergilloma — surgical excision if haemoptysis.\n\n**Viva corner**\n- *Aflatoxin is from?* — *A. flavus* (HCC).\n- *Branching: Aspergillus vs Mucor?* — *Aspergillus*: septate, acute-angle (V); *Mucor*: broad aseptate, right-angle."}]}, {"id": "mycology-11", "title": "Appendix — Fungal Clinical Scenarios from Part IV (Clinical Microbiology)", "qs": [{"id": "375-m", "n": 375, "t": "\"A diabetic lady complains of whitish vaginal discharge\" – Which fungi might cause this and how will you diagnose in the lab?", "st": 0, "src": "Board 2 Set 01", "du": [], "nmc": [], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": false, "v": true, "x": 1, "a": "**Answer**\n\n- **Probable diagnosis:** **Vulvovaginal candidiasis (moniliasis).**\n- **Fungus:** ***Candida albicans*** (≈ 90%); also *C. glabrata*, *C. tropicalis*.\n- **Why in a diabetic:** hyperglycaemia and glycosuria raise glucose in vaginal secretions, ↑ yeast adherence and growth, and impair neutrophil function.\n- **Laboratory diagnosis:** HVS → wet film / 10% KOH and Gram stain (budding yeast + pseudohyphae); culture on SDA at 37°C, 24–48 h (cream colonies); germ-tube test. *(Full answer: Q170.)*"}, {"id": "376-m", "n": 376, "t": "\"A young female with oral contraceptive complains of whitish vaginal discharge\" – Which fungi might cause this and how will you diagnose?", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "x": 1, "a": "**Answer**\n\n- **Fungus:** ***Candida albicans*** → vulvovaginal candidiasis. **Oral contraceptive pills** (oestrogen-rich) increase vaginal glycogen and *Candida* adherence.\n- **Diagnosis:** HVS; Gram film and KOH wet mount (budding yeasts, pseudohyphae); SDA culture at 37°C for 24–48 h; germ tube test. Differentiate from trichomoniasis and bacterial vaginosis. *(Full answer: Q170.)*"}, {"id": "377-m", "n": 377, "t": "\"A young female with whitish vaginal discharge came to you\" – Which fungi might cause these infections and under which predisposing factors?", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "x": 1, "a": "**Answer**\n\n- **Fungi:** ***Candida albicans*** (commonest), other *Candida* species (*C. glabrata*, *C. tropicalis*).\n- **Predisposing factors:** pregnancy, diabetes mellitus, oral contraceptives/HRT, broad-spectrum antibiotics, corticosteroids/immunosuppression (HIV), tight synthetic clothing, moist climate, IUCD. *(Q169.)*"}, {"id": "382-m", "n": 382, "t": "\"A young man with expanding erythematous vesicular lesion at the groin\" – Which fungi might cause this? How will you diagnose in the lab?", "st": 0, "src": "Board 2 Set 16", "du": [], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "x": 1, "a": "**Answer**\n\n- **Clinical diagnosis:** **Tinea cruris** (ringworm of the groin) — expanding erythematous, vesicular, scaly lesion with raised margin.\n- **Fungi:** dermatophytes — ***Epidermophyton floccosum***, ***Trichophyton rubrum***, *T. mentagrophytes*.\n- **Laboratory diagnosis:** scrape the active border → 10% KOH (septate hyphae, arthrospores) → SDA culture 25–30°C for 3–4 weeks → macroconidia (*E. floccosum* club-shaped). *(Q149 / Q148.)*"}]}]}, {"id": "parasitology", "name": "Part III — Parasitology", "intro": "", "notes": "", "topics": [{"id": "parasitology-1", "title": "General Parasitology", "qs": [{"id": 180, "n": 180, "t": "How can you classify protozoa/metazoa/parasites?", "st": 4, "src": "NMC 1; NMC 3; Board 2 Set 01, 08", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 01", "Board 2 Set 08"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Parasite** (Gr. *para* = beside, *sitos* = food): a living organism that depends on another living organism (the host) for food and shelter, and cannot lead an independent life. Parasites of medical importance are grouped in several ways.\n\n**A. Classification by structure (the fundamental classification)**\n\n```\nPARASITES\n├── PROTOZOA  (unicellular, eukaryotic)\n│     ├── Sarcodina / Rhizopoda   – amoebae (pseudopodia)\n│     ├── Mastigophora            – flagellates (flagella)\n│     ├── Ciliophora (Ciliata)    – ciliates (cilia)\n│     └── Sporozoa / Apicomplexa  – non-motile adults, apical complex\n└── METAZOA / HELMINTHS  (multicellular, triploblastic)\n      ├── PLATYHELMINTHES (flatworms)\n      │     ├── Cestoda   – tapeworms\n      │     └── Trematoda – flukes\n      └── NEMATHELMINTHES (roundworms) – Nematoda\n```\n\n**B. Medically important protozoa — by organelle of locomotion and examples**\n\n| Class | Locomotion | Important human parasites |\n|---|---|---|\n| **Rhizopoda (amoebae)** | Pseudopodia | *Entamoeba histolytica*, *Naegleria fowleri*, *Acanthamoeba* spp., *Balamuthia mandrillaris* |\n| **Mastigophora (flagellates)** | Flagella | *Giardia lamblia*, *Trichomonas vaginalis*, *Leishmania* spp., *Trypanosoma* spp. |\n| **Ciliophora (ciliates)** | Cilia | *Balantidium coli* (the only ciliate pathogenic to man) |\n| **Sporozoa (Apicomplexa)** | None in adult (gliding in invasive stages) | *Plasmodium* spp., *Toxoplasma gondii*, *Cryptosporidium*, *Cyclospora*, *Cystoisospora* |\n\n**By habitat:** intestinal (*E. histolytica*, *Giardia*, *Cryptosporidium*, *Balantidium*), urogenital (*T. vaginalis*), blood and tissue (*Plasmodium*, *Leishmania*, *Trypanosoma*, *Toxoplasma*), and free-living amoebae (CNS/eye).\n\n**C. Metazoa (helminths)** — differentiated into Platyhelminthes and Nemathelminthes as in the tree above. Examples: Cestoda — *Taenia saginata*, *T. solium*, *Diphyllobothrium latum*, *Echinococcus granulosus*, *Hymenolepis nana*; Trematoda — *Schistosoma* spp., *Fasciola hepatica*, *Clonorchis sinensis*, *Paragonimus westermani*; Nematoda — *Ascaris lumbricoides*, hookworms, *Trichuris trichiura*, *Enterobius vermicularis*, *Strongyloides stercoralis*, *Wuchereria bancrofti*.\n\n**D. Classification of parasites by nature and site of parasitism**\n\n| Type | Meaning | Example |\n|---|---|---|\n| Ectoparasite | Lives on the body surface | Louse, mite (*Sarcoptes scabiei*) |\n| Endoparasite | Lives inside the host | *E. histolytica* (large gut, liver) |\n| Obligate | Cannot survive without a parasitic life | *Plasmodium*, *Ascaris* |\n| Facultative | Can live free or parasitic | *Strongyloides stercoralis* (free-living cycle), *Naegleria* |\n| Permanent | Whole life spent on/in host | *A. duodenale*, *T. vaginalis* |\n| Temporary | Visits host only to feed | Bed bug, mosquito |\n| Accidental (incidental) | Infects an unusual host | Hydatid cyst (*E. granulosus*) in man |\n| Aberrant (wandering) | Reaches a site where it cannot develop further | *Trichinella spiralis* larvae in muscle |\n| Spurious | Free-living or food-borne organism merely passing through the gut | Non-human eggs ingested with liver |\n\n**Viva points**\n- *Protozoa* = \"first animals\" (Gr. *protos* + *zoon*); *Metazoa* = multicellular animals.\n- Only **ciliate** pathogenic to man: *Balantidium coli*. Sporozoa have **no locomotory organelle** in the adult.\n- *Ref: K.D. Chatterjee; Akram's Parasitology; Levinson Ch. 51–56.*"}, {"id": 181, "n": 181, "t": "Define and classify a host, with example. — Also asked: enumerate the types of hosts (definitive, intermediate, etc.) with examples.", "st": 5, "src": "DU-19M; Board 2 Set 01, 07, 16, 19", "du": ["DU-19M"], "nmc": [], "vv": ["Board 2 Set 01", "Board 2 Set 07", "Board 2 Set 16", "Board 2 Set 19"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Definition.** A **host** is an organism that harbours the parasite and provides it with nourishment and shelter.\n\n**Types of hosts**\n\n| Host | Definition | Example |\n|---|---|---|\n| **Definitive (final) host** | Harbours the **adult** or **sexually reproducing** stage of the parasite | Man for *Ascaris*, hookworm, *T. solium* adult; *Anopheles* for *Plasmodium*; dog for *E. granulosus* |\n| **Intermediate host** | Harbours the **larval** or **asexual** stage. May be *first* and *second* intermediate hosts when two are required | Man for *Plasmodium*; man for hydatid cyst; *Cyclops* (1st) and fish (2nd) for *D. latum*; *Culex* for *W. bancrofti* |\n| **Accidental (incidental) host** | Not the usual host; the parasite may or may not complete its cycle | Man in hydatid disease (dead-end); man in cutaneous larva migrans |\n| — *Permissive host* | Accidental host in which the parasite **can** complete its life cycle | Man for *T. solium* eggs (cysticercosis may develop) |\n| — *Non-permissive host* | Accidental host in which the parasite **cannot** complete its life cycle (\"dead-end\") | Man for *E. granulosus* |\n| **Paratenic (transport / carrier) host** | Parasite stays alive but does **not develop** further; serves only to transfer infection | Man in cutaneous larva migrans (*A. braziliense*); fish/frog for *Gnathostoma* |\n| **Reservoir host** | A vertebrate (usually animal) that maintains the infection in nature and is a long-term source for man or vectors | Dog for *Leishmania infantum* and *E. granulosus*; pig for *Balantidium*; cat for *Toxoplasma* |\n\n**Examples worth remembering**\n- *Man is the definitive host:* *Ascaris*, hookworm, *Enterobius*, *T. saginata*, *T. solium* (intestinal stage), *Strongyloides*, *W. bancrofti*, *L. donovani* (by convention).\n- *Man is the intermediate host:* *Plasmodium*, *E. granulosus*, *E. multilocularis*, *T. solium* (cysticercosis), *Toxoplasma gondii*.\n- *Man is both definitive and intermediate:* *T. solium*; *Trichinella spiralis* (in the same individual).\n\n**Viva points**\n- Definitive = sexual/adult; Intermediate = asexual/larval.\n- Parasites with **a single host** (direct cycle): *Enterobius*, *Ascaris*, *Trichuris*, hookworm, *Strongyloides*, *E. histolytica*.\n- **Two intermediate hosts** are required by *D. latum*, *Paragonimus*, *Clonorchis* (see #199)."}, {"id": 182, "n": 182, "t": "Explain the host–parasite relationship/association, with examples.", "st": 3, "src": "NMC 1; NMC 3; DU-19M", "du": ["DU-19M"], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nWhen two living organisms of different species live together, the association falls into three broad categories (plus a few minor ones).\n\n| Association | Benefit | Harm | Example |\n|---|---|---|---|\n| **Symbiosis (mutualism)** | Both partners benefit; each depends on the other | None | Cellulose-digesting bacteria and protozoa in the rumen of cattle; flagellates in the termite gut |\n| **Commensalism** | The commensal benefits | Host neither benefits nor is harmed; commensal can live independently | *E. coli*, *Entamoeba coli*, *Endolimax nana*, *Iodamoeba bütschlii* in the human gut |\n| **Parasitism** | Parasite benefits | Host is injured, loses nourishment, and has lost its independent life | Hookworm in man; *Plasmodium* in RBC; *Leishmania* in macrophages |\n\n**Other relationships**\n- **Phoresis:** one organism is transported by another without dependence (house-fly carrying cysts).\n- **Opportunism:** a commensal or free-living organism turns pathogenic when host defences fall (*Cryptosporidium* in AIDS; *Strongyloides* hyperinfection on steroids; *Naegleria*, *Acanthamoeba*).\n- **Commensal may turn pathogen:** *E. histolytica* strains can switch from commensal (luminal) to invasive behaviour.\n\n**Consequences of parasitism on the host:** (i) mechanical injury/obstruction (*Ascaris* bolus); (ii) deprivation of nutrients (hookworm blood loss, *D. latum* and vitamin B₁₂); (iii) toxic and allergic effects (hydatid fluid; *Ascaris* \"ascaron\"); (iv) tissue destruction (amoebic ulcer); (v) immunopathology (nephrotic syndrome in quartan malaria; filarial elephantiasis).\n\n**Host response and immunity**\n- Immunity in parasitic infection is generally **non-sterilising** — **premunition** (e.g., malaria) maintains low-grade parasitaemia and protects against superinfection but does not eliminate the infection.\n- Helminths usually provoke a **Th2** response (IgE, eosinophilia, mast cells).\n\n**Viva points**\n- Man and hookworm = parasitism; *E. coli* in gut = commensalism; ruminant gut protozoa = symbiosis.\n- A parasite benefits and the host is **always** injured; a commensal causes **no** injury."}, {"id": 183, "n": 183, "t": "Name 5 intestinal protozoa.", "st": 4, "src": "NMC 1; NMC 3; Board 2 Set 01, 10", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 01", "Board 2 Set 10"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Intestinal protozoa** are those that live in the lumen or wall of the alimentary tract. Five important examples (all fall in the Sarcodina/Mastigophora/Ciliophora/Sporozoa classes):\n\n| Protozoan | Class | Infective form | Disease |\n|---|---|---|---|\n| *Entamoeba histolytica* | Amoeba | Quadrinucleate cyst | Amoebiasis (dysentery, liver abscess) |\n| *Giardia lamblia* (*G. intestinalis*, *G. duodenalis*) | Flagellate | Cyst | Giardiasis (malabsorptive diarrhoea) |\n| *Cryptosporidium* (*C. parvum* / *C. hominis*) | Sporozoa (coccidian) | Oocyst | Cryptosporidiosis (watery diarrhoea) |\n| *Cyclospora cayetanensis* | Sporozoa | Sporulated oocyst | Prolonged watery diarrhoea |\n| *Cystoisospora* (*Isospora*) *belli* | Sporozoa | Sporulated oocyst | Isosporiasis |\n| *Balantidium coli* | Ciliate | Cyst | Balantidial dysentery |\n\n**Other intestinal protozoa**\n- *Pathogenic or possibly pathogenic:* *Dientamoeba fragilis*, *Blastocystis hominis*, microsporidia (*Enterocytozoon bieneusi*).\n- *Non-pathogenic commensals:* *Entamoeba coli*, *E. hartmanni*, *E. polecki*, *E. gingivalis* (mouth), *Endolimax nana*, *Iodamoeba bütschlii*, *Chilomastix mesnili*, *Trichomonas hominis* (caecum), *Enteromonas hominis*, *Retortamonas intestinalis*.\n\n**Viva points**\n- The *only* protozoon in the lumen of the human **small intestine** is *Giardia*.\n- Intestinal coccidia (*Cryptosporidium*, *Cyclospora*, *Cystoisospora*) are diagnosed with **modified acid-fast stain**."}, {"id": 184, "n": 184, "t": "Name protozoa causing diarrhoeal diseases.", "st": 4, "src": "DU-24M; Board 2 Set 05, 07, 13 — see also #183", "du": ["DU-24M"], "nmc": [], "vv": ["Board 2 Set 05", "Board 2 Set 07", "Board 2 Set 13 — see also #183"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Protozoan | Type of diarrhoea | Mechanism |\n|---|---|---|\n| *Entamoeba histolytica* | **Dysentery** — bloody mucoid stool | Invasion of colon, flask-shaped ulcers |\n| *Balantidium coli* | Dysentery-like (rare) | Invades colonic wall, ulcers (no extra-intestinal lesions) |\n| *Giardia lamblia* | Watery, foul, **fatty** (steatorrhoea), no blood | Non-invasive; villous damage, malabsorption |\n| *Cryptosporidium* | Profuse watery, chronic in AIDS | Brush-border (jejunal) damage, secretory |\n| *Cyclospora cayetanensis* | Prolonged watery, relapsing | Small-bowel mucosal damage |\n| *Cystoisospora belli* | Watery, chronic in AIDS | Small-bowel epithelial invasion |\n| Microsporidia (*E. bieneusi*) | Chronic watery in AIDS | Epithelial infection |\n| *Dientamoeba fragilis* / *Blastocystis* | Mild, debated pathogenicity | — |\n\n**Grouping for exams**\n- **Invasive (dysentery):** *E. histolytica*, *B. coli*.\n- **Non-invasive (watery/malabsorptive):** *Giardia*, *Cryptosporidium*, *Cyclospora*, *Cystoisospora*.\n- **Opportunistic (in AIDS):** *Cryptosporidium*, *Cyclospora*, *Cystoisospora*, microsporidia.\n\n**Viva points**\n- Blood in stool → *E. histolytica* (not *Giardia*).\n- Oocysts of *Cryptosporidium* resist chlorination."}, {"id": 185, "n": 185, "t": "Define the following, with examples: definitive host, intermediate host, parasite, vector, reservoir.", "st": 2, "src": "NMC 4; DU-19M", "du": ["DU-19M"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n1. **Parasite** — an organism that lives in or on another living organism (host), obtains food and shelter from it, and may injure it. *E.g., Ascaris lumbricoides, Plasmodium.*\n2. **Definitive host** — host in which the parasite attains **maturity** and reproduces **sexually**. *E.g., man for Ascaris; Anopheles for Plasmodium; dog for E. granulosus.*\n3. **Intermediate host** — host in which the parasite passes its **larval** (asexual) stages. *E.g., man for Plasmodium and hydatid cyst; Cyclops for D. latum; cattle for T. saginata.*\n4. **Vector** — a living carrier, usually a **blood-sucking arthropod**, that transmits the parasite from one host to another.\n   - **Biological vector:** parasite undergoes development and/or multiplication in the vector. Subtypes: *propagative* (multiplication only — plague bacilli in flea), *cyclo-propagative* (change + multiplication — *Plasmodium* in *Anopheles*), *cyclo-developmental* (change, no multiplication — *Wuchereria* in *Culex*).\n   - **Mechanical vector:** merely carries the organism on its body surface without any development (house-fly carrying cysts of *E. histolytica*).\n5. **Reservoir (of infection)** — an animal, plant or inanimate substance in which the parasite lives and multiplies and on which it depends primarily for survival, in such a way that it can be transmitted to a susceptible host. *E.g., dog for L. infantum; cat for Toxoplasma; man for Plasmodium vivax; pig for Balantidium.*\n\n**Viva point.** A vector transmits the infection; a reservoir *maintains* it. The same animal may be both (*dog* in zoonotic leishmaniasis)."}, {"id": 186, "n": 186, "t": "Name vector-borne parasitic diseases.", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Vector-borne (arthropod-borne) parasitic diseases**\n\n| Disease | Parasite | Vector |\n|---|---|---|\n| **Malaria** | *Plasmodium* spp. | Female *Anopheles* mosquito |\n| **Kala-azar (visceral leishmaniasis), PKDL, cutaneous leishmaniasis** | *Leishmania* spp. | Female sandfly (*Phlebotomus argentipes* in the Indian subcontinent) |\n| **Lymphatic filariasis** | *Wuchereria bancrofti*, *Brugia malayi* | *Culex quinquefasciatus* (urban), *Aedes*, *Anopheles*; *Mansonia* for *B. malayi* |\n| **African sleeping sickness** | *Trypanosoma brucei* spp. | Tsetse fly (*Glossina*) |\n| **Chagas disease** | *Trypanosoma cruzi* | Reduviid (\"kissing\") bug |\n| **Onchocerciasis (river blindness)** | *Onchocerca volvulus* | Black fly (*Simulium*) |\n| **Loiasis** | *Loa loa* | Deer fly (*Chrysops*) |\n| **Babesiosis** | *Babesia microti* | *Ixodes* tick |\n\n**Mechanically transmitted (not true vector-borne):** amoebiasis, giardiasis and helminthiasis through house-flies and cockroaches.\n\n**Viva points**\n- Vector-borne parasitic diseases of Bangladesh: **malaria, kala-azar, filariasis**.\n- *Dracunculus* is transmitted by *Cyclops* (intermediate host), not by a blood-sucking vector."}, {"id": 187, "n": 187, "t": "Which/name the parasites can be found in / live in the blood (with their infective form)?", "st": 5, "src": "NMC 3; NMC 4; DU-18M; Board 2 Set 06, 11", "du": ["DU-18M"], "nmc": ["NMC 3", "NMC 4"], "vv": ["Board 2 Set 06", "Board 2 Set 11"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Parasite | Stage found in blood | Where in blood | Infective form (to man) |\n|---|---|---|---|\n| ***Plasmodium* spp.** | Rings, trophozoites, schizonts, gametocytes | Inside **RBCs** | **Sporozoite** (from *Anopheles*) |\n| ***Leishmania donovani*** | Amastigotes (LD bodies) | Inside **monocytes/neutrophils** (buffy-coat; scanty) | **Promastigote** (from sandfly) |\n| ***Trypanosoma brucei*** | Trypomastigotes | **Extracellular** (plasma), lymph, CSF | **Metacyclic trypomastigote** (tsetse) |\n| ***T. cruzi*** | Trypomastigotes (acute phase) | Extracellular; amastigotes in cardiac muscle | **Metacyclic trypomastigote** (reduviid faeces) |\n| ***W. bancrofti*, *B. malayi*, *Loa loa*** | **Microfilariae** | Extracellular (plasma) | **3rd-stage (L₃) filariform larva** |\n| ***Babesia microti*** | Ring forms and \"Maltese cross\" | Inside RBCs | Sporozoite (tick) |\n\n**Periodicity of microfilariae in blood:** *W. bancrofti* and *B. malayi* — nocturnal (peak 10 pm–2 am); *Loa loa* — diurnal; *Mansonella perstans* — non-periodic.\n\n**Viva points**\n- Blood parasites seen on **thin film**: *Plasmodium*, microfilariae, trypanosomes.\n- Infective form of malaria parasite is the sporozoite; of filariae, the L₃ larva; of kala-azar, the promastigote."}, {"id": 188, "n": 188, "t": "Name the parasites causing cancer.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Parasites linked to human cancer** (IARC classification)\n\n| Parasite | Cancer | IARC group |\n|---|---|---|\n| ***Schistosoma haematobium*** | **Squamous-cell carcinoma of the urinary bladder** | **Group 1** (carcinogenic) |\n| ***Opisthorchis viverrini*** | **Cholangiocarcinoma** | **Group 1** |\n| ***Clonorchis sinensis*** | **Cholangiocarcinoma** | **Group 1** |\n| *Schistosoma japonicum* | Colorectal / hepatic cancers (weaker evidence) | Group 2B (possible) |\n| *Opisthorchis felineus* | Not established | Group 3 |\n| *Plasmodium falciparum* (holoendemic malaria) | Endemic **Burkitt lymphoma** (co-factor with EBV) | Group 2A |\n\n**Mechanism (flukes and schistosomes):** chronic inflammation, epithelial hyperplasia and metaplasia, repeated cell turnover, N-nitroso compounds and parasite-derived oestrogen-like metabolites → malignant transformation. *S. haematobium* eggs in the bladder wall → granuloma, fibrosis, squamous metaplasia → carcinoma.\n\n**Viva point.** The commonest answer expected: *S. haematobium* (bladder) and *Opisthorchis/Clonorchis* (bile duct). *S. mansoni* is **not** an established carcinogen."}, {"id": 189, "n": 189, "t": "Enumerate four parasites in stool and four parasites in blood detectable under the microscope; explain why both saline and iodine stool preparations are required.", "st": 0, "src": "DU-19M", "du": ["DU-19M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Parasites detectable in stool by microscopy**\n1. *Entamoeba histolytica* — trophozoites (with ingested RBCs) and quadrinucleate cysts.\n2. *Giardia lamblia* — cysts and trophozoites.\n3. *Ascaris lumbricoides* — fertilised/unfertilised eggs.\n4. Hookworm — oval, thin-shelled, colourless eggs (segmented ovum).\n(Also *Trichuris*, *Taenia*, *H. nana*, *Strongyloides* larvae, *Cryptosporidium* oocysts.)\n\n**Parasites detectable in blood by microscopy**\n1. *Plasmodium* species (RBC — thick and thin films).\n2. Microfilariae of *W. bancrofti* / *B. malayi* (night blood).\n3. *Trypanosoma* species.\n4. *Leishmania donovani* — LD bodies in buffy-coat films (scanty).\n\n**Why both saline and iodine wet mounts of stool are needed**\n\n| | **Saline mount** | **Iodine mount** (Lugol's / D'Antoni's) |\n|---|---|---|\n| Purpose | Shows **motility** of live trophozoites (amoeboid motion of *E. histolytica*, \"falling leaf\" motion of *Giardia*) and natural colour/refractility; shows ingested RBCs, pus cells, Charcot–Leyden crystals, ova and larvae | Stains **glycogen mass** (brown) and brings out **nuclei, karyosome and chromatoid bars** of **cysts**; permits counting of nuclei (4 in *E. histolytica*, 8 in *E. coli*) |\n| Limitation | Cyst nuclei are poorly seen | Iodine **kills** trophozoites (motility lost) and obscures their detail; ova details may be dark |\n| Best for | Trophozoites | Cysts |\n\nHence, **saline detects motile trophozoites; iodine identifies cysts** — the two preparations are complementary and are made on the same slide (one drop each, side by side), covered with coverslips and examined under low then high power.\n\n**Viva points**\n- Examine dysenteric stool **within 1 hour** (motility is lost in cold, old stool).\n- Concentration techniques (formol–ether sedimentation, zinc sulphate flotation) improve detection of cysts/ova."}, {"id": 190, "n": 190, "t": "Mention 4–5 parasitic diseases where humans act as intermediate host.", "st": 4, "src": "NMC 1; NMC 3; NMC 4; Board 2 Set 07", "du": [], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\nMan acts as an **intermediate host** (harbours asexual or larval stages) in:\n\n| Disease | Parasite | Stage in man | Definitive host |\n|---|---|---|---|\n| **Malaria** | *Plasmodium* spp. | Asexual (schizogony) | Female *Anopheles* |\n| **Hydatid disease** | *Echinococcus granulosus*, *E. multilocularis* | Hydatid cyst (larva) | Dog / fox |\n| **Cysticercosis** | *Taenia solium* | *Cysticercus cellulosae* | Man (adult worm) |\n| **Toxoplasmosis** | *Toxoplasma gondii* | Tachyzoites, bradyzoite cysts | Cat |\n\n**Viva points**\n- Man is a *dead-end* intermediate host for *E. granulosus* — the cyst will not be eaten by a dog.\n- Man is **both** definitive and intermediate host for *T. solium* (and *Trichinella*)."}, {"id": 191, "n": 191, "t": "Compare cestodes, trematodes and nematodes / mention their differences.", "st": 6, "src": "NMC 4; DU-26M, 24N; Board 2 Set 01, 16, 18", "du": ["DU-26M", "DU-24N"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 01", "Board 2 Set 16", "Board 2 Set 18"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | **Cestodes** (tapeworms) | **Trematodes** (flukes) | **Nematodes** (roundworms) |\n|---|---|---|---|\n| Shape | Long, flat, **tape-like** | Flat, **leaf-like** | **Cylindrical**, elongated, tapering ends |\n| Segmentation | **Segmented** (scolex, neck, strobila of proglottids) | Unsegmented | Unsegmented |\n| Body cavity | Absent | Absent | **Present** (pseudocoelom) |\n| Alimentary canal | **Absent** (absorb through tegument) | Present, **blind** (no anus) | Present, **complete** (mouth + anus) |\n| Sexes | **Hermaphrodite** | Hermaphrodite (except *Schistosoma* — separate sexes) | **Separate sexes**; female larger |\n| Attachment organs | Suckers, hooklets/bothria on scolex | Oral and ventral suckers (no hooks) | None (buccal capsule/teeth in hookworm) |\n| Covering | Tegument | Tegument | Non-cellular **cuticle** |\n| Intermediate host | Required (except *H. nana*) | **Snail** always first intermediate host | Not required for intestinal nematodes (except filariae, *Dracunculus*) |\n| Egg | Operculated (pseudophyllidean) or embryonated (cyclophyllidean) | **Operculated** (except *Schistosoma*, spined) | Shelled, various |\n| Examples | *T. saginata*, *T. solium*, *D. latum*, *E. granulosus*, *H. nana* | *Fasciola*, *Clonorchis*, *Paragonimus*, *Schistosoma* | *Ascaris*, hookworm, *Trichuris*, *Enterobius*, *Strongyloides*, filariae |\n| Drug of choice | **Praziquantel** | **Praziquantel** (not *Fasciola* — triclabendazole) | **Albendazole / mebendazole**; ivermectin; DEC |\n\n**Viva points**\n- Cestode = **no gut**; trematode = **blind gut**; nematode = **complete gut**.\n- Trematode eggs are operculated (except *Schistosoma*); nematode eggs are not (except *Trichuris*-plugged)."}, {"id": 192, "n": 192, "t": "What is auto- and retro-infection / define autoinfection and retrograde infection, with example?", "st": 4, "src": "NMC 4; DU-20Nov/July, 18M; Board 2 Set 06", "du": ["DU-20Nov/July", "DU-18M"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Autoinfection** — an infected person *reinfects himself* with the same parasite, without any need to pass out of the host to the external environment.\n- **External autoinfection:** eggs deposited around the anus are carried to the mouth by the **contaminated fingers** (nails) — *Enterobius vermicularis*, *Taenia solium* eggs (cysticercosis), *Hymenolepis nana*.\n- **Internal autoinfection:** the stages hatch/mature *within the same intestine* — *Strongyloides stercoralis* (rhabditiform larva → filariform in gut; penetrate the bowel wall or perianal skin), *H. nana* (eggs hatch in the gut and cysticercoids develop in villi), *T. solium* (reverse peristalsis carries gravid proglottids into the stomach).\n\n**Retro-infection (retrofection / retrograde infection)** — eggs laid on the **perianal skin** hatch there and the **larvae migrate back through the anus** into the rectum and colon, where they mature to adult worms without reaching the outside world. **Classic example: *Enterobius vermicularis*.**\n\n| | Autoinfection | Retro-infection |\n|---|---|---|\n| Route | Hand-to-mouth, or internal stages | Perianal larvae crawl back **through the anus** |\n| Examples | *Enterobius*, *H. nana*, *T. solium*, *Strongyloides* | *Enterobius vermicularis* only |\n\n**Clinical importance:** autoinfection and retrofection explain **persistence and reinfection** — pinworm recurrence after a single dose (hence **retreatment after 2 weeks**), chronic strongyloidiasis lasting decades."}, {"id": 193, "n": 193, "t": "Name the helminths that cause autoinfection.", "st": 2, "src": "DU-20Nov/July, 24N", "du": ["DU-20Nov/July", "DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Helminths that cause autoinfection**\n1. ***Enterobius vermicularis*** — external autoinfection (fingers) and retrofection.\n2. ***Strongyloides stercoralis*** — internal autoinfection (filariform larvae penetrate gut mucosa/perianal skin) → chronic infection, **hyperinfection**.\n3. ***Hymenolepis nana*** — eggs hatch in the gut; cysticercoids in villi → new adults, *without any intermediate host*.\n4. ***Taenia solium*** — eggs from own adult worm (fingers, or reverse peristalsis) → **cysticercosis**.\n5. *Capillaria philippinensis* — internal autoinfection leading to massive worm burden.\n\n**Mnemonic: \"E S H T\"** — *Enterobius, Strongyloides, Hymenolepis, Taenia solium*."}, {"id": 194, "n": 194, "t": "Define hyperinfection, with example, and explain hyperinfection syndrome.", "st": 2, "src": "DU-18M, 23N", "du": ["DU-18M", "DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Hyperinfection** — massive internal autoinfection in which the number of adult worms in the gut and larvae in tissues rises enormously because the rate of larval maturation (rhabditiform → filariform) and re-penetration is greatly increased. *Typical example: **Strongyloides stercoralis**.*\n\n**Hyperinfection syndrome (hyperinfective strongyloidiasis)**\n- *Predisposing states:* corticosteroids, immunosuppressive drugs (anti-TNF), **HTLV-1**, AIDS, malignancy, malnutrition, alcoholism, transplantation, hypogammaglobulinaemia.\n- *Mechanism:* loss of cell-mediated (Th2/eosinophil) control → accelerated autoinfection cycle → massive **worm load** in intestine and larvae in lungs.\n- *Clinical features:* severe diarrhoea, abdominal pain, malabsorption, paralytic ileus; **cough, wheeze, pneumonitis, alveolar haemorrhage**; larvae may be found in sputum; eosinophilia often **absent** in severe disease.\n- **Disseminated strongyloidiasis:** larvae migrate to unusual organs (brain, liver, kidney, skin) carrying **enteric bacteria** (*E. coli*, *Klebsiella*, *Enterococcus*) → **Gram-negative septicaemia, meningitis** — mortality is high.\n- *Diagnosis:* larvae in stool, sputum, duodenal aspirate, BAL; serology.\n- *Treatment:* **ivermectin** (drug of choice); prolonged course in hyperinfection.\n- *Prevention:* screen and treat people from endemic areas before starting steroids/immunosuppression.\n\n**Viva point.** Steroids can precipitate a fatal hyperinfection in a symptom-free *Strongyloides* carrier."}, {"id": 195, "n": 195, "t": "What do you mean by a provocation test, and where is it used?", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Provocation (provocative) test** — a test in which a condition is **deliberately provoked** (made manifest) in order to confirm or exclude a diagnosis when ordinary tests are negative.\n\n**1. DEC provocation test in lymphatic filariasis (the important one)**\n- *Principle:* *W. bancrofti* microfilariae are **nocturnally periodic**; by day they remain in the pulmonary capillaries. **Diethylcarbamazine (DEC)** stimulates their release into the peripheral blood.\n- *Procedure:* give **DEC 2 mg/kg orally** during the daytime → take blood **30–45 minutes later** → make thick smear and stain (Giemsa) → look for microfilariae.\n- *Use:* detects microfilaraemia **without night blood collection**; useful in suspected cases with negative night smear (not for occult filariasis).\n\n**2. Other provocation tests (historical or limited use)**\n- *Adrenaline provocation in malaria:* injection of adrenaline contracts the spleen and releases parasites into peripheral blood in chronic/latent malaria.\n- *Skin tests* (Casoni's) are different — they are *sensitivity* tests, not provocation tests.\n\n**Viva point.** DEC provocation → *day* blood; *Knott's concentration* and *membrane filtration* are used for low-density microfilaraemia."}, {"id": 196, "n": 196, "t": "List the common protozoal infections in Bangladesh.", "st": 2, "src": "DU-25M; Board 2 Set 17", "du": ["DU-25M"], "nmc": [], "vv": ["Board 2 Set 17"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Common protozoal infections in Bangladesh**\n\n| Infection | Agent | Remarks |\n|---|---|---|\n| **Amoebiasis** | *Entamoeba histolytica* | Endemic throughout; dysentery, liver abscess |\n| **Giardiasis** | *Giardia lamblia* | Very common in children; malnutrition, malabsorption |\n| **Malaria** | *Plasmodium falciparum* (≈85–90%), *P. vivax* | 13 districts endemic; ~80% of cases in Bandarban, Rangamati, Khagrachari (hill tracts); *P. vivax* in plain-land foci |\n| **Kala-azar (visceral leishmaniasis)** | *Leishmania donovani* | Central/northern districts, especially Mymensingh division; Bangladesh was WHO-validated (2023) for elimination as a public-health problem |\n| **PKDL** | *L. donovani* | Residual reservoir |\n| **Trichomoniasis** | *Trichomonas vaginalis* | Sexually transmitted |\n| **Toxoplasmosis** | *Toxoplasma gondii* | Congenital infection, HIV |\n| **Cryptosporidiosis** | *Cryptosporidium* | Diarrhoea in children and HIV |"}, {"id": 197, "n": 197, "t": "What are the important differences between protozoa and helminth?", "st": 0, "src": "Board 2 Set 20", "du": [], "nmc": [], "vv": ["Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Feature | **Protozoa** | **Helminths** |\n|---|---|---|\n| Cell number | **Unicellular** | **Multicellular** (metazoa) |\n| Size | Microscopic | Visible to naked eye (mm → m) |\n| Organisation | Single cell performs all life functions | Differentiated tissues and organ systems |\n| Nuclei | Variable (one or many) | Many cells, each with a nucleus |\n| Multiplication in host | **Yes** — rapid asexual multiplication (binary fission, schizogony) | **No** (except *Strongyloides*, *H. nana*, *Echinococcus* larva) |\n| Number of parasites | Increases within the host | Only through repeated reinfection |\n| Infective stage | Cyst / oocyst / sporozoite / promastigote | Egg or larva (filariform, cysticercus etc.) |\n| Locomotion | Pseudopodia, flagella, cilia (none in Sporozoa) | Muscular movement |\n| Eosinophilia | Rare | **Frequent** (tissue migration) |\n| Diagnosis | Stool/blood microscopy for trophozoites, cysts | Ova, larvae, adult worms |\n| Drugs | Metronidazole, chloroquine, artemisinins | Albendazole, mebendazole, praziquantel, DEC |\n| Examples | *Entamoeba*, *Giardia*, *Plasmodium* | *Ascaris*, *Taenia*, *Fasciola* |"}, {"id": 198, "n": 198, "t": "Enumerate 5 protozoal and 5 helminthic diseases.", "st": 0, "src": "Board 2 Set 20", "du": [], "nmc": [], "vv": ["Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Five protozoal diseases**\n1. **Amoebiasis** — *Entamoeba histolytica*\n2. **Giardiasis** — *Giardia lamblia*\n3. **Malaria** — *Plasmodium* spp.\n4. **Kala-azar** — *Leishmania donovani*\n5. **Toxoplasmosis** — *Toxoplasma gondii* (alternatively trichomoniasis — *T. vaginalis*)\n\n**Five helminthic diseases**\n1. **Ascariasis** — *Ascaris lumbricoides*\n2. **Ancylostomiasis (hookworm disease)** — *A. duodenale*, *N. americanus*\n3. **Filariasis** — *Wuchereria bancrofti*\n4. **Taeniasis / cysticercosis** — *T. saginata* / *T. solium*\n5. **Hydatid disease** — *Echinococcus granulosus* (alternatively enterobiasis, trichuriasis, schistosomiasis)"}, {"id": 199, "n": 199, "t": "Name 3 parasites where 2 intermediate hosts are required.", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Parasites requiring two intermediate hosts**\n\n| Parasite | First intermediate host | Second intermediate host | Infective form |\n|---|---|---|---|\n| ***Diphyllobothrium latum*** (fish tapeworm) | *Cyclops* (copepod) — procercoid | Freshwater **fish** — plerocercoid | Plerocercoid |\n| ***Paragonimus westermani*** (lung fluke) | **Snail** (*Semisulcospira*) — cercaria | **Crab / crayfish** — metacercaria | Metacercaria |\n| ***Clonorchis sinensis*** (Chinese liver fluke) | **Snail** (*Parafossarulus*) | Freshwater **fish** | Metacercaria |\n\nOthers: *Opisthorchis*, *Heterophyes*, *Metagonimus*, *Gnathostoma*.\n\n**Note.** *Echinococcus granulosus* has **one** intermediate host (sheep, man…) and does *not* belong in this list."}, {"id": 200, "n": 200, "t": "\"Man is the definitive host for *L. donovani* but intermediate host for *Plasmodium*\" – explain.", "st": 0, "src": "Board 2 Set 11", "du": [], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Principle.** The **definitive host** harbours the **sexual** (adult/gametic) stage; the **intermediate host** harbours the **asexual/larval** stages.\n\n**For *Plasmodium***\n- **Sexual cycle (sporogony)** occurs in the **female *Anopheles*** mosquito → mosquito is the **definitive host**.\n- **Asexual cycle (schizogony)** occurs in **man** (liver and RBC) → man is the **intermediate host**. (Gametocytes are formed in man, but fertilisation takes place only in the mosquito.)\n\n**For *Leishmania donovani***\n- By the textbook convention followed in South Asian parasitology, **man is the definitive (vertebrate) host**, because the multiplying *amastigote* stage is passed in man (macrophages of the reticulo-endothelial system), and the **sandfly** (carrying promastigotes) is the **intermediate host and vector**.\n- *Note:* strictly, genetic exchange has been shown to occur in the sandfly gut, so some modern authors regard the sandfly as the true definitive host. For exams, write the conventional answer.\n\n**Conclusion:** man is the *definitive* host in kala-azar but the *intermediate* host in malaria."}, {"id": 201, "n": 201, "t": "What is the literal meaning of the word 'protozoa'?", "st": 0, "src": "Board 2 Set 08", "du": [], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Protozoa** = Greek *protos* (\"first\") + *zoon* (\"animal\") → \"**first animals**\". They are single-celled, eukaryotic, animal-like microorganisms (term introduced by Goldfuss, 1820)."}, {"id": 202, "n": 202, "t": "What are the organelles / organs of locomotion (motility) for protozoa / parasites? Give examples.", "st": 4, "src": "Board 2 Set 04, 11, 17, 19", "du": [], "nmc": [], "vv": ["Board 2 Set 04", "Board 2 Set 11", "Board 2 Set 17", "Board 2 Set 19"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Class | Organelle | Speed | Examples |\n|---|---|---|---|\n| **Rhizopoda (amoebae)** | **Pseudopodia** (\"false feet\", formed by ectoplasm–endoplasm flow) | 0.2–3 µm/sec | *E. histolytica*, *Naegleria* (also transient flagellate stage) |\n| **Mastigophora (flagellates)** | **Flagella** (+ undulating membrane in *Trypanosoma*, *Trichomonas*) | 15–30 µm/sec | *Giardia* (4 pairs), *T. vaginalis* (4 free + 1 recurrent flagellum), *Leishmania* promastigote (1 flagellum), *Trypanosoma* |\n| **Ciliophora (ciliates)** | **Cilia** | 400–2000 µm/sec | *Balantidium coli* |\n| **Sporozoa (Apicomplexa)** | **No** locomotory organelle; invasive stages move by **gliding/flexion** (apical complex) | — | *Plasmodium*, *Toxoplasma*, *Cryptosporidium* |\n\n**Helminths** move by muscular contractions of the body wall; suckers/hooks help attachment (not locomotion).\n\n**Viva points**\n- *Giardia* moves with a characteristic \"**falling leaf**\" motion; *Trichomonas* with **jerky** motion; *Entamoeba* by progressive, directional **pseudopodial** crawling.\n- Ciliates are the fastest; amoebae the slowest."}, {"id": 203, "n": 203, "t": "Name some protozoa that move by cilia.", "st": 0, "src": "Board 2 Set 13", "du": [], "nmc": [], "vv": ["Board 2 Set 13"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Ciliated protozoa (move by cilia)**\n- ***Balantidium coli*** — the **only ciliate pathogenic to man**; large (50–200 µm), kidney-shaped macronucleus; reservoir **pig**; causes balantidial dysentery (flask-shaped colonic ulcers similar to amoebic ulcers, **no extra-intestinal lesions**); diagnosed by large ciliated trophozoites or cysts with V-shaped nucleus in stool; treated with tetracycline.\n- Non-pathogenic/free-living ciliates: *Paramecium*, *Nyctotherus* (occasionally found in stool)."}, {"id": 204, "n": 204, "t": "What are the modes of reproduction of protozoa? / How does a protozoan multiply?", "st": 2, "src": "Board 2 Set 09, 16", "du": [], "nmc": [], "vv": ["Board 2 Set 09", "Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Mode | Process | Examples |\n|---|---|---|\n| **Binary fission** (asexual) | One cell divides into two — *longitudinal* in flagellates, *transverse* in ciliates, any plane in amoebae | *Giardia*, *Leishmania* (longitudinal); *E. histolytica* trophozoite; *Balantidium* (transverse) |\n| **Multiple fission (schizogony / merogony)** | Nucleus divides repeatedly, followed by cytoplasmic division → many daughter cells | *Plasmodium* (tissue and erythrocytic schizogony) |\n| **Endodyogeny** | Two daughter cells develop inside the mother cell | *Toxoplasma* tachyzoites |\n| **Budding** | Daughter cell arises as bud from parent | Some amoebae (e.g., *Naegleria*, described) |\n| **Sporogony** (sexual) | Gametes fuse → zygote → oocyst → many sporozoites | *Plasmodium* in mosquito; *Cryptosporidium* |\n| **Conjugation** (sexual) | Temporary union of two ciliates with exchange of nuclear material | *Balantidium coli* |"}, {"id": 205, "n": 205, "t": "What is a kinetoplast? Name/give examples of protozoa possessing kinetoplasts.", "st": 2, "src": "Board 2 Set 12, 20", "du": [], "nmc": [], "vv": ["Board 2 Set 12", "Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Kinetoplast** — a **DNA-containing, rod- or dot-shaped organelle** situated near the **basal body (blepharoplast) at the base of the flagellum**; it is a specialised part of the **single large mitochondrion** of the kinetoplastid flagellates. It contains **kinetoplast DNA (kDNA)** arranged in interlocked maxicircles and minicircles; it stains **red-violet with Giemsa/Leishman** and is Feulgen-positive.\n\n**Protozoa possessing a kinetoplast:** ***Leishmania*** (amastigote and promastigote) and ***Trypanosoma*** (*T. brucei*, *T. cruzi*) — Order **Kinetoplastida**.\n\n**Diagnostic value:** in Leishman–Donovan (LD) bodies, a **nucleus and a rod-shaped kinetoplast** are seen — a diagnostic criterion in splenic/bone-marrow smears.\n\n**Viva point.** *Giardia* has *median bodies* and *Trichomonas* has a *parabasal body/axostyle* — but **no kinetoplast**."}, {"id": 206, "n": 206, "t": "How can you classify flagellates?", "st": 0, "src": "Board 2 Set 19", "du": [], "nmc": [], "vv": ["Board 2 Set 19"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Flagellates (Phylum Sarcomastigophora → Subphylum Mastigophora → Class Zoomastigophora)** are protozoa that move by **flagella**. Classification on the basis of **habitat**:\n\n```\nFLAGELLATES\n├── LUMINAL (cavity-dwelling) FLAGELLATES\n│     ├── Intestinal : Giardia lamblia  (duodenum, jejunum)\n│     │                Chilomastix mesnili, Trichomonas hominis,\n│     │                Enteromonas hominis, Retortamonas intestinalis,\n│     │                Dientamoeba fragilis (caecum, colon)\n│     ├── Oral       : Trichomonas tenax\n│     └── Urogenital : Trichomonas vaginalis\n└── HAEMOFLAGELLATES (blood & tissue)\n      ├── Genus Leishmania : L. donovani, L. tropica, L. major,\n      │                      L. braziliensis, L. mexicana\n      └── Genus Trypanosoma: T. brucei gambiense/rhodesiense, T. cruzi\n```\n\n**Taxonomic orders:** Kinetoplastida (*Leishmania*, *Trypanosoma*); Diplomonadida (*Giardia*); Trichomonadida (*Trichomonas*, *Dientamoeba*); Retortamonadida (*Chilomastix*, *Retortamonas*).\n\n**Pathogenic flagellates:** *Giardia lamblia* (diarrhoea), *T. vaginalis* (vaginitis, urethritis), *Leishmania*, *Trypanosoma*. The rest are commensals."}, {"id": 207, "n": 207, "t": "Name 5 important protozoal diseases.", "st": 0, "src": "Board 2 Set 15", "du": [], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Disease | Causative protozoan | Route/vector |\n|---|---|---|\n| **Malaria** | *Plasmodium* spp. | Female *Anopheles* |\n| **Amoebiasis** | *Entamoeba histolytica* | Faeco-oral (cyst) |\n| **Giardiasis** | *Giardia lamblia* | Faeco-oral (cyst) |\n| **Kala-azar** | *Leishmania donovani* | Sandfly |\n| **Toxoplasmosis** | *Toxoplasma gondii* | Oocyst/tissue cyst/transplacental |\n| Trichomoniasis | *Trichomonas vaginalis* | Sexual |\n| Sleeping sickness / Chagas disease | *T. brucei* / *T. cruzi* | Tsetse / reduviid bug |"}, {"id": 208, "n": 208, "t": "Enumerate the arthropod-borne protozoa.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Arthropod-borne protozoa**\n\n| Protozoan | Disease | Arthropod vector |\n|---|---|---|\n| *Plasmodium* spp. | Malaria | Female *Anopheles* mosquito |\n| *Leishmania* spp. | Kala-azar, cutaneous, mucocutaneous leishmaniasis | Female sandfly (*Phlebotomus*, *Lutzomyia*) |\n| *Trypanosoma brucei* | African sleeping sickness | Tsetse fly (*Glossina*) |\n| *Trypanosoma cruzi* | Chagas disease | Reduviid bug (*Triatoma*) |\n| *Babesia microti* | Babesiosis | *Ixodes* tick |\n\n**Mechanical transmission (not true vector-borne):** *E. histolytica* and *Giardia* cysts carried by house-flies and cockroaches."}, {"id": 209, "n": 209, "t": "Which parasites are transmitted by fly? State the clinical significance of any one of them.", "st": 0, "src": "Board 2 Set 15", "du": [], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Parasites transmitted by flies**\n\n| Fly | Parasite | Disease |\n|---|---|---|\n| **Sandfly** (*Phlebotomus*) | *Leishmania* | Kala-azar, cutaneous leishmaniasis |\n| **Tsetse fly** (*Glossina*) | *Trypanosoma brucei* | African trypanosomiasis |\n| **Black fly** (*Simulium*) | *Onchocerca volvulus* | River blindness |\n| **Deer fly** (*Chrysops*) | *Loa loa* | Loiasis |\n| **House fly** (*Musca*) | Cysts/eggs (*E. histolytica*, *Giardia*, *Ascaris*) | Mechanical transmission |\n| Tumbu fly / botfly | Larvae | Myiasis |\n\n**Clinical significance — sandfly and kala-azar (visceral leishmaniasis)**\n- Female *Phlebotomus argentipes* transmits *L. donovani* promastigotes; incubation 3–6 months.\n- Features: **prolonged irregular fever, hepatosplenomegaly (massive splenomegaly), pancytopenia, weight loss, hyperpigmentation** (\"kala-azar\" = black fever).\n- Untreated, it is **fatal in >95%** of patients; can leave **PKDL**, which maintains the reservoir. Bangladesh achieved WHO validation for elimination as a public-health problem (2023)."}, {"id": 210, "n": 210, "t": "Name some parasites associated with HIV.", "st": 0, "src": "Board 2 Set 11", "du": [], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Parasites associated with HIV/AIDS**\n\n| Parasite | Disease | Typical CD4 count |\n|---|---|---|\n| ***Toxoplasma gondii*** | Cerebral toxoplasmosis (ring-enhancing lesions) | < 100/µL |\n| ***Cryptosporidium*** | Chronic profuse watery diarrhoea | < 100/µL |\n| ***Cystoisospora belli*** | Chronic diarrhoea | Low |\n| ***Cyclospora cayetanensis*** | Prolonged diarrhoea | Low |\n| **Microsporidia** (*Enterocytozoon bieneusi*) | Chronic diarrhoea | < 100/µL |\n| ***Strongyloides stercoralis*** | Hyperinfection/disseminated strongyloidiasis | Steroids, HTLV-1 |\n| ***Leishmania donovani*** | VL–HIV co-infection, atypical, relapsing | Low |\n| **Free-living amoebae** (*Acanthamoeba*, *Balamuthia*) | Granulomatous amoebic encephalitis | Low |\n| *Balantidium coli* | Diarrhoea (source list) | — |\n\n**Viva point.** *Toxoplasma* is the commonest cause of **ring-enhancing brain lesions** in AIDS; prophylaxis with **cotrimoxazole** is given when CD4 < 100."}, {"id": 211, "n": 211, "t": "Name common helminthic diseases in Bangladesh.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Common helminthic diseases of Bangladesh**\n\n| Group | Disease | Parasite |\n|---|---|---|\n| **Soil-transmitted helminths** | **Ascariasis** (commonest) | *Ascaris lumbricoides* |\n| | Trichuriasis | *Trichuris trichiura* |\n| | Hookworm disease | *Ancylostoma duodenale*, *Necator americanus* |\n| | Strongyloidiasis | *Strongyloides stercoralis* |\n| | Enterobiasis | *Enterobius vermicularis* |\n| **Cestodes** | Taeniasis | *Taenia saginata* (commoner than *T. solium*) |\n| | Hymenolepiasis | *Hymenolepis nana* |\n| | Hydatid disease | *Echinococcus granulosus* (sporadic) |\n| **Filariae** | Lymphatic filariasis | *W. bancrofti* (WHO-validated elimination as a public-health problem in 2023; north-western districts) |\n| **Trematodes** | Fascioliasis | *Fasciola* (sporadic) |\n\n**Control:** school-based/mass deworming with albendazole or mebendazole, sanitation, handwashing, footwear."}, {"id": 212, "n": 212, "t": "Enumerate the bile-stained eggs / ova commonly found in the stool of Bangladeshi children.", "st": 3, "src": "Board 2 Set 01, 14, 18", "du": [], "nmc": [], "vv": ["Board 2 Set 01", "Board 2 Set 14", "Board 2 Set 18"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Bile-stained eggs** (golden-brown; the pigment is acquired from bile during passage through the intestine) commonly found in the stool of Bangladeshi children:\n\n| Egg | Morphology (key points) |\n|---|---|\n| ***Ascaris lumbricoides*** (fertilised) | Round/oval, 60–75 × 40–50 µm; thick shell with **mammillated albuminous coat**; unsegmented ovum with crescentic clear zone at poles |\n| ***Ascaris lumbricoides*** (unfertilised) | Longer, narrower (80 × 55 µm); thin shell with irregular coat; contains refractile granules |\n| ***Trichuris trichiura*** | **Barrel/lemon-shaped**, 50 × 25 µm; **mucous plug** at each pole; unsegmented ovum |\n| ***Taenia saginata*** (and *T. solium*) | Spherical, 30–40 µm; **thick radially striated shell** (embryophore); contains **hexacanth (six-hooked) oncosphere** |\n\n**Non-bile-stained eggs:** hookworm (colourless, segmented ovum with clear space), *Enterobius* (plano-convex, larva inside), *H. nana* (polar filaments), *Fasciolopsis* (occasionally).\n\n**Viva points**\n- **Floatation in saturated salt** concentrates *Ascaris* (fertilised), *Trichuris*, hookworm and *Enterobius* eggs — unfertilised *Ascaris* eggs sink.\n- *Taenia* eggs in stool **cannot be differentiated** to species level."}]}, {"id": "parasitology-2", "title": "Free-living Amoebae", "qs": [{"id": 213, "n": 213, "t": "Name/list the free-living amoebae of medical importance, and mention their mode of transmission and the diseases they cause.", "st": 6, "src": "DU-25N, 22M, 20Nov/July; Board 2 Set 05, 12, 14", "du": ["DU-25N", "DU-22M", "DU-20Nov/July"], "nmc": [], "vv": ["Board 2 Set 05", "Board 2 Set 12", "Board 2 Set 14"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Free-living amoebae (FLA)** live independently in **fresh water, warm ponds, lakes, swimming pools, hot springs, moist soil and dust**. Unlike the intestinal amoebae they are **aerobic** and feed on bacteria; man is only an **accidental (opportunistic) host**. Three genera cause human disease (the fourth, *Sappinia*, is exceptional).\n\n| | ***Naegleria fowleri*** | ***Acanthamoeba*** spp. (*A. castellanii*, *A. polyphaga*) | ***Balamuthia mandrillaris*** |\n|---|---|---|---|\n| **Habitat** | Warm fresh water (ponds, lakes, hot springs, poorly chlorinated swimming pools) — **thermophilic** | Soil, dust, fresh water, contact-lens fluid, air-conditioning units | Soil, water |\n| **Stages** | Amoeboid trophozoite, **flagellate form** (transient, environmental), **cyst** (never seen in tissue/CSF) | Trophozoite (with spiny **acanthopodia**) and double-walled cyst; **no flagellate stage** | Trophozoite and cyst; no flagellate stage |\n| **Mode of transmission** | **Nasal** — contaminated water splashed/inhaled (swimming, diving, ablution, neti pot) → trophozoites cross the **olfactory neuro-epithelium and cribriform plate** to the brain. *Drinking the water is harmless* | **Inhalation** (lung → haematogenous spread to brain), **skin wounds/ulcers**, **corneal trauma** or contaminated **contact lenses/solutions** | Skin wounds, inhalation → haematogenous spread |\n| **Disease** | **Primary amoebic meningo-encephalitis (PAM)** — acute, fulminant | **Granulomatous amoebic encephalitis (GAE)** — subacute/chronic; **amoebic keratitis**; skin ulcers | **GAE**; skin lesions (esp. face) |\n| **Host** | Healthy children and young adults with history of swimming | **Immunocompromised** (GAE); healthy contact-lens wearers (keratitis) | Immunocompromised and healthy |\n| **Incubation** | 2 days – 2 weeks | Weeks to months | Weeks to months |\n| **CSF** | **Neutrophilic** pleocytosis, ↑protein, ↓glucose; **motile trophozoites on fresh wet mount** | Lymphocytic pleocytosis; trophozoites/cysts in tissue | Lymphocytic; amoebae in tissue |\n| **Course/prognosis** | Death in **5–7 days**; mortality > 95% | Chronic; high mortality | High mortality |\n| **Diagnosis** | Wet mount of fresh CSF (do **not** refrigerate), Giemsa/trichrome, culture on **non-nutrient agar with *E. coli*** lawn, PCR | Corneal scraping (culture on non-nutrient agar + *E. coli*), brain biopsy, PCR | Brain biopsy, PCR |\n| **Treatment** | **Amphotericin B** (IV, intrathecal) ± miltefosine, azithromycin, rifampicin, dexamethasone | Keratitis: chlorhexidine/PHMB ± propamidine; GAE: combination (pentamidine, azoles, miltefosine, flucytosine) | Combination therapy; poor outcome |\n\n**Clinical picture of PAM:** severe frontal headache, fever, vomiting, **loss of smell/taste** (olfactory involvement), neck stiffness, seizures, coma.\n\n**Prevention:** avoid diving/swimming in warm fresh water, use nose-clips; use **sterile/boiled water for nasal irrigation or ablution**; adequate chlorination of pools; contact-lens hygiene (never rinse lenses in tap water).\n\n**Viva points**\n- *Naegleria* = \"brain-eating amoeba\"; enters by the **nose**, not by drinking.\n- Cyst is seen in tissue in *Acanthamoeba* and *Balamuthia*, **never** in *Naegleria*.\n- *Ref: Jawetz 28th; Akram's; Levinson Ch. 53.*"}]}, {"id": "parasitology-3", "title": "Entamoeba histolytica", "qs": [{"id": 214, "n": 214, "t": "Mention the morphological forms of *Entamoeba histolytica*, with diagram.", "st": 2, "src": "DU-22N; Board 2 Set 16", "du": ["DU-22N"], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n*E. histolytica* exists in **three morphological forms**: **trophozoite**, **precyst** and **cyst** (the cyst passes through uni-, bi- and quadrinucleate stages).\n\n**1. Trophozoite (vegetative, pathogenic form)**\n- Size **12–60 µm** (average 20 µm); *magna* (invasive, 20–60 µm, in dysentery/tissues) and *minuta* (luminal, 10–20 µm, in carriers) forms.\n- **Active, progressive, directional** amoeboid motion by a single finger-like **pseudopodium**.\n- Cytoplasm: clear hyaline **ectoplasm** and finely granular **endoplasm**; endoplasm contains **ingested red blood cells** (diagnostic), food vacuoles, occasionally leucocytes; **no bacteria** in healthy trophozoites.\n- **Nucleus:** single, spherical, 4–6 µm; delicate nuclear membrane lined by **fine, evenly distributed peripheral chromatin**; small **central karyosome**; fine radial fibrils (**cartwheel** appearance).\n- Not infective: destroyed by gastric acid.\n\n**2. Precyst** — round or oval, no food vacuoles, no RBC; large glycogen vacuole and 1–2 chromatoid bars; single nucleus.\n\n**3. Cyst (infective, resistant form)**\n- Spherical, **10–20 µm**, thick refractile wall, **non-motile**.\n- Nuclei: uninucleate → binucleate → **mature quadrinucleate** (4 nuclei; infective).\n- **Glycogen mass** (dark brown with iodine) in young cyst; disappears when mature.\n- **Chromatoid bars** — blunt-ended, rod/cigar shaped (crystalline RNA); unstained with iodine.\n- Viable for ~10 days in moist conditions; resists gastric acid and chlorination (killed by boiling, drying, filtration).\n\n**Schematic diagram**\n\n```\n  TROPHOZOITE                     PRECYST                 MATURE CYST (4 nuclei)\n  ┌───────────────────┐         ┌───────────┐            ┌───────────────┐\n  │ ectoplasm (clear) ├─▶ pseudopod                     │  ◉     ◉      │  cyst wall\n  │  ┌─────────────┐  │         │  ◉ nucleus│            │    ▬▬ chromatoid│\n  │  │endoplasm    │  │         │  glycogen │            │  ◉     ◉  bar  │\n  │  │ ◉ nucleus   │  │         │  vacuole  │            │  (4 nuclei)    │\n  │  │  (karyosome │  │         │  ▬ bars   │            └───────────────┘\n  │  │  + fine     │  │         └───────────┘                10–20 µm\n  │  │  peripheral │  │           10–20 µm\n  │  │  chromatin) │  │\n  │  │ ● ingested  │  │\n  │  │   RBCs      │  │\n  │  └─────────────┘  │\n  └───────────────────┘\n         20–60 µm\n```\n*Labels: ectoplasm, endoplasm, pseudopodium, nuclear membrane, karyosome, peripheral chromatin, ingested RBCs; cyst wall, nuclei ×4, chromatoid bar, glycogen mass.*\n\n**Viva points**\n- Diagnostic stage: trophozoite (dysentery) and cyst (formed stool); **infective stage: quadrinucleate cyst**; **pathogenic stage: trophozoite**.\n- Trophozoite with **ingested RBC** = *E. histolytica* (not *E. dispar*/other amoebae).\n- Chlorination does **not** kill cysts."}, {"id": 215, "n": 215, "t": "Discuss the life cycle of *E. histolytica*.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Habitat:** mucosa/submucosa of the **large intestine** (caecum, ascending colon, sigmoid, rectum). **Host:** man (only definitive host; *monoxenous* — no intermediate host or vector). **Infective form:** mature **quadrinucleate cyst**. **Reservoir:** man (asymptomatic cyst passers). **Incubation:** 2–4 weeks (range days to months).\n\n**Life cycle (sequential)**\n1. **Ingestion** of mature quadrinucleate cysts with faecally contaminated food, water, vegetables, or by hands/flies.\n2. Cysts **pass through the stomach unharmed** (wall resists gastric acid).\n3. **Excystation** in the **terminal ileum/caecum** (alkaline medium, trypsin digests wall) → one **metacyst** (4-nucleate amoeba).\n4. Each nucleus divides once → 8 nuclei → cytoplasmic division → **8 small metacystic trophozoites (amoebulae)**.\n5. Amoebulae colonise the **large intestine**, multiplying by **binary fission** in the lumen (commensal *minuta* form).\n6. **Invasive strains** adhere (Gal/GalNAc lectin), invade the mucosa → flask-shaped ulcers → **dysentery**; haematogenous spread to the liver via the portal vein.\n7. **Encystation** — in the lumen, trophozoites round up, extrude food vacuoles → **precyst** → secrete cyst wall → uninucleate → binucleate → **quadrinucleate cyst** (occurs *only* in the lumen of the colon, never in tissue).\n8. **Cysts passed in formed stool** (and trophozoites in dysenteric stool — which die outside); cysts contaminate food/water → cycle repeats.\n\n```\nMature cyst ingested ──▶ excystation (ileo-caecal) ──▶ 8 amoebulae\n        ▲                                                │\n        │                                       binary fission in colon\n cysts in faeces ◀── encystation ◀── precyst ◀── trophozoites\n (infective)                          │\n                                      └──▶ invasion → ulcer → liver (extra-intestinal)\n```\n\n**Diagnostic stages:** cyst and trophozoite in stool. **Infective stage:** cyst.\n\n**Viva points**\n- One cyst → 8 trophozoites.\n- Trophozoites cannot infect: destroyed by gastric acid; cannot survive outside the host more than a few hours.\n- Encystation never occurs in tissues; **cysts are never found in extra-intestinal lesions**."}, {"id": 216, "n": 216, "t": "Between amoebiasis and giardiasis, which one is invasive, and why?", "st": 3, "src": "NMC 1; NMC 3; Board 2 Set 15", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Amoebiasis is the invasive infection; giardiasis is non-invasive.**\n\n| Feature | **Amoebiasis (*E. histolytica*)** | **Giardiasis (*G. lamblia*)** |\n|---|---|---|\n| Invasion of mucosa | **Yes** — trophozoites invade the colonic wall (submucosa), enter vessels | **No** — remains in the **lumen**, adherent to the brush border (no tissue invasion, no bloodstream entry) |\n|
