12 hours of birth, ± tenofovir to the mother, prevents ~95% of carriage).\n2. **Prevent congenital malformation/fetal loss** – rubella, CMV, varicella, parvovirus B19, Zika – identify non-immune women for protection/vaccination and counselling.\n3. **Plan obstetric management** – caesarean section for active genital herpes or high HIV viral load.\n4. **Early treatment of the mother** (e.g. acyclovir for varicella pneumonia/HSV; HBV treatment) and **follow-up and early treatment of the infant**.\n5. Protect health-care workers and contacts; counselling and partner testing; surveillance and public health planning.\n\n---\n\n\n---"}]}]}, {"id": "mycology", "name": "Part II — Mycology", "intro": "## Quick-recall map of the whole chapter\n\n```\nFUNGI\n├── Form ............ Yeast | Yeast-like | Mould | Dimorphic\n├── Site ............ Superficial → Cutaneous → Subcutaneous → Systemic (deep) → Opportunistic\n├── Spores .......... Asexual: conidia, arthro-, blasto-, chlamydo-, sporangio-\n│                     Sexual : Zygo-, Asco-, Basidio-spores\n├── Diagnosis ....... Specimen → KOH / India ink / stains → SDA culture → serology / antigen / PCR\n└── Drugs ........... Membrane (polyenes, azoles, allylamines) | Cell wall (echinocandins)\n                      DNA (flucytosine) | Mitosis (griseofulvin)\n```", "notes": "## Sources used (Mycology)\n\n1. *Blueprint Microbiology & Immunology*, Vol. II, 14th ed. (2025), Chapter 6 — Mycology (supplied `Mycology.md`).\n2. Levinson's *Review of Medical Microbiology and Immunology*, 18th ed., Chapters 47–50 (supplied `levinson_mycology.json`).\n3. Structured study notes `study_mycology.json` — used only as a cross-check; where it differed from the textbooks, the textbooks were followed.\n4. Supplementary (web): WHO diagnostics profile and PLOS-NTD review on mycetoma grain colours and laboratory diagnosis; Sabouraud dextrose agar formulation (HiMedia/Oxoid product data); *Trichophyton indotineae* literature (Bangladesh/India isolates, Emerg Infect Dis 2025, JAMA Dermatology/NYC case series) for the South Asian terbinafine-resistance notes.\n\n*Prepared for exam revision. Verify drug choices against current local guidelines before clinical use.*\n\n", "topics": [{"id": "mycology-1", "title": "Introduction & Classification of Fungi", "qs": [{"id": 111, "n": 111, "t": "Classify fungi (morphologically and/or clinically), with examples.", "st": 14, "src": "NMC 1; NMC 3; NMC 4; DU-26M, 25M, 20Nov/July, 19M, 19Nov, 18M; Board 2 Set 01, 03, 04, 06, 18", "du": ["DU-26M", "DU-25M", "DU-20Nov/July", "DU-19M", "DU-19Nov", "DU-18M"], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": ["Board 2 Set 01", "Board 2 Set 03", "Board 2 Set 04", "Board 2 Set 06", "Board 2 Set 18"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\nFungi are classified in several ways. In exams, give **A (morphological)** and **B (clinical/site)** as the main answer, and add **C (sexual reproduction)** if the question says \"classify fungi\" without qualification.\n\n**A. Morphological classification**\n\n| Type | Features | Examples |\n|---|---|---|\n| **1. Yeasts** | Unicellular, round/oval; reproduce by **budding** (or binary fission); creamy, pasty colonies | *Cryptococcus neoformans* |\n| **2. Yeast-like fungi** | Yeast phase + **pseudohyphae**; reproduce by budding | *Candida albicans* |\n| **3. Moulds** | Multicellular; branching filaments (**hyphae**) forming a **mycelium**; cottony/powdery colonies | Dermatophytes, *Aspergillus*, *Mucor*, *Rhinosporidium seeberi* (traditional textbook placement) |\n| **4. Dimorphic fungi** | **Mould at 25°C** (saprophytic) ⇄ **yeast (or spherule) at 37°C** (in tissue) | *Histoplasma capsulatum*, *Blastomyces dermatitidis*, *Coccidioides immitis*, *Paracoccidioides brasiliensis*, *Sporothrix schenckii* |\n\n**B. Clinical classification (by site of infection)**\n\n| Group | Tissue involved | Examples | Disease |\n|---|---|---|---|\n| **1. Superficial** | Outermost keratinised layer (stratum corneum) / hair shaft; no tissue reaction | *Malassezia furfur* · *Hortaea werneckii* · *Piedraia hortae*, *Trichosporon* | Pityriasis (tinea) versicolor · Tinea nigra · Black / white piedra |\n| **2. Cutaneous** | Keratinised skin, hair, nail (epidermis) | Dermatophytes (*Trichophyton*, *Microsporum*, *Epidermophyton*); *Candida* spp. | Ringworm / tinea / dermatophytosis; cutaneous candidiasis |\n| **3. Subcutaneous** | Dermis, subcutaneous tissue, fascia, bone — after **traumatic implantation** | *Sporothrix schenckii*; *Fonsecaea / Phialophora*; *Madurella mycetomatis*; *Exophiala*, *Bipolaris* | Sporotrichosis; chromoblastomycosis; mycetoma; phaeohyphomycosis |\n| **4. Systemic (deep / endemic)** | Internal organs, after **inhalation** of spores; all are dimorphic | *Histoplasma*, *Coccidioides*, *Blastomyces*, *Paracoccidioides* | Histoplasmosis, coccidioidomycosis, blastomycosis, paracoccidioidomycosis |\n| **5. Opportunistic** | Immunocompromised host (AIDS, diabetes, neutropenia, steroids, transplant) | *Candida albicans*, *Cryptococcus neoformans*, *Aspergillus fumigatus*, *Mucor / Rhizopus*, *Pneumocystis jirovecii*, *Talaromyces (Penicillium) marneffei* | Candidiasis, cryptococcosis, aspergillosis, mucormycosis, pneumocystis pneumonia, talaromycosis |\n\n**C. By method of reproduction (taxonomic)**\n\n| Group | Sexual spore | Examples |\n|---|---|---|\n| **Fungi perfecti** — sexual stage known | | |\n| &nbsp;&nbsp;Zygomycotina | Zygospore | *Mucor*, *Rhizopus* |\n| &nbsp;&nbsp;Ascomycotina | Ascospore (in an **ascus**) | *Histoplasma* (teleomorph), *Microsporum* (teleomorph) |\n| &nbsp;&nbsp;Basidiomycotina | Basidiospore (on a **basidium**) | *Cryptococcus neoformans* (teleomorph), mushrooms |\n| **Fungi imperfecti** — no sexual stage (anamorph only) | None | Deuteromycotina: dermatophytes, *Candida albicans*, *Malassezia furfur* |\n\n> *Examiner's note:* modern molecular taxonomy has dissolved Deuteromycota and Zygomycota, but the above scheme is what the syllabus and marking schemes follow.\n\n**Viva corner**\n- *Which is the only capsulated fungus?* — *Cryptococcus neoformans* (*Histoplasma capsulatum* is **not** capsulated despite the name).\n- *Mould in the cold, yeast in the heat* — meaning? — thermal dimorphism: mould at 25°C, yeast at 37°C.\n- *Are dermatophytes dimorphic?* — No; they are moulds only."}, {"id": 112, "n": 112, "t": "Classify fungi with examples according to the site of infection.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nClassification by **site (depth) of infection** — the *clinical classification*:\n\n| Site | Group | Examples (disease) |\n|---|---|---|\n| Stratum corneum / hair shaft | **Superficial mycoses** | *Malassezia furfur* (pityriasis versicolor); *Hortaea werneckii* (tinea nigra); *Piedraia hortae* (black piedra); *Trichosporon* (white piedra) |\n| Skin, hair, nail | **Cutaneous mycoses** | Dermatophytes — *Trichophyton*, *Microsporum*, *Epidermophyton* (tinea / ringworm); *Candida* (cutaneous candidiasis) |\n| Subcutaneous tissue, fascia, bone | **Subcutaneous mycoses** | *Sporothrix schenckii* (sporotrichosis); *Madurella*, *Scedosporium* (mycetoma); *Fonsecaea*, *Phialophora* (chromoblastomycosis); *Rhinosporidium seeberi* (rhinosporidiosis) |\n| Lungs and internal organs of healthy persons | **Systemic (deep, endemic) mycoses** | *Histoplasma capsulatum*, *Coccidioides immitis*, *Blastomyces dermatitidis*, *Paracoccidioides brasiliensis* |\n| Internal organs of compromised host | **Opportunistic mycoses** | *Candida*, *Cryptococcus*, *Aspergillus*, *Mucor*, *Pneumocystis* |\n\n**Memory aid:** *Superficial → Cutaneous → Subcutaneous → Systemic → Opportunistic* — \"**S-C-S-S-O**\": depth increases and the portal changes from *contact* → *implantation* → *inhalation*."}, {"id": 113, "n": 113, "t": "Write down the structural differences between fungi and bacteria.", "st": 8, "src": "NMC 1; NMC 4; DU-22N; Board 2 Set 02, 05, 09, 11, 19", "du": ["DU-22N"], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 2 Set 02", "Board 2 Set 05", "Board 2 Set 09", "Board 2 Set 11", "Board 2 Set 19"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | Fungi | Bacteria |\n|---|---|---|\n| **Cell type / nucleus** | **Eukaryotic**; true nucleus with nuclear membrane, nucleolus, linear chromosomes | **Prokaryotic**; nucleoid, no nuclear membrane, single circular chromosome |\n| **Size** | Larger — ~4 µm (*Candida*) | Smaller — ~1 µm (*Staphylococcus*) |\n| **Cell wall** | **Chitin**, glucan, mannan (no peptidoglycan) | **Peptidoglycan** (muramic acid, D-amino acids) |\n| **Cell membrane** | **Ergosterol** (sterol present) | Sterols absent (except *Mycoplasma*) |\n| **Organelles** | Mitochondria, endoplasmic reticulum, Golgi, vacuoles present | Absent |\n| **Ribosomes** | **80S** (60S + 40S) | **70S** (50S + 30S) |\n| **Morphology** | Unicellular yeasts or multicellular filamentous moulds (hyphae) | Unicellular (cocci, bacilli, spirilla) |\n| **Spores** | **Sexual and asexual** spores for **reproduction**; destroyed by heat | **Endospores** for **survival**, not reproduction; heat-resistant |\n| **Reproduction** | Budding, hyphal extension, spores | Binary fission |\n| **Thermal dimorphism** | Present in some | Absent |\n| **Metabolism** | Need preformed organic carbon; obligate aerobes/facultative anaerobes; **no obligate anaerobes** | Many autotrophs; many obligate anaerobes |\n| **Toxins** | No endotoxin; no bacterial-type exotoxin (mycotoxins only) | Endotoxin (Gram-negative), exotoxins |\n| **Response to drugs** | Insensitive to **antibacterials** (β-lactams, aminoglycosides); sensitive to **antifungals** | Sensitive to antibacterials; insensitive to antifungals |\n\n**Clinical importance:** the differences explain why penicillins and aminoglycosides do not act on fungi, and why amphotericin B / azoles (acting on **ergosterol**) spare bacteria.\n\n**Viva corner**\n- *Why do antibacterials not act on fungi?* — No peptidoglycan, 80S (not 70S) ribosomes, different membrane sterol.\n- *Why are antifungals (ergosterol-targeting) relatively safe for human cells?* — Human membranes contain **cholesterol**, not ergosterol.\n- *Why can't bacteria grow in fungal media?* — Acidic pH, high sugar, and antibacterial antibiotics (e.g., chloramphenicol) are added."}, {"id": 114, "n": 114, "t": "Mention 3 differences between bacterial spore and fungal spore.", "st": 2, "src": "DU-20Nov/July, 18M", "du": ["DU-20Nov/July", "DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Bacterial spore (endospore) | Fungal spore |\n|---|---|\n| Formed **inside** the cell (endospore); one spore per cell | Formed **outside** (exospore) or on specialised structures, often many per organism |\n| Produced under **adverse conditions** as a **survival** (protective) mechanism | Produced for **reproduction** and dispersal |\n| **Resistant** to heat, desiccation, chemicals | **Destroyed** by heat and chemicals (low water content but not highly resistant) |\n| Has **exosporium, spore coat, cortex**, dipicolinic acid | None of these structures |\n| Produced by few genera (*Bacillus*, *Clostridium*) | Produced by almost all fungi, sexual **and** asexual types |\n| Does not increase cell number | Increases number (and genetic variation, if sexual) |\n\n*(For a 2-mark question, any three rows are sufficient.)*"}, {"id": 115, "n": 115, "t": "Describe/discuss the laboratory diagnosis of a fungal ball.", "st": 4, "src": "NMC 4; DU-20Nov/July, 18M; Board 2 Set 14", "du": ["DU-20Nov/July", "DU-18M"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Fungal ball (aspergilloma)** is a mass of tangled *Aspergillus* hyphae, fibrin, mucus and cellular debris growing in a **pre-existing pulmonary cavity** (healed tuberculosis, sarcoidosis, emphysematous bulla, bronchiectasis); upper lobes are most often affected. The organism is **saprophytic — it does not invade tissue**. Commonest agent: ***Aspergillus fumigatus***. In South Asia, post-tubercular cavities are the usual substrate.\n\n**Clinical picture:** often asymptomatic (incidental X-ray finding); **haemoptysis** (the main complication, can be massive), cough, dyspnoea, weight loss.\n\n**Laboratory / investigative diagnosis**\n\n1. **Imaging (first clue)** — chest X-ray/CT: round opaque mass inside a cavity with a **crescent of air** above it (**air-crescent / Monod sign**); the mass **shifts position** when the patient moves from erect to supine; HRCT is more sensitive.\n2. **Specimen:** sputum (repeated), bronchial lavage; resected tissue if surgery done.\n3. **Direct microscopy** (10% KOH / calcofluor white): **septate, branching hyphae** — uniform width, parallel walls, **V-shaped (dichotomous, ~45°) branching**; scanty hyphal fragments in sputum.\n4. **Histopathology** (resected lesion): tangled hyphae stained with **GMS (silver)** or PAS; no tissue invasion.\n5. **Culture:** **Sabouraud's dextrose agar**, 25–37°C (*A. fumigatus* grows even at 45°C), 2–5 days; colony — blue-green/smoky-grey velvety with a pale reverse; **lactophenol cotton-blue mount** — conidiophore with flask-shaped vesicle bearing a single row of phialides and **radiating chains of conidia**. Sputum culture is usually positive, but a positive culture alone does not prove disease (colonisation is common).\n6. **Serology:** **serum precipitins / IgG against *A. fumigatus*** — raised in nearly all patients (the most useful confirmatory blood test); immediate skin-test reactivity in ~50%.\n7. **Antigen / molecular** (supportive): galactomannan on BAL; PCR.\n\n**Treatment:** asymptomatic — observation (antifungals have little value); **surgical resection** for recurrent or massive haemoptysis; bronchial artery embolisation as temporising measure.\n\n**Viva corner**\n- *Aspergillus hyphae — describe.* — Septate, V-shaped branching, parallel walls (vs *Mucor*: broad, aseptate, right-angle branches).\n- *Why is antifungal therapy of little value in aspergilloma?* — Fungus is avascular, lying free in a cavity; drug penetration is poor."}, {"id": 116, "n": 116, "t": "List the sexual and asexual spores of fungi.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Fungal spores**\n\n| Type | Spore | Description / example |\n|---|---|---|\n| **ASEXUAL** (mitospores) — most medically important fungi | **Conidia (microconidia, macroconidia)** | Formed from the sides/tips of hyphae; shape and arrangement aid identification — *Aspergillus*, *Trichophyton*, *Microsporum* |\n| | **Arthroconidia (arthrospores)** | Fragmentation of hyphae into rectangular segments — *Coccidioides immitis* (infective form), dermatophytes in tissue |\n| | **Blastoconidia (blastospores)** | Formed by **budding** — yeasts, *Candida*, *Cryptococcus* |\n| | **Chlamydospores** | Rounded, **thick-walled**, resistant, terminal or intercalary — *Candida albicans* (diagnostic) |\n| | **Sporangiospores** | Formed **inside a sac (sporangium)** on a stalk — *Mucor*, *Rhizopus* |\n| **SEXUAL** (meiospores) | **Zygospore** | Single, large, thick-walled — *Mucor*, *Rhizopus* |\n| | **Ascospore** | Formed in a sac (**ascus**) — *Histoplasma* and *Microsporum* teleomorphs |\n| | **Basidiospore** | Formed externally on a pedestal (**basidium**) — *Cryptococcus* teleomorph, mushrooms |\n\n**Mnemonic for sexual spores: \"ZAB\"** — **Z**ygo-, **A**sco-, **B**asidio-spores."}, {"id": 117, "n": 117, "t": "Explain dimorphic fungus, with examples/diseases produced.", "st": 5, "src": "NMC 4; DU-23N, 22N; Board 2 Set 05, 09", "du": ["DU-23N", "DU-22N"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 05", "Board 2 Set 09"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Definition:** a **dimorphic fungus** is one that exists in **two forms** depending on the temperature (thermal dimorphism) — a **mould** in the saprophytic phase in soil/at room temperature, and a **yeast** (or spherule) in the parasitic phase in tissue/at 37°C.\n\n*Remember: \"Mould in the cold (22–25°C), yeast in the heat (37°C).\"*\n\n**Criteria**\n1. Two forms — mould and yeast/spherule.\n2. Mould form at **room temperature (22–25°C)**, the free-living saprophytic state; infective via spores.\n3. Yeast form at **37°C** in host tissue or on enriched medium (e.g., blood agar, BHI).\n\n**Examples and diseases**\n\n| Dimorphic fungus | Disease | Tissue form | Mould-phase hallmark | Geography |\n|---|---|---|---|---|\n| *Histoplasma capsulatum* | Histoplasmosis | Small oval **intracellular** yeasts in macrophages | **Tuberculate macroconidia** | Soil with bird/bat droppings; Americas, also elsewhere |\n| *Blastomyces dermatitidis* | Blastomycosis | Thick-walled yeast, **single broad-based bud** | Pear-shaped conidia | North America, Africa |\n| *Coccidioides immitis / posadasii* | Coccidioidomycosis | **Spherule** with endospores (not yeast) | Hyphae with **arthrospores** | Arid soils, SW USA, Latin America |\n| *Paracoccidioides brasiliensis* | Paracoccidioidomycosis | Yeast with **multiple buds** (\"pilot's wheel\") | Hyphae | South America |\n| *Sporothrix schenckii* | Sporotrichosis | Cigar-shaped yeast | Hyphae with **rosette (\"daisy\") conidia** | Worldwide (rose thorns) |\n| *Talaromyces (Penicillium) marneffei* | Talaromycosis | Yeast dividing by fission | Mould with red pigment | South-East Asia |\n\n**Clinical importance:** thermal dimorphism helps in rapid identification; the first four are the **systemic (endemic) mycoses**, acquired by inhalation, non-communicable.\n\n**Viva corner**\n- *Is Candida albicans dimorphic?* — Not thermally; it shows yeast ⇄ hypha (\"yeast-like\") change but is classified as a yeast-like fungus.\n- *Which dimorphic fungus has spherules?* — *Coccidioides*.\n- *Which dimorphic fungi are NOT capsulated although named so?* — *Histoplasma capsulatum*."}, {"id": 118, "n": 118, "t": "Enumerate four opportunistic fungi.", "st": 3, "src": "DU-22N; Board 2 Set 05, 20", "du": ["DU-22N"], "nmc": [], "vv": ["Board 2 Set 05", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Opportunistic fungi** cause disease mainly in persons with **impaired host defences** (AIDS, diabetes, neutropenia, malignancy, steroid/cytotoxic therapy, transplantation, broad-spectrum antibiotics).\n\n| Opportunistic fungus | Disease | Typical predisposition |\n|---|---|---|\n| ***Candida albicans*** | Thrush, vaginitis, candidaemia, endocarditis | Antibiotics, diabetes, catheters, neutropenia, AIDS |\n| ***Cryptococcus neoformans*** | Cryptococcal meningitis, pneumonia | AIDS, ↓ cell-mediated immunity |\n| ***Aspergillus fumigatus*** | Aspergilloma, invasive aspergillosis, ABPA | Neutropenia, TB cavities, asthma |\n| ***Mucor / Rhizopus*** | Rhinocerebral mucormycosis | Diabetic ketoacidosis, iron overload |\n| *Pneumocystis jirovecii* | Interstitial pneumonia | AIDS (CD4 <200) |\n| *Talaromyces marneffei* | Disseminated talaromycosis | AIDS, South-East Asia |\n\n*(Any four are asked — choose Candida, Cryptococcus, Aspergillus, Mucor.)*"}, {"id": 119, "n": 119, "t": "Define fungi imperfecti, with two examples.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Fungi imperfecti (Deuteromycotina)** are fungi in which **no sexual stage (teleomorph) is known**; they reproduce only asexually (**anamorph**) by conidia, and are identified from their asexual structures. (If a sexual stage is later discovered, the fungus is reclassified into the appropriate group.)\n\n**Examples:** (1) **Dermatophytes** (*Trichophyton*, *Epidermophyton*), (2) ***Candida albicans***, and also *Malassezia furfur*, *Aspergillus fumigatus*.\n\nContrast — **Fungi perfecti** form sexual spores (zygospores, ascospores, basidiospores)."}, {"id": 120, "n": 120, "t": "What is a fungus?", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nA **fungus** is a **chlorophyll-free, eukaryotic**, unicellular or multicellular organism that is **heterotrophic** (absorbs nutrients from organic matter), has a **rigid cell wall of chitin**, **ergosterol** in the membrane, and reproduces **sexually or asexually** by spores. Fungi belong to a separate kingdom (**Kingdom Fungi**); the study of fungi is **mycology** (Gk. *mykes* = fungus), and fungal infection is **mycosis**."}, {"id": 121, "n": 121, "t": "Enumerate the important structures of a fungus.", "st": 0, "src": "Board 2 Set 10", "du": [], "nmc": [], "vv": ["Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Structure of the fungal cell** (typical eukaryote)\n\n| Structure | Description | Importance |\n|---|---|---|\n| **Cell wall** | Rigid, external; 15–30% of dry weight. **Chitin**, β-glucan, mannan, glycoproteins | Shape, protection; **no peptidoglycan, so penicillins are ineffective**; β-glucan is the target of **echinocandins** |\n| **Cell membrane** | Phospholipid bilayer with **ergosterol** (and zymosterol) | Target of **amphotericin B and azoles**; human cells have cholesterol |\n| **Cytoplasm** | Mitochondria, ER, Golgi, vacuoles, **80S ribosomes** (60S + 40S) | Differ from 70S bacterial ribosomes |\n| **Nucleus** | Membrane-bound, nucleolus, linear chromosomes | Eukaryotic |\n| **Capsule** | Polysaccharide outside the wall; non-essential | Present **only in *Cryptococcus neoformans*** |\n\n*(Morphological structures — hyphae, mycelium, spores — are covered under Q125.)*"}, {"id": 122, "n": 122, "t": "What are the morphological forms of fungi?", "st": 0, "src": "Board 2 Set 16", "du": [], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nFungi occur in **four morphological forms**:\n\n1. **Yeasts** — unicellular, oval/round, reproduce by budding (*Cryptococcus*).\n2. **Yeast-like fungi** — yeast cells that also form **pseudohyphae** (*Candida albicans*).\n3. **Moulds (filamentous fungi)** — multicellular, composed of **hyphae** forming mycelium (dermatophytes, *Aspergillus*).\n4. **Dimorphic fungi** — mould at 25°C, yeast/spherule at 37°C (*Histoplasma*, *Blastomyces*, *Coccidioides*)."}, {"id": 123, "n": 123, "t": "What do you mean by yeast, mold, and dimorphic fungus?", "st": 0, "src": "Board 2 Set 04", "du": [], "nmc": [], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Term | Definition | Example |\n|---|---|---|\n| **Yeast** | Unicellular, spherical-to-ellipsoid fungus that reproduces by **budding** (blastoconidia); colonies are creamy/pasty | *Cryptococcus neoformans* |\n| **Mould (mold)** | Multicellular fungus composed of branching filaments (**hyphae**) forming a **mycelium**; reproduces by sexual and asexual spores; colonies are cottony/powdery | *Aspergillus*, dermatophytes |\n| **Dimorphic fungus** | Fungus existing as **mould at 22–25°C** and as **yeast (or spherule) at 37°C** | *Histoplasma capsulatum*, *Blastomyces dermatitidis* |"}, {"id": 124, "n": 124, "t": "Define hypha and pseudohyphae.", "st": 2, "src": "Board 2 Set 14, 20", "du": [], "nmc": [], "vv": ["Board 2 Set 14", "Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n- **Hypha** (pl. *hyphae*): a **tubular, branching filament** of fungal cells, the structural unit of the mould. It may be **septate** (cross-walled; *Aspergillus*, dermatophytes) or **aseptate/coenocytic** (*Mucor*, *Rhizopus*). A mass of hyphae is a **mycelium**; growth is by **apical extension**.\n- **Pseudohypha**: a chain of **elongated yeast cells (buds) that remain attached** after budding, resembling hyphae but with **constrictions at the points of attachment** (*Candida*).\n\n| Feature | Hyphae | Pseudohyphae |\n|---|---|---|\n| Formation | Apical elongation and branching | Budding of yeast cells, buds stay attached |\n| Constrictions | **Absent** — parallel walls | **Present** at junctions |\n| Septa | Present or absent | True septa absent (only constrictions) |\n| Appearance | Filamentous | Beaded / sausage-like |\n| Example | *Aspergillus*, *Trichophyton* | *Candida albicans* |"}, {"id": 125, "n": 125, "t": "Name fungal structures.", "st": 0, "src": "Board 2 Set 15", "du": [], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Morphological structures of fungi**\n\n1. **Hypha** — septate or aseptate; may be *vegetative* (penetrates substrate; **rhizoids** in *Rhizopus*), *aerial* (rises above surface, bears spores), or *reproductive*.\n2. **Mycelium** — mass of hyphae (mould colony).\n3. **Yeast cell** and **pseudohypha**.\n4. **Spore-bearing structures** — conidiophore (*Aspergillus*), sporangium (*Mucor*), ascus, basidium.\n5. **Spores** — sexual (zygo-, asco-, basidiospores) and asexual (conidia, arthro-, blasto-, chlamydo-, sporangiospores) — see Q116.\n6. **Cellular structures** (cell wall, membrane, nucleus, capsule) — see Q121."}, {"id": 126, "n": 126, "t": "How does a fungus multiply?", "st": 2, "src": "Board 2 Set 04, 16", "du": [], "nmc": [], "vv": ["Board 2 Set 04", "Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nFungi multiply by **three mechanisms**:\n\n1. **Vegetative (somatic) growth**\n   - *Yeasts:* **budding** (unequal daughter cell) — occasionally binary fission.\n   - *Moulds:* **apical extension and branching** of hyphae, and **fragmentation** of hyphae.\n2. **Asexual reproduction** (commonest in medically important fungi) — **mitosis** → spores: conidia, arthro-, blasto-, chlamydo-, sporangiospores.\n3. **Sexual reproduction** — mating of compatible strains → **meiosis** → zygo-, asco-, basidiospores.\n\nFungal spores serve for **reproduction and dispersal** (unlike bacterial spores that serve for survival)."}, {"id": 127, "n": 127, "t": "Mention the natural habitat of fungi. / \"Natural habitat for most fungi is environment e.g., soil, water, decaying material\" – explain.", "st": 2, "src": "Board 2 Set 14, 19", "du": [], "nmc": [], "vv": ["Board 2 Set 14", "Board 2 Set 19"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Natural habitat:** the **environment** — **soil, water, air, decaying vegetation and organic debris, animal (bird/bat) droppings**.\n\n**Explanation of the statement**\n1. Fungi are **heterotrophic** and have **no chlorophyll**; they cannot make their own food and need a **preformed organic carbon source**.\n2. They therefore live as **saprophytes**, decomposing dead organic matter (returning nutrients to the soil), which is why they are found where decaying material accumulates.\n3. Most pathogenic fungi are therefore **exogenous** — infection is acquired from the environment (inhalation of spores, traumatic implantation, contact), **not** from other patients.\n\n| Habitat | Fungus |\n|---|---|\n| Soil rich in **pigeon** droppings | *Cryptococcus neoformans* |\n| Soil with **bird / bat** guano | *Histoplasma capsulatum* |\n| Arid soil | *Coccidioides* |\n| Rose thorns, sphagnum moss | *Sporothrix schenckii* |\n| Soil, decaying vegetation, air | *Aspergillus*, *Mucor*, mycetoma agents |\n| Soil / animals / humans (geophilic / zoophilic / anthropophilic) | Dermatophytes |\n| **Exceptions — human body (normal flora)** | *Candida albicans*, *Malassezia furfur* |"}, {"id": 128, "n": 128, "t": "Enumerate the fungi that can be present as normal flora.", "st": 0, "src": "Board 2 Set 09", "du": [], "nmc": [], "vv": ["Board 2 Set 09"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Fungus | Site of carriage |\n|---|---|\n| ***Candida albicans*** (and other *Candida*) | Mouth, GIT, upper respiratory tract, female genital tract, skin |\n| ***Malassezia* (*M. furfur*, *M. globosa*)** | Skin — lipid-rich sebaceous areas (scalp, chest, back) |\n| *Rhodotorula*, *Saccharomyces* (rare) | Skin, GIT |\n| Transient airborne spores (*Aspergillus*, *Penicillium*, *Cladosporium*) | Upper respiratory tract — contaminants, not true residents |\n\nThese cause **endogenous infection** when host defence or normal bacterial flora is disturbed."}, {"id": 129, "n": 129, "t": "Mention the biomedical importance of fungus.", "st": 2, "src": "Board 2 Set 07, 11", "du": [], "nmc": [], "vv": ["Board 2 Set 07", "Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Biomedical importance of fungi**\n\n*A. Harmful*\n1. **Mycoses** — superficial, cutaneous, subcutaneous, systemic, opportunistic.\n2. **Opportunistic infections** — major cause of morbidity in AIDS, cancer, transplant and diabetic patients.\n3. **Mycotoxicoses** — ingestion of toxins (aflatoxin, ergot alkaloids, *Amanita* toxins).\n4. **Allergy** — IgE-mediated asthma, allergic bronchopulmonary aspergillosis (ABPA), allergic rhinosinusitis.\n5. **Spoilage** of food, grains, fruits, and contamination of laboratory cultures.\n\n*B. Beneficial*\n1. **Antibiotics and drugs** — penicillin (*Penicillium chrysogenum*), griseofulvin (*P. griseofulvum*), fusidic acid, **ciclosporin** (immunosuppressant), **statins** (lovastatin from *Aspergillus terreus*).\n2. **Food and drink** — bread, beer/wine (*Saccharomyces cerevisiae*), cheese, edible mushrooms (*Agaricus*).\n3. **Biotechnology** — yeast is used to produce recombinant **hepatitis B vaccine**; model organism for genetics.\n4. **Ecological** — decomposers; **bioremediation**; biological pest control."}, {"id": 130, "n": 130, "t": "Enumerate some fungal toxins.", "st": 0, "src": "Board 2 Set 16", "du": [], "nmc": [], "vv": ["Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Mycotoxins (fungal toxins) and the diseases they cause**\n\n| Toxin | Source | Effect |\n|---|---|---|\n| **Aflatoxin B₁** | *Aspergillus flavus* (on groundnuts, maize, stored grain) | Acute hepatotoxicity; **hepatocellular carcinoma** |\n| **Amanitin, phalloidin** | *Amanita phalloides* (mushroom) | **Liver necrosis** — amanitin inhibits RNA polymerase II → no mRNA synthesis |\n| **Ergotamine, LSD-type alkaloids** | *Claviceps purpurea* (on rye) | **Ergotism** — vasoconstriction, gangrene, neurological and hallucinatory effects |\n| Ochratoxin A | *Aspergillus ochraceus*, *Penicillium* | Nephrotoxic |\n| Fumonisin | *Fusarium* | Contaminated maize; oesophageal cancer association |\n\n**Mycotoxicosis** = disease caused by *ingestion* of fungal toxin (no infection involved).\n\n**Pathogenesis of aflatoxin-induced HCC:** aflatoxin (a coumarin derivative) ingested in spoiled grains/peanuts → metabolised in the liver to an **epoxide** (potent carcinogen) → **aflatoxin B₁ induces mutation of the *p53* tumour-suppressor gene** → loss of p53 and loss of growth control in hepatocytes → carcinoma (risk is greater with chronic hepatitis B)."}, {"id": 131, "n": 131, "t": "Enumerate the methods for diagnosis of fungal disease.", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Methods for diagnosis of fungal disease**\n\n1. **Direct microscopy** — 10% KOH mount, calcofluor white, India ink, Gram stain, Giemsa, PAS, GMS.\n2. **Culture** — Sabouraud's dextrose agar, 25–37°C.\n3. **Histopathology** — tissue biopsy stained with PAS/GMS.\n4. **Immunological** — antibody detection (CFT, immunodiffusion, ELISA), **antigen detection** (latex agglutination for cryptococcal antigen, galactomannan, β-D-glucan).\n5. **Molecular** — DNA probes, PCR, MALDI-TOF.\n6. **Skin tests** — histoplasmin, coccidioidin, *Candida* antigen (delayed hypersensitivity; shows exposure, not current disease).\n7. **Special bedside aids** — Wood's lamp, imaging.\n\n*(Details in Q132.)*"}, {"id": 132, "n": 132, "t": "How is a fungal infection diagnosed in the lab?", "st": 0, "src": "Board 2 Set 14", "du": [], "nmc": [], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Principle:** demonstration of the fungus by **direct microscopy** and its **isolation by culture**; serology and molecular tests are supportive.\n\n**Step 1 — Specimen** (depends on site): skin scraping, nail clipping, plucked hair, swabs (throat, vaginal), pus, sputum, CSF, blood, urine, tissue biopsy, bone-marrow aspirate, material from a removed catheter. Collect aseptically, before antifungal treatment.\n\n**Step 2 — Direct microscopic examination**\n- **10% KOH** dissolves keratin, epithelial cells and debris, leaving **alkali-resistant fungal elements** (hyphae, spores, yeast cells); calcofluor white adds fluorescence.\n- **India ink** for capsule of *Cryptococcus* in CSF.\n- Stains in tissue: **PAS, GMS (silver), Giemsa**, mucicarmine.\n\n**Step 3 — Culture** on **Sabouraud's dextrose agar (SDA)**, with chloramphenicol; **25–30°C (and 37°C for yeasts/dimorphs), 2–4 weeks** (yeasts 24–72 h). Identify by colony colour/texture and microscopy of asexual spores (lactophenol cotton blue).\n\n**Step 4 — Further tests:** germ-tube test (*Candida*), urease, sugar fermentation/assimilation, CHROMagar, MALDI-TOF.\n\n**Step 5 — Serology / antigen:** antibody tests (CFT, immunodiffusion) useful mainly in systemic mycoses; **antigen detection** (cryptococcal polysaccharide by latex agglutination; galactomannan; β-D-glucan).\n\n**Step 6 — Molecular:** DNA probes and PCR for *Coccidioides, Histoplasma, Blastomyces, Cryptococcus*."}, {"id": 133, "n": 133, "t": "Mention the media, incubation time, and temperature for fungal culture.", "st": 0, "src": "Board 2 Set 01", "du": [], "nmc": [], "vv": ["Board 2 Set 01"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Fungus / purpose | Medium | Temperature | Incubation |\n|---|---|---|---|\n| **General medium for fungi** | **Sabouraud's dextrose agar (SDA)** (+ chloramphenicol; ± cycloheximide) | **25–30°C** (room temp) | **2–4 weeks** (observe every 3–4 days) |\n| Dermatophytes | SDA ± cycloheximide, chloramphenicol; dermatophyte test medium | 25–30°C | 3–4 weeks |\n| *Candida* | SDA / blood agar; CHROMagar *Candida* | **37°C** | **24–48 hours** |\n| *Cryptococcus* | SDA, niger-seed (bird-seed) agar | **37°C** | **2–3 days** |\n| Dimorphic fungi (*Histoplasma*, etc.) | SDA at 25°C (mould) **and** BHI blood agar at 37°C (yeast) | 25°C and 37°C | 2–4 weeks |\n| Pityriasis versicolor | SDA (rarely needed) | 22–25°C | 3–4 weeks |\n\n**Composition of SDA (per litre):** peptone 10 g, **dextrose 40 g**, agar 15 g, **pH ≈ 5.6**."}, {"id": 134, "n": 134, "t": "\"Sabouraud's dextrose agar media allows the growth of fungi but not bacteria\" – explain.", "st": 0, "src": "Board 2 Set 15", "du": [], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nSDA is a **selective medium for fungi** because:\n\n1. **Acidic pH (≈ 5.6):** most pathogenic bacteria prefer neutral pH and are inhibited; fungi tolerate acid.\n2. **High dextrose (4%)** gives high osmotic pressure and a carbohydrate source suited to fungi — a poor environment for most bacteria.\n3. **Antibacterial antibiotics** (chloramphenicol, gentamicin/penicillin–streptomycin) are added to the medium.\n4. **Cycloheximide (actidione)** may be added to suppress saprophytic moulds. *(Do not use when looking for* Cryptococcus, *Aspergillus, or Mucor — they are inhibited.)*\n5. Slow-growing fungi (days–weeks) can therefore emerge without being overgrown by fast-growing bacteria."}, {"id": 135, "n": 135, "t": "\"Serological test is not reliable for the diagnosis of fungal disease\" – explain.", "st": 0, "src": "Board 2 Set 17", "du": [], "nmc": [], "vv": ["Board 2 Set 17"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nSerological (antibody) tests are **unreliable** in most fungal infections because:\n\n1. **Normal flora:** some fungi (e.g., *Candida*) are commensals, so antibodies are present in healthy persons — a positive test does not prove disease.\n2. **Immunity is mainly cell-mediated**, not antibody-mediated; antibody levels may be low or absent.\n3. **Immunocompromised patients** (the usual victims) often fail to mount antibodies.\n4. **Cross-reactivity** between fungal antigens causes false positives.\n5. Antibodies are of use only in **deep (systemic) mycoses**, and then a **significant rise in titre** (paired sera) is needed.\n\n*Exception:* **antigen detection** (cryptococcal capsular antigen by latex agglutination, galactomannan in aspergillosis) is reliable and widely used."}, {"id": 136, "n": 136, "t": "\"Antifungal drugs are more toxic and less in number than antibacterial drugs\" – explain.", "st": 0, "src": "Board 2 Set 18", "du": [], "nmc": [], "vv": ["Board 2 Set 18"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Why antifungals are fewer**\n1. Fungi are **eukaryotes**, like humans; most of their metabolic machinery (ribosomes, DNA/RNA synthesis, enzymes) is similar, leaving **few unique targets**.\n2. Unique targets are limited to the **cell wall** (β-glucan, chitin) and **membrane ergosterol** — hence only a few drug classes.\n\n**Why they are more toxic**\n- The differences are quantitative, not absolute; e.g., amphotericin B also binds cholesterol → **nephrotoxicity**; azoles inhibit human cytochrome P450 → **hepatotoxicity**, drug interactions; flucytosine → bone-marrow suppression; griseofulvin → hepatotoxicity.\n\n| Class | Example | Target |\n|---|---|---|\n| Polyenes | Amphotericin B, nystatin | Bind ergosterol → membrane pores |\n| Azoles | Fluconazole, itraconazole, voriconazole | Inhibit ergosterol synthesis (14α-demethylase) |\n| Allylamines | Terbinafine | Inhibit squalene epoxidase |\n| Echinocandins | Caspofungin, micafungin | Inhibit β-glucan synthase (cell wall) |\n| Flucytosine | 5-FC | Converted to 5-FU, inhibits DNA/RNA synthesis |\n| Griseofulvin | | Binds tubulin; disrupts mitotic spindle |\n\nBy contrast, **bacteria** have many unique targets (peptidoglycan, 70S ribosome, DNA gyrase, folate pathway) — so antibacterial drugs are numerous and selectively toxic."}, {"id": 137, "n": 137, "t": "Name 5 fungal diseases with respective fungi.", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Disease | Fungus |\n|---|---|\n| Ringworm (tinea) | *Trichophyton*, *Microsporum*, *Epidermophyton* |\n| Pityriasis versicolor | *Malassezia furfur* |\n| Oral thrush / vaginal candidiasis | *Candida albicans* |\n| Cryptococcal meningitis | *Cryptococcus neoformans* |\n| Aspergilloma / aspergillosis | *Aspergillus fumigatus* |\n| Mycetoma | *Madurella mycetomatis* |\n| Histoplasmosis | *Histoplasma capsulatum* |\n| Mucormycosis | *Mucor*, *Rhizopus* |\n\n*(Any five.)*"}]}, {"id": "mycology-2", "title": "Superficial Mycoses", "qs": [{"id": 138, "n": 138, "t": "Describe the laboratory diagnosis of onychomycosis.", "st": 2, "src": "NMC 1; NMC 3", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Onychomycosis** = fungal infection of the nail plate/bed (when due to dermatophytes it is called *tinea unguium*).\n\n**Specimen:** nail clippings **plus subungual debris/scrapings** taken from the **deeper, discoloured, friable part** of the nail (nail plate, nail bed and subungual region). Wash hands, decontaminate the nail with **70% alcohol**; patient should not have applied any antifungal for ≥ 1 week.\n\n**1. Direct microscopy**\n- Soften in **40% KOH** (nail needs strong alkali and a long time, ≥ 10 hours; gentle warming hastens clearing); calcofluor white (fluorescence) may be added.\n- *Dermatophytes:* **septate, branching hyphae with arthrospores**. *Candida:* budding yeasts and pseudohyphae. *Non-dermatophyte moulds:* irregular, broad hyphae.\n\n**2. Culture** on **SDA** (with chloramphenicol; **one tube with and one without cycloheximide**, because non-dermatophyte moulds and *Candida* are inhibited by it), **25–30°C, 3–4 weeks**, examined every 3–4 days.\n- Naked-eye: colour and texture of colony.\n- Microscopy of colony in lactophenol cotton blue: macro- and microconidia → *Trichophyton* (cylindrical macroconidia), *Epidermophyton* (club-shaped), *Microsporum* (spindle-shaped).\n\n**3. Histopathology:** PAS-stained nail clippings show hyphae within the nail plate.\n\n**4. Molecular:** PCR (fast, used in referral laboratories).\n\n> *Interpretation caution:* a non-dermatophyte mould isolate is significant only if seen in direct microscopy and grown repeatedly in pure culture."}, {"id": 139, "n": 139, "t": "What is onychomycosis, and what are its causative agents?", "st": 2, "src": "NMC 4; Board 2 Set 19", "du": [], "nmc": ["NMC 4"], "vv": ["Board 2 Set 19"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Definition:** **onychomycosis** is a chronic fungal infection of the nail (toe nails > finger nails) that causes **thickening, discolouration, brittleness, crumbling and separation (onycholysis)** of the nail plate.\n\n**Causative agents**\n\n| Group | Organisms |\n|---|---|\n| **Dermatophytes** (commonest — *tinea unguium*) | *Trichophyton rubrum* (commonest), *T. mentagrophytes*, *Epidermophyton floccosum* |\n| **Yeasts** | *Candida albicans* and other *Candida* (especially finger nails, chronic paronychia) |\n| **Non-dermatophyte moulds** | *Scopulariopsis*, *Aspergillus*, *Fusarium*, *Scytalidium* |\n\n**Predisposing factors:** age, diabetes, peripheral vascular disease, immunosuppression, occlusive footwear, nail trauma, prolonged water immersion (for *Candida*).\n\n**Pathogenesis:** nail-plate invasion causes a hyperkeratotic reaction that dislodges/distorts the nail."}, {"id": 140, "n": 140, "t": "Briefly discuss Pityriasis versicolor.", "st": 0, "src": "DU-25M", "du": ["DU-25M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Pityriasis (tinea) versicolor** is a chronic, mild, **superficial infection of the stratum corneum** caused by the lipophilic yeast ***Malassezia furfur*** (and related *Malassezia* species, e.g., *M. globosa*), producing **hypopigmented** (sometimes hyper-pigmented) scaly macules. Host response is minimal.\n\n- **Aetiology:** *Malassezia* — a **lipophilic yeast, normal skin commensal**; the disease occurs when the yeast converts to its **mycelial (hyphal) form** under favourable conditions.\n- **Predisposing factors:** **hot, humid climate**, excessive sweating, oily skin, adolescence/young adulthood (hormonal), corticosteroids, malnutrition, Cushing's syndrome.\n- **Clinical features:** well-defined, round-to-irregular **macular patches** on **chest, upper back, shoulders, arms, neck, abdomen**; **fine branny scaling** (positive \"stretch/scratch\" sign); usually **asymptomatic** or mildly itchy; hypopigmentation is conspicuous on **tanned skin** in summer — largely a cosmetic problem. Hypopigmentation is attributed to **azelaic acid** (a metabolic product of the yeast) inhibiting melanocyte tyrosinase. Patches may coalesce; the disease **recurs**.\n- **Diagnosis:** see Q141.\n- **Treatment:** topical **selenium-sulphide** shampoo/lotion, topical **azoles (miconazole, ketoconazole — drug of choice)**; **oral fluconazole/itraconazole** for extensive or recurrent disease. Recurrences are frequent; repigmentation is slow even after cure.\n- **Differential diagnosis:** vitiligo, pityriasis alba, indeterminate leprosy, seborrhoeic dermatitis."}, {"id": 141, "n": 141, "t": "Outline the laboratory diagnosis of Pityriasis versicolor.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Principle:** demonstration of characteristic fungal elements in skin scrapings; culture is **not routinely required**.\n\n1. **Specimen:** skin scrapings (use the edge of a glass slide) from the scaly patch.\n2. **Wood's lamp** (UV 365 nm): lesions show **yellow-gold / yellow-green fluorescence**.\n3. **KOH mount:** place scraping on a slide, add a drop of **10–20% KOH** (or stain with **calcofluor white**, or methylene blue / Parker ink), cover, **warm gently**, examine.\n   - **Findings:** clusters of **round, thick-walled yeast cells** together with **short, curved, unbranched hyphae** — the classic **\"spaghetti and meatballs\"** (or \"banana and grapes\") appearance.\n4. **Culture (if needed):** lipophilic — requires **lipid supplement** (SDA overlaid with sterile olive oil, or Dixon's/modified Leeming–Notman agar), 32–37°C, 5–7 days. *(SDA at 22–25°C for 3–4 weeks, examined every 3–4 days, is the routine textbook method for non-lipid-dependent species.)*\n5. Histology: PAS shows yeast and hyphae in stratum corneum (rarely required).\n\n**Viva corner**\n- *Microscopic appearance?* — \"Spaghetti and meatballs\".\n- *Treatment of choice?* — Topical miconazole/ketoconazole (and selenium sulphide)."}, {"id": 142, "n": 142, "t": "*Vignette: a 26-year-old male with irregularly shaped hypopigmented, scaly patches on chest/upper back for 3 months, recently returned from a hot, humid region.* Mention the probable diagnosis, causative organism, pathogenesis and confirmatory lab methods.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Probable diagnosis:** **Pityriasis (tinea) versicolor.** Clues: young adult, trunk distribution, hypopigmented scaly irregular patches, chronic course, hot-humid exposure.\n- **Causative organism:** ***Malassezia furfur*** (lipophilic yeast, normal skin flora).\n- **Pathogenesis:** commensal yeast (round form) → under warmth, humidity, sweat and sebum, converts to **hyphal (mycelial) phase** and invades the **stratum corneum**; azelaic acid and other lipid metabolites inhibit melanocyte tyrosinase → **hypopigmentation**. There is minimal inflammation (hence no itch) because invasion is confined to the dead keratin layer.\n- **Confirmatory laboratory methods:**\n  1. Skin scraping + **KOH / calcofluor white** → \"spaghetti and meatballs\" (short hyphae + spherical yeasts).\n  2. **Wood's lamp** → yellow-green fluorescence.\n  3. Culture (only if needed) on SDA with olive-oil overlay.\n- **Treatment:** topical selenium sulphide / azole; oral fluconazole or itraconazole for extensive disease."}, {"id": 143, "n": 143, "t": "Name superficial fungi with the diseases produced by them.", "st": 2, "src": "Board 2 Set 13, 15", "du": [], "nmc": [], "vv": ["Board 2 Set 13", "Board 2 Set 15"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Superficial fungus | Disease | Features |\n|---|---|---|\n| ***Malassezia furfur*** | **Pityriasis (tinea) versicolor** | Hypopigmented scaly macules on trunk |\n| ***Hortaea (Exophiala) werneckii*** | **Tinea nigra** | Dark brown–black painless macule on palm/sole (melanin-like pigment) |\n| ***Piedraia hortae*** | **Black piedra** | Hard, black nodules on hair shaft |\n| ***Trichosporon*** spp. | **White piedra** | Soft, yellowish nodules on hair shaft |"}]}, {"id": "mycology-3", "title": "Dermatophytes", "qs": [{"id": 144, "n": 144, "t": "What is ringworm infection, and where and why does it occur? Classify it by site of infection.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Ringworm (tinea, dermatophytosis)** is a **chronic superficial fungal infection of keratinised tissues — skin, hair and nails —** caused by dermatophytes. The classic lesion is **ring-shaped (annular)** with a raised, inflamed, scaly edge and central clearing — hence \"ring\"worm; no *worm* is involved.\n\n**Where it occurs:** only in the **superficial keratinised layers** (stratum corneum, hair, nail) — **never invades deeper tissue** — in warm, moist body areas (groin, feet, skin folds).\n\n**Why it occurs**\n1. Dermatophytes are **keratinophilic** — they digest **keratin** (via keratinases) as nutrient.\n2. They **cannot grow at 37°C in the depth of tissue or in serum** (serum contains inhibitory factors), so remain confined to the surface.\n3. Predisposition: **warm, humid climate**, sweating, occlusive clothing/footwear, minor skin trauma, shared towels, communal showers, close contact with pets, immunosuppression, topical steroid misuse.\n\n**Classification by site of infection**\n\n| Tinea | Site | Common agents |\n|---|---|---|\n| **T. capitis** | Scalp hair | *T. tonsurans*, *Microsporum canis* |\n| **T. barbae** | Beard | *T. mentagrophytes*, *T. verrucosum* |\n| **T. corporis** | Trunk and limbs (smooth skin) | *T. rubrum*, *T. mentagrophytes* |\n| **T. cruris** | Groin (jock itch) | *E. floccosum*, *T. rubrum* |\n| **T. pedis** | Foot, toe webs (athlete's foot) | *T. rubrum*, *T. mentagrophytes*, *E. floccosum* |\n| **T. manuum** | Palm and hand | *T. rubrum* |\n| **T. unguium** | Nails (onychomycosis) | *T. rubrum*, *T. mentagrophytes* |\n| **T. imbricata** | Trunk (concentric rings) | *T. concentricum* |"}, {"id": 145, "n": 145, "t": "Name the species of dermatophytes.", "st": 0, "src": "DU-18Nov", "du": ["DU-18Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nDermatophytes comprise **three genera** (all moulds; *none is dimorphic*), with the following important species:\n\n| Genus | Species | Site |\n|---|---|---|\n| ***Trichophyton*** | ***T. rubrum*** (commonest worldwide), ***T. mentagrophytes***, *T. interdigitale*, ***T. tonsurans***, *T. schoenleinii* (favus), *T. verrucosum*, *T. violaceum*, *T. concentricum*, *T. soudanense*; *T. indotineae* (see note) | Skin, hair, nails |\n| ***Epidermophyton*** | ***E. floccosum*** (only species) | Skin, nails (**never hair**) |\n| ***Microsporum*** | ***M. canis***, *M. audouinii*, *M. gypseum* | Skin, hair (**never nails**) |\n\n**Classification by natural habitat (reservoir)**\n- **Anthropophilic** — humans (*T. rubrum*, *E. floccosum*, *T. tonsurans*).\n- **Zoophilic** — animals (*M. canis* — cats/dogs; *T. verrucosum* — cattle); spread to humans and cause more inflammation.\n- **Geophilic** — soil (*M. gypseum*).\n\n> **South Asian note:** an ongoing epidemic of extensive, recurrent, treatment-resistant tinea in **India, Nepal and Bangladesh** is caused by ***Trichophyton indotineae*** (formerly *T. mentagrophytes* ITS genotype VIII, named in 2020). Most isolates are **resistant to terbinafine** (squalene epoxidase mutations); oral **itraconazole** is usually the most effective alternative. Over-the-counter steroid–antifungal combination creams are implicated in driving this problem."}, {"id": 146, "n": 146, "t": "Discuss the pathogenesis of dermatophytosis.", "st": 0, "src": "DU-22M", "du": ["DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n1. **Contact and adherence:** arthroconidia from an infected person, animal or soil land on skin with **minor abrasions/maceration**; they adhere to the keratinocytes and **germinate** within hours.\n2. **Invasion of keratin:** hyphae penetrate the **stratum corneum** and spread through the keratinised layer, digesting keratin with **keratinases and other proteinases**; the cooler, drier outer skin is ideal.\n3. **Limited to keratin:** invasion of deeper (living) tissue is extremely rare; fungus cannot grow at 37°C in serum.\n4. **Lateral (centrifugal) spread:** fungus grows outward as an advancing ring — the inflamed, scaly **active edge** where the host reacts (delayed-type hypersensitivity), while the centre heals → **ring-like** lesion.\n5. **Host response:** most infections are self-limited; **increased fungal growth rate or immune defect → chronic infection**. Strong inflammation with zoophilic species produces **kerion** (pustular boggy swelling of scalp).\n6. **Hair/nail involvement:** may spread to hair (endothrix/ectothrix) or nail (nail plate invasion → hyperkeratosis and dislodging = onychomycosis).\n7. **Hypersensitivity:** circulating antigens may produce a sterile **\"id\" reaction** at a distant site (Q147)."}, {"id": 147, "n": 147, "t": "Define dermatophytid reaction.", "st": 3, "src": "DU-23N; Board 2 Set 09, 20", "du": ["DU-23N"], "nmc": [], "vv": ["Board 2 Set 09", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Dermatophytid (“id”) reaction** is a **sterile hypersensitivity (allergic) reaction** at a site **distant from the primary dermatophyte infection**, in response to **circulating fungal antigens**, in which the lesions **contain no fungal hyphae**.\n\n- **Example/Site:** vesicles on the **sides and flexor aspects of fingers and the palm** in a patient with *tinea pedis*.\n- **Features:** itchy vesicular eruption; **KOH and culture of the vesicles are negative**; **trichophytin skin test is strongly positive**.\n- **Management:** treat the primary focus; the id reaction subsides.\n\n**Viva:** *Does the lesion show fungus?* — No. *Cause?* — Hypersensitivity to circulating fungal antigens."}, {"id": 148, "n": 148, "t": "Write the laboratory diagnosis of dermatophytosis/ringworm.", "st": 4, "src": "DU-19Nov, 18Nov; Board 2 Set 08, 20", "du": ["DU-19Nov", "DU-18Nov"], "nmc": [], "vv": ["Board 2 Set 08", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer** *(master answer — also used for Q149, Q150, Q156–Q161)*\n\n**Principle:** demonstration of fungal structures in the specimen by microscopy, and isolation and identification of the dermatophyte by culture.\n\n**1. Specimen**\n- **Skin:** scrape scales from the **active, peripheral, erythematous margin** with the blunt edge of a sterile scalpel/slide, after cleaning with 70% alcohol; adhesive tape if scaling is minimal.\n- **Hair:** pluck **dull, broken hair stumps with their root** (cut hair is unsuitable); Wood's lamp helps select fluorescing hairs.\n- **Nail:** clippings + subungual debris from the deeper discoloured part.\n\n**2. Direct microscopy** — dissolve in KOH, warm gently, and examine:\n\n| Specimen | KOH concentration | Time |\n|---|---|---|\n| Skin | 10% | ≥ 1 hour |\n| Hair | 20% | ≥ 10 hours |\n| Nail | 40% | ≥ 10 hours |\n\n- **Skin and nail:** **long, branching, septate hyphae with arthrospores (arthroconidia)**.\n- **Hair:** **ectothrix** (spores on the outside of the hair shaft — *Microsporum*, *T. mentagrophytes*) or **endothrix** (spores inside the shaft — *T. tonsurans*, *T. violaceum*).\n- *Why KOH?* — it is a **keratolytic** agent: dissolves keratin and debris leaving fungi intact.\n\n**3. Culture** — **Sabouraud's dextrose agar** (with chloramphenicol ± cycloheximide), **25–30°C, 3–4 weeks**.\n- **Naked eye:** colour (white, green, red, brown), texture (cottony, powdery, velvety), reverse pigment.\n- **Microscopy of colony (lactophenol cotton blue):** macro- and microconidia —\n\n| Genus | Macroconidia |\n|---|---|\n| *Trichophyton* | **Cylindrical / pencil-shaped**, thin-walled, few |\n| *Microsporum* | **Spindle-shaped**, thick-walled, echinulate |\n| *Epidermophyton* | **Club-shaped**, in clusters (no microconidia) |\n\n| Species | Microconidia / key feature |\n|---|---|\n| *T. mentagrophytes* | Round, **grape-like clusters** on terminal branches; spiral hyphae; urease +; hair-perforation test + |\n| *T. rubrum* | **Tear-drop**, singly along hyphae; **red (wine) reverse pigment**; urease − |\n| *T. tonsurans* | Mostly elongate |\n\n**4. Wood's lamp** (UV 365 nm): *M. canis, M. audouinii* — bright green fluorescence; *T. schoenleinii* — dull green; *T. tonsurans* and *T. rubrum* — none.\n\n**5. Molecular / MALDI-TOF** (reference labs; useful to identify resistant *T. indotineae*).\n\n**Flow summary**\n```\nSpecimen (scraping/hair/nail)\n   ├─ KOH mount ──► septate hyphae + arthrospores  (screen-positive)\n   └─ SDA 25–30 °C, 3–4 wk ──► colony ──► LPCB mount ──► macro/microconidia ──► genus/species\n```\n\n**Viva corner**\n- *Culture medium?* — SDA. *Temperature/time?* — 25–30°C, 3–4 weeks.\n- *Why not incubate at 37°C?* — dermatophytes do not grow at 37°C.\n- *Wood's lamp fluoresces which?* — *Microsporum canis*."}, {"id": 149, "n": 149, "t": "Outline the laboratory diagnosis of tinea cruris.", "st": 0, "src": "DU-19M", "du": ["DU-19M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Tinea cruris** (jock itch) — dermatophytosis of the groin, inner thighs and buttocks; usually **sparing the scrotum** (unlike candidiasis); caused by ***Epidermophyton floccosum***, *T. rubrum*, *T. mentagrophytes*.\n\n1. **Specimen:** skin scales from the **raised, active margin** after cleaning with 70% alcohol.\n2. **Direct microscopy:** **10% KOH** mount (≥ 1 h) → **septate branching hyphae with arthrospores**.\n3. **Culture:** SDA (± cycloheximide, chloramphenicol), **25–30°C, 3–4 weeks**.\n4. **Identification:** *E. floccosum* — khaki-green, flat colony; **club-shaped macroconidia in clusters, no microconidia**; *T. rubrum* — white cottony with wine-red reverse.\n5. **Differentials excluded:** erythrasma (*Corynebacterium minutissimum*, coral-red fluorescence under Wood's lamp, KOH-negative); candidal intertrigo (satellite lesions; yeast + pseudohyphae).\n\n*(Details as in Q148.)*"}, {"id": 150, "n": 150, "t": "Mention the clinical features and laboratory diagnosis of tinea corporis.", "st": 0, "src": "DU-22M", "du": ["DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Tinea corporis (ringworm of the body)** — dermatophytosis of the glabrous skin of the trunk and limbs.\n\n**Clinical features**\n1. **Annular (ring-shaped)** plaque with **raised, erythematous, scaly margin** carrying papules/vesicles and **central clearing**.\n2. **Itching (pruritus)**.\n3. Lesion **extends concentrically**; multiple lesions may coalesce.\n4. Chronic and recurrent; **may heal with scarring/pigmentation**.\n5. Sites: trunk, limbs, face; in Bangladesh/South Asia extensive or recurrent tinea is increasingly due to terbinafine-resistant *T. indotineae*.\n\n**Aetiology:** *T. rubrum*, *T. mentagrophytes*, *T. tonsurans*, *E. floccosum*, *M. canis* (children, pet contact).\n\n**Laboratory diagnosis:** as in **Q148** — skin scrapings from the active margin → 10% KOH (septate hyphae with arthrospores) → SDA culture at 25–30°C for 3–4 weeks → macro/microconidia on LPCB."}, {"id": 151, "n": 151, "t": "Which fungi are called Dermatophytes and why are they so called? / What are dermatophytes?", "st": 6, "src": "Board 2 Set 07, 09, 10, 12, 17, 20", "du": [], "nmc": [], "vv": ["Board 2 Set 07", "Board 2 Set 09", "Board 2 Set 10", "Board 2 Set 12", "Board 2 Set 17", "Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Dermatophytes** are a group of **closely related keratinophilic (keratin-loving) filamentous fungi** that infect the **superficial keratinised tissues — skin, hair and nails** — of humans and animals, causing **dermatophytosis (ringworm/tinea)**.\n\n**Why so called:** *dermato-* = skin, *-phyte* = plant (old term for fungus) — literally \"skin fungi\", because they infect the skin and its appendages.\n\n**Genera (3):** *Trichophyton*, *Microsporum*, *Epidermophyton*.\n\n**Important features**\n1. **Keratinophilic** — digest keratin for nutrition; infect only the dead superficial keratinised layers, **not deeper tissue**.\n2. Exist as **moulds**, not dimorphic; **cannot grow at 37°C** or in serum → **no systemic disease**.\n3. Reservoirs: humans (anthropophilic), animals (zoophilic), soil (geophilic).\n4. Transmission: direct contact (human-to-human, animal-to-human), **fomites** (towels, combs, shower stalls), soil.\n5. Diagnosed by **KOH mount + SDA culture**."}, {"id": 152, "n": 152, "t": "Mention the sites of infection of dermatophytes.", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Genus | Skin | Hair | Nail |\n|---|---|---|---|\n| ***Trichophyton*** | ✔ | ✔ | ✔ |\n| ***Microsporum*** | ✔ | ✔ | ✘ |\n| ***Epidermophyton*** | ✔ | ✘ | ✔ |\n\n**Memory aid:** *Epidermophyton* has **no hair**; *Microsporum* has **no nails**; *Trichophyton* attacks **all three**."}, {"id": 153, "n": 153, "t": "Name fungi infecting cutaneous and subcutaneous tissues.", "st": 0, "src": "Board 2 Set 14", "du": [], "nmc": [], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Fungi infecting cutaneous tissue (skin, hair, nails)**\n- Dermatophytes — *Trichophyton*, *Microsporum*, *Epidermophyton*.\n- *Candida* species — cutaneous candidiasis (moist folds, nails).\n- *Malassezia furfur* — pityriasis versicolor (superficial).\n\n**Fungi infecting subcutaneous tissue**\n- *Sporothrix schenckii* — sporotrichosis.\n- *Madurella mycetomatis*, *Scedosporium (Pseudallescheria) boydii* — eumycetoma (+ *Nocardia*, *Actinomadura* — actinomycetoma).\n- *Fonsecaea*, *Phialophora* — chromoblastomycosis.\n- *Exophiala*, *Bipolaris* — phaeohyphomycosis.\n- *Rhinosporidium seeberi* — rhinosporidiosis."}, {"id": 154, "n": 154, "t": "Which specimens will you collect for lab diagnosis of dermatophyte infections?", "st": 2, "src": "Board 2 Set 10, 17", "du": [], "nmc": [], "vv": ["Board 2 Set 10", "Board 2 Set 17"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Site of infection | Specimen | How collected |\n|---|---|---|\n| **Skin** (tinea corporis, cruris, pedis) | **Skin scrapings / scales** | From the **active edge** of the lesion; decontaminate with 70% alcohol; blunt scalpel edge into a sterile Petri dish; adhesive tape if scaling is minimal |\n| **Scalp / hair** (tinea capitis, barbae) | **Plucked hairs with root, scalp scales, stubs** | Choose lustreless/broken hairs; pluck with forceps; use Wood's lamp |\n| **Nail** (onychomycosis) | **Nail clippings + subungual debris** | From deeper discoloured part; no antifungal for ≥ 1 week |"}, {"id": 155, "n": 155, "t": "What is athlete's foot?", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Athlete's foot (tinea pedis)** — a chronic dermatophyte infection of the **interdigital spaces (toe webs)** of the foot; the **commonest dermatophytosis**, seen in people wearing **occlusive shoes** and using communal showers.\n\n- **Agents:** *Trichophyton rubrum*, *T. mentagrophytes*, *Epidermophyton floccosum*.\n- **Clinical features:** itching between the toes → small vesicles rupture and discharge thin fluid → macerated, white, **fissured toe-web skin** that is a portal for **secondary bacterial infection**; chronic cases show peeling, cracking, pain and pruritus. Variants: interdigital, **vesicular**, **ulcerative**, **moccasin type** (scaly hyperkeratotic sole).\n- **Complications:** secondary bacterial cellulitis; **dermatophytid reaction** on fingers; spread to nails.\n- **Diagnosis:** KOH mount (septate hyphae) + SDA culture (as Q148).\n- **Treatment:** keep feet dry; topical terbinafine/azole/tolnaftate; oral terbinafine or griseofulvin/itraconazole for resistant cases."}]}, {"id": "mycology-4", "title": "Dermatophytes — Case-based Questions", "qs": [{"id": 156, "n": 156, "t": "*Vignette: a 25-year-old man with itchy, ring-shaped lesions, raised erythematous margins and central clearing on the trunk for 2–3 months.* Diagnosis, causative organisms and laboratory diagnosis.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tinea corporis (ringworm of the body)** — itchy, annular lesions with raised erythematous scaly margin and central clearing, on the trunk, chronic.\n- **Causative organisms:** *Trichophyton rubrum* (commonest), *T. mentagrophytes*, *T. tonsurans*, *Epidermophyton floccosum*, *Microsporum canis* (all dermatophytes).\n- **Laboratory diagnosis:**\n  1. **Specimen:** scales scraped from the **active margin** after cleaning with 70% alcohol.\n  2. **Direct microscopy:** **10% KOH** → **septate, branching hyphae with arthrospores**.\n  3. **Culture:** **SDA** (+ chloramphenicol ± cycloheximide) at **25–30°C for 3–4 weeks**.\n  4. **Identification:** colony morphology + lactophenol cotton-blue mount of macroconidia (*Trichophyton* cylindrical, *Microsporum* spindle, *Epidermophyton* club-shaped) and microconidia.\n\n*(Full details: Q148.)*"}, {"id": 157, "n": 157, "t": "*Vignette: an 18-year-old male student with an itchy, circular rash on the inner thigh for 10 days, raised scaly border and central clearing (tinea cruris).* Diagnosis, causative agents, specimen and microscopic findings.", "st": 0, "src": "DU-25M", "du": ["DU-25M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tinea cruris** (jock itch; ringworm of the groin).\n- **Causative agents:** ***Epidermophyton floccosum***, ***Trichophyton rubrum***, *T. mentagrophytes*.\n- **Specimen:** skin scrapings/scales from the **peripheral raised, scaly border** of the thigh lesion, collected after cleaning with 70% alcohol using a sterile blunt scalpel or glass slide.\n- **Microscopic findings:** in **10% KOH**, **long, branching, septate hyphae and chains of rectangular arthrospores (arthroconidia)**; no budding yeasts (which would suggest candidal intertrigo).\n- **Culture** (confirmatory): SDA, 25–30°C, 3–4 weeks."}, {"id": 158, "n": 158, "t": "*Vignette: a 25-year-old male with well-demarcated, ring-shaped, pruritic, scaly lesions with central healing and raised edges on trunk/limbs; skin scraping microscopy shows long, branching, septate hyphae with arthrospores.* Diagnosis, causative agent, and media/time/temperature/duration for culture.", "st": 2, "src": "DU-24M, 22N", "du": ["DU-24M", "DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tinea corporis** (ringworm). The microscopy (long, branching, septate hyphae with arthrospores) confirms a dermatophyte.\n- **Causative agent:** dermatophytes — *Trichophyton* (commonest, *T. rubrum*), *Epidermophyton*, *Microsporum*.\n- **Culture:**\n\n| Item | Answer |\n|---|---|\n| Medium | **Sabouraud's dextrose agar** (± chloramphenicol, cycloheximide) |\n| Temperature | **25–30°C** (room temperature) |\n| Time / duration | **3–4 weeks**; inspect every 3–4 days |"}, {"id": 159, "n": 159, "t": "*Vignette: a 6-year-old boy with circular, dry, scaly, pruritic leg lesions; KOH preparation shows branching, septate hyphae.* Diagnosis, causative agent, two antifungals.", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tinea corporis** (ringworm of the body/leg) — circular, dry, scaly, pruritic lesion; KOH shows branching septate hyphae.\n- **Causative agent:** dermatophyte — *Trichophyton rubrum* / *T. mentagrophytes* (also *Microsporum canis* in children with pets).\n- **Two antifungals:**\n  1. **Topical:** clotrimazole / miconazole / terbinafine cream.\n  2. **Oral** (extensive disease): terbinafine or griseofulvin, itraconazole.\n\n> *South Asian note:* if lesions fail to respond to terbinafine, suspect terbinafine-resistant *T. indotineae*; itraconazole is the usual alternative, and steroid-containing combination creams should be stopped."}, {"id": 160, "n": 160, "t": "*Vignette: a 10-year-old boy with itching rash on the abdomen — red, circular lesions with a healing central area (tinea corporis).* Genus of dermatophytes causing this, and media for culture.", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tinea corporis** in a child (ring-shaped red lesions with healing centre).\n- **Genus of dermatophytes:** ***Trichophyton*** (most commonly *T. rubrum, T. mentagrophytes*); the other two genera, *Microsporum* (*M. canis* from pet cats/dogs) and *Epidermophyton*, can also cause it.\n- **Culture medium:** **Sabouraud's dextrose agar** (with chloramphenicol ± cycloheximide), 25–30°C, 3–4 weeks."}, {"id": 161, "n": 161, "t": "*Vignette: a 30-year-old lady with round, well-circumscribed, scaly, itchy skin lesions on the body and hand.* Fungal agent, sample collection/processing, and two tests with interpretation.", "st": 0, "src": "DU-18M", "du": ["DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Fungal agent:** a **dermatophyte** — *Trichophyton rubrum* (commonest), *T. mentagrophytes*; the picture is **tinea corporis with tinea manuum** (hand).\n- **Sample collection:** clean with 70% alcohol; scrape scales from the **active, erythematous peripheral margin** with a sterile blunt scalpel into a sterile Petri dish/paper packet (adhesive tape if scaling is minimal).\n- **Processing:** a portion mounted in **10% KOH** for microscopy; the rest inoculated on **SDA** (+ antibiotics) and incubated at 25–30°C for 3–4 weeks.\n- **Two tests with interpretation**\n  1. **KOH mount:** *septate, branching hyphae with arthrospores* → dermatophyte infection (a positive KOH supports but does not identify the species; a negative KOH does not exclude).\n  2. **Culture on SDA:** growth of a filamentous colony; **lactophenol cotton-blue** mount showing **macroconidia and microconidia** identifies genus/species (e.g., *T. rubrum* — red reverse, tear-drop microconidia)."}]}, {"id": "mycology-5", "title": "Mycetoma (Madura Foot)", "qs": [{"id": 162, "n": 162, "t": "How will you diagnose mycetoma / Madura foot in the laboratory?", "st": 4, "src": "NMC 4; DU-24N, 20Nov/July, 19Nov", "du": ["DU-24N", "DU-20Nov/July", "DU-19Nov"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mycetoma (Madura foot, maduromycosis)** is a **chronic, painless, progressive granulomatous infection of the skin, subcutaneous tissue, fascia and bone** following **traumatic implantation of soil organisms** (usually through the barefoot or a thorn prick). Clinical triad: **swelling + multiple discharging sinuses + grains in the discharge.** Mycetoma is caused by **fungi (eumycetoma)** or **filamentous bacteria — actinomycetes (actinomycetoma)**, and is a WHO-recognised **neglected tropical disease**.\n\n**Laboratory diagnosis**\n\n1. **Specimen:** **pus/discharge from sinuses containing grains**; for better yield, a **deep surgical biopsy** (including grains) — superficial swabs are unreliable.\n2. **Naked-eye examination of the grains** (wash in saline) — **colour, size, consistency** give a presumptive diagnosis:\n\n| Grain colour | Probable agent |\n|---|---|\n| **Black** | *Madurella mycetomatis*, *M. grisea* (eumycetoma) |\n| White / pale yellow | *Scedosporium (Pseudallescheria) boydii* (fungus); *Nocardia*, *Actinomadura madurae* (bacteria) |\n| Yellow | *Streptomyces somaliensis* |\n| **Red / pink** | *Actinomadura pelletieri* |\n\n3. **Direct microscopy:** crush a grain in a drop of **10% KOH**:\n   - **Fungal grain:** **broad, septate hyphae** (2–5 µm) with swollen peripheral cells.\n   - **Actinomycete grain:** very **thin (≤ 1 µm) branching filaments**; Gram-positive; **modified (weak) acid-fast stain** (1% H₂SO₄) positive for *Nocardia*.\n4. **Culture:** *fungi* — **SDA** (without cycloheximide), 25–37°C, up to 4 weeks; *actinomycetes* — blood agar/BHI/Löwenstein–Jensen, 37°C, 1–4 weeks.\n5. **Histopathology:** H&E — grains surrounded by neutrophils within granulomas (**Splendore–Hoeppli phenomenon**); PAS/GMS for fungi.\n6. **Molecular** (PCR/sequencing) for species identification where available.\n7. **Imaging:** X-ray (bone destruction), ultrasound, **MRI (\"dot-in-circle sign\")** to assess extent.\n\n**Why it matters:** treatment differs — **eumycetoma:** surgical debridement + antifungal (itraconazole); **actinomycetoma:** prolonged antibiotics (co-trimoxazole ± amikacin).\n\n**Viva corner**\n- *Mycetoma triad?* — Swelling, sinuses, grains.\n- *Mode of infection?* — Traumatic implantation of soil organisms.\n- *Does routine bacterial culture grow it?* — No (hence the vignette \"no growth on routine culture\")."}, {"id": 163, "n": 163, "t": "Enumerate the causes/organisms of mycetoma.", "st": 4, "src": "DU-24N, 20Nov/July, 19Nov; Board 2 Set 08", "du": ["DU-24N", "DU-20Nov/July", "DU-19Nov"], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Causes / organisms of mycetoma**\n\n| Type | Organism | Grain |\n|---|---|---|\n| **Eumycetoma (fungal)** | ***Madurella mycetomatis*** (commonest) | Black |\n| | *Madurella grisea* | Black |\n| | ***Scedosporium (Pseudallescheria) boydii*** | White |\n| | *Falciformispora (Leptosphaeria) senegalensis*, *Trematosphaeria grisea* | Black |\n| **Actinomycetoma (bacterial)** | ***Nocardia brasiliensis***, *N. asteroides* | White-yellow |\n| | ***Actinomadura madurae*** | White-yellow |\n| | *Actinomadura pelletieri* | Red |\n| | *Streptomyces somaliensis* | Yellow |\n| | *Actinomyces israelii* (appears in the local exam key; strictly the agent of actinomycosis) | — |\n\n> **Key principle:** fungal vs bacterial cause cannot be told clinically — hence the need for laboratory identification."}, {"id": 164, "n": 164, "t": "*Vignette: a 40-year-old farmer with a foot lesion with multiple discharging sinuses for months, discharging granular pus (or with no bacterial growth on routine culture).* Diagnosis, sample processing/collection, and tests for diagnosis.", "st": 2, "src": "DU-20Nov/July, 19Nov", "du": ["DU-20Nov/July", "DU-19Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Mycetoma (Madura foot)** — chronic foot swelling, multiple sinuses discharging **granular pus**, **no growth on routine bacterial culture** (the organisms need special media), in a farmer (soil exposure, barefoot). Mode of infection: through wounds contaminated by soil.\n- **Causative organisms:** fungi (eumycetoma) — *Madurella mycetomatis, M. grisea, Scedosporium boydii*; or actinomycetes (actinomycetoma) — *Nocardia, Actinomadura, Streptomyces*.\n- **Sample collection:** discharge/pus from the sinuses with **grains** collected in a sterile container (grains are visible to the naked eye); a **deep biopsy** is superior.\n- **Processing:** wash the grains in sterile saline; note **colour, size and consistency**; crush in KOH and examine microscopically; Gram stain and modified acid-fast stain; inoculate SDA (fungi) and blood agar/BHI (bacteria); fix part for histopathology.\n- **Tests:** (1) microscopy of crushed grain — fungal: **septate hyphae**, bacterial: **fine filamentous bacteria**; (2) culture; (3) histopathology; (4) imaging for bone involvement.\n\n*(Details: Q162.)*"}]}, {"id": "mycology-6", "title": "Systemic & Dimorphic Mycoses", "qs": [{"id": 165, "n": 165, "t": "What are the deep mycoses and what are their causes?", "st": 2, "src": "Board 2 Set 10, 12", "du": [], "nmc": [], "vv": ["Board 2 Set 10", "Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Deep mycoses** are fungal infections that involve **subcutaneous tissue and internal organs** (as opposed to the epidermis). They comprise subcutaneous, systemic (endemic) and opportunistic mycoses.\n\n| Group | Causative fungi | Disease | Portal |\n|---|---|---|---|\n| **Subcutaneous** | *Sporothrix schenckii* | Sporotrichosis | Thorn prick / trauma |\n| | *Madurella*, *Scedosporium* | Mycetoma | Trauma |\n| | *Fonsecaea*, *Phialophora* | Chromoblastomycosis | Trauma |\n| | *Rhinosporidium seeberi* | Rhinosporidiosis | Nasal mucosa (bathing in contaminated water) |\n| **Systemic (endemic, dimorphic)** | *Histoplasma capsulatum* | Histoplasmosis | **Inhalation** |\n| | *Coccidioides immitis* | Coccidioidomycosis | Inhalation |\n| | *Blastomyces dermatitidis* | Blastomycosis | Inhalation |\n| | *Paracoccidioides brasiliensis* | Paracoccidioidomycosis | Inhalation |\n| **Opportunistic** | *Candida*, *Cryptococcus*, *Aspergillus*, *Mucor*, *Pneumocystis* | Various | Endogenous / inhalation |"}, {"id": 166, "n": 166, "t": "Name systemic fungi. How are they transmitted?", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Systemic fungi:** *Histoplasma capsulatum*, *Coccidioides immitis (posadasii)*, *Blastomyces dermatitidis*, *Paracoccidioides brasiliensis*.\n\n**Common properties**\n1. **Dimorphic** — mould in soil (25°C), yeast (or spherule) in tissue (37°C).\n2. Live in **soil** in endemic geographical areas.\n3. Cause primary **lung infection**, mostly asymptomatic and self-limiting; dissemination in some (especially with ↓ cell-mediated immunity).\n4. **Not transmitted from person to person.**\n\n**Transmission:** **inhalation of airborne spores** (conidia/arthrospores) from contaminated soil — for example, soil enriched with bird droppings or bat guano (*Histoplasma*), arid soils (*Coccidioides* — arthrospores), moist soil (*Blastomyces*). Portal of entry: **lungs**."}, {"id": 167, "n": 167, "t": "What are the clinical features of histoplasmosis?", "st": 0, "src": "Board 2 Set 10", "du": [], "nmc": [], "vv": ["Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Histoplasmosis** (*Histoplasma capsulatum*, dimorphic; acquired by inhaling microconidia from soil contaminated with bird or bat droppings).\n\n**Pathogenesis in brief:** inhaled spores → alveolar macrophages → convert to **yeasts** and multiply **inside macrophages** → spread via the reticuloendothelial system (liver, spleen, bone marrow, lymph nodes) → granulomas.\n\n**Clinical features**\n1. **Asymptomatic** — most cases; heals with calcified lung foci.\n2. **Acute pulmonary histoplasmosis** — fever, cough, chest pain; resembles bacterial/atypical pneumonia; after heavy exposure (caves, chicken houses).\n3. **Chronic pulmonary histoplasmosis** — upper-lobe cavitary disease, **resembles pulmonary tuberculosis**.\n4. **Disseminated (progressive) histoplasmosis** — in AIDS/immunosuppressed: fever, weight loss, **hepatosplenomegaly, lymphadenopathy, pancytopenia**, **oral ulcers / mucocutaneous lesions**, adrenal involvement.\n5. Complications: mediastinal fibrosis; histoplasmoma.\n\n**Diagnosis (brief):** yeasts inside macrophages (Giemsa/PAS/GMS) on smear or biopsy; SDA at 25°C (hyphae with **tuberculate macroconidia**) and 37°C (yeast); antigen (urine/serum); CFT; histoplasmin skin test. **Treatment:** itraconazole (mild/chronic); **amphotericin B** (severe/disseminated).\n\n**Viva:** *Is it capsulated?* — No; \"capsulatum\" because the yeast sits in a clear halo within macrophages."}]}, {"id": "mycology-7", "title": "Candida albicans", "qs": [{"id": 168, "n": 168, "t": "*Vignette: a febrile patient with a central venous catheter (or an immunosuppressed transplant patient) — blood/sputum microscopy shows budding yeast cells with pseudohyphae.* Identify the most common causative species, the confirmatory test, predisposing factors and diseases it produces.", "st": 2, "src": "NMC 4; DU-24N", "du": ["DU-24N"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Probable diagnosis:** **Invasive candidiasis (candidaemia)** — a febrile patient with a central venous catheter or immunosuppression; blood/sputum shows **budding yeast cells with pseudohyphae**.\n- **Most common causative species:** ***Candida albicans***. *(In ICU/catheter-associated candidaemia in South Asia, non-albicans species — **C. tropicalis, C. parapsilosis, C. glabrata and the multidrug-resistant C. auris** — are also very common, so species identification matters.)*\n- **Confirmatory test:** **Germ-tube test** — a small portion of colony is incubated in **human serum at 37°C for 2–3 hours**: *C. albicans* produces **tube-like outgrowths (germ tubes)** without constriction. Supported by **chlamydospore for
