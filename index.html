. falciparum*,** because it\n  1. invades red cells of **all ages** → very high parasitaemia;\n  2. causes **cytoadherence and sequestration** (PfEMP-1 knobs) → capillary blockage → cerebral malaria, algid malaria, blackwater fever;\n  3. shows **antigenic variation** and **drug resistance**;\n  4. runs a rapid, fatal course in non-immune persons."}, {"id": 270, "n": 270, "t": "What are the complications of malaria?", "st": 0, "src": "Board 2 Set 14", "du": [], "nmc": [], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| System | Complication |\n|---|---|\n| Brain | Cerebral malaria (coma, convulsions), neurological sequelae |\n| Blood | Severe anaemia, thrombocytopenia, DIC/spontaneous bleeding, hyperparasitaemia |\n| Kidney | Acute renal failure (ATN), **blackwater fever** |\n| Lung | Pulmonary oedema/ARDS |\n| Metabolic | Hypoglycaemia, **lactic acidosis**, hyperpyrexia |\n| Circulation | **Algid malaria** (shock) |\n| Liver | Jaundice, hepatic dysfunction |\n| Spleen | Rupture; **hyper-reactive malarial splenomegaly** |\n| Pregnancy | Abortion, stillbirth, low birth weight, congenital malaria |\n| Immunological | Nephrotic syndrome (quartan malaria, *P. malariae*) |\n\n*Most life-threatening complications are due to* ***P. falciparum***."}]}, {"id": "parasitology-11", "title": "Nematodes — General", "qs": [{"id": 271, "n": 271, "t": "Classify female nematodes according to their mode of reproduction.", "st": 6, "src": "NMC 1; NMC 3; NMC 4; Board 2 Set 06, 07, 14", "du": [], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": ["Board 2 Set 06", "Board 2 Set 07", "Board 2 Set 14"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\nFemale nematodes are classified by how they reproduce and what stage is released:\n\n| Type | Definition | Examples |\n|---|---|---|\n| **Oviparous** | Lay **eggs** | |\n| a) Unsegmented ovum | Egg passed as a single cell | *Ascaris lumbricoides*, *Trichuris trichiura* |\n| b) Segmented ovum | Egg passed at 4–8-cell stage | Hookworms (*A. duodenale*, *N. americanus*) |\n| c) Embryonated egg | Egg contains a fully formed larva | *Enterobius vermicularis* |\n| **Ovo-viviparous** | Eggs hatch inside host tissue/gut; **larvae** are passed | *Strongyloides stercoralis* |\n| **Viviparous** | Female discharges **larvae** (no eggs) | Filarial worms (*Wuchereria*, *Brugia*, *Loa*, *Onchocerca*), *Trichinella spiralis*, *Dracunculus medinensis* |\n\n**Viva points**\n- Diagnostic stage: eggs (oviparous); rhabditiform larvae (*Strongyloides*); microfilariae (filaria)."}, {"id": 272, "n": 272, "t": "Classify nematodes depending on their mode of infection.", "st": 0, "src": "DU-22M", "du": ["DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Mode of infection | Infective stage | Examples |\n|---|---|---|\n| **Ingestion** of embryonated eggs (food, water, fingers) | Egg with larva | *A. lumbricoides*, *T. trichiura*, *E. vermicularis* |\n| **Ingestion of larvae** in an intermediate host | Larva | *D. medinensis* (infected *Cyclops*), *Trichinella* (encysted larvae in pork) |\n| **Skin penetration** | Filariform larva | Hookworms, *S. stercoralis* |\n| **Bite of blood-sucking insects** | L3 larva | Filarial worms (mosquito, blackfly, deerfly) |\n| **Inhalation** of egg-laden dust | Embryonated egg | *E. vermicularis*, *A. lumbricoides* |\n| **Autoinfection** | Egg/larva | *E. vermicularis*, *S. stercoralis* |"}, {"id": 273, "n": 273, "t": "List the tissue nematodes, with their habitat.", "st": 2, "src": "DU-24N; Board 2 Set 11", "du": ["DU-24N"], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Habitat | Tissue nematodes |\n|---|---|\n| Lymphatic system | *Wuchereria bancrofti*, *Brugia malayi*, *B. timori* |\n| Subcutaneous tissue | *Loa loa*, *Onchocerca volvulus*, *Dracunculus medinensis*, *Mansonella streptocerca* |\n| Conjunctiva/eye | *Loa loa* |\n| Mesentery/body cavity | *Mansonella perstans*, *M. ozzardi* |\n| Skeletal muscle (larvae) | *Trichinella spiralis* |\n| Larva migrans (wandering larvae) | *Toxocara canis/cati* (visceral), *Ancylostoma braziliense* (cutaneous) |\n\nIn Bangladesh only ***W. bancrofti*** is of importance among tissue nematodes."}, {"id": 274, "n": 274, "t": "Enumerate the intestinal nematodes according to their habitat. — Also asked: define nematode and classify by site of infection/habitat (including somatic nematodes).", "st": 5, "src": "DU-25N, 25M; Board 2 Set 04, 08, 19", "du": ["DU-25N", "DU-25M"], "nmc": [], "vv": ["Board 2 Set 04", "Board 2 Set 08", "Board 2 Set 19"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Nematodes (roundworms)** (Gk. *nema* = thread) are elongated, cylindrical, unsegmented worms with a resistant cuticle, a pseudocoelom, a complete alimentary canal and **separate sexes**.\n\n**Classification by habitat of the adult worm**\n\n| **Intestinal** | **Somatic (tissue)** |\n|---|---|\n| *Small intestine:* *Ascaris lumbricoides*, *A. duodenale*, *N. americanus*, *Strongyloides stercoralis*, *Trichinella spiralis* (adult), *Capillaria philippinensis* | Lymphatics: *W. bancrofti*, *B. malayi* |\n| *Caecum and appendix:* *Enterobius vermicularis*, *Trichuris trichiura* | Subcutaneous: *Loa loa*, *Onchocerca volvulus*, *Dracunculus medinensis* |\n| | Muscle: *Trichinella* larvae |\n| | Mesentery/others: *Mansonella* spp. |"}, {"id": 275, "n": 275, "t": "Name/list the intestinal nematodes endemic/common in Bangladesh, with their infective forms and mode of transmission.", "st": 3, "src": "DU-22N, 19Nov, 18Nov", "du": ["DU-22N", "DU-19Nov", "DU-18Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Nematode | Habitat | Infective form | Mode of transmission | Diagnostic stage |\n|---|---|---|---|---|\n| ***Ascaris lumbricoides*** | Small intestine | Embryonated egg | Ingestion (contaminated food, water, soil, fingers) | Egg in stool |\n| ***Trichuris trichiura*** | Caecum, appendix | Embryonated egg | Faeco-oral ingestion | Egg in stool |\n| ***Ancylostoma duodenale*** (and *N. americanus*) | Jejunum | **Filariform larva** | **Skin penetration** (barefoot on contaminated soil) | Egg in stool |\n| ***Enterobius vermicularis*** | Caecum, appendix | Embryonated egg | Ingestion, inhalation, autoinfection, retroinfection | Egg on perianal skin |\n| ***Strongyloides stercoralis*** | Small intestine | **Filariform larva** | Skin penetration; autoinfection | Rhabditiform larva in stool |"}, {"id": 276, "n": 276, "t": "Describe the pathogenic effects caused by *Trichuris trichiura*.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n*T. trichiura* (whipworm) lives in the caecum and colon, its slender anterior end threaded into the mucosa.\n\n- **Light infection:** asymptomatic.\n- **Mechanical injury:** mucosal trauma, local inflammation, oedema, microscopic bleeding.\n- **Heavy infection (children):** **Trichuris dysentery syndrome** — chronic bloody-mucoid diarrhoea, abdominal pain, tenesmus.\n- **Rectal prolapse** (tenesmus and straining in heavily infected children).\n- **Anaemia** (chronic blood loss), **malnutrition, growth retardation**, finger clubbing, impaired cognition.\n- Worms in the appendix may cause **appendicitis-like** symptoms; mild eosinophilia.\n\n*Diagnosis:* barrel-shaped eggs with polar plugs in stool. *Treatment:* albendazole/mebendazole."}, {"id": 277, "n": 277, "t": "Discuss the hygiene hypothesis.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Statement.** The hygiene hypothesis proposes that **reduced exposure to microbes and helminths in early life** (improved sanitation, smaller families) leads to **defective maturation of immune regulation** and a rise in **allergic and autoimmune diseases**.\n\n**Origin:** David **Strachan** (1989) noted that hay fever was less common in children with many older siblings.\n\n**Extension:** the **\"old friends\" hypothesis** (Rook) — organisms that co-evolved with man (helminths, commensal microbes) are needed for normal immunoregulation; their loss, not personal cleanliness, is the key.\n\n**Immunological basis**\n\n1. Helminths induce Th2 responses and an **immunoregulatory network**: Treg, regulatory B cells, alternatively-activated macrophages, **IL-10 and TGF-β**.\n2. This network suppresses **both** allergic (Th2/IgE) and Th1/Th17-driven autoimmune inflammation.\n3. Its absence leaves the immune system poorly \"calibrated\" → atopy, asthma, IBD, multiple sclerosis, type 1 diabetes.\n\n**Evidence:** lower asthma/atopy in farm children and large families; lower skin-test reactivity in helminth-infected children; animal models; helminth-therapy trials (*Trichuris suis* ova) with mixed results.\n**Criticisms:** the name is misleading (handwashing is not harmful); association ≠ causation; trials inconclusive.\n**Relevance:** as soil-transmitted helminths decline in Bangladesh, rising allergic/immune-mediated disease is plausible. **Deliberate infection is not recommended** — helminths cause anaemia and growth retardation."}, {"id": 278, "n": 278, "t": "Which nematodes have heart-lung migration in their life cycle? What is its clinical significance?", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Nematodes with heart–lung migration:** ***Ascaris lumbricoides*, hookworms (*A. duodenale*, *N. americanus*) and *Strongyloides stercoralis*** (also *Toxocara*).\n\n**Route:** larvae penetrate gut mucosa (or skin in hookworm/*Strongyloides*) → blood → **right heart → pulmonary capillaries → alveoli → bronchi → trachea → pharynx → swallowed → small intestine** → adult.\n\n**Clinical significance**\n\n1. **Löffler's syndrome** — transient eosinophilic pneumonitis.\n2. **Eosinophilia** in the early phase.\n3. Larvae may be found in **sputum or gastric aspirate**; stool eggs absent at this stage (prepatent period).\n4. Secondary bacterial bronchitis/pneumonia; asthma-like attacks.\n5. In *Strongyloides* hyperinfection, massive pulmonary larval load → respiratory failure."}, {"id": 279, "n": 279, "t": "What do you know about Loeffler's syndrome?", "st": 0, "src": "Board 2 Set 17", "du": [], "nmc": [], "vv": ["Board 2 Set 17"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Löffler's syndrome** (Löffler, 1932) is a **transient pulmonary eosinophilic infiltrate** (simple pulmonary eosinophilia) with peripheral blood eosinophilia.\n\n- **Causes:** larval migration of ***Ascaris lumbricoides*** (commonest), hookworms, *Strongyloides*; also drugs (nitrofurantoin, sulfonamides).\n- **Pathogenesis:** IgE-mediated hypersensitivity to larval antigens in the alveoli, 1–2 weeks after egg ingestion.\n- **Clinical:** dry cough, wheeze, dyspnoea, fever, urticaria, occasional blood-stained sputum.\n- **Investigations:** chest X-ray — transient migratory patchy opacities; **eosinophilia (5–20 %)**; larvae in sputum/gastric washing; stool eggs absent.\n- **Course:** self-limiting in 1–3 weeks; supportive care (steroids if severe); anthelmintic later."}, {"id": 280, "n": 280, "t": "Which one is the commonest nematode infection in our country? State the clinical problems caused by it.", "st": 0, "src": "Board 2 Set 03", "du": [], "nmc": [], "vv": ["Board 2 Set 03"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nThe commonest nematode infection in Bangladesh is **ascariasis (*Ascaris lumbricoides*)**.\n\n**Clinical problems**\n\n- **Pulmonary:** Löffler's syndrome (larval migration).\n- **Intestinal:** abdominal pain, malnutrition, vitamin A deficiency, growth retardation; **intestinal obstruction**, intussusception, volvulus, perforation.\n- **Hepatobiliary:** biliary colic, cholangitis, obstructive jaundice, liver abscess; **pancreatitis**.\n- **Appendicitis**, wandering worms, **suffocation** (worm in larynx/bronchus).\n- Allergic features (urticaria, oedema) from worm antigens.\n\n*(See Q285 for details.)*"}, {"id": 281, "n": 281, "t": "Enumerate the nematodes found in caecum & vermiform appendix.", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nNematodes found in the **caecum and vermiform appendix**: **(1) *Enterobius vermicularis* (pinworm)** and **(2) *Trichuris trichiura* (whipworm)**.\n\n*Both may produce appendicitis-like symptoms; wandering* Ascaris *may rarely enter the appendix.*"}, {"id": 282, "n": 282, "t": "Name some nematodes that cause lesions in the eye.", "st": 0, "src": "Board 2 Set 08", "du": [], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Nematode | Eye lesion |\n|---|---|\n| ***Loa loa*** (eye worm) | Adult worm crosses the **subconjunctival tissue**; periorbital (Calabar) swelling |\n| ***Onchocerca volvulus*** | **River blindness**: keratitis, iridocyclitis, chorioretinitis, optic atrophy |\n| ***Toxocara canis/cati*** | **Ocular larva migrans**: retinal granuloma (mimics retinoblastoma) |\n| *Trichinella spiralis* | Periorbital oedema, subconjunctival haemorrhage |\n| *Thelazia*, *Dirofilaria*, *Gnathostoma*, *Angiostrongylus* | Sporadic zoonotic ocular infection |\n\nIn Bangladesh ocular nematode disease is mainly due to ***Toxocara***."}]}, {"id": "parasitology-12", "title": "Ascaris lumbricoides & Hookworm", "qs": [{"id": 283, "n": 283, "t": "Name parasites that cause anaemia, with their mechanism (general nematode survey).", "st": 3, "src": "NMC 1; NMC 3; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Parasite | Type of anaemia | Mechanism |\n|---|---|---|\n| **Hookworm** (*A. duodenale*, *N. americanus*) | Microcytic hypochromic (iron deficiency); dimorphic if folate/B₁₂ also lacking | **Chronic intestinal blood loss** (worm sucks blood; anticoagulant keeps wound oozing) |\n| ***Trichuris trichiura*** (heavy) | Microcytic hypochromic | Chronic colonic bleeding |\n| ***Ascaris lumbricoides*** | Nutritional | Malnutrition; heavy infection impairs absorption |\n| ***Diphyllobothrium latum*** | Macrocytic (megaloblastic) | Vitamin B₁₂ deficiency |\n| ***Plasmodium*** | Normocytic normochromic | Haemolysis, hypersplenism, marrow suppression |\n| ***Leishmania donovani*** | Normocytic normochromic | Marrow suppression, hypersplenism, immune haemolysis |\n| *Giardia*, *Schistosoma*, *Trypanosoma* | Variable | Malabsorption; blood loss; haemolysis |"}, {"id": 284, "n": 284, "t": "Name the tissue nematodes responsible for infection of subcutaneous tissue.", "st": 2, "src": "NMC 1; NMC 3", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Nematode | Habitat / lesion | Vector / source |\n|---|---|---|\n| ***Loa loa*** | Adult worm in subcutaneous tissue; Calabar swellings | Deerfly (*Chrysops*) |\n| ***Onchocerca volvulus*** | Subcutaneous nodules (onchocercomas); skin and eye lesions | Blackfly (*Simulium*) |\n| ***Dracunculus medinensis*** | Gravid female in subcutaneous tissue; painful ulcer, usually leg | Infected *Cyclops* in drinking water |\n| *Mansonella streptocerca* | Skin | *Culicoides* |\n\n*None of these is endemic in Bangladesh.*"}, {"id": 285, "n": 285, "t": "Discuss the fertilised and unfertilised ovum of *A. lumbricoides*, with a diagram, and describe the pathogenic effects produced by *A. lumbricoides* (and *A./Ankylostoma duodenale*) in the human host.", "st": 8, "src": "NMC 4; DU-26M, 25N, 20Nov/July, 24N; Board 2 Set 05, 13, 20", "du": ["DU-26M", "DU-25N", "DU-20Nov/July", "DU-24N"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 05", "Board 2 Set 13", "Board 2 Set 20"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**A. Ova of *Ascaris lumbricoides***\n\n```\n FERTILISED (corticated)      FERTILISED (decorticated)     UNFERTILISED\n    ___________                    ___________               ______________\n  /~ ~ ~ ~ ~ ~ ~\\                /             \\            /~ ~ ~ ~ ~ ~ ~ ~ ~\\\n |~ /  o  \\  ~  |               | /   o   \\    |          |  ░ ▒ ░ ▒ ░ ▒ ░ ▒  |\n |~ \\ ovum /  ~ |               | \\  ovum /    |          |  (granular mass)  |\n  \\~ ~ ~ ~ ~ ~ ~/                \\_____________/           \\~ ~ ~ ~ ~ ~ ~ ~ ~/\n mammillated albuminous coat     no albuminous coat         thin shell, irregular coat\n 60-75 x 40-50 um                colourless                 88-94 x 39-44 um\n```\n*Fig. Eggs of* A. lumbricoides.\n\n| Feature | **Fertilised egg** | **Unfertilised egg** |\n|---|---|---|\n| Shape/size | Round-oval, 60–75 × 40–50 µm | Longer, narrower, elliptical, 88–94 × 39–44 µm |\n| Colour | **Golden-brown (bile-stained)** | Brownish |\n| Shell | **Thick**, three layers: outer **mammillated albuminous coat**, middle chitinous, inner lipoid membrane | **Thin shell**, irregular albuminous coat |\n| Contents | Large **unsegmented ovum** with **clear crescentic space at each pole** | Small mass of **refractile granules** |\n| Flotation in saturated salt | **Floats** | Does not float |\n| Infectivity | Infective after embryonation in soil (10–40 days) | **Not infective** |\n| Note | Decorticated eggs lack the coat (smooth, colourless) | |\n\n**B. Pathogenic effects of *A. lumbricoides***\n\n| Stage | Effect |\n|---|---|\n| **Larva (migrating)** | **Lungs:** Ascaris pneumonitis/**Löffler's syndrome**; larvae may reach brain, kidney, eye producing granulomas |\n| **Adult — spoliative/toxic** | Competes for protein and vitamins (**vitamin A deficiency**), antitryptic action → **malnutrition, growth retardation**; **allergic features** (urticaria, oedema, conjunctivitis) |\n| **Adult — mechanical** | **Intestinal obstruction** (bolus of worms), **intussusception**, **volvulus**, **perforation** |\n| **Adult — ectopic (wandering)** | **Biliary** (colic, cholangitis, obstructive jaundice), **liver abscess**, **pancreatitis**, **appendicitis**, **suffocation**; exit through mouth or nose |\n| **Eggs** | Granulomatous reaction if lodged in biliary canaliculi |\n\n**C. Pathogenic effects of *Ancylostoma duodenale***\n\n| Stage | Effect |\n|---|---|\n| **Larva (skin penetration)** | **Ground itch** (dew itch); creeping eruption (rare) |\n| **Larva (lung migration)** | Cough, bronchitis, Löffler's syndrome, eosinophilia |\n| **Adult (jejunum)** | **Chronic blood loss → microcytic hypochromic anaemia**; hypoalbuminaemia with oedema; protein-energy malnutrition; dyspepsia; growth/mental retardation; pica; high-output cardiac failure |\n| **Oral ingestion of larvae** | **Wakana disease** (nausea, vomiting, cough, dyspnoea) |\n\n**Viva points**\n- Infective form: *Ascaris* = embryonated egg; hookworm = filariform larva.\n- *A. duodenale* sucks ~0.2 mL blood/worm/day vs 0.03 mL for *N. americanus*."}, {"id": 286, "n": 286, "t": "Briefly discuss ectopic ascariasis.", "st": 0, "src": "DU-18M", "du": ["DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Definition.** Ectopic ascariasis is migration of adult *Ascaris* out of the small intestine into other sites, provoked by fever, anaesthesia, certain drugs or irritation.\n\n| Site | Consequence |\n|---|---|\n| **Common bile duct/gall bladder** | Biliary colic, cholangitis, **obstructive jaundice**, gallstones |\n| **Liver** | Liver abscess |\n| **Pancreatic duct** | **Acute pancreatitis** |\n| **Appendix** | Appendicitis |\n| **Larynx/trachea/bronchus** | **Suffocation/asphyxia**, aspiration pneumonia |\n| **Mouth/nose/Eustachian tube** | Worm vomited or expelled |\n| **Peritoneum** | Perforation → peritonitis |\n\n*Diagnosis:* ultrasonography (tubular worm in duct), ERCP, barium meal. *Treatment:* albendazole, antispasmodics, ERCP extraction/surgery when required."}, {"id": 287, "n": 287, "t": "Discuss the mechanism of anaemia caused by hookworm.", "st": 4, "src": "DU-25M, 19Nov, 18Nov; Board 2 Set 05", "du": ["DU-25M", "DU-19Nov", "DU-18Nov"], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\nHookworm anaemia is **microcytic hypochromic (iron deficiency)** and arises as follows:\n\n1. **Chronic intestinal blood loss** — the adult attaches to the **jejunal mucosa** by buccal teeth/cutting plates and sucks blood; it changes attachment sites often, leaving **bleeding ulcers**; an **anticoagulant** keeps the wounds oozing. *A. duodenale*: ~0.2 mL blood/worm/day; *N. americanus*: ~0.03 mL.\n2. **Iron depletion** → exhausted stores → defective haemoglobin synthesis.\n3. **Protein loss** into the gut → **hypoalbuminaemia** and oedema.\n4. **Nutritional deficiency** of iron, protein, folate, B₁₂ may produce **dimorphic anaemia**.\n5. Severity is proportional to worm burden; greater in children, pregnant women and the malnourished.\n\n*Consequences:* pallor, weakness, oedema, palpitation, cardiac failure, growth and mental retardation."}, {"id": 288, "n": 288, "t": "Describe the life cycle of hookworm.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Infective form:** filariform (L3) larva. **Host:** man (only definitive host). **Habitat:** jejunum.\n\n```\n Eggs in faeces (4-8 cell stage) -> warm, moist, shaded soil\n        |  (24-48 h)\n Rhabditiform larva (L1, feeding) -> moult -> L2 -> moult\n        |  (5-10 days)\n FILARIFORM LARVA (L3, infective) -- penetrates skin of feet (barefoot)\n        |\n Subcutaneous tissue -> venules/lymphatics -> right heart -> lungs (moult to L4)\n        |\n Alveoli -> bronchi -> trachea -> pharynx -> swallowed\n        |\n Small intestine (jejunum): final moult -> adult -> eggs in faeces\n```\n\n- **Prepatent period:** ~5–7 weeks from skin penetration to eggs in stool.\n- Adult lifespan: *A. duodenale* ~1–2 years; *N. americanus* 3–5 years or more.\n- *A. duodenale* larvae may also infect **orally** or via arrested (\"hypobiotic\") larvae."}, {"id": 289, "n": 289, "t": "Explain larva currens and larva migrans.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | **Larva migrans (cutaneous, \"creeping eruption\")** | **Larva currens** |\n|---|---|---|\n| Cause | Animal hookworm larvae (*A. braziliense*, *A. caninum*) lost in man; also visceral type (*Toxocara*) | ***Strongyloides stercoralis*** autoinfective larvae |\n| Definition | Arrested larvae wander in skin/viscera of an abnormal host | \"Running larva\": rapidly migrating larvae in skin |\n| Lesion | Serpiginous erythematous track advancing a few mm–1 cm/day, intensely itchy | **Linear urticarial track advancing ~5–10 cm/hour**, appearing and fading rapidly |\n| Site | Feet, buttocks, legs | **Buttocks, perianal area, thighs, trunk** |\n| Duration | Weeks, self-limiting | Recurrent over years (autoinfection) |\n| Treatment | Ivermectin/albendazole | Ivermectin |\n\n**Visceral larva migrans:** *Toxocara canis/cati* larvae wander through liver, lung and eye (granulomas, hepatomegaly, eosinophilia)."}, {"id": 290, "n": 290, "t": "Trichuris:** Describe the egg of *Trichuris trichiura*.", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n```\n        _______________\n      /  ___________    \\\n plug|  |  unsegmented  |  |plug\n     |  |     ovum      |  |\n      \\  \\_____________/  /\n       \\_________________/\n   barrel-/lemon-shaped, 50 x 22 um\n```\n*Fig. Egg of* Trichuris trichiura.\n\n- **Shape and size:** barrel- (lemon-/football-) shaped, 50–54 × 22–23 µm.\n- **Colour:** brown, bile-stained.\n- **Shell:** thick, smooth, double-layered.\n- **Polar plugs:** a translucent, unstained mucoid **plug at each pole** — the key feature.\n- **Contents:** unsegmented ovum when passed; becomes infective (embryonated) after 2–4 weeks in warm moist soil.\n- Floats in saturated salt; diagnostic in stool."}, {"id": 291, "n": 291, "t": "Hookworm:** How will you diagnose a case of Hookworm infection? Mention its clinical findings.", "st": 0, "src": "Board 2 Set 02", "du": [], "nmc": [], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Diagnosis**\n\n1. **Clinical suspicion:** barefoot farmer, tea-garden worker or village child with anaemia, pica, oedema, eosinophilia.\n2. **Stool examination (fresh):**\n   - Direct saline wet mount and **concentration** (formol-ether or **saturated salt flotation**) → oval, colourless, thin-shelled eggs with **4–8-cell segmented ovum and clear space** (not bile-stained).\n   - **Kato–Katz** egg count for intensity; **stool culture** (Harada–Mori) to recover filariform larvae. *Examine fresh stool:* eggs hatch on standing and larvae may be confused with *Strongyloides*.\n3. **Occult blood test** — often positive; **blood:** low Hb, microcytic hypochromic film, eosinophilia, low serum iron/ferritin and albumin.\n4. Adult worms are recovered only after treatment.\n\n**Clinical findings:** ground itch; cough, wheeze (lungs); epigastric pain, dyspepsia; **pallor, fatigue, oedema of face and ankles, palpitation, pica**; growth/mental retardation in children; cardiac failure in severe disease.\n\n**Treatment:** albendazole or mebendazole, iron supplementation."}, {"id": 292, "n": 292, "t": "Name the diseases caused by adult *Ancylostoma duodenale*.", "st": 0, "src": "Board 2 Set 17", "du": [], "nmc": [], "vv": ["Board 2 Set 17"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nAdult *A. duodenale* causes **ancylostomiasis (hookworm disease)**, which includes:\n\n1. **Iron-deficiency (hookworm) anaemia** — microcytic hypochromic, sometimes dimorphic.\n2. **Hypoproteinaemia** with oedema.\n3. **Protein-energy malnutrition**, growth and mental retardation.\n4. Epigastric pain/dyspepsia and eosinophilia.\n5. High-output heart failure in chronic severe anaemia.\n\n*(Larvae cause ground itch and Löffler's syndrome.)*"}, {"id": 293, "n": 293, "t": "\"Accidental ingestion of hookworm ova during lab work will not lead to infection\" – explain.", "st": 0, "src": "Board 2 Set 09", "du": [], "nmc": [], "vv": ["Board 2 Set 09"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nThe **hookworm ovum is not infective**. Eggs passed in faeces contain an early (4–8-cell) embryo; they need 1–2 days in **warm, moist, shaded soil** to hatch into rhabditiform larvae, which moult twice (5–10 days) to become infective **filariform larvae**. Man is infected by **skin penetration by filariform larvae** (or oral ingestion of L3 in *A. duodenale*), not by eggs. Eggs swallowed during laboratory work cannot develop further and are destroyed or passed out; hence **no infection occurs** (unlike *Ascaris*, *Trichuris*, *Enterobius*, whose embryonated eggs are infective).\n\n*Caution:* cultured filariform larvae (Harada–Mori) *are* infective — handle with gloves."}, {"id": 294, "n": 294, "t": "How can you prevent hookworm infection?", "st": 0, "src": "Board 2 Set 20", "du": [], "nmc": [], "vv": ["Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n1. **Sanitary disposal of faeces** (sanitary latrines); avoid untreated night-soil as manure.\n2. **Wearing shoes/footwear and gloves** (farmers, miners, tea-garden workers, children).\n3. **Treatment of cases and mass chemotherapy** (periodic school-based albendazole/mebendazole deworming).\n4. **Health education:** personal hygiene, handwashing, avoiding barefoot soil contact.\n5. **Prevent anaemia:** iron–folate supplementation and nutrition.\n6. Environmental control, safe water and sanitation (WASH)."}]}, {"id": "parasitology-13", "title": "Strongyloides stercoralis", "qs": [{"id": 295, "n": 295, "t": "Strongyloides:** What are the peculiarities of the life cycle of *S. stercoralis*?", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*S. stercoralis* has an unusual **heterogonic life cycle** with these peculiarities:\n\n1. **Two cycles:** a **parasitic cycle** in man and a **free-living cycle** in soil.\n2. Only **parasitic females** live in the host (small-intestinal mucosa, parthenogenetic); no parasitic males.\n3. The female is **ovo-viviparous:** eggs hatch in the mucosa, so **rhabditiform larvae (not eggs)** are passed in stool.\n4. Infection by **filariform larvae penetrating the skin**, with **heart–lung migration**.\n5. **Autoinfection:** rhabditiform larvae become filariform in the gut and re-penetrate the mucosa or perianal skin (internal/external autoinfection) — infection can persist for decades.\n6. **Hyperinfection/dissemination** in immunosuppression (corticosteroids, HTLV-1, malignancy, AIDS, malnutrition).\n7. Marked **eosinophilia**; skin lesion **larva currens**."}, {"id": 296, "n": 296, "t": "\"*S. stercoralis* has both parasitic and free-living life cycle\" – explain.", "st": 0, "src": "Board 2 Set 08", "du": [], "nmc": [], "vv": ["Board 2 Set 08"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**A. Parasitic (direct) cycle in man**\n\n1. Filariform larvae penetrate the skin (bare feet) → blood → right heart → lungs.\n2. Lungs → bronchi → trachea → pharynx → swallowed → small intestine.\n3. Parasitic females embed in the mucosa and lay eggs that hatch there.\n4. Rhabditiform larvae pass in faeces; some turn filariform inside the gut → **autoinfection**.\n\n**B. Free-living (indirect, heterogonic) cycle in soil**\n\n1. Rhabditiform larvae in faeces moult in warm moist soil into **free-living adult males and females**.\n2. They mate; the female lays eggs → rhabditiform larvae.\n3. These either repeat the free-living cycle or become **filariform larvae** (direct/homogonic development).\n4. Filariform larvae penetrate the skin and start the parasitic cycle.\n\n```\n Rhabditiform larvae in faeces\n        |------------------------------> free-living adults -> eggs -> rhabditiform\n        |                                        |\n        v                                        v\n (direct) moult to filariform <------------------+\n        |\n skin penetration -> lungs -> intestine -> parasitic female -> eggs -> larvae\n```\n\n**Viva points**\n- Diagnostic stage = rhabditiform larva in stool (not egg); drug of choice = ivermectin."}]}, {"id": "parasitology-14", "title": "Filariasis & Tropical Pulmonary Eosinophilia", "qs": [{"id": 297, "n": 297, "t": "State/describe the lesions produced in classical filariasis, and describe the pathogenesis/mechanism of filariasis or elephantiasis. — Also asked: mode of transmission of *W. bancrofti*.", "st": 8, "src": "NMC 1; NMC 3; DU-24M, 22N, 22M, 18Nov; Board 2 Set 09, 10", "du": ["DU-24M", "DU-22N", "DU-22M", "DU-18Nov"], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 09", "Board 2 Set 10"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**A. Mode of transmission of *W. bancrofti***\n\n- Bite of an **infected female *Culex quinquefasciatus*** (principal vector in Bangladesh; *Aedes*, *Anopheles* elsewhere).\n- **Infective stage:** **third-stage (L3) larva**, which leaves the mosquito's proboscis and enters the skin through the bite wound.\n- Adult worms live in the **lymphatics** (inguino-scrotal and limb vessels); prepatent period 6–12 months; microfilariae are **sheathed and nocturnally periodic**.\n\n**B. Lesions in classical filariasis**\n\n| Phase | Lesions |\n|---|---|\n| **Acute (inflammatory)** | Adenolymphangitis (retrograde, limb), **filarial fever**, funiculitis, epididymo-orchitis |\n| **Chronic (obstructive)** | **Lymph varix**, **hydrocele**, **lymph scrotum**, **chyluria**, chylocele, chylous ascites, lymphoedema → **elephantiasis** (leg, scrotum, arm, breast, vulva) |\n| **Complication** | Secondary bacterial/fungal infection (acute dermatolymphangioadenitis, abscess) |\n\n**C. Pathogenesis**\n\n1. **Adult worms (living and dead) in lymphatics**, not circulating microfilariae, cause the pathology.\n2. Worm products (and symbiotic *Wolbachia*) provoke **lymphangitis**; dead worms cause granuloma, **obliterative endolymphangitis** and fibrosis.\n3. Lymphatic dilatation and valve dysfunction → **lymph stasis**.\n4. Protein-rich stagnant lymph + recurrent **secondary bacterial infection** → fibrosis, connective-tissue hyperplasia, thick skin → **non-pitting oedema** → **elephantiasis**.\n5. Host immune response (Th2, IgE, eosinophils) modifies expression.\n\n```\n Adult worm in lymphatics -> lymphangitis -> lymphatic obstruction/dilatation\n        -> lymph stasis -> oedema -> recurrent infection -> fibrosis -> ELEPHANTIASIS\n```\n\n*Elephantiasis follows repeated infection over years; a tourist infected once does not usually develop it.* **WHO validated Bangladesh (May 2023)** as having eliminated lymphatic filariasis as a public health problem (previously endemic in 19 north-western districts)."}, {"id": 298, "n": 298, "t": "Mention the differences between classical and occult filariasis.", "st": 7, "src": "DU-24M, 23N, 22N; Board 2 Set 03, 05, 13, 19", "du": ["DU-24M", "DU-23N", "DU-22N"], "nmc": [], "vv": ["Board 2 Set 03", "Board 2 Set 05", "Board 2 Set 13", "Board 2 Set 19"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | **Classical filariasis** | **Occult filariasis** |\n|---|---|---|\n| Cause | **Adult worms** (living/dead) | **Microfilariae** — hypersensitivity |\n| Basic lesion | Lymphangitis, granuloma, fibrosis | **Eosinophilic granuloma/abscess** |\n| Organs | Lymphatics, genitalia, limbs | **Lungs**, lymph nodes, liver, spleen |\n| Microfilariae in blood | **Present** (early) or absent in chronic stage | **Absent from blood** (destroyed in tissues by ADCC) |\n| Eosinophilia | Mild–moderate | **Marked** (> 3000/µL) |\n| Filarial antibody (IgE) | Moderate | **Very high** |\n| Clinical picture | Fever, lymphangitis, hydrocele, elephantiasis | **Tropical pulmonary eosinophilia**: nocturnal cough, wheeze, dyspnoea, low-grade fever |\n| Chest X-ray | Normal | Increased bronchovascular markings, diffuse mottling |\n| Diagnosis | Night blood film for microfilariae; antigen test | **Serology**, eosinophilia, response to DEC |\n| Response to DEC | Poor for established lesions | **Dramatic** |"}, {"id": 299, "n": 299, "t": "Write the laboratory diagnosis of filariasis. — Also asked: mode of transmission of filariasis.", "st": 5, "src": "NMC 4; DU-22M, 20Nov/July, 18Nov; Board 2 Set 04", "du": ["DU-22M", "DU-20Nov/July", "DU-18Nov"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 04"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Principle:** demonstration of **microfilariae** in night blood or other fluid; supported by antigen detection and imaging.\n**Specimens:** blood (collected **10 pm–2 am**), hydrocele fluid, chylous urine, lymph; biopsy.\n\n1. **Detection of microfilariae**\n   - Wet mount (live, motile) and **thick blood film** (Giemsa/Wright) — sheathed, tail-tip free of nuclei.\n   - **Concentration:** **Knott's method** (blood + 2 % formalin, centrifuge) or **membrane filtration**.\n   - **DEC provocation test** — blood 30–45 min after DEC 2 mg/kg to detect daytime microfilaraemia.\n2. **Adult-worm detection:** lymph-node biopsy; **ultrasound** (\"filarial dance sign\"); X-ray of calcified worm.\n3. **Immunological:** **antigen detection** (ICT card test, ELISA; any time of day); antibody detection (IgG4, IFAT, ELISA, CFT — limited value).\n4. **Molecular:** PCR/LAMP.\n5. **Others:** blood eosinophilia; urine for chyle (Sudan III, ether test).\n\n*Mode of transmission:* see Q297."}, {"id": 300, "n": 300, "t": "What is tropical pulmonary eosinophilia?", "st": 2, "src": "NMC 1; NMC 3", "du": [], "nmc": ["NMC 1", "NMC 3"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Definition.** Tropical pulmonary eosinophilia (TPE) is an **immunological hyper-responsiveness to microfilariae trapped in the lungs** (occult filariasis) in filariasis-endemic areas.\n\n- **Cause:** *W. bancrofti* or *B. malayi* microfilariae (hypersensitivity); commoner in young adult males.\n- **Clinical:** **paroxysmal nocturnal cough and wheeze**, breathlessness, low-grade fever, weight loss.\n- **Investigations:** **eosinophils > 3000/µL**; very high IgE and filarial antibody; **no microfilariae in blood**; chest X-ray — increased bronchovascular markings/miliary mottling.\n- **Differential:** bronchial asthma (unresponsive to antiasthma drugs), Löffler's, miliary TB, *Strongyloides*, *Toxocara*.\n- **Treatment:** **diethylcarbamazine (DEC)** for 2–3 weeks; untreated disease may progress to pulmonary fibrosis."}, {"id": 301, "n": 301, "t": "*Vignette: a 40-year-old male from Dinajpur with intermittent fever/chills, scrotal and lower-limb swelling.* Diagnosis, causative agent/mode of transmission, laboratory diagnosis.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Bancroftian (lymphatic) filariasis** — recurrent fever with chills (acute adenolymphangitis) with **hydrocele/scrotal swelling and lower-limb lymphoedema (early elephantiasis)** in a patient from an endemic north-western district.\n- **Causative agent:** *Wuchereria bancrofti*; **transmission:** bite of infected female *Culex quinquefasciatus* (L3 larvae).\n- **Laboratory diagnosis:** **night blood film** (thick, Giemsa) or Knott's concentration for microfilariae; **ICT antigen test**; scrotal ultrasound (filarial dance sign); hydrocele fluid; DEC provocation test; eosinophil count.\n- *Note:* microfilariae are often absent in chronic obstructive disease, so antigen testing is useful."}, {"id": 302, "n": 302, "t": "*Vignette: a 30-year-old lady from a filariasis-endemic district with asthma-like symptoms unresponsive to anti-asthma drugs, with eosinophilia and high IgE.* Diagnosis, causative agent, mode of infection, drug of choice.", "st": 0, "src": "DU-19Nov", "du": ["DU-19Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Tropical pulmonary eosinophilia** (occult filariasis) — asthma-like symptoms not responding to antiasthma drugs, eosinophilia, high IgE in an endemic area.\n- **Causative agent:** microfilariae of ***Wuchereria bancrofti*** (or *Brugia malayi*) trapped in the lungs.\n- **Mode of infection:** bite of an infected **female *Culex* mosquito** transmitting L3 larvae.\n- **Drug of choice:** **diethylcarbamazine (DEC)**, 2–3 weeks."}, {"id": 303, "n": 303, "t": "\"For detection of Microfilaria, blood should be collected at night\" – explain.", "st": 0, "src": "Board 2 Set 20", "du": [], "nmc": [], "vv": ["Board 2 Set 20"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*W. bancrofti* microfilariae in Bangladesh show **nocturnal periodicity**: they appear in peripheral blood in greatest numbers between about **10 pm and 2 am** and stay in pulmonary capillaries by day.\n\n- **Adaptive significance:** the peak coincides with the night-biting habit of the vector (*Culex quinquefasciatus*), maximising transmission.\n- **Hence blood is collected at night**; by day use the **DEC provocation test** or **antigen test (ICT)**.\n\n| Species/form | Periodicity |\n|---|---|\n| *W. bancrofti* (South Asia) | **Nocturnal** |\n| *W. bancrofti* var. *pacifica* | Diurnal subperiodic |\n| *Brugia malayi* | Nocturnal periodic/subperiodic |\n| *Loa loa* | **Diurnal** |\n| *Mansonella* spp. | Non-periodic |"}]}, {"id": "parasitology-15", "title": "Enterobius vermicularis (Pinworm)", "qs": [{"id": 304, "n": 304, "t": "Mention/write the mode of transmission and infective form of *Enterobius vermicularis*.", "st": 2, "src": "DU-26M, 19M", "du": ["DU-26M", "DU-19M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Infective form:** **embryonated egg** containing an infective larva (infective within 4–6 h of laying).\n\n**Modes of transmission** (faeco-oral)\n\n1. **Autoinfection** — fingers carry eggs from perianal skin to mouth after scratching.\n2. **Retroinfection** — eggs hatch on perianal skin and larvae migrate back through the anus into the colon.\n3. **Person-to-person** — contaminated clothing, bed linen, toys, toilet seats.\n4. Contaminated food and water.\n5. **Inhalation** of egg-laden dust, then swallowed.\n\n*Children and families/institutions are commonly affected; man is the only host.*"}, {"id": 305, "n": 305, "t": "Describe the life cycle of *Enterobius vermicularis*.", "st": 2, "src": "DU-23N; Board 2 Set 15", "du": ["DU-23N"], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Infective form:** embryonated egg. **Habitat:** caecum and appendix. **Host:** man only; no intermediate host or soil phase.\n\n```\n Gravid female migrates down at night -> lays eggs on PERIANAL skin\n        |   (eggs infective in 4-6 hours)\n Ingestion (autoinfection, fomites, dust)   <----  retroinfection (larvae re-enter anus)\n        |\n Egg shell dissolved in small intestine -> larvae -> 2 moults\n        |\n Adult worms in caecum/appendix; mating; male dies\n        |\n Gravid female -> rectum -> anus (at night) -> eggs\n```\n\n- Total cycle 2–6 weeks; adults live ~2 months.\n- No tissue migration or lung phase."}, {"id": 306, "n": 306, "t": "How can you diagnose a case of pinworm / *Enterobius vermicularis* infection in the laboratory (and state its management)?", "st": 10, "src": "NMC 1; NMC 3; NMC 4; DU-26M, 25M, 19M; Board 2 Set 01, 07, 16, 18", "du": ["DU-26M", "DU-25M", "DU-19M"], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": ["Board 2 Set 01", "Board 2 Set 07", "Board 2 Set 16", "Board 2 Set 18"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Principle:** eggs are laid on the perianal skin, so the **perianal region, not stool,** is examined.\n**Specimen:** **perianal swab** (cellophane/Scotch-tape or NIH swab), collected **early in the morning before bathing or defecation**.\n\n**Technique**\n\n1. Press adhesive cellophane tape (sticky side) on the perianal skin and stick it on a slide.\n2. Examine under low/high power: **plano-convex (D-shaped) eggs, 50–60 × 20–30 µm, colourless, thin double shell,** containing a coiled **tadpole-like larva**.\n3. Take **3 consecutive mornings** (single tape ~50 %, three tapes ~90 % sensitivity).\n\n**Other findings:** adult worm on the perianal skin at night or in stool/after enema; eggs in stool in a minority only; **eosinophilia usually absent**.\n\n**Management**\n\n1. **Albendazole, mebendazole or pyrantel pamoate** — single dose, **repeated after 2 weeks** (kills adults, not eggs).\n2. **Treat all family members/contacts** simultaneously.\n3. **Hygiene:** handwashing, short nails, morning bath, change of underwear and bed linen, hot-water washing of bedding."}, {"id": 307, "n": 307, "t": "*Vignette: a 3-year-old boy who cannot sleep at night due to perianal itching, with small thread-like worms observed in stool.* Diagnosis, likely helminth, mode of transmission.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Enterobiasis** (pinworm/threadworm infection) — nocturnal perianal itching and thread-like worms in a child.\n- **Helminth:** ***Enterobius vermicularis***.\n- **Mode of transmission:** faeco-oral ingestion of **embryonated eggs** — autoinfection (scratching), retroinfection, contaminated fomites, food or inhaled dust.\n- **Confirmation:** cellophane-tape swab of perianal skin (eggs)."}, {"id": 308, "n": 308, "t": "*Vignette: a 5-year-old boy with itching around the anus at night and small worms visible in stool.* Helminth, infective form, mode of transmission, sample for diagnosis.", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Helminth:** *Enterobius vermicularis* (pinworm).\n- **Infective form:** embryonated egg with larva.\n- **Mode of transmission:** ingestion of eggs (autoinfection, fomites, food/dust); retroinfection.\n- **Sample:** **perianal swab** (cellophane tape) taken in the morning before washing."}, {"id": 309, "n": 309, "t": "State the clinical significance of *Enterobius vermicularis*.", "st": 0, "src": "Board 2 Set 19", "du": [], "nmc": [], "vv": ["Board 2 Set 19"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*E. vermicularis* is the commonest helminth of children in many countries; it is a nuisance more often than a serious pathogen.\n\n- **Perianal pruritus** (worse at night) → sleeplessness, irritability; scratching → excoriation, dermatitis, **secondary bacterial infection**.\n- **Genital:** **vulvovaginitis** in girls; migration to the genital tract → salpingitis, endometritis, **tubo-ovarian abscess**, pelvic peritonitis.\n- **Urinary tract infection**, enuresis.\n- **Appendicitis** (worms in the lumen; 1–2 % of appendectomy specimens).\n- Eosinophilia usually absent.\n- Heavy infection: abdominal pain, anorexia, weight loss."}]}, {"id": "parasitology-16", "title": "Cestodes", "qs": [{"id": 310, "n": 310, "t": "List the characteristic features of cestodes / classify cestodes.", "st": 7, "src": "NMC 1; NMC 3; DU-25M; Board 2 Set 01, 09, 11, 17", "du": ["DU-25M"], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 01", "Board 2 Set 09", "Board 2 Set 11", "Board 2 Set 17"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**A. Characteristic features of cestodes (tapeworms)**\n\n1. **Long, flat, tape-like, segmented** worms (mm to many metres).\n2. Body in three regions: **scolex** (head with suckers ± hooks/rostellum), **neck** (growing region), **strobila** (chain of **proglottids** — immature, mature, gravid).\n3. **Hermaphrodite** — each mature proglottid has male and female organs.\n4. **No alimentary canal and no body cavity**; nutrients absorbed through the tegument.\n5. Excretory (flame cells) and nervous systems present.\n6. Life cycle needs **one or two intermediate hosts** (larval stages); adults live in the intestine of the definitive host.\n7. Eggs contain an **oncosphere** (hexacanth embryo with three pairs of hooklets).\n\n**B. Classification**\n\n| Feature | **Order Pseudophyllidea** | **Order Cyclophyllidea** |\n|---|---|---|\n| Scolex | Two slit-like grooves (**bothria**) | Four **cup-like suckers** ± rostellum with hooks |\n| Eggs | **Operculated** | Non-operculated |\n| Intermediate hosts | Two (copepod, fish) | One |\n| Larval stage | Procercoid → **plerocercoid** | **Cysticercus, hydatid cyst, coenurus, cysticercoid** |\n| Examples | *Diphyllobothrium latum*, *Spirometra* | *Taenia saginata*, *T. solium*, *Echinococcus granulosus*, *Hymenolepis nana*, *Dipylidium caninum* |"}, {"id": 311, "n": 311, "t": "State the differences among cestodes, trematodes and nematodes.", "st": 2, "src": "DU-24N, 26M", "du": ["DU-24N", "DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | **Cestodes** | **Trematodes** | **Nematodes** |\n|---|---|---|---|\n| Shape | Flat, tape-like | Flat, leaf-like | Cylindrical, elongated |\n| Segmentation | **Segmented** | Unsegmented | Unsegmented |\n| Sexes | Hermaphrodite | Hermaphrodite (except *Schistosoma*) | **Separate sexes** |\n| Alimentary canal | **Absent** | Present, blind (no anus) | Present, complete |\n| Body cavity | Absent | Absent | **Pseudocoelom** |\n| Attachment organs | Suckers ± hooks | Oral and ventral suckers | None (buccal capsule in some) |\n| Intermediate host | One or two | Snail (± second host) | Usually none (except filaria, *Dracunculus*) |\n| Eggs | Oncosphere with hooklets | **Operculated** (except schistosomes) | Variable |\n| Examples | *Taenia*, *Echinococcus* | *Fasciola*, *Schistosoma* | *Ascaris*, hookworm |"}, {"id": 312, "n": 312, "t": "Mention/name the infective forms and modes of transmission (and complications) of *Taenia saginata*, *Taenia solium* and *Diphyllobothrium latum*. — Also asked: clinical importance of *D. latum* and its prevention.", "st": 6, "src": "NMC 1; NMC 3; DU-22N, 19Nov, 18M; Board 2 Set 14", "du": ["DU-22N", "DU-19Nov", "DU-18M"], "nmc": ["NMC 1", "NMC 3"], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | ***Taenia saginata*** | ***Taenia solium*** | ***Diphyllobothrium latum*** |\n|---|---|---|---|\n| Common name | Beef tapeworm | Pork tapeworm | Fish tapeworm |\n| **Infective form** | ***Cysticercus bovis*** | ***Cysticercus cellulosae*** (for taeniasis); **egg** (for cysticercosis) | **Plerocercoid larva** |\n| **Mode of transmission** | Ingestion of **undercooked beef** | Ingestion of **undercooked pork**; ingestion of eggs/autoinfection → cysticercosis | Ingestion of **raw/undercooked freshwater fish** |\n| Intermediate host | Cattle | Pig (man in cysticercosis) | 1st: copepod (*Cyclops*); 2nd: freshwater fish |\n| **Complications** | Abdominal discomfort, weight loss, rarely appendicitis/obstruction; no cysticercosis | **Cysticercosis** (neurocysticercosis → epilepsy, hydrocephalus; ocular, muscular) | **Vitamin B₁₂ deficiency (megaloblastic anaemia)**, rarely obstruction |\n\n**Clinical importance of *D. latum*:** the longest tapeworm (up to ~10 m); causes B₁₂-deficiency anaemia and neuropathy; **operculated** eggs (60–75 µm) in stool; treat with praziquantel plus B₁₂.\n\n**Prevention:** thorough **cooking or deep-freezing of fish**, sanitary disposal of human faeces (prevent contamination of lakes/rivers), treatment of carriers. *(D. latum is rare in Bangladesh; T. saginata is the common tapeworm there.)*"}, {"id": 313, "n": 313, "t": "Differentiate between *Taenia saginata* and *Taenia solium*.", "st": 3, "src": "NMC 4; Board 2 Set 04, 17", "du": [], "nmc": ["NMC 4"], "vv": ["Board 2 Set 04", "Board 2 Set 17"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Feature | ***T. saginata*** | ***T. solium*** |\n|---|---|---|\n| Common name | Beef tapeworm (\"unarmed\") | Pork tapeworm (\"armed\") |\n| Occurrence in Bangladesh | Common | Rare |\n| Length | 5–10 m | 2–4 m |\n| Scolex | Large, quadrate; **no rostellum or hooks** | Small, globular; **rostellum with two rows of hooks** |\n| Proglottids | 1,000–2,000 | < 1,000 |\n| Gravid segment | Longer than broad; **15–30 lateral uterine branches per side** (fine, dichotomous) | Squarish; **7–13 per side** (thick, dendritic) |\n| Passage of segments | **Actively expelled singly** through anus | Passed **passively in chains** of 5–6 |\n| Ovary | Two lobes | **Three lobes** (accessory lobe) |\n| Testes | 300–400 | 150–200 |\n| Intermediate host | Cattle (*Cysticercus bovis*) | Pig (*Cysticercus cellulosae*) |\n| Cysticercosis in man | **Does not occur** | **Occurs** |\n| Eggs | Identical — cannot be differentiated | |"}, {"id": 314, "n": 314, "t": "Explain the mechanism of anaemia in fish tapeworm (*D. latum*) infection.", "st": 5, "src": "DU-18M, 19Nov; Board 2 Set 09, 15, 18", "du": ["DU-18M", "DU-19Nov"], "nmc": [], "vv": ["Board 2 Set 09", "Board 2 Set 15", "Board 2 Set 18"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n*D. latum* causes **megaloblastic (macrocytic) anaemia due to vitamin B₁₂ deficiency.**\n\n1. The worm lives in the **jejunum** and **absorbs/consumes large amounts of dietary vitamin B₁₂** before it reaches the ileum.\n2. It also interferes with the **B₁₂–intrinsic factor complex** (the worm splits the complex and its unsaturated fatty acids compete), preventing absorption in the terminal ileum.\n3. Deficiency impairs DNA synthesis in erythroid precursors → megaloblasts, macrocytosis (high MCV), hypersegmented neutrophils.\n4. Neurological features (paraesthesia, subacute combined degeneration) may follow.\n\n*Only a minority of infected persons become anaemic (heavy infection or marginal B₁₂ intake). Treatment:* praziquantel + parenteral vitamin B₁₂."}, {"id": 315, "n": 315, "t": "Discuss cysticercosis.", "st": 2, "src": "DU-23N, 22M", "du": ["DU-23N", "DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Definition.** Cysticercosis is infection of man by the larval stage (*Cysticercus cellulosae*) of ***Taenia solium***; **man is the intermediate host**.\n\n**Acquisition (ingestion of *T. solium* eggs):** contaminated food/water (eggs from a carrier), **external autoinfection** (hands), **internal autoinfection** (reverse peristalsis in a carrier).\n\n**Pathogenesis:** oncospheres hatch in the intestine, penetrate the wall, and are carried by blood to **brain, muscle, subcutaneous tissue, eye**, forming **cysticerci** (5–15 mm cysts with invaginated scolex). The viable cyst provokes little reaction; **degeneration of the larva causes intense inflammation** and finally calcification.\n\n**Clinical features**\n\n- **Neurocysticercosis:** **seizures (commonest)**, headache, hydrocephalus, meningitis, raised intracranial pressure.\n- **Subcutaneous nodules; muscular** (calcified \"rice-grain\" cysts).\n- **Ocular:** vitreous/subretinal cysts, visual loss.\n\n**Diagnosis:** CT/MRI (cyst with eccentric scolex, calcified lesions), **serology** (enzyme immunoblot, ELISA), nodule biopsy, soft-tissue X-ray, stool examination of patient/contacts for *T. solium* carriers.\n**Treatment:** albendazole ± praziquantel with corticosteroids and antiepileptics; surgery for hydrocephalus.\n**Prevention:** sanitation, meat inspection, hand hygiene, treatment of carriers."}, {"id": 316, "n": 316, "t": "*Vignette: a 20-year-old male passing a tapeworm segment through the anus; stool shows round ova with 3 pairs of hooklets.* Diagnosis, confirmation, infective stage, drug of choice.", "st": 0, "src": "DU-20Nov/July", "du": ["DU-20Nov/July"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n- **Diagnosis:** **Taeniasis** (intestinal tapeworm infection) — passage of segments with **round eggs containing an oncosphere with three pairs of hooklets**. By the standard exam key this is ***Taenia solium***; ***T. saginata*** (commoner in Bangladesh) cannot be excluded because **the eggs are identical**.\n- **Confirmation:** examination of the **gravid proglottid** (uterine branches per side: > 15 = *T. saginata*; 7–13 = *T. solium*) and, after treatment, recovery of the **scolex** (hooks present in *T. solium*).\n- **Infective stage:** *Cysticercus cellulosae* in pork (*T. solium*); *Cysticercus bovis* in beef (*T. saginata*). *T. solium* eggs are infective for cysticercosis.\n- **Drug of choice:** **praziquantel** (single dose); niclosamide is an alternative."}, {"id": 317, "n": 317, "t": "Name 3 intestinal cestodes.", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n1. ***Taenia saginata*** (beef tapeworm)\n2. ***Taenia solium*** (pork tapeworm)\n3. ***Diphyllobothrium latum*** (fish tapeworm)\n\n*(Others:* Hymenolepis nana, H. diminuta, Dipylidium caninum.)"}, {"id": 318, "n": 318, "t": "What is fish tapeworm, beef tapeworm, pork tapeworm, and dog tapeworm? Why are they so called?", "st": 2, "src": "Board 2 Set 03, 10", "du": [], "nmc": [], "vv": ["Board 2 Set 03", "Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Common name | Species | Why so called |\n|---|---|---|\n| **Fish tapeworm** | *Diphyllobothrium latum* | Man is infected by eating raw/undercooked **freshwater fish** (2nd intermediate host) |\n| **Beef tapeworm** | *Taenia saginata* | Infection by undercooked **beef** (cysticercus in cattle) |\n| **Pork tapeworm** | *Taenia solium* | Infection by undercooked **pork** (cysticercus in pig) |\n| **Dog tapeworm** | *Echinococcus granulosus* | Adult lives in the intestine of the **dog** (definitive host); man gets hydatid disease from dog faeces |"}, {"id": 319, "n": 319, "t": "State the pathogenesis of *T. saginata*.", "st": 0, "src": "Board 2 Set 11", "du": [], "nmc": [], "vv": ["Board 2 Set 11"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n*T. saginata* infection (taeniasis) follows ingestion of **undercooked beef containing *Cysticercus bovis***.\n\n1. In the duodenum bile evaginates the scolex, which **attaches to the jejunal mucosa by its four suckers**.\n2. The worm grows (~3 months) to 5–10 m, shedding **gravid proglottids** that **crawl actively out of the anus**.\n3. **Effects:** mechanical irritation and mild mucosal inflammation → abdominal discomfort, nausea, hunger pains, diarrhoea/constipation, weight loss; allergic urticaria and eosinophilia; rarely obstruction, appendicitis or biliary obstruction by a migrating segment.\n4. **No cysticercosis** in man."}, {"id": 320, "n": 320, "t": "What is *Cysticercus bovis* and *Cysticercus cellulosae*?", "st": 0, "src": "Board 2 Set 13", "du": [], "nmc": [], "vv": ["Board 2 Set 13"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| | ***Cysticercus bovis*** | ***Cysticercus cellulosae*** |\n|---|---|---|\n| Parent | *T. saginata* | *T. solium* |\n| Definition | Larval stage (**bladder worm**) in cattle muscle | Larval stage in pig muscle (and in man in cysticercosis) |\n| Description | Pearly-white cyst ~5–10 × 3–4 mm with **unarmed** invaginated scolex (\"measly beef\") | Opalescent oval cyst ~8–10 × 5 mm with **armed** (hooked) scolex (\"measly pork\") |\n| Sites | Masseters, tongue, heart, diaphragm | Tongue, neck, trunk muscle, heart, brain |\n| Infectivity | Infective to man (adult worm); **no cysticercosis** | Infective to man (adult worm); **causes cysticercosis** |\n| Killed by | Cooking ≥ 56 °C, freezing, salting | Same |"}]}, {"id": "parasitology-17", "title": "Trematodes", "qs": [{"id": 321, "n": 321, "t": "What is bilharziasis, and which main organ does it affect?", "st": 2, "src": "NMC 4; Board 2 Set 02", "du": [], "nmc": ["NMC 4"], "vv": ["Board 2 Set 02"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Bilharziasis (schistosomiasis)** is a chronic parasitic disease caused by the **blood flukes of the genus *Schistosoma*** (*S. haematobium*, *S. mansoni*, *S. japonicum*; less often *S. mekongi*, *S. intercalatum*). It was named after **Theodor Bilharz**, who discovered the worm in Cairo (1851). The adult worms live in **the veins** (hence \"blood flukes\"), and most of the damage is caused by their **eggs** lodged in tissues.\n\n| Species | Habitat of adult worm | Main organ affected | Disease |\n|---|---|---|---|\n| ***S. haematobium*** | Vesical and pelvic venous plexus | **Urinary bladder** (and ureters) | Urinary schistosomiasis — terminal haematuria; bladder fibrosis; **squamous-cell carcinoma of bladder** |\n| ***S. mansoni*** | Inferior mesenteric veins | **Large intestine (colon, rectum) and liver** | Intestinal schistosomiasis — bloody diarrhoea; hepatosplenomegaly; portal hypertension |\n| ***S. japonicum*** | Superior mesenteric veins | **Small intestine and liver** | Oriental schistosomiasis — severe hepatosplenic disease (acute stage: Katayama fever) |\n\n**Pathogenesis in brief:** cercariae penetrate skin → schistosomula → portal blood → adults in mesenteric/vesical veins → eggs penetrate the gut/bladder wall (spine and lytic enzymes); eggs trapped in tissue provoke **granuloma (Type IV hypersensitivity) → fibrosis**; pipe-stem periportal fibrosis in the liver.\n\n**Viva points**\n- Intermediate host: freshwater **snail** (*Biomphalaria* for *S. mansoni*; *Bulinus* for *S. haematobium*; *Oncomelania* for *S. japonicum*).\n- Drug of choice: **praziquantel**. *S. haematobium* → urine; *S. mansoni/japonicum* → stool."}, {"id": 322, "n": 322, "t": "How can you classify trematodes (flukes) depending on their habitat?", "st": 2, "src": "Board 2 Set 05, 10", "du": [], "nmc": [], "vv": ["Board 2 Set 05", "Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Classification of trematodes (flukes) by habitat of the adult worm**\n\n| Group | Fluke | Habitat |\n|---|---|---|\n| **Blood flukes** | *Schistosoma haematobium* | Veins of the urinary bladder (vesical plexus) |\n| | *S. mansoni*, *S. japonicum*, *S. mekongi* | Mesenteric veins of the colon/small intestine |\n| **Liver flukes** | *Fasciola hepatica*, *F. gigantica* | Bile ducts and liver |\n| | *Clonorchis sinensis*, *Opisthorchis viverrini*, *O. felineus* | Bile ducts and gall bladder |\n| **Lung flukes** | *Paragonimus westermani* | Lung (bronchioles) |\n| **Intestinal flukes** | *Fasciolopsis buski*, *Heterophyes heterophyes*, *Metagonimus yokogawai*, *Echinostoma* spp., *Gastrodiscoides hominis* | Small intestine |\n\n*(Gastrodiscoides hominis, the amphistome of the caecum and colon, occurs in Assam and Bangladesh.)*"}, {"id": 323, "n": 323, "t": "How do trematodes look?", "st": 0, "src": "Board 2 Set 07", "du": [], "nmc": [], "vv": ["Board 2 Set 07"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Morphology of trematodes (flukes)**\n\n```\n          ORAL SUCKER\n           ( o )\n     .-----'  '-----.        <- leaf-shaped, dorso-ventrally flattened,\n    /   pharynx      \\          unsegmented body covered with a tegument\n   |    \\ ||/          |\n   |  intestinal caeca |      <- blind (forked) gut, NO anus\n   |   ( o ) ventral   |      <- ventral sucker (acetabulum)\n   |      sucker       |\n   |  testes / ovary   |      <- hermaphrodite reproductive organs\n    \\    uterus  eggs /\n     '---------------'\n```\n*Fig. Schematic plan of a digenetic trematode (adult).*\n\n1. **Shape and size:** flat, leaf-like, **unsegmented**, bilaterally symmetrical; 1 mm to ~7 cm (*Fasciola hepatica* 30 × 13 mm; *Clonorchis* 10–25 mm; *Paragonimus* is thick, coffee-bean shaped, ~10 mm).\n2. **Covering:** tegument (sometimes spiny).\n3. **Suckers:** an **oral sucker** and a **ventral sucker** (acetabulum); no hooks.\n4. **Alimentary canal:** incomplete — mouth, pharynx, oesophagus, **two blind intestinal caeca**; **no anus**.\n5. **Sex:** **hermaphrodite** (monoecious) — except ***Schistosoma***, which has **separate sexes**, a cylindrical body, and the male carries the female in a **gynaecophoric canal**.\n6. **No body cavity.**\n7. **Eggs:** **operculated** (lid) — except *Schistosoma* (non-operculated, with spine).\n8. **Life cycle:** involves a **snail** as first intermediate host (with larval stages miracidium → sporocyst → redia → cercaria) and often a second intermediate host (fish, crab, aquatic plant)."}, {"id": 324, "n": 324, "t": "Name 5 trematodes with their site of localization.", "st": 2, "src": "Board 2 Set 02, 16", "du": [], "nmc": [], "vv": ["Board 2 Set 02", "Board 2 Set 16"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| # | Trematode | Site of localization | Disease |\n|---|---|---|---|\n| 1 | ***Schistosoma haematobium*** | Veins of the urinary bladder | Urinary schistosomiasis |\n| 2 | ***Schistosoma mansoni*** / ***S. japonicum*** | Mesenteric veins (large / small intestine) | Intestinal schistosomiasis |\n| 3 | ***Fasciola hepatica*** | Liver, bile ducts | Fascioliasis (\"sheep liver rot\") |\n| 4 | ***Clonorchis sinensis*** | Bile ducts, gall bladder | Clonorchiasis (Chinese liver fluke) |\n| 5 | ***Paragonimus westermani*** | Lungs | Paragonimiasis (endemic haemoptysis) |\n| 6 | ***Fasciolopsis buski*** | Small intestine | Fasciolopsiasis (giant intestinal fluke) |\n| 7 | ***Heterophyes heterophyes*** | Small intestine | Heterophyiasis |"}, {"id": 325, "n": 325, "t": "Name lung and liver flukes. Outline the life cycle.", "st": 0, "src": "Board 2 Set 06", "du": [], "nmc": [], "vv": ["Board 2 Set 06"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Liver flukes:** *Fasciola hepatica*, *Clonorchis sinensis*, *Opisthorchis viverrini* / *O. felineus*.\n**Lung fluke:** *Paragonimus westermani*.\n\n**General life cycle of trematodes (digenetic)**\n\n```\n EGG (operculated, in faeces/sputum/urine)  -> reaches fresh water\n        |\n MIRACIDIUM (ciliated, free-swimming) -> penetrates / is eaten by SNAIL (1st intermediate host)\n        |\n SPOROCYST -> REDIA (1-2 generations) -> CERCARIA (tailed, leaves snail)\n        |\n 2nd intermediate host / aquatic plant:  METACERCARIA (infective cyst)\n        |\n MAN ingests metacercaria -> excysts in duodenum -> migrates to target organ -> ADULT -> eggs\n```\n\n| Fluke | Snail | Second intermediate host / source | Infective stage | Migration in man | Egg passed in |\n|---|---|---|---|---|---|\n| ***Fasciola hepatica*** | *Lymnaea* | **Aquatic vegetation** (watercress, water chestnut) | Metacercaria | Excysts in duodenum → penetrates gut wall → peritoneum → liver capsule → parenchyma → bile ducts (~3 months) | Faeces |\n| ***Clonorchis sinensis*** | *Parafossarulus* | **Freshwater fish** (cyprinids; metacercariae in muscle) | Metacercaria | Excysts in duodenum → ascends via ampulla of Vater → bile ducts (~1 month) | Faeces |\n| ***Paragonimus westermani*** | *Semisulcospira* | **Freshwater crab/crayfish** | Metacercaria | Excysts in duodenum → penetrates gut wall → peritoneum → diaphragm → pleura → lung (6–8 weeks) | **Sputum** (also faeces) |\n\n**Clinical notes**\n- *Fasciola:* fever, hepatomegaly, biliary colic; eggs in stool; **triclabendazole**.\n- *Clonorchis/Opisthorchis:* biliary obstruction, cholangitis, **cholangiocarcinoma**; praziquantel.\n- *Paragonimus:* chronic cough, **rusty/chocolate-brown sputum**, haemoptysis (mimics TB); praziquantel."}, {"id": 326, "n": 326, "t": "Enumerate the schistosomes with their habitat.", "st": 0, "src": "Board 2 Set 14", "du": [], "nmc": [], "vv": ["Board 2 Set 14"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n| Schistosome | Habitat (adult worm) | Egg | Egg passed in |\n|---|---|---|---|\n| ***S. haematobium*** | Vesical and pelvic venous plexus (veins of urinary bladder) | Large, **terminal spine** | **Urine** |\n| ***S. mansoni*** | Inferior mesenteric veins (colon, rectum) | Large **lateral spine** | Stool |\n| ***S. japonicum*** | Superior mesenteric veins (small intestine, liver) | Small, rudimentary **lateral knob** | Stool |\n| *S. mekongi* | Mesenteric veins (Mekong basin) | Small lateral spine | Stool |\n| *S. intercalatum* | Mesenteric veins (West/Central Africa) | Terminal spine | Stool |"}, {"id": 327, "n": 327, "t": "Name the cancer-causing trematode.", "st": 0, "src": "Board 2 Set 05", "du": [], "nmc": [], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nThe **liver flukes *Clonorchis sinensis* and *Opisthorchis viverrini*** are the trematodes causing cancer — **cholangiocarcinoma** (bile-duct carcinoma). Both are classified by IARC as **Group 1 carcinogens**; chronic biliary inflammation, epithelial hyperplasia and fibrosis from long-standing infection lead to malignancy.\n\n*Also:* ***Schistosoma haematobium*** causes **squamous-cell carcinoma of the urinary bladder** (chronic egg-induced inflammation, fibrosis, calcification; also an IARC Group 1 carcinogen).\n\n**Viva points**\n- Raw/pickled freshwater fish (East Asia, Thailand, Laos) → *Opisthorchis/Clonorchis* → cholangiocarcinoma.\n- Egypt/Africa → *S. haematobium* → bladder carcinoma."}, {"id": 328, "n": 328, "t": "\"Prevalence of Trypanosomiasis, Schistosomiasis, and lung flukes are rare in Bangladesh\" – why?", "st": 0, "src": "Board 2 Set 18", "du": [], "nmc": [], "vv": ["Board 2 Set 18"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\nThese infections are **rare/absent in Bangladesh** because the **essential biological vector or intermediate host and the transmission conditions are absent**.\n\n1. **Trypanosomiasis**\n   - *T. brucei* (sleeping sickness) needs the **tsetse fly (*Glossina*)**, which is **confined to sub-Saharan Africa**.\n   - *T. cruzi* (Chagas' disease) needs **reduviid (triatomine) bugs**, restricted to **Central and South America**.\n   - No competent vector → no transmission (only imported cases).\n2. **Schistosomiasis**\n   - Human schistosomes need specific snail hosts — ***Biomphalaria*** (*S. mansoni*), ***Bulinus*** (*S. haematobium*), ***Oncomelania*** (*S. japonicum*) — which are **not present in Bangladesh**.\n   - Only **animal/bird schistosomes** (e.g. *S. spindale*, *Trichobilharzia*) occur, whose cercariae cause self-limiting **cercarial dermatitis (\"swimmer's itch\")** in paddy-field workers; they cannot mature in man.\n3. **Lung flukes (*Paragonimus*)**\n   - Need the specific **snail and freshwater crab/crayfish hosts**, and transmission depends on **eating raw, pickled or undercooked crabs/crayfish**, a food habit not common in Bangladesh (found in East Asia, West Africa, parts of South America and NE India).\n4. Contributing factors: climate and ecology, absence of reservoir hosts, dietary and cultural habits.\n\n*Imported cases in travellers/migrant workers are possible, so clinicians should still consider these diagnoses with a relevant travel history.*"}]}, {"id": "parasitology-18", "title": "Echinococcus granulosus & Hydatid Cyst", "qs": [{"id": 329, "n": 329, "t": "Identify/name the definitive and intermediate hosts of *Echinococcus granulosus*.", "st": 2, "src": "DU-25N, 23N", "du": ["DU-25N", "DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Host | Animal | Role |\n|---|---|---|\n| **Definitive host** | **Dog** (also wolf, jackal, fox) | Adult worm (3–6 mm) lives in the small intestine; gravid proglottids/eggs passed in faeces |\n| **Intermediate host** | **Sheep** (chief), cattle, goat, pig, camel, horse | Hydatid cyst develops in liver, lung, other organs |\n| **Accidental (aberrant) intermediate host** | **Man** | Infected by ingesting eggs; **a dead-end host** (cyst does not reach the dog) |\n\n*Man is infected by eggs from dog faeces on fingers, food, water or by handling dogs.*"}, {"id": 330, "n": 330, "t": "Name the species of *Echinococcus*, with their mode of transmission and the diseases they produce.", "st": 3, "src": "DU-19M, 22N; Board 2 Set 15", "du": ["DU-19M", "DU-22N"], "nmc": [], "vv": ["Board 2 Set 15"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n| Species | Disease | Definitive host | Intermediate host | Mode of transmission to man |\n|---|---|---|---|---|\n| ***E. granulosus*** | **Cystic echinococcosis** (unilocular hydatid disease) | Dog, other canids | Sheep, cattle, pig, camel | Ingestion of **eggs** (contaminated hands, food, water; handling dogs) |\n| ***E. multilocularis*** | **Alveolar echinococcosis** (multilocular; infiltrative, tumour-like liver lesions) | Fox, dog, cat | Small rodents (voles) | Ingestion of eggs (foxes' faeces on wild berries, soil, dogs) |\n| ***E. vogeli*** | **Polycystic echinococcosis** (South America) | Bush dog | Paca, agouti | Ingestion of eggs |\n| *E. oligarthrus* | Rare polycystic disease | Wild felids | Agouti, rodents | Ingestion of eggs |\n\n**Viva points**\n- Most common worldwide and the species of exam interest: ***E. granulosus*** (sheep–dog cycle).\n- Alveolar hydatid disease is aggressive and behaves like a malignancy (metastasis-like spread)."}, {"id": 331, "n": 331, "t": "Discuss/describe a hydatid cyst — its morphology, structure and contents, and composition — with a diagram.", "st": 11, "src": "NMC 1; NMC 3; NMC 4; DU-25M, 23N, 19M, 25N, 22M, 20Nov/July; Board 2 Set 03, 08", "du": ["DU-25M", "DU-23N", "DU-19M", "DU-25N", "DU-22M", "DU-20Nov/July"], "nmc": ["NMC 1", "NMC 3", "NMC 4"], "vv": ["Board 2 Set 03", "Board 2 Set 08"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Hydatid cyst** is the larval stage (metacestode) of *Echinococcus granulosus*, a slow-growing, **unilocular fluid-filled cyst** that develops in the intermediate host (and in man) after ingestion of eggs. The oncosphere penetrates the gut wall and reaches the **liver (60–70 %)**, **lung (20–25 %)** and other organs (spleen, kidney, brain, bone) via blood.\n\n**Structure (three layers, from outside in)**\n\n```\n       HYDATID CYST (cross-section)\n   ______________________________________\n  /   ___________________________________ \\\n |  / ______________________________    \\  |   1. PERICYST   (host fibrous capsule)\n | | /  ___________________________  \\   | |   2. ECTOCYST   (laminated, acellular, white)\n | | | /   brood capsule  ( o o o )   \\  | | |   3. ENDOCYST   (germinal layer, cellular)\n | | | |   with protoscolices  (( ))  | | | |\n | | | |   daughter cyst   [  o  ]    | | | |   HYDATID FLUID (clear) + \"hydatid sand\"\n | | | \\_______________________________/ | | |   (free protoscolices, hooklets, brood capsules)\n | | \\_____________________________/    | | |\n |  \\__________________________________/   |\n  \\_________________________________________/\n```\n*Fig. Hydatid cyst — pericyst, ectocyst (laminated membrane), endocyst (germinal membrane), brood capsules with protoscolices, daughter cysts and hydatid fluid.*\n\n| Layer | Nature | Function/features |\n|---|---|---|\n| **Pericyst** | **Host-derived** fibrous capsule (inflammatory reaction), may calcify | Not part of the parasite |\n| **Ectocyst (laminated membrane)** | **Parasite-derived**, acellular, chitin-like, white, opaque (up to 1–2 mm), PAS-positive | Protects the parasite; permits nutrient passage; resembles boiled egg-white; gives characteristic \"jelly-like sheet\" |\n| **Endocyst (germinal membrane)** | Thin, **cellular**, living layer | Secretes hydatid fluid and laminated layer; produces **brood capsules** → **protoscolices** (each potentially a future worm) and **daughter cysts** |\n\n**Contents**\n\n1. **Hydatid fluid:** clear, colourless, watery, antigenic (see Q334).\n2. **Brood capsules:** small vesicles attached to the germinal layer, each containing 5–30 **protoscolices** (invaginated scolex with hooklets).\n3. **Hydatid sand:** sediment of free protoscolices, hooklets and detached brood capsules (visible microscopically).\n4. **Daughter cysts:** secondary cysts inside the mother cyst (may be exogenous in man).\n\n**Composition of the cyst fluid:** water (>98 %), sodium chloride, glucose, protein (antigen 5, antigen B), urea, enzymes, lipids, protoscolices, hooklets.\n\n**Viva points**\n- Ectocyst = laminated, acellular; endocyst = germinal, **produces fluid and protoscolices**.\n- Infected sheep/goat viscera fed to dogs completes the cycle.\n- Growth rate ~1–5 cm/year; may remain silent for years."}, {"id": 332, "n": 332, "t": "Mention the consequences/complications of hydatid cyst rupture.", "st": 2, "src": "DU-25M, 22M", "du": ["DU-25M", "DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Consequences of rupture of a hydatid cyst** (spontaneous or traumatic, or during surgery/aspiration)\n\n1. **Anaphylaxis** — hypersensitivity to hydatid fluid (urticaria, bronchospasm, shock; occasionally fatal).\n2. **Secondary hydatidosis (dissemination)** — spillage of protoscolices → multiple new cysts in the peritoneum, pleura or other sites.\n3. **Rupture into hollow structures**\n   - **Biliary tree:** obstructive jaundice, cholangitis, biliary colic (\"hydatid sand\" in bile).\n   - **Bronchus:** hydatid expectoration (**hydatoptysis**), cough with salty fluid and membranes, pneumonia.\n   - **Peritoneum:** peritonitis, anaphylaxis, multiple peritoneal hydatids.\n   - **Pleural cavity:** pleural effusion, empyema; **pericardium:** tamponade.\n4. **Secondary bacterial infection → abscess formation.**\n5. **Pressure effects** (before rupture): obstruction of bile duct, portal vein, IVC; Budd–Chiari.\n\n**Viva points**\n- Never aspirate a suspected hydatid cyst without precautions (PAIR with albendazole cover).\n- Surgical spillage is prevented by pre-operative albendazole and scolicidal agents (hypertonic saline)."}, {"id": 333, "n": 333, "t": "Describe the laboratory diagnosis of hydatid cyst.", "st": 4, "src": "NMC 4; DU-20Nov/July, 22N; Board 2 Set 05", "du": ["DU-20Nov/July", "DU-22N"], "nmc": ["NMC 4"], "vv": ["Board 2 Set 05"], "bd": ["Board 2"], "w": true, "v": true, "a": "**Answer**\n\n**Principle:** diagnosis combines **imaging**, **serology** and, where safe, **identification of the parasite**.\n**Specimens:** serum, cyst fluid (operative/after drainage), sputum, bile, urine, biopsy/excised cyst.\n\n1. **Imaging (first-line)**\n   - **Ultrasonography:** well-defined cyst with a double wall; **\"water-lily sign\"** (collapsed endocyst floating in fluid); daughter cysts (\"honeycomb\"); WHO-Gharbi classification.\n   - **CT/MRI:** daughter cysts, wall calcification; MRI shows low-intensity rim (\"rim sign\").\n   - **X-ray:** rounded opacity in lung; **egg-shell calcification** in liver/abdominal cysts.\n2. **Serology** (antibody detection) — **ELISA** (hydatid antigen B), **indirect haemagglutination (IHA)**, **IFAT**, **immunoblot** (specific; confirms); latex agglutination and CFT are older methods. Sensitivity ~60–90 % (lower for lung and calcified cysts); false-negative in ~10–40 %; cross-reactions with cysticercosis.\n3. **Casoni's intradermal test** — obsolete, non-specific (see Q335).\n4. **Haematology:** **eosinophilia** (in about 25–50 %, especially after leakage/rupture).\n5. **Direct demonstration of parasite:** **protoscolices/hooklets** in aspirated cyst fluid, sputum, bile or urine (Giemsa/saline wet mount); histology of excised cyst (laminated membrane, germinal layer) — **FNA for diagnosis is generally avoided** (risk of spillage/anaphylaxis).\n6. **Molecular:** PCR on cyst material for species/genotype.\n7. **Liver function tests:** may be normal; raised ALP/bilirubin if biliary compression.\n\n**Viva points**\n- Best initial test: ultrasound. Confirmatory: serology (+ imaging).\n- Eosinophilia and positive serology support but do not exclude."}, {"id": 334, "n": 334, "t": "Mention the important characteristics of hydatid fluid.", "st": 0, "src": "Board 2 Set 12", "du": [], "nmc": [], "vv": ["Board 2 Set 12"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Hydatid fluid** is the clear fluid filling the hydatid cyst, secreted by the germinal layer.\n\n**Important characteristics**\n\n1. **Clear, colourless/pale straw, watery**; may appear opalescent from protoscolices.\n2. **Sterile** unless secondarily infected.\n3. **Specific gravity 1.005–1.015**; **pH ~6.7–7.5**; **non-albuminous** (little or no coagulable protein) — hence it does **not clot on boiling** unless contaminated with blood/serum.\n4. **Composition:** NaCl, sodium sulphate, glucose, inositol, lactate/succinate, urea, **proteins (antigen 5, antigen B)**, enzymes (e.g. alkaline phosphatase), lipids; **contains protoscolices, hooklets, brood capsules (\"hydatid sand\")**.\n5. **Under tension** — it spurts when the cyst is punctured; large cysts may hold litres of fluid.\n6. **Strongly antigenic/allergenic** — source of antigen for **Casoni's test**, ELISA, IHA; **leakage causes anaphylaxis**.\n7. **Scolicidal agents** (hypertonic saline, 20 %; ethanol) are used to inactivate protoscolices before drainage."}, {"id": 335, "n": 335, "t": "What is Casoni's test? How is it performed?", "st": 0, "src": "Board 2 Set 10", "du": [], "nmc": [], "vv": ["Board 2 Set 10"], "bd": ["Board 2"], "w": false, "v": true, "a": "**Answer**\n\n**Casoni's test** (Casoni, 1911) is an **intradermal skin test** for hydatid disease, a **Type I (immediate) hypersensitivity** reaction to hydatid antigen.\n\n**Antigen:** sterile, bacteria-free, filtered **hydatid fluid** from a sheep/ox cyst (0.2 mL of 1:10 diluted fluid, or purified antigen B).\n\n**Procedure**\n\n1. Inject **0.2 mL** of antigen **intradermally** on the flexor surface of the forearm.\n2. Inject **0.2 mL of sterile saline** at a second site on the other forearm
