<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230b1f3a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<title>Microbiology 2nd Term — Study Platform</title>
<style>
/* ===== 1. DESIGN TOKENS ===== */
:root{
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Backgrounds: Arctic White, Pearl, Alabaster */
  --arctic:#f6f9fc; --pearl:#eef2f7; --alabaster:#f7f6f2;
  --paper:var(--alabaster); --soft:var(--pearl);
  /* Surfaces: Pure White, Frost Glass */
  --card:#fff; --frost:rgba(255,255,255,.84);
  /* Text & borders: Charcoal, Cool Slate, Midnight Navy */
  --ink:#1d2733; --slate:#5d6b7b; --navy:#0b1f3a; --line:#e2e6eb; --line2:#cdd5df;
  /* Primary: Medical Blue, Cobalt */
  --blue:#1769e0; --cobalt:#0047ab; --wr:#0b4aa8; --viva:#94490a;
  /* Gradients: Clinical Clean, Sterile Mist, Oceanic Pulse */
  --g-clean:linear-gradient(135deg,#fff,#eaf2ff); --g-mist:linear-gradient(160deg,#f6f9fc,#e4edf5);
  --g-pulse:linear-gradient(100deg,#0047ab,#1769e0 60%,#2bb3d6);
  /* Category accent (overridden per part): colour, text-safe colour, tint */
  --acc:var(--blue); --acct:var(--cobalt); --accbg:#e9f1fd; --grad:var(--g-clean); --fs:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0c131f;--soft:#19243a;--card:#131c2b;--frost:rgba(19,28,43,.84);--arctic:#101a2b;--ink:#e5ebf3;--slate:#98a8bb;--navy:#e8f0fb;--line:#243248;--line2:#33445f;--blue:#5b95ff;--cobalt:#7aa8ff;--wr:#9bbcff;--viva:#f2b36b;--accbg:#1a2b4a;--g-clean:linear-gradient(135deg,#131c2b,#10264a);--g-mist:linear-gradient(160deg,#0c131f,#0f1a2e)}}
:root[data-theme="dark"]{--paper:#0c131f;--soft:#19243a;--card:#131c2b;--frost:rgba(19,28,43,.84);--arctic:#101a2b;--ink:#e5ebf3;--slate:#98a8bb;--navy:#e8f0fb;--line:#243248;--line2:#33445f;--blue:#5b95ff;--cobalt:#7aa8ff;--wr:#9bbcff;--viva:#f2b36b;--accbg:#1a2b4a;--g-clean:linear-gradient(135deg,#131c2b,#10264a);--g-mist:linear-gradient(160deg,#0c131f,#0f1a2e)}
[data-part=virology]{--acc:#6366f1;--acct:#4f46e5;--accbg:#ecedff;--grad:linear-gradient(135deg,#e9e7ff,#f3e8ff)}          /* Soft Indigo · Violet Fade */
[data-part=parasitology]{--acc:#5f9a72;--acct:#3b7550;--accbg:#e6f3eb;--grad:linear-gradient(135deg,#e4f5ea,#f2faf5)}      /* Sage Green · Mint Whisper */
[data-part=mycology]{--acc:#c0841a;--acct:#92600c;--accbg:#fbefd6;--grad:linear-gradient(135deg,#ffefd2,#ffd9bd 65%,#fcd3d3)}          /* Warm Ochre · Sunset Glow */
[data-part=clinical]{--acc:#0d9488;--acct:#0a7a70;--accbg:#d9f4f1;--grad:linear-gradient(135deg,#d7f5f4,#c6ebf3)}          /* Teal · Cyan Wash */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-part=virology]{--acct:#a9acff;--accbg:#1f2142;--grad:linear-gradient(135deg,#1f2142,#2a2048)}:root:not([data-theme="light"]) [data-part=parasitology]{--acct:#8fd3a6;--accbg:#173125;--grad:linear-gradient(135deg,#173125,#14281f)}:root:not([data-theme="light"]) [data-part=mycology]{--acct:#f0c06a;--accbg:#3a2c12;--grad:linear-gradient(135deg,#3a2c12,#3a2218)}:root:not([data-theme="light"]) [data-part=clinical]{--acct:#5fd6c9;--accbg:#10332f;--grad:linear-gradient(135deg,#10332f,#0f2b3a)}}
:root[data-theme="dark"] [data-part=virology]{--acct:#a9acff;--accbg:#1f2142;--grad:linear-gradient(135deg,#1f2142,#2a2048)}:root[data-theme="dark"] [data-part=parasitology]{--acct:#8fd3a6;--accbg:#173125;--grad:linear-gradient(135deg,#173125,#14281f)}:root[data-theme="dark"] [data-part=mycology]{--acct:#f0c06a;--accbg:#3a2c12;--grad:linear-gradient(135deg,#3a2c12,#3a2218)}:root[data-theme="dark"] [data-part=clinical]{--acct:#5fd6c9;--accbg:#10332f;--grad:linear-gradient(135deg,#10332f,#0f2b3a)}

/* ===== 2. BASE ===== */
*{box-sizing:border-box} html{font-size:var(--fs);scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;font:400 1rem/1.65 var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);color:var(--navy);font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:0}
a{color:var(--cobalt)} button,select,input,textarea{font:inherit;color:inherit} button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.i{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.17em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== 3. TOP BAR ===== */
.top{position:sticky;top:0;z-index:30;background:var(--frost);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.in{display:flex;align-items:center;gap:20px;max-width:1280px;margin:0 auto;padding:0 20px;height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font:600 1.15rem var(--serif);white-space:nowrap}
.logo em{font-style:italic;font-weight:400;color:var(--cobalt)} .logo .m{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;gap:6px;padding:0 12px;text-decoration:none;color:var(--slate);font-weight:500;font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav a:hover{color:var(--navy)} .nav a.on{color:var(--navy);border-color:var(--cobalt)}
.search{display:flex;align-items:center;gap:8px;margin-left:auto;width:min(300px,100%);padding:0 12px;height:38px;border:1px solid var(--line2);border-radius:99px;background:var(--card);color:var(--slate)}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.15)}
.search input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:.9rem}
.tools{display:flex;gap:4px;align-items:center}
.tl,.ib{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:9px;color:var(--slate);font-size:.82rem;font-weight:500}
.tl b{font-weight:600;font-variant-numeric:tabular-nums} .ib{width:36px;justify-content:center;padding:0}
.tl:hover,.ib:hover,.ib.on{background:var(--soft);color:var(--navy)}

/* ===== 4. LAYOUT & SHARED ===== */
.wrap{display:grid;grid-template-columns:272px minmax(0,1fr);gap:36px;max-width:1280px;margin:0 auto;padding:28px 20px 96px}
.wrap.nof{grid-template-columns:minmax(0,1fr);max-width:1120px}
main{min-width:0} .sp{flex:1}
aside{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding:2px 6px 2px 0;scrollbar-width:thin}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:.92rem;text-decoration:none;background:var(--cobalt);color:#fff;transition:background .15s}
.btn:hover{background:var(--blue)} .btn.o{background:var(--card);color:var(--navy);border:1px solid var(--line2)} .btn.o:hover{background:var(--soft)}
.bar{display:block;height:4px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1;min-width:40px}
.bar u{display:block;height:100%;width:0;background:var(--g-pulse);border-radius:99px;transition:width .35s}
[data-part] .bar u{background:var(--acc)}
.eyebrow{font:600 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acct)}
.empty{text-align:center;color:var(--slate);padding:56px 0}

/* ===== 5. HOME ===== */
.hero{position:relative;padding:44px 0 8px}
.hero::before{content:"";position:absolute;right:-60px;top:-40px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(23,105,224,.10),transparent);pointer-events:none}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);line-height:1.04;letter-spacing:-.025em;margin:14px 0 18px;max-width:14em}
.hero h1 em{display:block;font-style:italic;font-weight:400;color:var(--cobalt);font-size:.62em;margin-top:.25em;letter-spacing:-.01em}
.lead{max-width:60ch;color:var(--slate);font-size:1.08rem;margin:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 18px}
.hs{margin:0;width:min(440px,100%);height:44px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:18px 0 16px} .stats b{display:block;font:500 2rem/1.1 var(--serif);color:var(--navy)}
.stats span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--slate)}
.gp{display:flex;align-items:center;gap:14px;margin:16px 0 0;font-size:.85rem;color:var(--slate)} .gp .bar{height:6px}
.sec{margin-top:52px} .sh{display:flex;align-items:baseline;gap:14px;margin-bottom:6px} .sh h2{font-size:1.9rem} .sh p{margin:0;color:var(--slate);font-size:.9rem}
.ph2{display:flex;align-items:center;gap:12px;margin:34px 0 14px;padding:12px 16px;border-radius:12px;background:var(--grad);border:1px solid var(--line)}
.ph2 .ic{display:flex;gap:6px;color:var(--acct);font-size:1.15rem} .ph2 h3{font-size:1.25rem} .ph2 small{color:var(--slate);font-variant-numeric:tabular-nums} .ph2 .bar{flex:none;width:90px}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--acc);transform:translateY(-1px)}
.tno{font:500 1.35rem/1 var(--serif);color:var(--acct);min-width:1.7em;font-variant-numeric:lining-nums}
.rt{font-weight:500;font-size:.93rem;line-height:1.35;color:var(--navy)} .rc{font-size:.78rem;color:var(--slate);white-space:nowrap}
.row .bar{grid-column:1/-1;height:3px;margin-top:8px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:56px} .two h3{font-size:1.25rem;margin-bottom:10px}
.toc{margin:0;padding-left:18px} .toc li{margin:8px 0}

/* ===== 6. PAGE HEADERS, TABS, FILTERS ===== */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px;scrollbar-width:none}
.tabs a{display:flex;gap:7px;align-items:center;padding:10px 16px;text-decoration:none;color:var(--slate);font-weight:500;font-size:.92rem;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--navy);border-color:var(--acc)} .tabs a.on svg{color:var(--acct)}
.ph3{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph3>div:first-child{flex:1;min-width:240px} .ph3 h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:6px 0 4px;letter-spacing:-.02em}
.sub2{margin:0;color:var(--slate);font-size:.92rem} .pt{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:.8rem;color:var(--slate)} .crumb a{color:var(--slate);text-decoration:none} .crumb a:hover{color:var(--cobalt)}
aside h4{margin:22px 0 8px;font:600 .68rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--slate)} aside h4:first-child{margin-top:0}
.fr{display:flex;flex-wrap:wrap;gap:6px}
.fc{padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:.8rem;font-weight:500;color:var(--slate)}
.fc:hover{border-color:var(--blue);color:var(--navy)} .fc.on{background:var(--navy);border-color:var(--navy);color:#fff}
aside select{width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-size:.85rem}
aside details{border-top:1px solid var(--line);padding:6px 0} aside summary{cursor:pointer;font-weight:600;font-size:.85rem;padding:6px 0;color:var(--navy);list-style:none} aside summary svg{color:var(--acct);margin-right:4px}
.ti{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:5px 8px;border-radius:7px;font-size:.82rem;line-height:1.35;color:var(--slate)}
.ti:hover{background:var(--soft);color:var(--navy)} .ti.on{background:var(--accbg);color:var(--acct);font-weight:600} .ti span{font-variant-numeric:tabular-nums;opacity:.7}
.ab{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-size:.82rem;font-weight:500;color:var(--slate);text-decoration:none}
.ab:hover{color:var(--navy);border-color:var(--slate)} .fbtn{display:none}

/* ===== 7. TOPICS & QUESTION CARDS ===== */
.ph{display:flex;gap:10px;align-items:center;margin:40px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--acc);font-size:1.3rem}
.ph svg{color:var(--acct)} main section:first-child>.ph{margin-top:8px}
.tp{margin-bottom:26px}
.th{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line2);color:var(--navy)}
.th b{flex:1;font:500 1.15rem/1.3 var(--serif)} .th>svg{color:var(--slate);transition:transform .2s} .th.c>svg{transform:rotate(-90deg)}
.cnt{font-size:.78rem;color:var(--slate);white-space:nowrap;font-variant-numeric:tabular-nums} .th .bar{flex:none;width:64px}
.tb{display:grid;gap:12px;margin-top:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px 12px;transition:border-color .15s,box-shadow .15s}
.q:hover{border-color:var(--line2)} .q.o{border-color:var(--acc);box-shadow:0 6px 24px rgba(11,31,58,.06)} .q.dn .num{background:var(--acc);color:#fff}
.qh{display:flex;gap:14px;align-items:flex-start} .qh[data-act]{cursor:pointer}
.qh>svg{margin:5px 0 0 auto;color:var(--slate);transition:transform .2s} .q.o .qh>svg{transform:rotate(180deg)}
.num{flex:none;min-width:2.6em;text-align:center;padding:3px 8px;border-radius:7px;background:var(--accbg);color:var(--acct);font:600 .78rem var(--sans);font-variant-numeric:tabular-nums;margin-top:3px}
.qt{flex:1;font:500 1.08rem/1.45 var(--serif);color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0 calc(2.6em + 14px);font-size:.76rem;color:var(--slate)}
.pill{padding:2px 9px;border-radius:99px;font:600 .68rem var(--sans);letter-spacing:.06em;text-transform:uppercase}
.pill.w{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--wr)} .pill.v{background:color-mix(in srgb,#d9822b 16%,transparent);color:var(--viva)}
.fr2{color:#a4701a;font-weight:600} .src{color:var(--slate)}
.qf{display:flex;align-items:center;gap:2px;margin:12px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.st,.gl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--slate)}
.st:hover,.gl:hover,.gi:hover{background:var(--soft);color:var(--navy)} .st.on{color:#0f7a4a} .gl.on{color:var(--acct)}
.gi{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--slate)} .gi.on{color:var(--acct)} .gi.on svg,.st.on svg{fill:currentColor;fill-opacity:.15}
.lk{display:inline-flex;gap:5px;align-items:center;margin-left:8px;font-size:.82rem;font-weight:600;text-decoration:none;color:var(--cobalt)}
.note{display:block;width:100%;min-height:76px;margin:6px 0 8px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--soft);resize:vertical;font-size:.92rem}
mark{background:#ffe58a;color:#1d2733;border-radius:3px;padding:0 2px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.pgl{display:block;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none} .pgl:last-child{text-align:right} .pgl:hover{border-color:var(--cobalt)}
.pgl small{display:block;color:var(--slate);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em} .pgl b{font:500 1rem var(--serif);color:var(--navy)}

/* ===== 8. ANSWER CONTENT (markdown) ===== */
.body{margin:14px 0 4px;padding:18px 0 4px;border-top:1px solid var(--line);font-size:.97rem}
.md{overflow-wrap:anywhere} .md>:first-child{margin-top:0} .md p{margin:.7em 0} .md ul,.md ol{padding-left:1.35em} .md li{margin:.25em 0}
.md h1,.md h2,.md h3{margin:1.4em 0 .5em;font-size:1.12rem;color:var(--acct)} .md strong{color:var(--navy);font-weight:600}
.md pre{overflow-x:auto;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:10px;font:.76rem/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.md code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.88em} .md pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px} .md table{border-collapse:collapse;min-width:100%;font-size:.88rem}
.md th{background:var(--soft);color:var(--navy);text-align:left;font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.md th,.md td{padding:9px 14px;vertical-align:top;border-bottom:1px solid var(--line)} .md tr:last-child td{border-bottom:0} .md tbody tr:hover{background:var(--arctic)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.5em 0} .lnk{color:var(--cobalt);cursor:pointer;text-decoration:underline dotted}
details.card summary{cursor:pointer;font:500 1.05rem var(--serif);color:var(--navy)} details.card{margin-bottom:14px;padding:16px 22px}

/* ===== 9. FOCUS MODE, MODAL ===== */
.focus .nav,.focus .search,.focus .tools,.focus aside,.focus .tabs,.focus .pt,.focus .tabbar,.focus .qf,.focus .th .bar,.focus .meta{display:none}
.focus .wrap{grid-template-columns:minmax(0,1fr);max-width:800px} .focus .body{font-size:1.06rem;line-height:1.8}
#fx{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;padding:10px 18px;border-radius:99px;background:var(--navy);color:var(--paper);font-weight:600;font-size:.85rem;box-shadow:0 8px 24px rgba(11,31,58,.25)}
.focus #fx{display:flex;gap:6px;align-items:center}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(11,31,58,.5);padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:grid} .modal .card{width:min(420px,100%)} .modal h3{margin-bottom:6px} .modal label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;font-size:.92rem}
.tabbar{display:none}

/* ===== 10. RESPONSIVE (phones, Android & iPad) ===== */
@media (max-width:1000px){

/* ===== 12. POLISH: colour, dark mode, toggles, tab bar, clear-all ===== */
:root{--on-solid:#fff;--h1:#0b2a63;--h2:#14509e;--h3:#0e7490;--strong:#173f7c;color-scheme:light;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

.hero h1 em,.logo em{color:var(--cobalt)}

.sh h2,.two h3,details.card summary,.fh b,.pgl b,.stats b,.kp b,.sh2 h3,.modal h3{color:var(--h2)}

.qt,.rt{color:var(--h1)} .md strong,.md td:first-child{color:var(--strong)} .md th{color:var(--h2)} .md h4{color:var(--h3)}

.tno{color:var(--acct)}

/* ===== 14. INK: handwriting annotation layer ===== */
:root{--ib:24px} @media (max-width:1000px){:root{--ib:78px}} .focus{--ib:88px}
.q{position:relative;isolation:isolate} /* isolate = card is its own stacking context, so a z-index:-1 child paints ABOVE the card background but BELOW its text */
/* Ink overlay: a transparent canvas living INSIDE each .q card (position:absolute against the card's padding box).
   Classes are namespaced (.mbi) because the app already owns .ab (= opaque 'action button': background:var(--card), border, padding,
   display:inline-flex). The old canvas was class="al ab", so it inherited that button skin and painted a solid box over the card.
   Every property that a generic rule could leak onto the canvas is reset explicitly here. */
canvas.mbi{position:absolute;left:0;top:0;right:auto;bottom:auto;width:100%;height:100%;min-width:0;min-height:0;max-width:none;max-height:none;
  display:block;margin:0;padding:0;border:0;border-radius:0;outline:0;box-shadow:none;
  background:transparent!important;background-image:none!important;opacity:1;filter:none;mix-blend-mode:normal;
  pointer-events:none!important;z-index:3;-webkit-user-select:none;user-select:none}
/* Highlighter layers. Behind the content: canvas.mbi-hl (saved strokes) and canvas.mbi-hlive (stroke in progress) -> text is never tinted.
   Some blocks paint their own opaque background (code/diagram <pre>, table headers, tags, notes) which would hide a behind-layer, so for those
   rectangles ONLY a blended copy (mbi-hlx / mbi-hlivex) is drawn on top: multiply keeps dark text dark (light themes), lighten keeps light text light (dark themes). */
canvas.mbi.mbi-hl,canvas.mbi.mbi-hlive{z-index:-1}
canvas.mbi.mbi-hlx,canvas.mbi.mbi-hlivex{z-index:2;mix-blend-mode:multiply;mix-blend-mode:var(--mbi-blend)}
canvas.mbi.mbi-live{z-index:4}
:root{--mbi-blend:multiply;--mbi-hla:.5}

<script type="application/json" id="data">{"meta": {"title": "Microbiology — 2nd Term: Question Bank with Model Answers", "sub": "Virology · Mycology · Parasitology · Clinical Microbiology — 383 questions from NMC, DU and Board 1/2 viva papers, each with a model answer.", "how": "- **★** — number of distinct sittings (NMC papers + DU sittings + Board card sets) in which the question, or a near-identical variant, appeared. No star = asked once. **More stars = learn first.**\n- **NMC 1 / 3 / 4** — NMC papers: NMC 1 = 2nd Assessment Exam (SAQ), Mar-2023; NMC 3 = 2nd Term Exam (SAQ), Oct-2024; NMC 4 = 2nd Term Exam, 15 Sep 2025, plus the Virology & Clinical Microbiology Card Exam, Sep-2025.\n- **DU-xxM / xxN / xxNov** — Dhaka University sittings (month / November, with year).\n- **Board 1 / Board 2 Set nn** — viva card-exam board and set number.\n- *Also asked: …* — an extra sub-question from another sitting merged into the same entry.\n- **Written exam:** use the full headed answer. **Viva:** use the *Viva pearls / Viva corner* lines at the end of answers.\n- Drug doses are intentionally omitted (not required in microbiology papers).", "audit": "*How often each topic has appeared across DU written papers, NMC papers and the Viva (Board 1/2 card) sets. Counts come from the merged question bank, so one row = one topic section.*\n\n**How to read it:** each number is a count of *appearances*, not distinct questions. A question asked in DU-26M and DU-25M adds 2 to the DU column; one asked in NMC 1 and NMC 4 adds 2 to the NMC column; one asked in Board 2 Sets 01, 03, 04 adds 3 to the Viva column. **Total** = DU + NMC + Viva. **Avg/Q** = Total ÷ questions in the topic, so it shows how reliably the topic repeats rather than how large it is.\n\n**Priority tiers (by Total):** 🔥 Very high ≥ 40 · ⭐ High 22–39 · Medium 10–21 · Low < 10.\n\n**Whole bank:** 383 questions · 264 DU appearances · 153 NMC appearances · 327 Viva appearances · 744 total.\n\n### 1. Summary by part\n\n| Part  | 3 | **3** | 1.0 | Low |\n| 40 | Pyrexia of Unknown Origin & Septicaemia | Clinical Microbiology | 3 | 0 | 3 | 0 | **3** | 1.0 | Low |\n| 41 | Respiratory Tract Scenarios | Clinical Microbiology | 3 | 0 | 0 | 3 | **3** | 1.0 | Low |\n| 42 | Trichomonas vaginalis | Parasitology | 3 | 1 | 0 | 2 | **3** | 1.0 | Low |\n| 43 | Cryptosporidium & Opportunistic Intestinal Protozoa | Parasitology | 2 | 0 | 0 | 2 | **2** | 1.0 | Low |\n| 44 | Pneumocystis jirovecii | Mycology | 2 | 0 | 0 | 2 | **2** | 1.0 | Low |\n| 45 | Respiratory Tract & Food-borne Infections | Clinical Microbiology | 2 | 0 | 2 | 0 | **2** | 1.0 | Low |\n| 46 | Respiratory Viruses | Virology | 1 | 1 | 0 | 1 | **2** | 2.0 | Low |\n| 47 | Sexually Transmitted & Genital Infections | Clinical Microbiology | 2 | 0 | 2 | 0 | **2** | 1.0 | Low |\n| 48 | Strongyloides stercoralis | Parasitology | 2 | 0 | 0 | 2 | **2** | 1.0 | Low |\n| 49 | Wound Infection & Hospital-Acquired Infection | Clinical Microbiology | 2 | 0 | 2 | 0 | **2** | 1.0 | Low |\n| 50 | Aspergillus | Mycology | 1 | 0 | 0 | 1 | **1** | 1.0 | Low |\n| 51 | Trypanosomes (Sleeping Sickness & Chagas Disease) | Parasitology | 1 | 0 | 0 | 1 | **1** | 1.0 | Low |\n\n### 3. Top 25 most-repeated questions\n\n| # | Question | Topic | DU | NMC | Viva | Total |\n|---:|---|---|---:|---:|---:|---:|\n| 111 | Classify fungi (morphologically and/or clinically), with examples. | Introduction & Classification of Fungi | 6 | 3 | 5 | **14** |\n| 331 | Discuss/describe a hydatid cyst — its morphology, structure and contents, and composition — with a diagram. | Echinococcus granulosus & Hydatid Cyst | 6 | 3 | 2 | **11** |\n| 245 | Describe the laboratory diagnosis of visceral leishmaniasis / Kala-azar. | Leishmania Species & PKDL | 6 | 2 | 2 | **10** |\n| 306 | How can you diagnose a case of pinworm / *Enterobius vermicularis* infection in the laboratory (and state its management)? | Enterobius vermicularis (Pinworm) | 3 | 3 | 4 | **10** |\n| 41 | Give the Ag-Ab pattern/serological markers of Hepatitis B and Hepatitis C, and their significance/interpretation and infection outcomes in c… | Hepatitis Viruses | 4 | 2 | 2 | **8** |\n| 113 | Write down the structural differences between fungi and bacteria. | Introduction & Classification of Fungi | 1 | 2 | 5 | **8** |\n| 285 | Discuss the fertilised and unfertilised ovum of *A. lumbricoides*, with a diagram, and describe the pathogenic effects produced by *A. lumbr… | Ascaris lumbricoides & Hookworm | 4 | 1 | 3 | **8** |\n| 297 | State/describe the lesions produced in classical filariasis, and describe the pathogenesis/mechanism of filariasis or elephantiasis. — Also … | Filariasis & Tropical Pulmonary Eosinophilia | 4 | 2 | 2 | **8** |\n| 55 | Explain antigenic shift and antigenic drift, with examples. | Orthomyxoviruses & Paramyxoviruses | 4 | 2 | 1 | **7** |\n| 175 | How can you diagnose cryptococcal meningitis in the laboratory? — Also asked: important characteristics and clinical importance of *Cryptoco… | Cryptococcus neoformans | 1 | 1 | 5 | **7** |\n| 298 | Mention the differences between classical and occult filariasis. | Filariasis & Tropical Pulmonary Eosinophilia | 3 | 0 | 4 | **7** |\n| 310 | List the characteristic features of cestodes / classify cestodes. | Cestodes | 1 | 2 | 4 | **7** |\n| 151 | Which fungi are called Dermatophytes and why are they so called? / What are dermatophytes? | Dermatophytes | 0 | 0 | 6 | **6** |\n| 191 | Compare cestodes, trematodes and nematodes / mention their differences. | General Parasitology | 2 | 1 | 3 | **6** |\n| 213 | Name/list the free-living amoebae of medical importance, and mention their mode of transmission and the diseases they cause. | Free-living Amoebae | 3 | 0 | 3 | **6** |\n| 271 | Classify female nematodes according to their mode of reproduction. | Nematodes — General | 0 | 3 | 3 | **6** |\n| 312 | Mention/name the infective forms and modes of transmission (and complications) of *Taenia saginata*, *Taenia solium* and *Diphyllobothrium l… | Cestodes | 3 | 2 | 1 | **6** |\n| 7 | Describe the steps of the viral replication cycle. | Structure & General Properties of Viruses | 1 | 2 | 2 | **5** |\n| 60 | Outline the complications of measles virus infection. | Orthomyxoviruses & Paramyxoviruses | 2 | 2 | 1 | **5** |\n| 77 | Discuss the pathogenesis of paralytic poliomyelitis. | Poliovirus | 3 | 1 | 1 | **5** |\n| 117 | Explain dimorphic fungus, with examples/diseases produced. | Introduction & Classification of Fungi | 2 | 1 | 2 | **5** |\n| 181 | Define and classify a host, with example. — Also asked: enumerate the types of hosts (definitive, intermediate, etc.) with examples. | General Parasitology | 1 | 0 | 4 | **5** |\n| 187 | Which/name the parasites can be found in / live in the blood (with their infective form)? | General Parasitology | 1 | 2 | 2 | **5** |\n| 219 | Write/state the laboratory diagnosis of amoebic liver abscess / how to diagnose a case of hepatic amoebiasis. | Entamoeba histolytica | 3 | 2 | 0 | **5** |\n| 242 | Mention/explain the causes/mechanism of anaemia in Kala-azar. | Leishmania Species & PKDL | 5 | 0 | 0 | **5** |\n\n*Question numbers (#) match the numbering in this document. DU counts only DU-written sittings; the Viva column counts Board 1/2 card sets.*", "contents": ["- [How to use this book](#how-to-use-this-book)", "- [Study Priorities — Topic Frequency Audit](#study-priorities--topic-frequency-audit)", "- [Part I — Virology](#part-i--virology)", "- [Part II — Mycology](#part-ii--mycology)", "- [Part III — Parasitology](#part-iii--parasitology)", "- [Part IV — Clinical Microbiology](#part-iv--clinical-microbiology)"]}, "parts": [{"id": "virology", "name": "Part I — Virology", "intro": "", "notes": "", "topics": [{"id": "virology-1", "title": "Structure & General Properties of Viruses", "qs": [{"id": 1, "n": 1, "t": "Draw and label the basic structure of a virus / mention the structure of a complete virus particle, with diagram.", "st": 4, "src": "DU-22N, 25M, 20Nov/July; Board 1 Set 16", "du": ["DU-22N", "DU-25M", "DU-20Nov/July"], "nmc": [], "vv": ["Board 1 Set 16"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Virion (complete virus particle)** is the structurally intact, extracellular, infectious virus particle. It is built of a **genome** (nucleic acid) enclosed in a protein shell, the **capsid**; together they form the **nucleocapsid**. Some viruses possess an additional lipoprotein **envelope**.\n\n```\n A. ENVELOPED VIRUS (icosahedral)           B. NAKED (NON-ENVELOPED) VIRUS\n\n      Y    Y    Y    Y    Y                       ____________\n    .-_____________________-.                    /\\    /\\    /\\\n   /  .-------------------.  \\                  /  \\  /  \\  /  \\\n  |  /   .-------------.   \\  |                /____\\/____\\/____\\\n  | |   /  genome:      \\   | |                \\    /\\    /\\    /\n  | |  |   DNA or RNA    |  | |                 \\  /  \\  /  \\  /\n  | |   \\               /   | |                  \\/____\\/____\\/\n  |  \\   '-------------'   /  |\n   \\  '-------------------'  /                Nucleocapsid = capsid + genome\n    '-._,,,,,,,,,,,,,,,,,,,_-'\n      Y    Y    Y    Y    Y\n\n  Y  = glycoprotein spike (peplomer)        outer ring   = ENVELOPE (lipid bilayer + matrix protein)\n  middle ring = CAPSID (capsomers)          centre       = GENOME (DNA or RNA, never both)\n```\n\n**1. Viral nucleic acid (genome)**\n- Either DNA **or** RNA, never both.\n- Single- or double-stranded; linear or circular; DNA genome is a single molecule, RNA genome may be one molecule or segmented (influenza – 8 segments; rotavirus – 11 segments).\n- All viruses are haploid except **retroviruses (diploid)**.\n\n**2. Capsid**\n- Protein coat made up of repeating subunits, the **capsomers**.\n- *Functions:* (a) protects the genome from nucleases; (b) attachment to host-cell receptors (in naked viruses); (c) antigenic – induces antibody and activates cytotoxic T cells; (d) gives the virion its symmetry.\n- *Symmetry:* **icosahedral** (20 triangular faces, near-spherical) or **helical** (capsomers coiled round the nucleic acid in a hollow rod). All human helical viruses are enveloped.\n\n**3. Envelope (only in some viruses)**\n- Lipid bilayer derived from host cell membrane, with virus-coded glycoprotein spikes; acquired by **budding** (herpesviruses – from the nuclear membrane).\n- *Functions:* protection and attachment (spikes such as HA, gp120).\n- Enveloped viruses are labile – inactivated by heat, drying, detergents, alcohol and ether.\n\n**4. Other components:** matrix protein, virion enzymes (e.g. RNA-dependent RNA polymerase in negative-strand viruses; reverse transcriptase in retroviruses).\n\n*Viva:* **Virion** = complete infectious particle; **capsomer** = structural subunit of capsid; **nucleocapsid** = capsid + nucleic acid."}, {"id": 2, "n": 2, "t": "Define a virus and list its main characteristics/structures that differentiate it from other microorganisms.", "st": 4, "src": "NMC 4; Board 1 Set 01, 14, 15", "du": [], "nmc": ["NMC 4"], "vv": ["Board 1 Set 01", "Board 1 Set 14", "Board 1 Set 15"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Definition.** Viruses are the smallest infectious agents (20–300 nm), non-cellular, composed of a nucleic acid genome (DNA **or** RNA, never both) enclosed in a protein coat, which are **obligate intracellular parasites** and replicate only inside living host cells by using the host's synthetic machinery.\n\n**Main characteristics**\n1. Non-cellular; no nucleus, cytoplasm, mitochondria or ribosomes.\n2. Contain only one type of nucleic acid (DNA or RNA).\n3. Lack enzymes for energy production and cannot synthesize their own protein; hence **obligate intracellular parasites**.\n4. Multiply by **replication** (not binary fission); one virion can yield hundreds of progeny.\n5. Cannot be grown on artificial cell-free media – only in cell culture, embryonated eggs or animals.\n6. Resistant to antibiotics; sensitive to **interferon**.\n7. Too small to be seen by light microscope (except the largest, e.g. poxvirus, by special staining).\n8. Show **cell tropism** (specific receptors).\n9. May integrate into the host genome (parasites at the genomic level).\n\n**Differences from other microorganisms (virus vs bacteria)**\n\n| Feature | Virus | Bacteria |\n|---|---|---|\n| Size | 20–300 nm | > 300 nm (0.2–5 µm) |\n| Cellular organisation | Non-cellular | Cellular (prokaryotic) |\n| Nucleic acid | DNA **or** RNA | DNA **and** RNA |\n| Ribosome | Absent | Present (70S) |\n| Metabolic activity | Absent | Present |\n| Site | Obligate intracellular | Usually extracellular (few intracellular: *Chlamydia, Rickettsia*) |\n| Growth on artificial media | Not possible | Possible |\n| Multiplication | Replication | Binary fission |\n| Antibiotic sensitivity | Resistant | Sensitive |\n| Interferon sensitivity | Sensitive | Insensitive |\n\n*Viva:* Only bacteria that are obligate intracellular – *Chlamydia* and *Rickettsia*."}, {"id": 3, "n": 3, "t": "Describe the Baltimore classification system for viruses.", "st": 3, "src": "NMC 4; Board 1 Set 12, 17", "du": [], "nmc": ["NMC 4"], "vv": ["Board 1 Set 12", "Board 1 Set 17"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Baltimore classification** (David Baltimore, 1971) classifies viruses according to the **genome type and the mechanism by which mRNA is synthesized**. All viruses must produce **positive-sense mRNA** to be translated; the classification is organised around how each genome type achieves this.\n\n| Class | Genome | mRNA synthesis | Important examples |\n|---|---|---|---|\n| **I** | Double-stranded DNA (dsDNA) | Host (or virion) DNA-dependent RNA polymerase transcribes DNA → mRNA | Herpesviruses, adenovirus, papillomavirus, polyomavirus, poxvirus |\n| **II** | Single-stranded DNA (ssDNA) | ssDNA → dsDNA (host DNA polymerase) → mRNA | Parvovirus B19 |\n| **III** | Double-stranded RNA (dsRNA) | Virion RNA polymerase copies the negative strand → mRNA | Rotavirus (Reoviridae) |\n| **IV** | Positive-sense ssRNA (+ssRNA) | Genome itself acts as mRNA (infectious RNA) | Picornaviruses (polio, HAV, rhinovirus), flaviviruses (dengue, HCV), togaviruses (rubella), coronaviruses, caliciviruses, HEV |\n| **V** | Negative-sense ssRNA (−ssRNA) | Virion RNA-dependent RNA polymerase makes + strand mRNA | Orthomyxo-, paramyxo-, rhabdo- (rabies), filo-, bunya-, arenaviruses |\n| **VI** | ssRNA with reverse transcriptase | RNA → DNA (reverse transcriptase) → provirus → mRNA | Retroviruses (HIV, HTLV) |\n| **VII** | dsDNA with reverse transcriptase | DNA → pregenomic RNA → DNA (reverse transcriptase) | Hepadnaviruses (HBV) |\n\n*Key points for viva*\n- Negative-strand RNA genomes are **not infectious by themselves**; the virion carries its own RNA polymerase.\n- Positive-strand RNA genomes are infectious (naked RNA can initiate infection).\n- Only **parvovirus** is a ssDNA human virus; only **reovirus (rotavirus)** is dsRNA.\n- *Mnemonic:* the classes follow the order **I–VII = dsDNA, ssDNA, dsRNA, +ssRNA, −ssRNA, RT-RNA, RT-DNA**.\n\n*(The traditional ICNV classification uses nucleic acid type, strandedness, envelope, symmetry and ether sensitivity.)*"}, {"id": 4, "n": 4, "t": "Write down the immunopathogenesis of viral infection.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Immunopathogenesis** means tissue damage and clinical illness produced not by the direct cytopathic action of the virus but by the **host's own immune response** against viral antigens.\n\n**Mechanisms and examples**\n1. **Cytotoxic T-cell (CD8+) mediated injury** – T cells kill virus-infected cells: liver damage in **hepatitis B, C and A**; measles rash (T cells attacking infected endothelial cells).\n2. **Immune-complex (type III) hypersensitivity** – virus–antibody complexes deposited in joints, kidney, vessels: arthralgia/arthritis in **HBV, rubella, parvovirus B19**; glomerulonephritis and vasculitis (polyarteritis nodosa) in chronic HBV.\n3. **Antibody-dependent enhancement (ADE)** – non-neutralising cross-reactive antibodies from a previous infection increase viral entry into macrophages (via Fc receptors) → cytokine release → **dengue haemorrhagic fever/shock syndrome**.\n4. **Cytokine storm** – excess IL-1, IL-6, TNF: severe **influenza**, **COVID-19 (ARDS)**.\n5. **Maternal antibody–virus complexes** damaging respiratory cells in **RSV** bronchiolitis of infants.\n6. **Immunosuppression** by the virus itself – **HIV** (CD4+ depletion), **measles** (suppresses cell-mediated immunity → secondary bacterial infection, TB flare-up).\n7. **Autoimmunity** – EBV (heterophile antibody); molecular mimicry (e.g. Guillain–Barré syndrome after viral infection).\n8. **Immune evasion allowing persistence** (antigenic variation, MHC-I down-regulation) leading to chronic immunopathology – HBV, HCV, HIV.\n\n*Viva:* Hepatitis B — \"the virus is not cytopathic; the cytotoxic T cell is the culprit.\""}, {"id": 5, "n": 5, "t": "Write a short note on prions / discuss briefly defective virus and prion.", "st": 4, "src": "NMC 4; DU-25M, 22M; Board 1 Set 18", "du": ["DU-25M", "DU-22M"], "nmc": ["NMC 4"], "vv": ["Board 1 Set 18"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### A. Prions\n**Definition.** Prions (*proteinaceous infectious particles*) are infectious agents composed **solely of protein**; they contain **no DNA or RNA**. The infectious form is an abnormally folded isoform of a normal host protein (PrP^C → PrP^Sc).\n\n**Diseases – transmissible spongiform encephalopathies (TSE)**\n- Humans: **Creutzfeldt–Jakob disease (CJD)**, variant CJD, **kuru**, Gerstmann–Sträussler–Scheinker syndrome, fatal familial insomnia.\n- Animals: scrapie (sheep), bovine spongiform encephalopathy (\"mad cow disease\").\n\n**Features**\n1. No nucleic acid – clearly distinct from viruses.\n2. Prion protein is encoded by a **normal cellular (host) gene** on chromosome 20.\n3. PrP^Sc is rich in β-pleated sheets, **protease-resistant**, and converts PrP^C to PrP^Sc (template-directed misfolding); amyloid-like filaments form.\n4. Highly resistant to heat, UV, formalin and ionising radiation; **inactivated by** autoclaving at 134 °C for ≥ 18 min, sodium hydroxide (1 N) or sodium hypochlorite.\n5. Since the protein is a normal host protein, there is **no inflammatory or antibody response**.\n6. Very long incubation period (years) – a \"slow infection\"; brain shows vacuolation (spongiform change), neuronal loss and gliosis, without inflammation.\n7. *Diagnosis:* clinical, MRI, EEG (periodic sharp waves), CSF 14-3-3 protein/RT-QuIC, brain biopsy/autopsy. **No treatment.**\n\n### B. Defective virus\n**Definition.** A virus particle that is functionally deficient in some aspect of replication; it consists of viral nucleic acid and protein but **cannot replicate without a \"helper\" virus** that supplies the missing function. It usually results from mutation or deletion in the genome.\n\n**Example:** **Hepatitis D virus (delta virus)** – lacks its own envelope gene; uses **HBsAg** of HBV and replicates only in HBV-infected cells. (Others: adeno-associated virus needs adenovirus.)\n\n**Significance**\n1. During replication of most human viruses defective particles outnumber infectious ones (up to 100:1).\n2. Defective interfering particles can reduce yield of infectious virus and help recovery.\n3. Defective measles virus persisting in brain causes SSPE."}, {"id": 6, "n": 6, "t": "What are the differences between viruses and prions?", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | Prions | Conventional viruses |\n|---|---|---|\n| Nucleic acid | **Absent** (protein only) | Present (DNA or RNA) |\n| Protein encoded by | Host (cellular) gene | Viral genes |\n| Resistance to UV, heat, formalin | **Very resistant** | Rapidly inactivated |\n| Electron microscopy | Filamentous rods (amyloid-like fibrils) | Icosahedral/helical particles |\n| Immune response (antibody) | **None** | Present |\n| Inflammatory response | **None** | Present |\n| Mode of replication | Template-induced conformational change of host PrP^C | Replication of genome and capsid synthesis |\n| Disease type | Slow spongiform encephalopathy | Acute, chronic, latent, oncogenic |\n| Interferon | Not induced / not sensitive | Induces and is sensitive |\n| Treatment | None | Some antivirals/vaccines |"}, {"id": 7, "n": 7, "t": "Describe the steps of the viral replication cycle.", "st": 5, "src": "NMC 1; NMC 4; DU-24M; Board 1 Set 11, 15", "du": ["DU-24M"], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 1 Set 11", "Board 1 Set 15"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Viral replication** is the process by which a virus multiplies inside a susceptible host cell. It is a *one-step growth cycle* in which one virion gives rise to hundreds of progeny virions. It takes place **only within living cells** (nucleus or cytoplasm depending on the virus).\n\n```\n Virion  -->  1 ATTACHMENT  -->  2 PENETRATION  -->  3 UNCOATING\n                                                        |\n        +-----------------------------------------------+\n        v\n 4 EARLY transcription -> 5 EARLY translation (non-structural enzymes, e.g. polymerase)\n        |\n 6 GENOME REPLICATION -> 7 LATE transcription -> 8 LATE translation (capsid proteins)\n        |\n 9 CONDENSATION / ASSEMBLY (nucleocapsid formation) -> 10 MATURATION -> 11 RELEASE\n                                                                (lysis or budding)\n```\n\n**Steps**\n1. **Attachment (adsorption)** – virion binds to specific receptor on host cell; determines **tropism** (HIV gp120 → CD4; rabies → acetylcholine receptor; HSV → heparan sulfate; poliovirus → PVR).\n2. **Penetration (entry)** – by receptor-mediated endocytosis, fusion of the envelope with the cell membrane, or direct translocation across the membrane.\n3. **Uncoating** – separation of nucleic acid from the capsid so that it becomes functional.\n4. **Early transcription** – synthesis of early mRNA.\n5. **Early translation** – production of **early (non-structural) proteins** – enzymes such as polymerase; they inhibit host macromolecular synthesis.\n6. **Genome replication** – synthesis of progeny genomes.\n7. **Late transcription** and 8. **late translation** – structural (capsid) proteins.\n9. **Assembly (condensation)** – genome packaged into capsids.\n10. **Maturation** – cleavage of precursor proteins; acquisition of the envelope.\n11. **Release** – **naked viruses** by cell lysis; **enveloped viruses** by **budding** through the host membrane (the envelope is acquired during budding; cell may survive).\n\n**Eclipse period:** the interval after infection during which no infectious virus can be recovered inside the cell. **Latent period:** from infection to appearance of virus extracellularly.\n\n*Site of replication:* most **DNA viruses – nucleus** (exception: **poxvirus – cytoplasm**); most **RNA viruses – cytoplasm** (exceptions: **influenza virus and retroviruses** – nuclear step)."}, {"id": 8, "n": 8, "t": "Discuss the steps of replication of an RNA virus, with diagram.", "st": 0, "src": "DU-22N — see also #7", "du": ["DU-22N — see also #7"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**RNA virus replication** differs according to the polarity of the genome. The general sequence (attachment → penetration → uncoating → synthesis of mRNA → translation → genome replication → assembly → release) is the same as in Q7; the steps in the middle depend on the RNA type. The model below is a **positive-sense RNA virus (poliovirus)**.\n\n```\n  Virus attaches to receptor (PVR) -> penetration -> uncoating\n                      |\n       (+) strand genome RNA  = mRNA   (VPg removed; ribosome binds IRES)\n                      |\n            Translation -> one large POLYPROTEIN\n                      |\n        Viral protease cleaves it -> RNA-dependent RNA polymerase (RdRp) + capsid proteins\n                      |\n      RdRp:  (+)RNA --> (-)RNA template --> many (+)RNA copies  (in cytoplasm, on membrane vesicles)\n                      |\n       (+)RNA + capsid proteins  -> ASSEMBLY  -> progeny virions\n                      |\n       Release by CELL LYSIS (naked virus)\n```\n\n**Synthesis of mRNA in different RNA viruses**\n\n| Genome type | Example | How mRNA is made |\n|---|---|---|\n| +ssRNA | Poliovirus, HAV, rubella, dengue | Genome acts directly as mRNA; naked RNA is infectious |\n| −ssRNA | Influenza, measles, rabies | Virion-associated **RNA-dependent RNA polymerase** transcribes − strand into + mRNA; genome is not infectious by itself |\n| dsRNA | Rotavirus | Virion RNA polymerase makes mRNA from the − strand within the partially uncoated core |\n| +ssRNA with RT | HIV | **Reverse transcriptase** → DNA → integrates as provirus → host RNA polymerase makes mRNA |\n\n*Special points:* Influenza virus RNA is transcribed in the **nucleus**, uses \"cap-snatching\" from host mRNA, and releases progeny by **budding** (neuraminidase cleaves sialic acid). HIV – see Q86 for full cycle."}, {"id": 9, "n": 9, "t": "Outline the laboratory diagnosis of viral disease.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Laboratory diagnosis of viral diseases** rests on **five approaches**: (1) isolation/identification of the virus in cell culture; (2) microscopy of the specimen; (3) serology (antibody detection); (4) detection of viral antigen; (5) detection of viral nucleic acid. **Molecular methods are now the gold standard** for most infections.\n\n**1. Specimens** – blood, throat/nasal swab and washings, sputum, stool, urine, CSF, vesicle fluid/scraping, biopsy and autopsy tissue; collected early in illness in **viral transport medium** and transported cold.\n\n**2. Direct microscopy**\n- *Light microscopy:* **inclusion bodies** (Negri bodies – rabies; owl's-eye – CMV; Cowdry A – HSV/VZV), multinucleated giant cells (Tzanck smear – HSV/VZV), koilocytes (HPV).\n- *Immunofluorescence microscopy:* labelled-antibody staining (rabies, HSV, RSV, influenza).\n- *Electron microscopy / immunoelectron microscopy:* rotavirus, norovirus, poxvirus.\n\n**3. Virus isolation (culture)**\n- *Cell cultures:* **primary** (monkey kidney; 1–2 passages), **semicontinuous diploid** (human fetal fibroblasts, MRC-5; 20–50 passages), **continuous** (HeLa, HEp-2, Vero).\n- Detection by **cytopathic effect (CPE)**, haemadsorption, interference, immunofluorescence, plaque assay.\n- *Embryonated hen's egg* (influenza; allantoic/amniotic cavity), *laboratory animals* (suckling mice for Coxsackie, arboviruses) – now rarely used.\n\n**4. Serology** – IgM = current infection (single sample); **≥ 4-fold rise** of IgG between acute and convalescent sera = recent infection. Tests: ELISA, immunochromatographic tests (ICT), haemagglutination inhibition (HI), complement fixation, neutralisation, Western blot. Limitations: window period; delay; maternal antibody in infants.\n\n**5. Antigen detection** – ELISA/immunofluorescence for HBsAg, HIV p24, rotavirus in stool, NS1 antigen of dengue, RSV, influenza.\n\n**6. Nucleic acid detection** – PCR / RT-PCR / real-time PCR (HSV in CSF, HIV RNA, HCV RNA, SARS-CoV-2); also quantitative **viral load** to monitor therapy; DNA probes and hybridisation.\n\n*Viva:* CPE is not specific; serology is the mainstay in most routine laboratories of Bangladesh; PCR is the most sensitive."}, {"id": 10, "n": 10, "t": "Describe the vertical transmission of viruses.", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Vertical transmission** is the transmission of a virus **from mother to offspring** (in utero, at birth or after birth), in contrast to *horizontal* transmission (person to person).\n\n| Timing / route | Mechanism | Viruses |\n|---|---|---|\n| **Antenatal (transplacental)** | Maternal viraemia → placenta → fetus | **Rubella, CMV, parvovirus B19, VZV**, HIV, HBV, HCV, HSV (rare), Zika |\n| **Intrapartum (perinatal, at birth)** | Contact with infected blood/secretions in the birth canal | **HSV-2, HBV, HCV, HIV, HPV, CMV**, enteroviruses |\n| **Postnatal (breastfeeding)** | Infected breast milk | **CMV, HIV, HTLV-1**, HBV (rare) |\n\n**Consequences:** abortion, stillbirth, congenital malformation (rubella, CMV), congenital/neonatal infection (HSV, HBV carriage in 90% of infants), hydrops fetalis (parvovirus B19), HIV infection of the baby.\n\n**Prevention:** screening of pregnant women (HBsAg, HIV, rubella IgG), immunisation before pregnancy (rubella, MMR), HBIG + HBV vaccine to newborns of HBsAg-positive mothers, antiretroviral therapy in pregnancy, caesarean section for active genital herpes/high HIV viral load, avoid breastfeeding where appropriate."}, {"id": 11, "n": 11, "t": "Differentiate between the lytic and lysogenic cycles, using a bacteriophage as an example.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Bacteriophages** are viruses that infect bacteria. Two types of life cycle occur.\n\n| Feature | Lytic (virulent phage) cycle | Lysogenic (temperate phage) cycle |\n|---|---|---|\n| Fate of host | Cell is **lysed** and progeny phages released | Host cell **survives** and divides |\n| Phage genome | Replicates freely in cytoplasm, host DNA degraded | **Integrates** into bacterial chromosome as **prophage** |\n| Progeny phage | Produced immediately | Not produced; prophage replicates with host DNA |\n| Gene expression | All genes expressed (early/late) | Only repressor gene expressed (λ cI repressor) |\n| Induction | – | UV light/DNA damage → prophage excision → enters lytic cycle |\n| Example | T4 phage of *E. coli* | **λ (lambda) phage** of *E. coli*; CTXφ of *Vibrio cholerae* |\n| Importance | Phage therapy | **Lysogenic conversion**, transduction |\n\n**Lysogenic conversion:** new properties (usually toxin production) acquired by a bacterium from prophage genes: **diphtheria toxin** (β-phage – *C. diphtheriae*), **cholera toxin** (CTXφ), botulinum toxin (types C, D), erythrogenic toxin (*S. pyogenes*), Shiga-like toxin."}, {"id": 12, "n": 12, "t": "Name virus-like structures.", "st": 0, "src": "Board 1 Set 05", "du": [], "nmc": [], "vv": ["Board 1 Set 05"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Atypical virus-like agents** (virus-like structures) are four:\n1. **Defective viruses** – nucleic acid + protein but cannot replicate without a helper virus (HDV needs HBV).\n2. **Pseudovirions** – capsid contains **host-cell DNA** instead of viral DNA; can enter cells but cannot replicate.\n3. **Viroids** – naked circular single-stranded **RNA** only, no capsid or envelope; cause plant diseases; not human pathogens.\n4. **Prions** – infectious **proteins** without nucleic acid (CJD, kuru, scrapie)."}, {"id": 13, "n": 13, "t": "How does a virus get its envelope?", "st": 0, "src": "Board 1 Set 08", "du": [], "nmc": [], "vv": ["Board 1 Set 08"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nMost enveloped viruses acquire their lipoprotein envelope from the **host cell membrane by budding** while leaving the cell.\n1. Viral glycoproteins are synthesised and inserted into the host membrane (plasma membrane; nuclear membrane in herpesviruses; Golgi/ER in coronaviruses and bunyaviruses).\n2. The matrix protein aligns under the modified membrane and the nucleocapsid attaches to it.\n3. The membrane bulges outward and **pinches off** around the nucleocapsid – the **budding virion** – carrying lipid from the host and glycoproteins from the virus.\n\n*Viva:* Herpesviruses are the only viruses that bud from the **nuclear membrane**. The cell often survives budding (e.g. influenza, HIV, measles)."}, {"id": 14, "n": 14, "t": "Are enveloped viruses more resistant than non-enveloped viruses?", "st": 0, "src": "Board 1 Set 08", "du": [], "nmc": [], "vv": ["Board 1 Set 08"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**No.** The envelope is a lipoprotein membrane; its presence makes the virus **less stable**. Enveloped viruses are inactivated easily by drying, heat, detergents, soap, alcohol, ether and acids, so they must be transmitted in moist, direct ways (droplets, blood, sexual contact). **Non-enveloped (naked) viruses** are more resistant – to acid, bile, drying and detergents – and so spread by the faeco-oral route and survive on surfaces (polio, HAV, rotavirus, norovirus, adenovirus)."}, {"id": 15, "n": 15, "t": "Why are viruses intracellular?", "st": 0, "src": "Board 1 Set 14", "du": [], "nmc": [], "vv": ["Board 1 Set 14"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nViruses have **no ribosomes, mitochondria or metabolic enzymes**; they cannot generate ATP or synthesize proteins. They therefore depend entirely on the **host cell's energy and synthetic machinery** (ribosomes, tRNA, amino acids, nucleotides) for replication, and are **obligate intracellular parasites**; outside the cell they are inert particles."}, {"id": 16, "n": 16, "t": "Why can not viruses multiply in artificial media?", "st": 0, "src": "Board 1 Set 05", "du": [], "nmc": [], "vv": ["Board 1 Set 05"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nBecause viruses lack their own metabolic and protein-synthesis machinery (no ribosomes, no energy-yielding enzymes), they can multiply **only inside living cells**. Artificial (cell-free) media contain nutrients but no host machinery, so viruses cannot grow; they need **cell culture, embryonated eggs or experimental animals**."}, {"id": 17, "n": 17, "t": "Where do viruses replicate?", "st": 0, "src": "Board 1 Set 11", "du": [], "nmc": [], "vv": ["Board 1 Set 11"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nViruses replicate **inside susceptible host cells** – DNA viruses mostly in the **nucleus** (poxvirus in the cytoplasm); RNA viruses mostly in the **cytoplasm** (influenza virus and retroviruses have a nuclear phase)."}, {"id": 18, "n": 18, "t": "What do you mean by early proteins and late proteins?", "st": 0, "src": "Board 1 Set 16", "du": [], "nmc": [], "vv": ["Board 1 Set 16"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n- **Early proteins** are synthesised **before** replication of the viral genome. They are **non-structural** proteins – mainly enzymes (e.g. DNA/RNA polymerase) needed for genome replication, and they shut off host macromolecular synthesis. **They are not present in the mature virion.**\n- **Late proteins** are synthesised **after** genome replication. They are **structural** proteins – capsid and envelope proteins – and are **present in the virion**."}, {"id": 19, "n": 19, "t": "What are the consequences of viral infection in a host?", "st": 0, "src": "Board 1 Set 06", "du": [], "nmc": [], "vv": ["Board 1 Set 06"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Consequences of viral infection** may be considered at two levels.\n\n**A. On the infected cell**\n1. **Cell death** (cytocidal) – shut-off of host protein, RNA and DNA synthesis; lysis (CPE).\n2. **Multinucleated giant cells (syncytia)** – cell fusion (herpesviruses, measles, RSV).\n3. **Inclusion body formation** (Negri body, owl's-eye).\n4. **Malignant transformation** (EBV, HPV, HBV, HTLV-1).\n5. **Persistent/latent infection** without cell killing.\n6. **Lysogenic conversion** (bacteriophages) and change in cell surface antigens.\n7. No apparent change (inapparent infection).\n\n**B. On the host**\n1. **Inapparent (subclinical) infection** – most common (e.g. polio).\n2. **Acute apparent disease** with recovery (influenza, measles).\n3. **Latent infection** with later reactivation (herpesviruses).\n4. **Chronic/persistent infection and carrier state** (HBV, HCV, HIV).\n5. **Slow virus infection** (SSPE, PML).\n6. **Oncogenesis**.\n7. **Immunopathology/immunosuppression** (Q4).\n8. **Congenital infection** and fetal damage."}, {"id": 20, "n": 20, "t": "What are the mechanisms by which viral infections can persist?", "st": 0, "src": "Board 1 Set 20", "du": [], "nmc": [], "vv": ["Board 1 Set 20"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nViral persistence means the virus remains in the host for a long time after the acute infection. Mechanisms:\n1. **Latency with integration or episome formation** – herpesviruses (neurons, B cells); HIV provirus; HBV DNA integration.\n2. **Antigenic variation** – high mutation rate (HIV *env*, HCV E1/E2), so antibody and T-cell responses lag behind.\n3. **Infection of immunologically privileged sites** – neurons (HSV, rabies), epidermis (HPV).\n4. **Restricted viral gene expression** – infected cells nearly \"invisible\" (EBV in B cells).\n5. **Down-regulation of MHC class I** on infected cells (CMV, HSV, adenovirus, HIV Nef) so CTLs cannot recognise them.\n6. **Infection of and destruction of immune cells** (HIV – CD4+ cells; EBV – B cells).\n7. **Immune tolerance** – infection in utero/early infancy (HBV in neonates – 90% become carriers; congenital rubella, CMV).\n8. **Defective viruses** and **cell-to-cell spread** avoiding antibody (measles in SSPE)."}, {"id": 21, "n": 21, "t": "Enumerate some viruses that can cause latent infection.", "st": 0, "src": "Board 1 Set 18", "du": [], "nmc": [], "vv": ["Board 1 Set 18"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nViruses causing **latent infection** (and the usual site of latency):\n- **HSV-1** – trigeminal (cranial sensory) ganglia\n- **HSV-2** – sacral/lumbar sensory ganglia\n- **Varicella-zoster virus** – dorsal-root/cranial-nerve ganglia\n- **Epstein–Barr virus** – B lymphocytes\n- **Cytomegalovirus** – monocytes, leucocytes, kidney, salivary glands\n- **HHV-6, HHV-7** – T lymphocytes; **HHV-8** – B lymphocytes\n- Also: **HIV** (proviral DNA in CD4+ cells), adenovirus (adenoids/tonsils), JC and BK polyomaviruses (kidney)."}, {"id": 22, "n": 22, "t": "Name some neurotropic viruses.", "st": 0, "src": "Board 1 Set 20", "du": [], "nmc": [], "vv": ["Board 1 Set 20"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Neurotropic viruses** – viruses having a predilection for nervous tissue:\n- **Poliovirus** (anterior horn cells), **rabies virus** (neurons – Negri bodies), **herpes simplex virus** (HSV-1 encephalitis, trigeminal ganglion), **varicella-zoster virus**, **mumps virus**, **measles virus** (SSPE), **Coxsackie and echoviruses** (aseptic meningitis), Japanese encephalitis virus and other arboviruses, **Nipah virus**, JC virus (PML), HIV (dementia), CMV."}, {"id": 23, "n": 23, "t": "\"All viral diseases are practically diagnosed by serological test (antibody detection)\" - explain.", "st": 0, "src": "Board 1 Set 13", "du": [], "nmc": [], "vv": ["Board 1 Set 13"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Statement.** In routine practice most viral infections are diagnosed by detecting the **host's antibody** (serology) rather than by direct isolation of the virus. The reasons are:\n1. **Viruses cannot be seen by light microscope** (size 20–300 nm) – direct visualisation needs electron microscopy, which is costly and not generally available.\n2. **Viruses cannot be grown on ordinary culture media** – isolation needs cell culture, embryonated eggs or animals; these are expensive, slow (days–weeks), technically demanding and not available in most routine laboratories.\n3. Antibodies (IgM, or a ≥ 4-fold rise in IgG) appear in blood in all immunocompetent persons, are easily detected by simple, cheap tests (ELISA, ICT) in a blood sample, and often suffice for diagnosis (hepatitis A, B, C, HIV, dengue, rubella, measles, mumps, HEV).\n4. Many viral diseases are self-limiting and clinical management does not depend on virus isolation.\n\n*Limitations (worth mentioning in the answer):* the **window period**; delayed diagnosis (needs paired sera); immunocompromised patients (e.g. HIV) may not produce antibody; antibody in newborns may be maternal; antibody does not always mean active infection. Therefore **antigen detection and PCR** are now preferred where available."}, {"id": 24, "n": 24, "t": "Name 3 vaccine-preventable viral diseases.", "st": 0, "src": "Board 1 Set 19", "du": [], "nmc": [], "vv": ["Board 1 Set 19"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nThree vaccine-preventable viral diseases:\n1. **Poliomyelitis** (OPV, IPV)\n2. **Measles** (live attenuated; MR/MMR)\n3. **Hepatitis B** (recombinant HBsAg vaccine)\n\nOthers: rubella, mumps, varicella, rabies, hepatitis A, HPV infection, rotavirus gastroenteritis, influenza, Japanese encephalitis, yellow fever, COVID-19."}]}, {"id": "virology-2", "title": "General Overview of DNA & RNA Viruses", "qs": [{"id": 25, "n": 25, "t": "Name 3 DNA viruses with important diseases they produce.", "st": 0, "src": "Board 1 Set 17", "du": [], "nmc": [], "vv": ["Board 1 Set 17"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n| DNA virus | Important disease(s) |\n|---|---|\n| **Herpes simplex virus** | Gingivostomatitis, herpes labialis, genital herpes, encephalitis |\n| **Hepatitis B virus** | Acute and chronic hepatitis, cirrhosis, hepatocellular carcinoma |\n| **Human papillomavirus** | Warts, cervical carcinoma |\n| Varicella-zoster virus | Chickenpox, shingles |\n| Adenovirus | Pharyngitis, conjunctivitis, haemorrhagic cystitis |\n| Parvovirus B19 | Erythema infectiosum, aplastic crisis |\n| Poxvirus | Smallpox, molluscum contagiosum |"}, {"id": 26, "n": 26, "t": "Name 5 important RNA viruses.", "st": 0, "src": "Board 1 Set 01", "du": [], "nmc": [], "vv": ["Board 1 Set 01"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n1. **Poliovirus** – poliomyelitis\n2. **Influenza virus** – influenza\n3. **Human immunodeficiency virus (HIV)** – AIDS\n4. **Rabies virus** – rabies\n5. **Hepatitis A virus** (or hepatitis C virus, measles virus, rotavirus, dengue virus)"}, {"id": 27, "n": 27, "t": "Name 3 RNA viruses with important diseases they produce.", "st": 0, "src": "Board 1 Set 17", "du": [], "nmc": [], "vv": ["Board 1 Set 17"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n| RNA virus | Important disease |\n|---|---|\n| **Poliovirus** | Poliomyelitis |\n| **HIV** | AIDS |\n| **Rabies virus** | Rabies (hydrophobia) |\n| Rotavirus | Infantile diarrhoea |\n| Dengue virus | Dengue fever, DHF, DSS |\n| Measles virus | Measles, SSPE |"}]}, {"id": "virology-3", "title": "Herpesviruses", "qs": [{"id": 28, "n": 28, "t": "List the human herpesviruses and their associated diseases.", "st": 3, "src": "NMC 4; DU-24N; Board 1 Set 09", "du": ["DU-24N"], "nmc": ["NMC 4"], "vv": ["Board 1 Set 09"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Human herpesviruses (HHV 1–8)** are enveloped, icosahedral, double-stranded DNA viruses of the family *Herpesviridae*.\n\n| Virus | Subfamily | Diseases |\n|---|---|---|\n| **HSV-1 (HHV-1)** | α | Gingivostomatitis, recurrent herpes labialis (cold sore), keratoconjunctivitis, **encephalitis** (temporal lobe), herpetic whitlow, herpes gladiatorum, eczema herpeticum, pharyngitis |\n| **HSV-2 (HHV-2)** | α | **Genital herpes**, neonatal herpes, aseptic meningitis, (association with cervical carcinoma) |\n| **VZV (HHV-3)** | α | **Chickenpox** (primary); **herpes zoster/shingles** (reactivation); post-herpetic neuralgia; congenital varicella |\n| **EBV (HHV-4)** | γ | **Infectious mononucleosis**, Burkitt's lymphoma, nasopharyngeal carcinoma, Hodgkin and other lymphomas, oral hairy leukoplakia, post-transplant lymphoproliferative disease |\n| **CMV (HHV-5)** | β | **Congenital CMV (cytomegalic inclusion disease)**, mononucleosis-like illness (heterophile-negative), retinitis/pneumonitis/colitis in the immunocompromised |\n| **HHV-6 (HHV-6A/B)** | β | **Roseola infantum** (exanthem subitum, sixth disease), febrile convulsions |\n| **HHV-7** | β | Roseola infantum (second cause) |\n| **HHV-8 (KSHV)** | γ | **Kaposi's sarcoma**, primary effusion lymphoma, multicentric Castleman's disease |"}, {"id": 29, "n": 29, "t": "Mention the general characteristics of herpesvirus.", "st": 2, "src": "DU-24N; Board 1 Set 09", "du": ["DU-24N"], "nmc": [], "vv": ["Board 1 Set 09"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\nGeneral characteristics of herpesviruses:\n1. **Enveloped**, spherical virion with icosahedral capsid (150–200 nm); tegument between capsid and envelope.\n2. Genome: **linear double-stranded DNA**.\n3. Replicate in the **nucleus**, forming **intranuclear inclusion bodies** (Cowdry type A); the envelope is acquired by **budding through the nuclear membrane** – the only viruses to do so.\n4. Cause **multinucleated giant cells** in tissue culture and lesions (Tzanck smear).\n5. Cause **primary infection followed by latency**; reactivation occurs, particularly in the immunosuppressed (**lifelong persistence**).\n6. Do not carry their own RNA polymerase; encode their own DNA polymerase and thymidine kinase (target of acyclovir).\n7. Each human herpesvirus has **one serotype** (HSV has two types).\n8. Several are **oncogenic** (EBV, HHV-8, HSV-2 association).\n9. Sensitive to ether, detergents and heat; transmitted by close contact (saliva, genital, vertical, transplantation)."}, {"id": 30, "n": 30, "t": "Name the viruses which cause congenital malformation.", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nViruses that can cause **congenital malformation** (teratogenic viruses – the TORCH group):\n1. **Rubella virus** – most important (cataract, deafness, PDA/VSD)\n2. **Cytomegalovirus** – commonest congenital viral infection (microcephaly, deafness, chorioretinitis)\n3. **Herpes simplex virus**\n4. **Varicella-zoster virus** (congenital varicella syndrome)\n5. Parvovirus B19 (hydrops fetalis), Zika virus (microcephaly)."}, {"id": 31, "n": 31, "t": "Name the Herpes virus family with their site of latency.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Herpesvirus | Usual site of latency |\n|---|---|\n| **HSV-1** | Trigeminal (cranial sensory) ganglia |\n| **HSV-2** | Sacral (lumbar–sacral dorsal-root) ganglia |\n| **VZV** | Dorsal-root ganglia (thoracic) and cranial-nerve (trigeminal) ganglia |\n| **EBV** | B lymphocytes (memory B cells) |\n| **CMV** | Monocytes/macrophages, leucocytes, kidney, salivary glands |\n| **HHV-6, HHV-7** | T lymphocytes (HHV-7 also salivary glands) |\n| **HHV-8** | B lymphocytes |"}, {"id": 32, "n": 32, "t": "Differentiate between herpes simplex type 1 and type 2 infections.", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | HSV-1 | HSV-2 |\n|---|---|---|\n| Skin lesions | Vesicles **above the waist** (lips, face) | Vesicles **below the waist** (genitals, buttocks) |\n| Main diseases | Gingivostomatitis, herpes labialis, keratoconjunctivitis, **encephalitis** (temporal lobe), whitlow | **Genital herpes**, **neonatal herpes**, aseptic meningitis |\n| Eye | Keratoconjunctivitis (corneal ulcer, blindness) | Rare |\n| CNS | Encephalitis | Meningitis |\n| Neonate | Rare; acquired postnatally | Skin, eye, CNS and disseminated infection from birth canal |\n| Transmission | Saliva, contact, droplets | Sexual contact; vertical (birth canal) |\n| Site of latency | Trigeminal ganglion | Sacral ganglia |\n| Age of acquisition | Childhood | After puberty (sexual activity) |\n\n*Laboratory differentiation:* restriction endonuclease patterns of DNA, type-specific monoclonal antibodies/PCR; clinically by site of lesion."}, {"id": 33, "n": 33, "t": "Classify oncogenic viruses.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Oncogenic viruses** are viruses capable of causing tumours.\n\n| Group | Virus | Associated tumour |\n|---|---|---|\n| **DNA viruses** | **Human papillomavirus** 16, 18 | **Carcinoma of cervix**, anal, penile, oropharyngeal cancers |\n| | HPV 6, 11 | Genital warts (benign) |\n| | **Epstein–Barr virus** | Burkitt's lymphoma, nasopharyngeal carcinoma, Hodgkin's lymphoma, post-transplant lymphoma |\n| | **Hepatitis B virus** | **Hepatocellular carcinoma** |\n| | **HHV-8 (KSHV)** | Kaposi's sarcoma, primary effusion lymphoma |\n| | Merkel cell polyomavirus | Merkel cell carcinoma |\n| **RNA viruses** | **HTLV-1** | Adult T-cell leukaemia/lymphoma |\n| | **Hepatitis C virus** | Hepatocellular carcinoma |\n\n*Mechanisms:* HPV – E6 inactivates **p53**, E7 inactivates **Rb**; HBV – integration and persistent regeneration; HTLV-1 – *Tax* protein; HHV-8 – nuclear antigen inactivates Rb; EBV – B-cell transformation, c-myc translocation t(8;14)."}, {"id": 34, "n": 34, "t": "Compare and contrast the diseases caused by Varicella-Zoster Virus during primary infection versus reactivation.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Feature | **Primary infection: Varicella (chickenpox)** | **Reactivation: Herpes zoster (shingles)** |\n|---|---|---|\n| Occurrence | First exposure, mostly in children; non-immune persons | Later in life (usually > 50 years), immunosuppression, stress, trauma |\n| Source of virus | Exogenous – respiratory droplets; contact with lesion | **Endogenous** – virus latent in dorsal-root/cranial ganglia |\n| Spread | Respiratory mucosa → lymph nodes → primary viraemia → liver/spleen → secondary viraemia → skin | Retrograde axonal flow back down a sensory nerve to the skin |\n| Rash | **Generalised**, centripetal, crops of macule→papule→vesicle→pustule→crust (\"dew-drop on a rose petal\"); lesions at different stages | **Unilateral, dermatomal**, painful vesicles (thoracic, trigeminal – ophthalmic division) |\n| Systemic features | Fever, malaise | Severe radicular pain precedes rash |\n| Complications | Pneumonia, encephalitis, secondary bacterial infection, **congenital varicella syndrome**, Reye's syndrome | **Post-herpetic neuralgia**, zoster ophthalmicus, Ramsay Hunt syndrome |\n| Infectivity | Highly infectious | Less infectious (contact with vesicular fluid → chickenpox in susceptible persons) |\n| Immunity | Lifelong | Occurs despite immunity; usually one episode |\n| Treatment | Acyclovir in adults/immunocompromised | Acyclovir/valacyclovir |\n| Prevention | Live attenuated varicella vaccine (Varivax); VZIG | Zoster vaccine (recombinant) |"}, {"id": 35, "n": 35, "t": "*Vignette: a 20-year-old female with fever, malaise and a rash spreading from trunk to face/limbs (macules, papules, vesicles); Tzanck smear shows multinucleated giant cells.* What is the most probable diagnosis?", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Most probable diagnosis: Varicella (chickenpox).** The centripetal rash that evolves through macules, papules and vesicles, together with fever, malaise and the finding of **multinucleated giant cells in a Tzanck smear** (scraping of the vesicle base), is characteristic."}, {"id": 36, "n": 36, "t": "Name the virus responsible (VZV).", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Varicella-zoster virus (VZV; human herpesvirus 3)** – an enveloped, icosahedral, double-stranded DNA virus of the family *Herpesviridae* (subfamily Alphaherpesvirinae)."}, {"id": 37, "n": 37, "t": "Mention the mode of transmission of this virus.", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n1. **Respiratory route** – airborne droplets from an infected person (the main route; infectious from 1–2 days before the rash until crusting).\n2. **Direct contact** with vesicular fluid of chickenpox or zoster lesions.\n3. Transplacental (congenital varicella) and perinatal transmission."}]}, {"id": "virology-4", "title": "Hepatitis Viruses", "qs": [{"id": 38, "n": 38, "t": "List the medically important hepatitis viruses.", "st": 2, "src": "DU-19M; Board 1 Set 10", "du": ["DU-19M"], "nmc": [], "vv": ["Board 1 Set 10"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Hepatotropic (primary hepatitis) viruses:**\n1. **Hepatitis A virus (HAV)** – Picornaviridae (*Hepatovirus*), naked ssRNA\n2. **Hepatitis B virus (HBV)** – Hepadnaviridae, partly dsDNA\n3. **Hepatitis C virus (HCV)** – Flaviviridae, enveloped ssRNA\n4. **Hepatitis D virus (HDV, delta)** – defective RNA virus (*Deltavirus*)\n5. **Hepatitis E virus (HEV)** – Hepeviridae, naked ssRNA\n\n**Other viruses that can cause hepatitis:** EBV, CMV, HSV, yellow fever virus, rubella, enteroviruses.\n\n*Viva:* Faeco-oral: **A and E**; blood-borne/sexual/vertical: **B, C, D**."}, {"id": 39, "n": 39, "t": "Describe the routes of transmission of hepatitis viruses.", "st": 2, "src": "DU-19M; Board 1 Set 15", "du": ["DU-19M"], "nmc": [], "vv": ["Board 1 Set 15"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n| Virus | Routes of transmission |\n|---|---|\n| **HAV** | **Faeco-oral** – contaminated water and food (raw shellfish), hands; children in crowded conditions |\n| **HEV** | **Faeco-oral** – contaminated drinking water (epidemics); zoonotic (pig meat, genotype 3) |\n| **HBV** | **Parenteral** – transfusion of unscreened blood, contaminated needles/syringes, IV drug use, tattooing, acupuncture, dental and surgical instruments; **sexual**; **vertical** – transplacental, during delivery (commonest), breast milk |\n| **HCV** | **Parenteral** – unscreened blood/blood products, IV drug use, needle-stick injury (~3%), iatrogenic; sharing razors/toothbrushes; vertical (~3–5%) and sexual (uncommon) |\n| **HDV** | As HBV (requires HBV co-infection or superinfection) |"}, {"id": 40, "n": 40, "t": "Name the agents causing hepatitis.", "st": 0, "src": "DU-19M", "du": ["DU-19M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Agents causing hepatitis**\n- *Viral (A–E):* HAV, HBV, HCV, HDV, HEV; also EBV, CMV, HSV, yellow fever virus, rubella virus, enteroviruses.\n- (Non-viral causes such as leptospires, *Entamoeba histolytica*, drugs and alcohol are also known.)"}, {"id": 41, "n": 41, "t": "Give the Ag-Ab pattern/serological markers of Hepatitis B and Hepatitis C, and their significance/interpretation and infection outcomes in children and adults.", "st": 8, "src": "NMC 1; NMC 4; DU-24M, 22M, 25N, 19M; Board 1 Set 15, 16", "du": ["DU-24M", "DU-22M", "DU-25N", "DU-19M"], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 1 Set 15", "Board 1 Set 16"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### A. HEPATITIS B – structure and antigens\n- **HBsAg** – surface (envelope) antigen; first marker to appear; the **indicator of infection**; ≥ 6 months = chronic carrier.\n- **HBcAg** – core antigen; not found free in serum (only in hepatocytes).\n- **HBeAg** – secreted from core; marker of **active replication and high infectivity**.\n- **Anti-HBs** – protective antibody (appears after recovery or after vaccination).\n- **Anti-HBc IgM** – earliest antibody; marker of acute/recent infection and the **window period**; **anti-HBc IgG** – persists for life.\n- **Anti-HBe** – indicates decline of infectivity.\n- **HBV DNA** – direct evidence of replicating virus (viral load).\n\n**Time course in acute self-limited hepatitis B** (weeks after exposure)\n\n| Marker | Appears | Disappears / persists |\n|---|---|---|\n| HBsAg | 4–6 weeks (before symptoms) | Clears in 3–6 months |\n| HBeAg | Soon after HBsAg | Clears before HBsAg |\n| Anti-HBc IgM | At onset of symptoms | Falls in ~6 months |\n| **Window period** | HBsAg negative **and** anti-HBs not yet detectable – only anti-HBc IgM (± anti-HBe) positive | Lasts a few weeks |\n| Anti-HBe | After HBeAg clears | Persists |\n| Anti-HBc IgG | After IgM | **Lifelong** |\n| Anti-HBs | After the window period (months) | **Lifelong** – protective |\n\n### Interpretation table (serological profile)\n\n| Stage / condition | HBsAg | HBeAg | Anti-HBc IgM | Anti-HBc IgG | Anti-HBe | Anti-HBs | HBV DNA | Interpretation |\n|---|---|---|---|---|---|---|---|---|\n| Incubation / early acute | + | + | ± | – | – | – | + | Active infection, highly infectious |\n| **Acute hepatitis** | + | + | **+** | – / + | – | – | + | Acute infection; anti-HBc IgM is the surest marker |\n| **Window period** | – | – | **+** | + | ± | – | ± | HBsAg gone, anti-HBs not yet detectable; diagnosed by **anti-HBc IgM** |\n| **Recovery (past infection)** | – | – | – | + | + | **+** | – | Immune; lifelong protection |\n| **Chronic carrier – replicative** | + (> 6 mo) | + | – | + | – | – | high | Highly infectious, risk of cirrhosis/HCC |\n| **Chronic – non-replicative (inactive carrier)** | + | – | – | + | + | – | low/– | Low infectivity |\n| **Vaccinated person** | – | – | – | – | – | **+ only** | – | Immunised (anti-HBs ≥ 10 mIU/mL) |\n\n### B. HEPATITIS C – laboratory markers\n| Marker | Meaning |\n|---|---|\n| **Anti-HCV antibody (ELISA)** | Screening; does **not** distinguish acute, chronic or resolved infection; may be negative for 8–12 weeks (window) |\n| **HCV RNA (RT-PCR)** | **Confirms active infection**; positive within 1–2 weeks of exposure; used for **viral load** and monitoring therapy |\n| HCV core antigen | Alternative to RNA for active infection |\n| Genotyping | Selects antiviral regimen (6 genotypes) |\n| RIBA (re
