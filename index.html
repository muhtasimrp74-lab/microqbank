combinant immunoblot) | Older supplemental test |\n\n| Profile | Interpretation |\n|---|---|\n| Anti-HCV –, HCV RNA + | Very early acute infection (window) |\n| Anti-HCV +, HCV RNA + | Current (acute or chronic) infection |\n| Anti-HCV +, HCV RNA – | Resolved infection (or false-positive screen) |\n\n### Outcome of infection\n\n| | **HBV** | **HCV** |\n|---|---|---|\n| **Adults** | Acute hepatitis (90–95%) → recovery; **< 5% chronic**; < 1% fulminant | Mostly asymptomatic; **75–85% become chronic** |\n| **Children** | Age 1–5 yr: 25–50% chronic | High rate of chronicity as in adults |\n| **Neonates/infants** | **~90% become chronic carriers** (immature immune system/tolerance) | ~3–5% transmission; most infected infants have chronic infection |\n| **Complications** | Chronic active hepatitis → cirrhosis → **hepatocellular carcinoma**; fulminant hepatitis (< 1%) | Chronic hepatitis, cirrhosis (10–20%), HCC |"}, {"id": 42, "n": 42, "t": "Why is hepatitis C more dangerous than hepatitis B?", "st": 3, "src": "DU-22M, 19M; Board 1 Set 17", "du": ["DU-22M", "DU-19M"], "nmc": [], "vv": ["Board 1 Set 17"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Hepatitis C is more dangerous than hepatitis B because:**\n1. **\"Silent killer\"** – acute infection is mostly asymptomatic, so it is not diagnosed; damage progresses silently.\n2. **Very high rate of chronicity** – 75–85% become chronic (compared with < 5% of adults with HBV); 10–20% of these develop **cirrhosis**, and later **hepatocellular carcinoma**; alcohol hastens progression.\n3. **No vaccine** available (high antigenic variation of envelope glycoproteins E1/E2; six genotypes) whereas an effective vaccine exists for HBV.\n4. **No hyperimmune globulin** and no effective post-exposure prophylaxis.\n5. Antibodies are **not protective**, so reinfection can occur.\n*(However, HCV is now curable with direct-acting antivirals, while HBV can only be suppressed.)*"}, {"id": 43, "n": 43, "t": "Describe the post-exposure prophylaxis of HBV. — Also asked as a scenario: a nurse has a needle-stick injury from an HBV-infected patient — how can she protect herself?", "st": 2, "src": "DU-25N; Board 1 Set 18", "du": ["DU-25N"], "nmc": [], "vv": ["Board 1 Set 18"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### Post-exposure prophylaxis (PEP) of hepatitis B\nThe principle is **passive–active immunisation** and should begin **as early as possible, within 24 hours (not later than 7 days)**.\n\n1. **First aid (needle-stick/mucosal exposure):** let the wound bleed freely, wash with soap and running water; flush mucosa/eyes with water or saline; do not squeeze or scrub; apply antiseptic.\n2. **Report the incident**; test the source patient for **HBsAg** (± HIV, anti-HCV) and the exposed person for HBsAg, anti-HBs, HIV.\n3. **Management according to vaccination status of the exposed person:**\n\n| Exposed person | Source HBsAg positive/unknown high-risk |\n|---|---|\n| Unvaccinated | **HBIG** (0.06 mL/kg IM) **plus** start HBV vaccine series (0, 1, 6 months) at a different site |\n| Previously vaccinated, anti-HBs ≥ 10 mIU/mL | No treatment |\n| Vaccinated, anti-HBs < 10 mIU/mL (non-responder) | HBIG + booster dose of vaccine (or HBIG ×2) |\n\n4. **HBIG** (hepatitis B immune globulin) – high-titre anti-HBs gives immediate passive protection; **vaccine** (recombinant HBsAg) gives long-term active immunity.\n5. **Newborn of HBsAg-positive mother:** HBIG (0.5 mL) + first vaccine dose within 12 hours of birth.\n\n**Scenario – nurse with needle-stick injury from an HBV-infected patient:** immediate first aid → report → check her own anti-HBs/vaccination status → if non-immune, give **HBIG + HBV vaccine** (different sites) and complete the 3-dose schedule → follow-up testing at 3–6 months.\n*(Ref: Levinson; CDC/WHO guidance)*"}, {"id": 44, "n": 44, "t": "Define the window period of HIV/HBV infection(s) and its clinical significance.", "st": 3, "src": "NMC 1; DU-22N; Board 1 Set 18", "du": ["DU-22N"], "nmc": ["NMC 1"], "vv": ["Board 1 Set 18"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Window period** – the interval between the **disappearance of an antigen** (or of the virus from detectable levels) and the **appearance of detectable antibody** against it, during which the infected person is infectious but the usual serological test is negative.\n\n**Hepatitis B:** HBsAg has disappeared but **anti-HBs is not yet detectable** (several weeks). HBsAg-negative serum may therefore be mistaken for non-infected. **Anti-HBc IgM is always positive** in this phase and is the marker used for diagnosis.\n\n**HIV:** the period after infection (≈ 3–12 weeks; up to 6 months with older assays) during which the blood contains virus/p24 antigen but **antibody is not yet detectable** by ELISA – the person is highly infectious.\n\n**Clinical significance**\n1. **False-negative** result and missed diagnosis – a negative test does not exclude infection; **repeat after 3 months** or use p24 antigen/NAT.\n2. Infected persons transmit the infection unknowingly; **transfusion-transmitted** infection from donors in the window period – hence p24/NAT screening of blood.\n3. Alternate markers needed: anti-HBc IgM for HBV; p24 antigen/HIV RNA PCR for HIV.\n4. Counselling and repeat testing of exposed persons."}, {"id": 45, "n": 45, "t": "Which HBV serological marker will be positive in all stages of HBV infection?", "st": 0, "src": "Board 1 Set 09", "du": [], "nmc": [], "vv": ["Board 1 Set 09"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Anti-HBc (core antibody)** – IgM in the acute and window phase and **IgG thereafter (lifelong)**. It is present in acute infection, window period, chronic infection and after recovery, and is **absent only in vaccinated persons**. (HBsAg may disappear and anti-HBs may not be detectable, but anti-HBc remains.)"}, {"id": 46, "n": 46, "t": "Why is this specific HBV serological marker positive in all stages?", "st": 0, "src": "Board 1 Set 09", "du": [], "nmc": [], "vv": ["Board 1 Set 09"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n1. **HBcAg is intensely immunogenic**; the antibody response to the core appears **early, with the onset of symptoms, and persists for life**.\n2. During the **window period** HBsAg has cleared and anti-HBs has not yet appeared, but anti-HBc is positive; IgM turns into IgG and remains.\n3. Anti-HBc is **non-neutralising and not induced by the vaccine** (vaccine contains only HBsAg); it therefore signals true exposure to the virus, not immunisation.\n4. In chronic infection anti-HBc remains as the virus continues to replicate."}, {"id": 47, "n": 47, "t": "A patient with Jaundice is found both HBsAg and HBeAg positive - What is your interpretation?", "st": 0, "src": "Board 1 Set 01", "du": [], "nmc": [], "vv": ["Board 1 Set 01"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Interpretation:** the patient has **hepatitis B infection with active viral replication and high infectivity** – HBsAg shows infection; HBeAg shows replicating virus.\n- To differentiate: **anti-HBc IgM positive** → acute hepatitis B; **HBsAg persisting > 6 months with anti-HBc IgG** → chronic hepatitis B (replicative phase).\n- Next steps: HBV DNA, LFT (ALT), HDV co-infection, HIV/HCV screening, treat if chronic (tenofovir/entecavir); screen contacts and vaccinate; counselling."}, {"id": 48, "n": 48, "t": "A person is given HBV vaccine. How will you detect the efficacy of the vaccine?", "st": 0, "src": "Board 1 Set 10", "du": [], "nmc": [], "vv": ["Board 1 Set 10"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Detection of vaccine efficacy:** measure **anti-HBs (IgG) titre** 1–2 months after the last (3rd) dose.\n- **Anti-HBs ≥ 10 mIU/mL** (protective) = adequate response; HBsAg and anti-HBc should be **negative**.\n- **< 10 mIU/mL** = non-responder; repeat the series/give a booster and re-test.\n- Immunised persons show anti-HBs **alone** in the serological profile."}, {"id": 49, "n": 49, "t": "\"HCV is a silent killer\" - explain.", "st": 0, "src": "Board 1 Set 07", "du": [], "nmc": [], "vv": ["Board 1 Set 07"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nHCV is called a **\"silent killer\"** because:\n1. The acute infection is **asymptomatic or mild** in the majority; the patient seldom seeks medical care.\n2. 75–85% proceed to chronic infection without symptoms for 10–30 years.\n3. Silent progression to **chronic active hepatitis, cirrhosis and hepatocellular carcinoma**; the diagnosis is often made only at the stage of advanced liver disease.\n4. No vaccine and no protective immunity."}, {"id": 50, "n": 50, "t": "What are the complications of HCV infection?", "st": 0, "src": "Board 1 Set 19", "du": [], "nmc": [], "vv": ["Board 1 Set 19"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Complications of HCV infection**\n1. **Chronic hepatitis** (70–85%)\n2. **Cirrhosis** (10–20% of chronic cases) with portal hypertension, ascites, oesophageal varices\n3. **Hepatocellular carcinoma**\n4. Fulminant hepatitis (rare)\n5. **Extrahepatic:** mixed essential cryoglobulinaemia, membranoproliferative glomerulonephritis, porphyria cutanea tarda, lymphoma\n6. Liver failure and death"}, {"id": 51, "n": 51, "t": "How will you diagnose a case of HCV infection in the laboratory?", "st": 2, "src": "Board 1 Set 10, 19", "du": [], "nmc": [], "vv": ["Board 1 Set 10", "Board 1 Set 19"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Laboratory diagnosis of HCV** (specimen: blood)\n1. **Screening: anti-HCV antibody** by ELISA/ICT (rapid test) – does not differentiate acute, chronic, past infection; may be negative in the early window period.\n2. **Confirmation: HCV RNA by RT-PCR** – demonstrates active infection (positive within 1–2 weeks); **quantitative PCR = viral load**; also genotyping for treatment.\n3. **HCV core antigen** assay.\n4. Supplementary test: RIBA.\n5. **Liver function tests:** raised ALT (fluctuating) and AST; bilirubin; prothrombin time.\n6. Chronic infection: persistent HCV RNA for ≥ 6 months with raised ALT and anti-HCV positive; liver biopsy/elastography to assess fibrosis."}, {"id": 52, "n": 52, "t": "Mention the clinical significance of HDV.", "st": 0, "src": "Board 1 Set 17", "du": [], "nmc": [], "vv": ["Board 1 Set 17"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Clinical significance of HDV (hepatitis delta virus)**\n1. A **defective RNA virus** that needs **HBV** (uses HBsAg as its envelope) – it occurs **only in persons infected with HBV**.\n2. **Co-infection** (simultaneous HBV + HDV) – acute hepatitis, usually more severe than HBV alone, mostly self-limited.\n3. **Superinfection** (HDV in a chronic HBV carrier) – **severe**, with high rate of **fulminant hepatitis, rapidly progressive chronic hepatitis, cirrhosis and liver failure**.\n4. Prevented by **HBV vaccination** (no separate vaccine). Treatment: pegylated interferon; no cure of carrier state."}, {"id": 53, "n": 53, "t": "How can you diagnose HDV in the laboratory?", "st": 0, "src": "Board 1 Set 10", "du": [], "nmc": [], "vv": ["Board 1 Set 10"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Laboratory diagnosis of HDV**\n1. **Anti-HDV antibody** (IgM in acute, IgG in chronic) by ELISA – the usual test; **total anti-HDV**.\n2. **HDV antigen (delta antigen)** in serum – appears only transiently.\n3. **HDV RNA by RT-PCR** – confirms active infection and for monitoring.\n4. **HBsAg** is always positive; **anti-HBc IgM** positive = co-infection, negative = superinfection of a chronic carrier.\n5. Immunohistochemical detection of HDAg in liver biopsy."}]}, {"id": "virology-5", "title": "Orthomyxoviruses & Paramyxoviruses", "qs": [{"id": 54, "n": 54, "t": "What are the main differences between orthomyxoviruses and paramyxoviruses?", "st": 4, "src": "NMC 1; DU-25k, 23N, 20Nov/July", "du": ["DU-25k", "DU-23N", "DU-20Nov/July"], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Property | Orthomyxoviruses | Paramyxoviruses |\n|---|---|---|\n| Members | Influenza A, B, C | Measles, mumps, RSV, parainfluenza |\n| Genome | ssRNA, negative-sense | ssRNA, negative-sense |\n| **Segmentation** | **Segmented (8 segments)** | **Non-segmented (single piece)** |\n| Capsid | Helical | Helical |\n| Virion size | 80–120 nm | 150–300 nm (larger, pleomorphic) |\n| Envelope spikes | **HA and NA on separate spikes** | HN (or H) and **F (fusion) protein**; HA and NA on the same spike |\n| Fusion protein / giant cells | Absent – **no giant cell** | **Present – giant cells/syncytia formed** |\n| Site of RNP synthesis/replication | **Nucleus** | **Cytoplasm** |\n| Genetic reassortment | **Yes** (antigenic shift) | No |\n| Antigenic stability | **Unstable** (shift and drift) | **Stable** (one serotype for measles, mumps) |\n| Animal reservoir | Influenza A – birds, pigs | Mostly human only |\n| Vaccine | Needs annual reformulation | Stable, long-lasting live vaccine (measles, mumps) |"}, {"id": 55, "n": 55, "t": "Explain antigenic shift and antigenic drift, with examples.", "st": 7, "src": "NMC 1; NMC 4; DU-23N, 26M, 25M, 20Nov/July; Board 1 Set 08", "du": ["DU-23N", "DU-26M", "DU-25M", "DU-20Nov/July"], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 1 Set 08"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\nBoth are changes in the antigenicity of **haemagglutinin (HA)** and **neuraminidase (NA)** of **influenza A virus**. They explain why influenza recurs and why immunity is short-lived.\n\n| Feature | **Antigenic drift** | **Antigenic shift** |\n|---|---|---|\n| Nature of change | **Minor** | **Major (abrupt)** |\n| Genetic basis | **Point mutations** in HA/NA genes | **Genetic reassortment** – exchange of whole RNA segments between two viruses (human + avian/swine) in a doubly infected cell |\n| Types affected | Influenza A and B | **Influenza A only** (B and C lack an animal reservoir) |\n| Consequence | **Epidemics** (seasonal, yearly) | **Pandemics** |\n| Population immunity | Partially protective | None – new subtype |\n| Vaccine | Must be reformulated every year | New vaccine required |\n| Examples | Yearly H3N2 and H1N1 variants | 1957 **H2N2** (Asian flu); 1968 **H3N2** (Hong Kong flu); 2009 **H1N1** (swine-origin pandemic virus); H5N1 avian virus (potential) |\n\n**Mechanism of shift:** a pig (or person) infected simultaneously with human and avian influenza virus → mixed packaging of the eight RNA segments → progeny with a novel HA/NA combination.\n\n**Clinical importance:** (1) pandemics with high mortality (1918 – H1N1); (2) vaccination is not permanently effective; (3) surveillance by WHO and annual change in vaccine strains (two A strains + B strain).\n\n*Viva:* \"Influenza B does not cause pandemics\" – because it undergoes **only drift, not shift**."}, {"id": 56, "n": 56, "t": "Outline the criteria for a virus to cause a pandemic infection.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nA virus can cause a **pandemic** (worldwide epidemic) when it meets the following criteria (WHO):\n1. **Novel antigen** – a new subtype with a new haemagglutinin (± neuraminidase) against which the population has **no pre-existing immunity** (arises by **antigenic shift**, e.g. human + avian virus reassortment).\n2. **Ability to infect humans and cause disease** (virulence/pathogenicity) – able to bind human receptors, replicate efficiently and cause significant illness.\n3. **Efficient and sustained human-to-human transmission** – readily by the respiratory route (droplets/aerosol), so that spread continues in the community.\n4. **Rapid global spread** in many regions/countries (WHO phase 6) because of a large susceptible population and air travel.\n\n*Examples:* 1918 H1N1 (Spanish flu), 1957 H2N2, 1968 H3N2, 2009 H1N1 and COVID-19 (SARS-CoV-2, a novel coronavirus; no immunity to spike antigen)."}, {"id": 57, "n": 57, "t": "What is the relationship between measles and subacute sclerosing panencephalitis (SSPE)?", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Subacute sclerosing panencephalitis (SSPE)** is a rare, **fatal, progressive degenerative disease of the brain** caused by a **defective (mutant) measles virus persisting in neurons**.\n- Follows measles infection **after a latent period of 5–10 years** (infection usually before 2 years of age).\n- The virus is defective in the M (matrix) gene and cannot form complete virions, so persists by cell-to-cell spread.\n- *Clinical:* personality change, intellectual deterioration, myoclonic jerks, seizures, blindness, coma → death.\n- *Diagnosis:* very high **anti-measles antibody titre in CSF and serum**, characteristic EEG (periodic complexes), brain biopsy (Cowdry A inclusions); no effective treatment.\n- **Prevention: measles vaccination** (SSPE is far rarer after vaccination than after natural measles)."}, {"id": 58, "n": 58, "t": "Discuss the morphology and pathogenesis of influenza virus infection.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n### Morphology of influenza virus\n- **Spherical/pleomorphic**, 80–120 nm; **helical nucleocapsid**, enveloped.\n- **Genome:** single-stranded, negative-sense RNA in **8 segments**, each coding one or two proteins; associated with nucleoprotein (NP) and polymerase (PB1, PB2, PA).\n- **Envelope:** lipid bilayer with two types of spikes – **haemagglutinin (HA)** (attachment; 16 subtypes) and **neuraminidase (NA)** (release; 9 subtypes); **M2** ion channel; **matrix protein (M1)** beneath the envelope.\n- **Types:** A, B, C (based on NP/M antigens). Subtypes of A named by HA and NA (H1N1, H3N2, H5N1).\n- **Haemagglutinin:** binds sialic acid receptors; target of neutralising antibody; **agglutinates RBC** (HI test).\n- **Neuraminidase:** cleaves sialic acid – releases progeny, degrades mucus, prevents aggregation.\n\n### Pathogenesis\n1. Transmission by **airborne droplets**; incubation 1–4 days.\n2. **Neuraminidase** liquefies the protective mucus layer; HA binds to sialic acid receptors of **respiratory epithelial cells** (ciliated cells).\n3. Virus replicates in the epithelium of the upper and lower respiratory tract → **cell death**, desquamation of the epithelium.\n4. Infection stays **localised to the respiratory tract (no viraemia)**; systemic symptoms (fever, severe myalgia, headache) result from **cytokines (IL-1, IL-6, TNF, interferon)**.\n5. **Complications:** primary viral interstitial pneumonia; **secondary bacterial pneumonia** (*S. aureus, S. pneumoniae, H. influenzae*) – loss of ciliary clearance; **Reye's syndrome** (aspirin in children), myocarditis, Guillain–Barré syndrome.\n6. Recovery via interferon, NK cells, cytotoxic T cells and antibody to HA; immunity is **short-lived** (antigenic change).\n\n*Lab diagnosis:* nasal/throat swab – **RT-PCR** (best), rapid antigen test, culture in MDCK cells/eggs (HI), paired sera.\n*Treatment:* oseltamivir, zanamivir (A and B); amantadine/rimantadine (A only). *Prevention:* annual inactivated or live vaccine."}, {"id": 59, "n": 59, "t": "State the mode of transmission of measles.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mode of transmission of measles**\n1. **Respiratory droplets** and aerosols from coughing and sneezing (highly contagious – R₀ 12–18).\n2. Infectious from **4 days before to 4 days after the onset of rash** (maximum in the prodromal/catarrhal stage).\n3. Direct contact with nasopharyngeal secretions; rarely fomites.\nHumans are the only natural reservoir; no carrier state."}, {"id": 60, "n": 60, "t": "Outline the complications of measles virus infection.", "st": 5, "src": "NMC 1; NMC 4; DU-26M, 25M; Board 1 Set 07", "du": ["DU-26M", "DU-25M"], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 1 Set 07"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Complications of measles**\n1. **Respiratory:** secondary bacterial pneumonia (commonest cause of death); primary giant-cell (Hecht) pneumonia; laryngotracheobronchitis (croup).\n2. **Otitis media** (bacterial).\n3. **Encephalitis** (1 in 1000 cases) – post-infectious.\n4. **Subacute sclerosing panencephalitis (SSPE)** – years later.\n5. **Gastrointestinal:** diarrhoea, dehydration, malnutrition; **noma (cancrum oris)** in the malnourished.\n6. **Ocular:** keratitis, corneal ulcer and blindness in vitamin-A deficiency.\n7. Activation/worsening of **tuberculosis** (suppression of cell-mediated immunity).\n8. **In pregnancy:** abortion, premature labour, stillbirth (not congenital malformation).\n9. Black (haemorrhagic) measles; myocarditis (rare).\n*Risk factors:* malnutrition, vitamin A deficiency, immunocompromise (AIDS), infancy and adulthood."}, {"id": 61, "n": 61, "t": "State the prevention of measles.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Prevention of measles**\n1. **Active immunisation** – live attenuated measles vaccine (Edmonston–Zagreb/Schwarz strain), subcutaneous; **Measles–Rubella (MR)/MMR**. WHO recommends the first dose at **9 months** in endemic countries (Bangladesh EPI: MR at 9 and 15 months); a second dose is essential – **95% coverage** is needed for herd immunity.\n2. **Contraindications:** pregnancy, severe immunodeficiency (live vaccine).\n3. **Post-exposure:** vaccine within **72 hours** or immunoglobulin within 6 days (infants, pregnant women, immunocompromised).\n4. **Vitamin A supplementation** in children with measles reduces severity and mortality.\n5. Isolation of cases until 4 days after the rash; early notification; supplementary immunisation campaigns."}, {"id": 62, "n": 62, "t": "Why is mumps of greater concern in adult males but less so in children?", "st": 0, "src": "NMC 1", "du": [], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nMumps is of greater concern in **adult (post-pubertal) males** because the virus, spreading haematogenously, involves the gonads more readily after puberty:\n1. **Orchitis** occurs in **20–30% of post-pubertal males**, usually unilateral (bilateral in 15–30% of these) – painful testicular swelling, fever; atrophy may follow and **bilateral involvement can cause sterility/infertility** (rarely).\n2. Orchitis is rare in prepubertal children (the testes are immature) and occurs mainly after puberty.\n3. Disease is **more severe in adults** (higher incidence of pancreatitis, meningitis, encephalitis).\n4. In adult females: oophoritis, mastitis; abortion if infected in the first trimester.\nIn children the disease is typically a benign, self-limited parotitis."}, {"id": 63, "n": 63, "t": "*Vignette: a 10-year-old boy with swelling and tenderness below both ears for 2 days, fever, headache, and difficulty chewing (mumps).* What is the clinical diagnosis?", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mumps (epidemic parotitis)** – bilateral tender parotid swelling (\"hamster face\"), fever, headache and pain on chewing in a 10-year-old child. The causative agent is the **mumps virus** (a paramyxovirus), transmitted by respiratory droplets; incubation 16–21 days."}, {"id": 64, "n": 64, "t": "Which vaccine can prevent this disease?", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Live attenuated mumps vaccine (Jeryl Lynn strain)**, given subcutaneously as part of the **MMR vaccine** (measles–mumps–rubella), 2 doses. It is contraindicated in pregnancy and in the immunocompromised."}, {"id": 65, "n": 65, "t": "Name two complications if this disease is left untreated.", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nComplications if left untreated: (any two)\n1. **Orchitis** (± sterility) in post-pubertal males; oophoritis in females\n2. **Aseptic meningitis/meningoencephalitis**\n3. **Pancreatitis**\n4. Sensorineural **deafness** (labyrinthitis)\nOthers: myocarditis, arthritis, abortion, diabetes mellitus."}, {"id": 66, "n": 66, "t": "Write a note on congenital rubella syndrome.", "st": 0, "src": "NMC 4 — see also #107, #108", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Congenital rubella syndrome (CRS)** results from **intrauterine rubella infection**; **rubella virus (a togavirus; single-stranded, positive-sense, enveloped RNA virus) is a teratogen**.\n\n**Pathogenesis:** infection of a **non-immune pregnant woman** → maternal viraemia → placental infection → fetal infection → inhibition of cell division, vascular damage and chronic persistent infection of fetal organs. **Risk of malformation: 90% in the first 8–10 weeks; about 50% at 11–16 weeks; low after 16 weeks.**\n\n**Clinical features**\n1. **Classical triad:** **cataract, congenital heart disease (patent ductus arteriosus, VSD, pulmonary stenosis), sensorineural deafness.**\n2. Microcephaly, mental retardation, microphthalmia, glaucoma, retinopathy (\"salt and pepper\").\n3. Transient: low birth weight, thrombocytopenic purpura (\"blueberry muffin\" rash), hepatosplenomegaly, jaundice, meningoencephalitis.\n4. Late: diabetes mellitus, progressive rubella panencephalitis.\n5. Abortion, stillbirth.\n\n**Laboratory diagnosis:** (a) rubella-specific **IgM** in the neonate (or IgG persisting beyond 6 months); (b) virus isolation/RT-PCR from throat, urine, CSF, cataract lens; (c) in pregnancy: IgG avidity, paired sera.\n**Treatment:** none. **Prevention:** **live attenuated rubella vaccine (RA 27/3)** to all children (MR/MMR) and to non-immune women before pregnancy (avoid conception for 1–3 months); check rubella IgG in antenatal screening; not given in pregnancy; postpartum vaccination if non-immune."}, {"id": 67, "n": 67, "t": "Name one orthomyxovirus (arthomyxovirus) with its special properties.", "st": 0, "src": "Board 1 Set 06", "du": [], "nmc": [], "vv": ["Board 1 Set 06"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Influenza A virus** – the best-known orthomyxovirus. Special properties:\n1. **Segmented negative-sense ssRNA genome** (8 segments) → **genetic reassortment**.\n2. Surface **haemagglutinin (16 types) and neuraminidase (9 types)** – undergo **antigenic drift and shift**, causing epidemics and pandemics.\n3. **Animal reservoirs** (aquatic birds, pigs, horses) – source of novel genes; zoonotic subtypes (H5N1, H7N9).\n4. **Replicates in the nucleus** and buds from the plasma membrane.\n5. Causes **haemagglutination** (HI test) and elution by neuraminidase.\n6. Neuraminidase inhibitors (oseltamivir) and M2 blockers (amantadine) are specific antivirals."}, {"id": 68, "n": 68, "t": "Name some Paramyxoviruses with important diseases produced by them.", "st": 0, "src": "Board 1 Set 07", "du": [], "nmc": [], "vv": ["Board 1 Set 07"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n| Paramyxovirus | Important disease |\n|---|---|\n| **Measles virus** | Measles (rubeola), SSPE |\n| **Mumps virus** | Mumps (parotitis, orchitis, meningitis) |\n| **Respiratory syncytial virus (RSV)** | Bronchiolitis and pneumonia in infants |\n| **Parainfluenza viruses (1–4)** | Croup (laryngotracheobronchitis), common cold, bronchiolitis |\n| Human metapneumovirus | Bronchiolitis, pneumonia |\n| **Nipah and Hendra viruses** | Encephalitis, respiratory illness (zoonotic, bat-borne) |"}]}, {"id": "virology-6", "title": "Rabies", "qs": [{"id": 69, "n": 69, "t": "*Vignette: a patient presents to the ED 2 hours after being bitten by a stray dog, with a bleeding wound on the leg.* Which virus can be transmitted?", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Rabies virus** (genus *Lyssavirus*, family *Rhabdoviridae*) – transmitted in the saliva of the rabid dog through the bite wound.\n*(Case: stray dog bite, bleeding wound on the leg – a WHO category III exposure requiring immediate PEP; see Q72.)*"}, {"id": 70, "n": 70, "t": "List the enveloped viruses.", "st": 2, "src": "DU-24N; Board 1 Set 08", "du": ["DU-24N"], "nmc": [], "vv": ["Board 1 Set 08"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Important enveloped viruses**\n- **DNA viruses:** herpesviruses (HSV, VZV, CMV, EBV, HHV-6/7/8), hepatitis B virus, poxviruses.\n- **RNA viruses:** orthomyxoviruses (influenza), paramyxoviruses (measles, mumps, RSV, parainfluenza), rubella virus, rabies virus, **HIV, HTLV**, hepatitis C virus, hepatitis D virus, coronaviruses, dengue and other flaviviruses, togaviruses, bunyaviruses, filoviruses, arenaviruses.\n\n*Non-enveloped (naked) viruses:* poliovirus, HAV, HEV, rotavirus, adenovirus, parvovirus B19, HPV, rhinovirus, norovirus."}, {"id": 71, "n": 71, "t": "Enumerate the agents which dissolve the viral envelope.", "st": 0, "src": "DU-24N", "du": ["DU-24N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\nAgents that **dissolve (destroy) the viral envelope** (lipid solvents/detergents):\n1. **Ether and chloroform** (the ether-sensitivity test)\n2. **Alcohol** (70% ethanol, isopropanol) and acetone\n3. **Detergents and soap** – sodium dodecyl sulphate (SDS), Triton X-100, sodium deoxycholate (bile salts)\n4. Other: heat, drying, and 0.1% phenol-type disinfectants also destabilise enveloped viruses.\n*Naked viruses resist these agents* – hence their persistence in the environment."}, {"id": 72, "n": 72, "t": "What is the most important immediate step in management of the wound, and how is a suspected rabid-dog-bite case managed (local and systemic)?", "st": 4, "src": "NMC 1; NMC 4; DU-24N, 23N", "du": ["DU-24N", "DU-23N"], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n### Management of the rabid-dog-bite case\n**A. Immediate local wound care (most important first step)**\n1. **Immediately wash the wound thoroughly with soap (or detergent) and running water for at least 15 minutes** – this physically removes/inactivates virus and markedly reduces the risk of rabies. *(Do this before anything else.)*\n2. Apply a **virucidal agent** – 70% alcohol, tincture iodine or povidone iodine.\n3. **Do not suture** the wound (if unavoidable, loosely and only after RIG infiltration); do not apply irritants or cauterise.\n4. **Antibiotics** (penicillin/amoxicillin–clavulanate) and **tetanus prophylaxis** (TT ± TIG).\n\n**B. Systemic management – post-exposure prophylaxis (PEP)** as in Q73.\nDecision depends on the **category of exposure** (WHO), status of the biting animal (observe a domestic dog for 10 days; euthanise and examine a wild/rabid animal’s brain), and local rabies endemicity (in Bangladesh – dogs are the source in ~99% cases; treat as rabid).\n\n| WHO category | Type of contact | PEP |\n|---|---|---|\n| I | Touching/feeding animals, licks on intact skin | None |\n| II | Nibbling of uncovered skin, minor scratches without bleeding | Wound washing + **vaccine** |\n| **III** | **Single/multiple transdermal bites or scratches; licks on broken skin; mucous membrane contamination; all bat exposures** | Wound washing + **vaccine + rabies immunoglobulin (RIG)** |\n\n**C. Follow-up:** record, complete the full vaccine schedule, advise return if the animal develops signs; counsel about vaccinating pets (dog vaccination is the long-term control).\n*(Ref: WHO Rabies position paper 2018; Levinson)*"}, {"id": 73, "n": 73, "t": "Discuss the post-exposure prophylaxis (PEP) protocol for a previously unvaccinated person.", "st": 2, "src": "NMC 4; DU-26M", "du": ["DU-26M"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n### PEP of a previously unvaccinated person\n**1. Local treatment** – as in Q72.\n\n**2. Passive immunisation – Rabies immunoglobulin (RIG)** for category III:\n- **Human RIG (HRIG) 20 IU/kg**, or **equine RIG (ERIG) 40 IU/kg** (after skin test), or rabies monoclonal antibody;\n- Given **once, on day 0, with the first dose of vaccine** (up to day 7 if delayed), **infiltrated into and around the wound** (as much as anatomically possible); the vaccine is given at a **different site** from the RIG.\n\n**3. Active immunisation – cell-culture vaccine (HDCV, PCEC, PVRV)** – all give inactivated virus (nerve-tissue vaccine is obsolete):\n\n| Regimen | Schedule |\n|---|---|\n| **Intradermal, 2-site (WHO 2018 – used in Bangladesh)** | 0.1 mL ID at 2 sites on **days 0, 3, 7** |\n| Updated Thai Red Cross (2-2-2-0-2) | 0.1 mL ID at 2 sites on days 0, 3, 7 and 28 |\n| Intramuscular – Essen (5-dose) | 1 mL IM (deltoid; anterolateral thigh in infants – **never the gluteal region**) on **days 0, 3, 7, 14, 28** |\n| Intramuscular – abbreviated 4-dose | Days 0 (2 sites), 7, 21 (Zagreb) |\n\n**4.** Antibiotics, tetanus prophylaxis; check that the full course is completed.\n**5. Previously immunised** persons need **no RIG** – only 2 booster doses (days 0 and 3).\n**6. Pregnancy and infancy are not contraindications.**\n**Pre-exposure prophylaxis** (veterinarians, laboratory workers, travellers): 2 visits (days 0, 7) ID/IM.\n\n*Viva:* \"RIG gives immediate passive antibody at the wound while the vaccine induces active immunity; incubation is long, so antibody develops before the virus reaches the CNS.\"\n*(Ref: Levinson, WHO position paper 2018; National guideline, Bangladesh)*"}, {"id": 74, "n": 74, "t": "*Vignette: a 15-year-old boy with fever, anxiety and difficulty swallowing three weeks after being bitten by a stray dog; painful throat spasms and agitation on attempting to drink water.* Name the diagnosis and mention the properties of the causative agent.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Diagnosis: Rabies (hydrophobia)** – history of dog bite, incubation of weeks, prodromal anxiety/fever, then painful pharyngeal spasm on attempting to drink water (**hydrophobia**) and agitation.\n\n**Properties of rabies virus**\n1. **Rhabdovirus** (genus *Lyssavirus*) – **bullet-shaped**, 75 × 180 nm, **enveloped**, with **glycoprotein (G) spikes**; helical nucleocapsid.\n2. Genome: **single-stranded, negative-sense, non-segmented RNA**; virion carries **RNA-dependent RNA polymerase**.\n3. **One antigenic type**; antigenicity in the G protein (neutralising antibody, vaccine antigen).\n4. Replicates in the **cytoplasm**, buds from the plasma membrane; forms **Negri bodies** (cytoplasmic eosinophilic inclusions) in neurons – pathognomonic.\n5. **Neurotropic**; attaches to acetylcholine receptor; travels by **retrograde axonal flow**; broad host range (all mammals); no viraemia.\n6. **Street virus** (wild, long incubation, Negri bodies +) and **fixed virus** (rabbit-passaged, short incubation, no Negri bodies; used for vaccine).\n7. Labile – destroyed by heat, lipid solvents, soap, formalin.\n8. Dogs are the main reservoir in Bangladesh; bats elsewhere. Almost **100% fatal** once symptoms develop."}]}, {"id": "virology-7", "title": "Respiratory Viruses", "qs": [{"id": 75, "n": 75, "t": "Name the viruses that are transmitted through the respiratory route.", "st": 2, "src": "DU-18Nov; Board 1 Set 12", "du": ["DU-18Nov"], "nmc": [], "vv": ["Board 1 Set 12"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Viruses transmitted by the respiratory route**\n- Influenza virus, parainfluenza viruses, RSV, adenovirus, rhinovirus, coronaviruses (SARS-CoV-2, MERS, SARS)\n- **Measles, mumps, rubella** viruses\n- **Varicella-zoster virus**, HSV-1 (saliva), EBV (saliva), CMV\n- Parvovirus B19, human metapneumovirus, hantavirus (aerosol), enteroviruses (also faecal)"}]}, {"id": "virology-8", "title": "Poliovirus", "qs": [{"id": 76, "n": 76, "t": "Mention the properties of poliovirus.", "st": 0, "src": "DU-26M", "du": ["DU-26M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Properties of poliovirus** (genus *Enterovirus*, family *Picornaviridae*)\n1. **Smallest RNA virus**, 27–30 nm, **naked**, **icosahedral** capsid (60 capsomers; VP1–VP4).\n2. Genome: **single-stranded, positive-sense RNA** (infectious RNA; acts as mRNA); VPg at 5′ end.\n3. **Three serotypes (1, 2, 3)** – type 1 commonest cause of paralysis; no cross-protection; type 2 (wild) and type 3 have been eradicated.\n4. **Resistant** to ether, alcohol, acid (survive stomach pH), bile; inactivated by heat (50 °C), formalin, chlorine, UV; stable at room temperature for days.\n5. Replicates in the **cytoplasm**; released by **cell lysis**; **CPE** in cell cultures (monkey kidney, HeLa, Vero).\n6. **Natural host: humans only**; transmitted by the **faeco-oral route**; no animal reservoir, no carrier state.\n7. Receptor: **CD155 (poliovirus receptor)** – restricts tropism (gut, anterior horn cells).\n8. **Neurotropic**; eradication is feasible."}, {"id": 77, "n": 77, "t": "Discuss the pathogenesis of paralytic poliomyelitis.", "st": 5, "src": "NMC 4; DU-26M, 18N, 25N; Board 1 Set 20", "du": ["DU-26M", "DU-18N", "DU-25N"], "nmc": ["NMC 4"], "vv": ["Board 1 Set 20"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### Pathogenesis of paralytic poliomyelitis\n```\n Ingestion of virus (faeco-oral)\n        |\n Multiplication in pharynx, tonsils & gut (Peyer's patches) -> shed in stool\n        |\n Spread to cervical/mesenteric lymph nodes -> Minor viraemia (7-10 days)\n        |\n Seeding of reticuloendothelial system -> Major viraemia\n        |\n Entry into CNS: (a) via blood across the blood-brain barrier  (b) retrograde axonal transport\n        |\n Replication in MOTOR NEURONS of ANTERIOR HORN of spinal cord (and brainstem nuclei)\n        |\n Neuronal death -> ASYMMETRIC FLACCID PARALYSIS (LMN type)\n```\n1. **Incubation:** 7–14 days (range 3–35).\n2. Virus enters through the mouth and multiplies in the **alimentary tract lymphoid tissue (tonsils, Peyer's patches)**.\n3. Spread to regional lymph nodes and **viraemia**; fever, sore throat (minor illness).\n4. In < 1% of infected persons the virus invades the **CNS** – the anterior horn cells (lumbar > cervical), motor nuclei of the brainstem (**bulbar polio**, risk of respiratory failure), rarely the motor cortex.\n5. Virus destroys the infected neurons (CPE); **inflammation and oedema** follow.\n6. **Paralysis** of muscle groups supplied by the dead neurons – **flaccid, asymmetric, with loss of reflexes and later muscle wasting; sensation preserved**. Predisposing factors: **IM injections, tonsillectomy, strenuous exercise, pregnancy, immunodeficiency**.\n7. **Post-polio syndrome** appears after 15–40 years.\n\n*(Ref: Levinson; Blueprint; Park)*"}, {"id": 78, "n": 78, "t": "How can poliomyelitis be prevented?", "st": 0, "src": "DU-18Nov", "du": ["DU-18Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Prevention of poliomyelitis**\n1. **Active immunisation** – the main measure:\n - **Oral polio vaccine (OPV, Sabin)** – live attenuated, trivalent/bivalent (types 1 and 3), 2 drops orally; EPI: birth dose (where applicable), 6, 10, 14 weeks and booster; gives **gut IgA** immunity and **herd immunity**.\n - **Inactivated polio vaccine (IPV, Salk)** – killed, injectable; added to the EPI schedule at 14 weeks (+ later dose) to eliminate vaccine-derived poliovirus (cVDPV).\n2. **Surveillance** of **acute flaccid paralysis (AFP)** with stool examination; mop-up and **National Immunisation Days**.\n3. **Sanitation and hygiene** – safe water, proper excreta disposal, handwashing.\n4. **Avoid IM injections** in a febrile child with suspected polio.\n5. Global Polio Eradication Initiative (WHO, 1988); the WHO South-East Asia Region, including Bangladesh, was certified polio-free in 2014."}, {"id": 79, "n": 79, "t": "Briefly describe the outcome of poliovirus infection in an unvaccinated person.", "st": 0, "src": "DU-22M", "du": ["DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Outcome of poliovirus infection in an unvaccinated person**\n| Outcome | Frequency | Features |\n|---|---|---|\n| **Inapparent (subclinical) infection** | Majority (~70–90%) | Asymptomatic; virus shed in stool; gives immunity |\n| **Abortive poliomyelitis (minor illness)** | ~ 5–25% | Fever, headache, sore throat, vomiting; recovery in < 1 week |\n| **Non-paralytic poliomyelitis (aseptic meningitis)** | 1–5% | Fever, headache, neck stiffness, CSF lymphocytosis; recovery |\n| **Paralytic poliomyelitis** | **< 1% (1 in 200 for type 1)** | Spinal – asymmetric flaccid paralysis of legs; bulbar – cranial nerve palsy, respiratory failure; bulbospinal |\n| **Post-polio syndrome** | After decades | New muscle weakness/pain |\nImmunity is lifelong and type-specific. Fatality in paralytic polio is 2–10% (more in bulbar)."}, {"id": 80, "n": 80, "t": "Describe herd immunity.", "st": 0, "src": "DU-22M", "du": ["DU-22M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Herd immunity** is the **resistance of a whole community to the spread of an infectious agent because a high proportion of its members are immune**; the immune persons protect the susceptible minority by breaking the chain of transmission (indirect protection).\n\n- *Threshold:* proportion needed depends on R₀ – about **95% for measles**, 80–85% for polio.\n- *Achieved by:* (a) recovery from natural infection; (b) **vaccination** – especially live vaccines.\n- *Example: OPV* gives herd immunity because (i) it induces **intestinal IgA** that prevents infection and shedding of wild virus; (ii) the live vaccine virus is excreted and **spreads to unvaccinated contacts**, immunising them (\"contact immunisation\") and displacing the wild virus.\n- *Not provided by:* killed vaccines (IPV) to the same degree."}, {"id": 81, "n": 81, "t": "Mention the advantages and disadvantages of oral polio vaccine (OPV) / the vaccines available for the disease.", "st": 4, "src": "DU-26M, 25N; Board 1 Set 05, 19", "du": ["DU-26M", "DU-25N"], "nmc": [], "vv": ["Board 1 Set 05", "Board 1 Set 19"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### Vaccines available: IPV (Salk) and OPV (Sabin)\n\n**OPV – merits**\n1. Cheap; easy to administer by trained or lay workers (oral drops; no needles).\n2. Induces **local gut immunity (secretory IgA)** as well as humoral IgG – blocks wild-virus multiplication in the gut.\n3. **Secondary spread to contacts** → **herd immunity**; interrupts transmission; useful for epidemic control.\n4. Interference with the wild virus; long-lasting immunity; single dose gives high take.\n\n**OPV – demerits**\n1. **Vaccine-associated paralytic poliomyelitis (VAPP)** – reversion to neurovirulence (especially type 3 and type 2), ~1 in 2.4 million doses; **circulating vaccine-derived poliovirus (cVDPV)**.\n2. **Contraindicated in immunodeficient** persons (risk of prolonged excretion and paralysis).\n3. **Interference** by other enteroviruses and diarrhoea – lower take in tropical countries (3–5 doses needed).\n4. Requires **cold chain** (refrigeration) – heat-labile.\n5. Not advisable for pregnant women.\n\n**IPV (Salk) – merits:** safe, no reversion, no VAPP, safe in immunodeficiency, stable (no cold-chain problems as great), can be combined with DPT.\n**Demerits:** injectable; costly; **does not induce gut IgA**; no herd immunity/contact spread; needs boosters; not useful for epidemic control.\n\n| Feature | OPV (Sabin) | IPV (Salk) |\n|---|---|---|\n| Nature | Live attenuated | Killed |\n| Route | Oral | Injection (IM/ID) |\n| Intestinal immunity | Yes (IgA) | No |\n| Herd immunity | Yes | Little |\n| Reversion/VAPP | Possible | No |\n| In immunocompromised | Contraindicated | Safe |\n| Cost/cold chain | Cheap; cold chain needed | Costly |"}, {"id": 82, "n": 82, "t": "*Vignette: a 2-year-old unvaccinated child with fever, headache, irritability, and muscle pain, progressing to acute flaccid paralysis of the legs over 48 hours.* Mention the probable diagnosis and mode of transmission.", "st": 0, "src": "DU-25N", "du": ["DU-25N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Probable diagnosis: Paralytic poliomyelitis** (acute flaccid paralysis in an unvaccinated child; preceded by fever, headache and myalgia). It is caused by **poliovirus**.\n**Mode of transmission: faeco-oral route** – ingestion of food or water contaminated with faeces of infected persons; occasionally by respiratory droplets/direct contact. Confirm by virus isolation from two stool specimens (24–48 h apart) and typing."}]}, {"id": "virology-9", "title": "Retroviruses / HIV", "qs": [{"id": 83, "n": 83, "t": "What is a retrovirus?", "st": 3, "src": "NMC 1; NMC 4; Board 1 Set 12", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": ["Board 1 Set 12"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Retroviruses** are **enveloped RNA viruses** (family *Retroviridae*) with an **icosahedral capsid** and a genome of **two identical copies of single-stranded, linear, positive-sense RNA (diploid)**. Their defining feature is the virion enzyme **reverse transcriptase (RNA-dependent DNA polymerase)**, which transcribes the RNA genome into DNA – \"retro\" = backward (RNA → DNA, reverse of the usual direction). The DNA copy (**provirus**) integrates into the host chromosome by **integrase**.\n\n**Classification:** (1) **Oncovirus** group – HTLV-1, HTLV-2; (2) **Lentivirus** (\"slow virus\") group – **HIV-1, HIV-2**, visna virus; (3) **Spumavirus** group – non-pathogenic.\n\n**Genes:** *gag* (core proteins), *pol* (reverse transcriptase, integrase, protease), *env* (envelope glycoproteins).\n**Importance:** chronic infection, oncogenesis (HTLV-1) and immunodeficiency (HIV); the enzymes are antiviral targets."}, {"id": 84, "n": 84, "t": "Write down the mechanism of CD4/helper-T-lymphocyte destruction by HIV.", "st": 2, "src": "NMC 4; DU-19Nov", "du": ["DU-19Nov"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Mechanism of CD4+ T-cell destruction by HIV**\n1. **Entry:** HIV **gp120 binds the CD4 receptor** and co-receptor (**CCR5/CXCR4**); **gp41** mediates fusion.\n2. **Direct cytopathic effect** – high-level virus production and budding damage the cell membrane; lysis of infected CD4+ cells.\n3. **Syncytia formation** – gp120/gp41 on infected cells fuse with uninfected CD4+ cells → non-functional **multinucleated giant cells**.\n4. **Immune-mediated killing** – **cytotoxic CD8+ T cells** and NK cells destroy infected cells; antibody-dependent cellular cytotoxicity (ADCC) against gp120-coated cells.\n5. **Apoptosis (programmed cell death)** of both infected and uninfected \"bystander\" CD4+ cells triggered by gp120, Vpr, Tat and chronic immune activation.\n6. **Superantigen-like effect** – polyclonal activation and exhaustion of helper T cells.\n7. **Accumulation of unintegrated viral DNA** is toxic; HIV also infects thymic precursors and impairs CD4+ cell regeneration.\n8. **Nef** reduces CD4 and MHC-I expression on the cell surface; Nef also causes death of uninfected cytotoxic T cells.\n\n**Result:** progressive fall in CD4+ count (normal ~1000/µL → < 200/µL) → loss of both **cell-mediated and humoral immunity** → opportunistic infections and tumours (AIDS)."}, {"id": 85, "n": 85, "t": "Mention the routes of transmission of HIV.", "st": 2, "src": "DU-19Nov; Board 1 Set 14", "du": ["DU-19Nov"], "nmc": [], "vv": ["Board 1 Set 14"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Routes of transmission of HIV**\n1. **Sexual** (commonest; 75–85%) – heterosexual and homosexual; risk raised by genital ulcers/STIs and lack of circumcision.\n2. **Parenteral/blood-borne** – transfusion of infected blood and blood products; **sharing needles/syringes by IV drug users**; needle-stick injury (risk ~0.3%); contaminated surgical/dental instruments, tattooing, ear-piercing.\n3. **Organ/tissue transplantation** and artificial insemination with infected semen.\n4. **Vertical (mother-to-child)** – **transplacental, intrapartum (birth canal), breastfeeding** (risk 15–40% without intervention; < 2% with ART).\n\n*HIV is NOT transmitted by:* casual contact, hugging, shared food/utensils/toilets, mosquitoes, coughing/sneezing, or swimming pools. Saliva, tears and urine contain little virus."}, {"id": 86, "n": 86, "t": "Discuss the clinical course/stages of HIV infection, with a diagram.", "st": 3, "src": "NMC 1; NMC 4; DU-23N", "du": ["DU-23N"], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**HIV infection passes through three clinical stages** (course of an untreated infection: about 10 years).\n\n```\n CD4+ count\n (cells/uL)\n  1000 |*.\n       |  '*.\n   500 |     '*..__                   CD4+ T cells  (falls steadily)\n       |            ''*..__\n   200 |- - - - - - - - - - ''*..__ - - - - - - - - - -  AIDS threshold (< 200)\n       |                          ''*..__\n     0 +--------+------------------------------------+----------+------> time\n       0     2-12 wk                 7-11 years            > 10 years\n       |ACUTE   |<------------ CLINICAL LATENCY ----->|   AIDS   |\n       |        |  (asymptomatic / PGL / ARC)         | (OIs, tumours)\n\n HIV RNA (viral load):  ^ peak in acute phase (p24 +) -> low \"set point\" in latency -> rises again in AIDS\n Antibody:              appears 2-12 weeks after infection (seroconversion) -> persists\n```\n\n| | **1. Acute (primary) infection** | **2. Clinical latency (chronic stage)** | **3. AIDS** |\n|---|---|---|---|\n| Time | 2–4 weeks after exposure; lasts ~2 weeks | 7–11 years (untreated) | After ~10 years |\n| CD4+ count | Transient fall, then recovery | Slow, steady fall (800 → 350/µL) | **< 200/µL** |\n| HIV RNA (viral load) / p24 | **Peak** (very infectious) | Low \"set point\" | Rises again |\n| Anti-HIV antibody | Appears 2–12 weeks (seroconversion; window) | Present, persists | Present (may fall) |\n| Symptoms | Flu-like illness, rash, lymphadenopathy | None, PGL or ARC | Opportunistic infections, tumours, wasting |\n\n**1. Acute (primary) infection – 2–4 weeks after exposure**\n- \"Acute retroviral syndrome\": fever, sore throat, myalgia, generalised lymphadenopathy, maculopapular rash on trunk/limbs, mucocutaneous ulcers; resolves in ~2 weeks.\n- High viraemia (HIV RNA, **p24 antigen** present), **transient fall of CD4+ cells**; antibodies appear after 2–12 weeks (**seroconversion**) – the **window period**.\n**2. Chronic stage – clinical latency (7–11 years)**\n- Asymptomatic or **persistent generalised lymphadenopathy (PGL)**; virus replicates in lymph nodes; CD4+ falls gradually.\n- **AIDS-related complex (ARC)** may occur: fever, night sweats, weight loss > 10%, chronic diarrhoea > 1 month, oral thrush, herpes zoster.\n**3. AIDS (immunodeficiency stage)**\n- **CD4+ < 200/µL**, or an AIDS-defining illness; high viral load.\n- Opportunistic infections (*Pneumocystis jirovecii* pneumonia, TB, cryptococcal meningitis, CMV retinitis), malignancy (Kaposi sarcoma, lymphoma), \"slim disease\", neurological disease (dementia).\n\n*WHO clinical staging 1–4; CDC categories A, B, C.* Death occurs within about 2 years in untreated AIDS."}, {"id": 87, "n": 87, "t": "Mention the common opportunistic infections in an AIDS patient.", "st": 0, "src": "DU-23N", "du": ["DU-23N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Common opportunistic infections in AIDS**\n\n| Category | Organisms and disease |\n|---|---|\n| **Bacterial** | ***Mycobacterium tuberculosis*** (TB), ***M. avium* complex**, *Salmonella*, *Nocardia*, *Listeria*, pneumococcus |\n| **Viral** | **CMV** (retinitis, colitis), **HSV**, **VZV** (zoster), **EBV** (oral hairy leukoplakia), **JC virus (PML)**, HHV-8 (Kaposi sarcoma), HPV |\n| **Fungal** | ***Pneumocystis jirovecii*** pneumonia, ***Candida*** (thrush, oesophagitis), ***Cryptococcus neoformans*** (meningitis), *Histoplasma*, *Coccidioides* |\n| **Protozoal/parasitic** | ***Toxoplasma gondii*** (encephalitis), ***Cryptosporidium*** and *Isospora* (chronic diarrhoea), *Strongyloides* |\n| **Malignancy** | **Kaposi's sarcoma**, non-Hodgkin lymphoma, primary CNS lymphoma, cervical cancer |\n\n*Viva:* OIs appear when CD4+ falls below **200/µL**. The two most characteristic manifestations of AIDS are **PCP and Kaposi's sarcoma**."}, {"id": 88, "n": 88, "t": "How can you diagnose HIV infection in adults and in newborns, and what are the screening and confirmatory tests?", "st": 4, "src": "NMC 4; DU-25N, 22N; Board 1 Set 11", "du": ["DU-25N", "DU-22N"], "nmc": ["NMC 4"], "vv": ["Board 1 Set 11"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n### A. Diagnosis in adults (and children > 18 months)\n**Principle:** serological detection of antibody (± p24 antigen) is the mainstay; nucleic acid tests in special situations. Specimen: blood (also oral fluid).\n\n1. **Screening tests** – **ELISA** (4th generation = antibody + p24 antigen \"combo\" assay), **rapid/simple tests** (ICT, dipstick) – high sensitivity; some false-positives.\n2. **Confirmatory tests** – **Western blot** (antibodies to p24, **gp41, gp120/160**) – positive when bands for at least two of gp160/120, gp41 and p24 are present; or additional rapid tests of different principle (national algorithm); HIV-1/2 differentiation assay; **HIV RNA PCR**.\n3. **Nucleic acid test (RT-PCR):** viral load – for acute infection, window period, infants and monitoring therapy.\n4. **p24 antigen** – detects early infection and screens donated blood.\n5. **CD4+ count** (flow cytometry) – immune status; **< 200/µL** = AIDS.\n6. Drug-resistance genotyping.\n**Interpretation:** a positive screening test must be **confirmed**; a negative test in the window period should be **repeated after 3 months**.\n\n### B. Diagnosis in newborns (exposed infants)\n- **Antibody tests are unreliable before 18 months** – maternal IgG crosses the placenta, so every baby born to an HIV-positive mother is antibody-positive.\n- Use **virological tests: HIV DNA PCR (or RNA PCR)** on blood/dried blood spot – at **birth (high-risk), 4–6 weeks, then at 3 and 6 months**; two positive results confirm infection. \n- An antibody test at 18 months confirms or excludes infection (negative = uninfected).\n- Take into account breastfeeding exposure."}, {"id": 89, "n": 89, "t": "What is HAART therapy?", "st": 2, "src": "NMC 4; DU-23N", "du": ["DU-23N"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**HAART – Highly Active Antiretroviral Therapy (now called ART/cART)** is the **combination of at least three antiretroviral drugs** from two or more classes, given **lifelong**, to suppress HIV replication maximally.\n\n**Standard regimen:** **two NRTIs** (tenofovir + lamivudine/emtricitabine) **plus** one **NNRTI** (efavirenz, nevirapine), **protease inhibitor** (lopinavir/ritonavir, atazanavir) or **integrase inhibitor (dolutegravir)**.\n\n| Class | Examples | Target |\n|---|---|---|\n| NRTI | Zidovudine, lamivudine, abacavir, tenofovir | Reverse transcriptase |\n| NNRTI | Nevirapine, efavirenz | Reverse transcriptase |\n| Protease inhibitors | Lopinavir, ritonavir, indinavir | Protease |\n| Integrase inhibitors | Raltegravir, dolutegravir | Integration |\n| Entry inhibitors | Enfuvirtide, maraviroc (CCR5) | Fusion/entry |\n\n**Aims:** suppress viral load to undetectable levels; restore CD4+ count/immunity; reduce morbidity and mortality; prevent transmission (\"undetectable = untransmittable\") and resistance.\n**Disadvantages:** lifelong therapy, adverse effects, drug interactions, adherence problems, **resistance**, immune reconstitution inflammatory syndrome; virus is not eradicated (latent reservoir)."}, {"id": 90, "n": 90, "t": "What is a \"false-negative\" result, and how is it related to the window period?", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**False-negative HIV test** – a negative result in a person who is actually infected.\n- **Relation to the window period:** after infection there is a lag (usually 3–12 weeks) before detectable antibody appears. Testing during this window by antibody ELISA gives a **false-negative** result although the person is **viraemic and highly infectious**.\n- **Other causes:** very early/very late disease (loss of antibody), immunosuppression, agammaglobulinaemia, technical error.\n- **How to avoid:** repeat test after 3 months; use 4th-generation (p24 antigen + antibody) assays or **HIV RNA PCR**; screen blood donations with p24/NAT.\n- *Significance:* transfusion-transmitted HIV and missed infections; counsel exposed persons accordingly."}, {"id": 91, "n": 91, "t": "*Vignette: a 35-year-old man with unexplained fever, progressive weight loss, persistent diarrhoea and generalised lymphadenopathy for 6 months, with a history of exposure.* Name the probable viral cause, its type, and one screening + one confirmatory test.", "st": 0, "src": "DU-24M", "du": ["DU-24M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Probable viral cause: Human immunodeficiency virus (HIV)** – (unexplained fever, weight loss > 10%, chronic diarrhoea > 1 month and generalised lymphadenopathy, with a high-risk exposure = AIDS/ARC).\n**Type of virus:** an **RNA virus – retrovirus** (lentivirus subgroup), enveloped, diploid ssRNA with reverse transcriptase.\n**Screening test:** anti-HIV antibody **ELISA** (or 4th-generation combo assay/rapid test).\n**Confirmatory test:** **Western blot** (antibodies to p24, gp41, gp120/160) or HIV RNA PCR.\n**Further:** CD4+ count, viral load; screen for TB and other OIs."}, {"id": 92, "n": 92, "t": "Give some examples of retroviruses.", "st": 0, "src": "Board 1 Set 12", "du": [], "nmc": [], "vv": ["Board 1 Set 12"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Examples of retroviruses**\n- **HIV-1 and HIV-2** (lentiviruses) – AIDS\n- **HTLV-1** – adult T-cell leukaemia/lymphoma, tropical spastic paraparesis; **HTLV-2**\n- Animal retroviruses: Rous sarcoma virus, murine leukaemia virus, feline leukaemia virus, simian immunodeficiency virus (SIV), visna virus."}, {"id": 93, "n": 93, "t": "Enumerate the cells that are infected with HIV.", "st": 0, "src": "Board 1 Set 14", "du": [], "nmc": [], "vv": ["Board 1 Set 14"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Cells infected by HIV (CD4-bearing cells)**\n1. **CD4+ helper T lymphocytes** (principal target)\n2. **Monocytes and macrophages** (reservoir; including alveolar macrophages)\n3. **Dendritic cells and Langerhans cells** (mucosal entry)\n4. **Microglia and brain macrophages** (HIV encephalopathy)\n5. Also: thymocytes, haematopoietic progenitor cells, gut-associated lymphoid cells; some epithelial cells and astrocytes (CD4-independent; low-level)."}, {"id": 94, "n": 94, "t": "Name the important HIV antigens.", "st": 0, "src": "Board 1 Set 14", "du": [], "nmc": [], "vv": ["Board 1 Set 14"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Important HIV antigens** (basis of laboratory tests)\n- **Envelope:** **gp120** (surface glycoprotein; binds CD4; major target of neutralising antibody) and **gp41** (transmembrane; fusion); precursor **gp160**.\n- **Core (gag):** **p24 (capsid antigen – the major core antigen; appears early; detected by antigen assays)**, **p17 (matrix)**, p7/p9 (nucleocapsid).\n- **Enzymes (pol):** reverse transcriptase (p66/p51), integrase (p32), protease (p10).\n- Regulatory: Tat, Rev, Nef, Vif, Vpr, Vpu.\nWestern blot detects antibodies to **p24, gp41 and gp120/160**."}, {"id": 95, "n": 95, "t": "Why is vaccine development not very successful in HIV infection?", "st": 0, "src": "Board 1 Set 06", "du": [], "nmc": [], "vv": ["Board 1 Set 06"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Why an HIV vaccine has not been successful**\n1. **Extreme antigenic variability** – very high mutation rate (error-prone reverse transcriptase, no proofreading) especially of *env* (gp120); multiple subtypes (clades) and recombinants.\n2. **Integration of provirus** into host DNA and **latent reservoirs** in resting CD4+ cells – cannot be cleared by the immune system.\n3. **Infects the very cells (CD4+ T cells) that coordinate the immune response.**\n4. **Poor neutralising antibody response** – conserved epitopes are hidden by the **glycan shield** and conformational masking; antibodies neutralise HIV poorly *in vivo*.\n5. **Cell-to-cell spread** and virus in sanctuary sites (CNS, lymph nodes) escape antibody.\n6. **Immune evasion** – Nef/Tat down-regulate MHC-I; escape mutants of CTL epitopes.\n7. **No natural recovery** from infection, so no model of protective immunity (\"correlate of protection\").\n8. Lack of a good animal model; safety concerns with live attenuated vaccine; trial results have been disappointing."}, {"id": 96, "n": 96, "t": "Why is the incidence of HIV still low in our country?", "st": 0, "src": "Board 1 Set 06", "du": [], "nmc": [], "vv": ["Board 1 Set 06"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\nBangladesh is a **low-prevalence country** (< 0.01–0.1% of the general adult population), with a **concentrated epidemic** among key populations (people who inject drugs, men who have sex with men, sex workers, migrant workers). Factors commonly cited for the low general-population incidence are:\n1. **Socio-cultural and religious norms** – conservative society, low rate of premarital/extramarital sex and multiple partners.\n2. **High rate of male circumcision** (majority Muslim population) – lowers the risk of HIV acquisition.\n3. **Early national response** – surveillance and targeted prevention programmes for high-risk groups since the mid-1980s.\n\n*(These are the explanations commonly offered in textbooks; the epidemiological evidence is limited.)*\n\n**But there is no room for complacency:** low condom use, limited knowledge of HIV, cross-border mobility (migrant workers), under-testing and the rapid rise of injecting drug use make the country vulnerable, and **newly reported cases have recently risen**, so continued prevention and testing are required.\n*(Ref: UNAIDS/DGHS reports and published reviews on HIV in Bangladesh)*"}]}, {"id": "virology-10", "title": "Rotavirus, Poliovirus-related, Arboviruses, Dengue & Emerging Viral Diseases", "qs": [{"id": 97, "n": 97, "t": "Write down the pathogenesis of Rotavirus.", "st": 3, "src": "NMC 4; Board 1 Set 01, 13", "du": [], "nmc": ["NMC 4"], "vv": ["Board 1 Set 01", "Board 1 Set 13"], "bd": ["Board 1"], "w": true, "v": true, "a": "**Answer**\n\n**Rotavirus** – most common cause of **severe infantile gastroenteritis (6 months–2 years)**; a double-shelled, wheel-shaped (*rota* = wheel), **non-enveloped dsRNA virus (11 segments)** of the family *Reoviridae*, with **VP4 and VP7 outer proteins** (P and G types).\n\n**Pathogenesis**\n1. **Faeco-oral transmission** (very low infective dose; incubation 1–3 days).\n2. Virus passes the stomach (acid-stable) and infects the **mature enterocytes at the tips of the villi of the small intestine** (duodenum/jejunum); colon is spared.\n3. Replicates in the **cytoplasm**; **destruction of villous epithelial cells** → **villous atrophy/blunting**.\n4. **Loss of absorptive surface and disaccharidase (lactase) enzymes** → **malabsorption** of Na⁺, glucose and water; undigested lactose causes **osmotic diarrhoea**.\n5. Immature **crypt cells** replace the villous cells and secrete fluid.\n6. The viral **enterotoxin NSP4** triggers a signal-transduction pathway (Ca²⁺-dependent) → **secretion of Cl⁻ and water** (secretory diarrhoea); **enteric nervous system** stimulation.\n7. Result: **watery, non-bloody diarrhoea with vomiting** and fever, leading to **dehydration, electrolyte imbalance and shock** (a cause of infant death).\n8. Recovery in 3–7 days; immunity by local IgA (incomplete – reinfection occurs).\n\n*Prevention:* oral live rotavirus vaccines; ORS (WHO) for treatment."}, {"id": 98, "n": 98, "t": "Explain how rotavirus infection is diagnosed in the laboratory.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Laboratory diagnosis of rotavirus infection** (specimen: **stool**, in the first few days)\n1. **Antigen detection in stool** – **ELISA** (commonest, rapid, sensitive), latex agglutination, immunochromatographic rapid tests.\n2. **Electron microscopy** – wheel-like particles (*rota*) in stool.\n3. **Polyacrylamide gel electrophoresis (PAGE)** of the genomic RNA – characteristic pattern of 11 segments (electropherotype).\n4. **RT-PCR** – detection and genotyping (G and P types).\n5. **Culture** – difficult; not used routinely.\n6. **Serology** – four-fold rise in antibody (acute vs convalescent) – used in research."}, {"id": 99, "n": 99, "t": "Name the mosquito-borne viral diseases with their causative agents.", "st": 0, "src": "DU-18M", "du": ["DU-18M"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Vector | Disease | Causative virus (family) |\n|---|---|---|\n| ***Aedes aegypti/albopictus*** | **Dengue fever/DHF/DSS** | Dengue virus (Flavivirus) |\n| | **Chikungunya** | Chikungunya virus (Togavirus/Alphavirus) |\n| | **Yellow fever** | Yellow fever virus (Flavivirus) |\n| | **Zika fever** | Zika virus (Flavivirus) |\n| ***Culex* species** | **Japanese encephalitis** | JE virus (Flavivirus) |\n| | **West Nile fever** | West Nile virus (Flavivirus) |\n| *Culex/Aedes/Mansonia* | Rift Valley fever, equine encephalitides, Sindbis | Bunyaviridae/Togaviridae |"}, {"id": 100, "n": 100, "t": "Explain/discuss the pathogenesis of dengue haemorrhagic fever/shock.", "st": 4, "src": "NMC 1; DU-18M, 25N, 24M", "du": ["DU-18M", "DU-25N", "DU-24M"], "nmc": ["NMC 1"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Dengue** is caused by **dengue virus (4 serotypes: DEN-1 to DEN-4)**, a flavivirus transmitted by the bite of the female ***Aedes aegypti*** mosquito.\n\n### Pathogenesis of dengue haemorrhagic fever (DHF) and dengue shock syndrome (DSS)\n**A. First (primary) infection** – classic dengue fever: viraemia, fever, rash, myalgia (\"breakbone fever\"); lifelong immunity to that serotype, but only **short-lived partial protection** against the others.\n\n**B. Second (secondary) infection with a different serotype** – **immunopathogenesis (antibody-dependent enhancement; ADE)**\n```\n 1st infection (DEN-1) -> antibody to DEN-1 (neutralises DEN-1; cross-reacts, NOT neutralising to DEN-2)\n        |\n 2nd infection with DEN-2 -> pre-existing non-neutralising IgG binds DEN-2 virus\n        |\n Virus-antibody complexes bind Fc receptors on monocytes/macrophages\n        |           -> enhanced viral entry & replication in monocytes (ADE)\n        |\n Massive activation of cross-reactive memory T cells + complement activation\n        |           -> cytokine storm (TNF-alpha, IL-6, IL-2, IFN-gamma), histamine, nitric oxide\n        v\n Endothelial dysfunction -> INCREASED VASCULAR PERMEABILITY (plasma leakage)\n + thrombocytopenia + DIC / platelet dysfunction  -> HAEMORRHAGE\n        |\n Haemoconcentration, hypovolaemia  -> DENGUE SHOCK SYNDROME\n```\n**Key features:** plasma leakage (rising haematocrit ≥ 20%, pleural effusion, ascites, hypoalbuminaemia); **thrombocytopenia < 100,000/mm³**; bleeding manifestations (positive tourniquet test, petechiae, GI bleeding); in DSS – narrow pulse pressure (< 20 mmHg), hypotension, cold clammy skin, restlessness. Critical phase is at **defervescence (days 3–7)**. Case fatality of DSS can reach 10% without management.\n\n*Other contributing factors:* virulence of strain (DEN-2 Asian genotype), NS1 antigen-mediated endothelial damage, host genetic factors, age (children), secondary infection."}, {"id": 101, "n": 101, "t": "How can you diagnose a case of dengue (haemorrhagic fever)?", "st": 3, "src": "NMC 4; DU-18M, 24M", "du": ["DU-18M", "DU-24M"], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Laboratory diagnosis of dengue (specimen: blood)** – choice of test depends on day of illness.\n\n| Day of illness | Test |\n|---|---|\n| **Days 1–5** (febrile/viraemic) | **NS1 antigen** (ELISA/rapid ICT; early and specific), **RT-PCR for viral RNA** (serotyping), virus isolation (cell culture/mosquito inoculation – specialised labs) |\n| **From day 5 onwards** | **Dengue-specific IgM** (MAC-ELISA, ICT) – primary infection; a ≥ 4-fold rise in IgG/HI titre in paired sera or IgG in a single serum > 1:1280 – secondary infection |\n\n**Supportive laboratory findings (routine):** **leucopenia**, **thrombocytopenia (< 100,000/mm³)**, **rising haematocrit** (≥ 20% – haemoconcentration), raised AST/ALT, prolonged PT/APTT, hypoalbuminaemia. **Tourniquet test** is positive (≥ 20 petechiae/in²). Chest X-ray/ultrasound – pleural effusion, ascites, gall-bladder wall oedema.\n\n*Viva:* NS1 + IgM + IgG ICT cards are used widely in Bangladesh. Negative NS1 and IgM in the first days does not exclude dengue — repeat after day 5."}, {"id": 102, "n": 102, "t": "*Vignette: a 10-year-old boy with sudden high-grade fever, severe body ache, maculopapular rash and a positive NS1 test.* What is the probable viral cause, its probable complications, and the mosquito vector?", "st": 0, "src": "DU-22N", "du": ["DU-22N"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Probable viral cause: Dengue virus** (an enveloped, single-stranded positive-sense RNA virus, *Flavivirus*; **4 serotypes**) – sudden high fever, severe body ache and maculopapular rash with positive NS1 antigen = dengue fever.\n\n**Probable complications:**\n1. **Dengue haemorrhagic fever (DHF)** – bleeding (petechiae, epistaxis, GI bleeding), plasma leakage;\n2. **Dengue shock syndrome (DSS)** – hypotension and circulatory failure;\n3. Others: thrombocytopenia, hepatitis, myocarditis, encephalopathy, multi-organ failure.\n\n**Mosquito vector: *Aedes aegypti*** (also *Aedes albopictus*) – a day-biting, domestic container-breeding mosquito."}, {"id": 103, "n": 103, "t": "*Vignette: a 10-year-old boy from Bogura with high fever for 3 days followed by low blood pressure, rapid pulse, narrow pulse pressure, decreased WBC/platelet count and raised haematocrit; recent travel to Dhaka.* What is the most likely diagnosis, causative agent, mode of transmission and confirmatory test?", "st": 0, "src": "DU-19Nov", "du": ["DU-19Nov"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Most likely diagnosis: Dengue shock syndrome (dengue haemorrhagic fever with shock)** – high fever for 3 days followed by hypotension, tachycardia, narrow pulse pressure, leucopenia/thrombocytopenia and **raised haematocrit** (haemoconcentration from plasma leakage), in a child from an endemic area (history of travel to Dhaka, where the outbreak occurs).\n**Causative agent:** **Dengue virus (DEN-1–4)**; severe disease follows secondary infection with a different serotype (antibody-dependent enhancement).\n**Mode of transmission:** bite of an infected female ***Aedes aegypti*** (or *albopictus*) mosquito – a man→mosquito→man cycle; no direct person-to-person spread (rarely vertical or via transfusion).\n**Confirmatory tests:** **NS1 antigen, RT-PCR** (first 5 days), **dengue IgM ELISA** (after day 5) or rising IgG titre; virus isolation."}, {"id": 104, "n": 104, "t": "Name emerging viral diseases with their causative agents.", "st": 2, "src": "NMC 1; NMC 4", "du": [], "nmc": ["NMC 1", "NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n| Emerging viral disease | Causative virus |\n|---|---|\n| **AIDS** | HIV |\n| **COVID-19, SARS, MERS** | SARS-CoV-2, SARS-CoV, MERS-CoV |\n| **Avian influenza / swine flu** | Influenza A H5N1, H7N9; pandemic H1N1 (2009) |\n| **Ebola and Marburg haemorrhagic fever** | Ebola virus, Marburg virus (Filoviridae) |\n| **Nipah encephalitis** | Nipah virus (Paramyxoviridae) – Bangladesh since 2001 |\n| **Dengue / chikungunya / Zika fever** | Dengue, chikungunya, Zika viruses |\n| **West Nile fever, Japanese encephalitis** | West Nile virus, JE virus |\n| **Lassa fever; Hantavirus pulmonary syndrome** | Lassa virus; Sin Nombre hantavirus |\n| Mpox (monkeypox) | Monkeypox virus |\n\n**Re-emerging:** measles, mumps, hepatitis C, rhinovirus, polio (cVDPV), dengue.\n*Emerging virus* = newly appeared, or rapidly increasing in incidence or geographic range; often arise by **zoonosis** (cross-species jump) – bats, birds, pigs, primates – and factors such as urbanisation, travel and climate change."}, {"id": 105, "n": 105, "t": "Define the term \"arbovirus\"; explain its transmission cycle and the pathogenesis of one disease it causes.", "st": 0, "src": "NMC 4", "du": [], "nmc": ["NMC 4"], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Arbovirus (arthropod-borne virus)** is an **ecological (not taxonomic) grouping** of > 350 viruses which are **transmitted to vertebrates by the bite of haematophagous arthropods (mosquitoes, ticks, sandflies)** in which they multiply. Families: Flaviviridae (dengue, YF, JE, West Nile), Togaviridae (chikungunya), Bunyaviridae (Crimean–Congo HF), Reoviridae, Rhabdoviridae.\n\n### Transmission cycle\n```\n Urban cycle (dengue, chikungunya, YF):    Human  <-- bite --  Aedes mosquito  -- bite -->  Human\n Sylvatic/zoonotic (JE virus):   Pigs/water birds (amplifying hosts)  --> Culex mosquito --> Human (dead-end host)\n```\n1. The mosquito (vector) acquires the virus by biting a viraemic vertebrate host.\n2. **Extrinsic incubation period** (8–12 days): virus multiplies in the mosquito gut, spreads to the salivary glands.\n3. The infected mosquito transmits to a new host by biting; the mosquito remains infective for life; **transovarial (vertical) transmission** occurs in the vector.\n4. Hosts: humans (dengue – reservoir), birds, pigs, monkeys; **dead-end hosts** (humans/horses in JE) do not transmit further.\n\n### Pathogenesis of one disease – dengue (see Q100)\nBite → virus replicates in skin dendritic cells and local lymph nodes → monocytes/macrophages → **viraemia** → organs (liver, spleen, bone marrow). Primary infection → dengue fever. **Secondary infection with a different serotype → antibody-dependent enhancement, cytokine storm, plasma leakage → DHF/DSS.**\n*(Alternatively, Japanese encephalitis: viraemia → crosses blood–brain barrier → neuronal infection → encephalitis.)*"}, {"id": 106, "n": 106, "t": "Name some viruses causing diarrhea.", "st": 0, "src": "Board 1 Set 13", "du": [], "nmc": [], "vv": ["Board 1 Set 13"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Viruses causing diarrhoea (gastroenteritis)** – mnemonic **RANCA**:\n1. **R**otavirus – commonest cause in infants and young children\n2. **A**denovirus (types 40, 41)\n3. **N**orwalk virus (Norovirus)\n4. **C**alicivirus (Sapovirus)\n5. **A**strovirus\nOthers: coronavirus, enteroviruses (minor), CMV in AIDS."}]}, {"id": "virology-11", "title": "Congenital/TORCH Infections", "qs": [{"id": 107, "n": 107, "t": "*Vignette: a baby born with microcephaly, deafness, cataract and ventricular septal defect; mother had a maculopapular rash during the first trimester (congenital rubella syndrome).* Name the organism, tests to diagnose it, prevention, and two other infections with a similar rash.", "st": 0, "src": "DU-19M — see also #66, #108", "du": ["DU-19M — see also #66", "DU-#108"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Organism:** **Rubella virus** (a togavirus) – **congenital rubella syndrome (CRS)** (microcephaly, deafness, cataract and VSD in the newborn; first-trimester maternal rash).\n\n**Tests to diagnose**\n- **Rubella-specific IgM** in the neonate's serum (or IgG persisting beyond 6 months); IgG avidity;\n- **RT-PCR/virus isolation** from throat swab, urine, CSF or lens aspirate;\n- In the mother: **IgM** (recent infection) and paired sera showing a **4-fold rise in IgG/HI titre**; amniocentesis for viral RNA to confirm fetal infection.\n\n**Prevention**\n- **Live attenuated rubella vaccine (RA 27/3)** – MR/MMR for all children; vaccinate non-immune women of childbearing age before pregnancy (avoid conception for at least 4 weeks); not during pregnancy.\n- **Antenatal screening of rubella IgG**; avoid contact with cases; hyperimmune globulin is of doubtful value.\n\n**Two other infections with a similar maculopapular rash:** **Measles** and **CMV infection** (also dengue, parvovirus B19 infection, enteroviral rash, roseola)."}, {"id": 108, "n": 108, "t": "*Vignette: a 30-year-old lady whose baby was born with cataract and ventricular septal defect; she had low-grade fever, trunk rash and posterior auricular lymphadenopathy in the first trimester.* Write the probable diagnosis, and how it is diagnosed and prevented during pregnancy.", "st": 0, "src": "DU-18M — see also #66, #107", "du": ["DU-18M — see also #66", "DU-#107"], "nmc": [], "vv": [], "bd": [], "w": true, "v": false, "a": "**Answer**\n\n**Probable diagnosis: Congenital rubella syndrome** – cataract and VSD in the newborn, with maternal first-trimester fever, **trunk rash and posterior auricular lymphadenopathy** (characteristic of rubella).\n\n**Diagnosis in the mother during pregnancy**\n1. **Rubella IgM** – recent (acute) infection; **IgG** – paired sera ≥ 4-fold rise or IgG titre ≥ 1:8 (≥ 10 IU/mL) = immune/protected; **low avidity** IgG indicates recent infection.\n2. If maternal infection is confirmed – fetal infection by **amniocentesis (RT-PCR of amniotic fluid)** or cord blood IgM after 22 weeks.\n3. Neonate: IgM, virus isolation/PCR from throat and urine.\n\n**Prevention**\n1. **MR/MMR vaccination** of all children and of non-immune girls/women **before pregnancy** (avoid pregnancy for 4 weeks after the vaccine).\n2. **Antenatal screening** of rubella IgG; non-immune pregnant woman – avoid contact with cases; **vaccinate postpartum**.\n3. Termination of pregnancy may be offered for first-trimester infection; the live vaccine is **contraindicated in pregnancy**."}, {"id": 109, "n": 109, "t": "Which viral infections should be screened in pregnancy?", "st": 0, "src": "Board 1 Set 05", "du": [], "nmc": [], "vv": ["Board 1 Set 05"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Viral infections to be screened in pregnancy** (antenatal screening, the TORCH-based approach):\n1. **HIV** – routine opt-out test for every pregnant woman\n2. **Hepatitis B (HBsAg)** – and HBeAg/HBV DNA if positive\n3. **Rubella IgG** (immune status)\n4. **Hepatitis C** (anti-HCV) in high-risk groups\n5. **CMV, HSV, VZV (IgG), parvovirus B19** – selectively (symptomatic or exposed women)\n6. Zika virus in endemic exposure\n(Non-viral: syphilis, toxoplasmosis.)"}, {"id": 110, "n": 110, "t": "Why should certain viral infections be screened in pregnancy?", "st": 0, "src": "Board 1 Set 05", "du": [], "nmc": [], "vv": ["Board 1 Set 05"], "bd": ["Board 1"], "w": false, "v": true, "a": "**Answer**\n\n**Reasons for screening certain viral infections in pregnancy**\n1. **Prevent vertical transmission** – HIV (antiretroviral therapy in pregnancy and for the neonate reduces transmission from 15–40% to < 2%; avoid breast-feeding or give ART); HBV (**HBIG + vaccine to the newborn** within
